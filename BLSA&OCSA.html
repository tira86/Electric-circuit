r\"\u003eFull circuit ↗\u003c/a\u003e\u003c/div\u003e\u003c/header\u003e\n\u003cnav id=\"lessons\" aria-label=\"Lessons\"\u003e\u003c/nav\u003e\n\u003cmain\u003e\u003csection class=\"panel workspace\"\u003e\u003cdiv class=\"question\"\u003e\u003cdiv\u003e\u003ch1 id=\"question\"\u003e\u003c/h1\u003e\u003cp id=\"objective\"\u003e\u003c/p\u003e\u003c/div\u003e\u003cspan class=\"pill\" id=\"lessonIndex\"\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"canvas\"\u003e\u003csvg id=\"circuit\" viewBox=\"0 0 920 480\" role=\"group\" aria-label=\"Interactive circuit for this lesson\"\u003e\u003c/svg\u003e\u003c/div\u003e\u003cdiv class=\"config\" id=\"config\"\u003e\u003c/div\u003e\u003cdiv class=\"controls\"\u003e\u003cbutton id=\"play\" class=\"primary\"\u003e▶ Play this segment\u003c/button\u003e\u003cbutton id=\"pause\" disabled\u003ePause\u003c/button\u003e\u003cbutton id=\"again\"\u003e↺ Replay\u003c/button\u003e\u003cbutton id=\"next\"\u003eNext segment →\u003c/button\u003e\u003clabel\u003e\u003cspan class=\"sr\"\u003eSpeed\u003c/span\u003e\u003cselect id=\"speed\"\u003e\u003coption value=\".5\"\u003e0.5×\u003c/option\u003e\u003coption value=\"1\" selected\u003e1×\u003c/option\u003e\u003coption value=\"2\"\u003e2×\u003c/option\u003e\u003c/select\u003e\u003c/label\u003e\u003cinput id=\"seek\" aria-label=\"Segment progress\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\"\u003e\u003cbutton id=\"all\"\u003ePlay lesson\u003c/button\u003e\u003c/div\u003e\u003c/section\u003e\n\u003caside class=\"panel guide\"\u003e\u003cdiv class=\"eyebrow\"\u003eINPUT → CIRCUIT → OUTPUT\u003c/div\u003e\u003cdiv class=\"io\"\u003e\u003cdiv\u003e\u003csmall id=\"inputName\"\u003e\u003c/small\u003e\u003cstrong id=\"inputValue\"\u003e\u003c/strong\u003e\u003csmall\u003eControl / initial condition for this segment\u003c/small\u003e\u003c/div\u003e\u003cdiv\u003e\u003csmall id=\"outputName\"\u003e\u003c/small\u003e\u003cstrong id=\"outputValue\"\u003e\u003c/strong\u003e\u003csmall id=\"currentValue\"\u003e\u003c/small\u003e\u003c/div\u003e\u003c/div\u003e\u003ch2 id=\"stageTitle\"\u003e\u003c/h2\u003e\u003cp id=\"explain\"\u003e\u003c/p\u003e\u003cp id=\"watch\"\u003e\u003c/p\u003e\u003cdiv id=\"steps\" aria-label=\"Lesson segments\"\u003e\u003c/div\u003e\u003cdetails id=\"math\" open\u003e\u003csummary\u003eFormula: relation → substitution → result\u003c/summary\u003e\u003cpre id=\"formula\"\u003e\u003c/pre\u003e\u003c/details\u003e\u003cdetails\u003e\u003csummary\u003eAssumptions and terms for this lesson\u003c/summary\u003e\u003cp id=\"assumptions\" class=\"note\"\u003e\u003c/p\u003e\u003cbutton id=\"source\"\u003eSources\u003c/button\u003e\u003c/details\u003e\u003cdiv class=\"bridge\"\u003e\u003cstrong id=\"bridgeTitle\"\u003e\u003c/strong\u003e\u003cp id=\"bridgeText\"\u003e\u003c/p\u003e\u003cbutton id=\"bridgeButton\"\u003e\u003c/button\u003e\u003c/div\u003e\u003c/aside\u003e\n\u003csection class=\"panel scope\"\u003e\u003cdiv class=\"scope-head\"\u003e\u003cstrong\u003eLesson scope \u003cspan id=\"legend\"\u003e\u003c/span\u003e\u003c/strong\u003e\u003cspan id=\"clock\"\u003e\u003c/span\u003e\u003c/div\u003e\u003csvg id=\"wave\" viewBox=\"0 0 900 135\" role=\"img\" aria-label=\"Voltage waveforms updated with the animation\"\u003e\u003c/svg\u003e\u003c/section\u003e\u003c/main\u003e\n\u003cdialog id=\"detail\"\u003e\u003cbutton id=\"close\"\u003eClose ✕\u003c/button\u003e\u003ch2 id=\"detailTitle\"\u003e\u003c/h2\u003e\u003cp id=\"detailText\"\u003e\u003c/p\u003e\u003c/dialog\u003e\n\u003cscript data-tutorial-model\u003e\n/* DRAM Circuit Lab. Educational long-channel MOS transient model.\n * Units: V, ns, pF, mA. Not a DDR5 timing or process sign-off model.\n * OCSA core connectivity: US20200227111A1, Fig.3 / Fig.6A–E.\n * Named rail/column/write drivers are explicit illustrative peripheral circuits.\n */\n(function(global){\n'use strict';\nconst C={BL:.2,BLB:.2,CELL:.02,SL:.02,SR:.02,LA:.04,LAB:.04,LIO:.05,LIOB:.05};\nconst nodes=Object.keys(C), caps=nodes.map(n=\u003eC[n]), ix=Object.fromEntries(nodes.map((n,i)=\u003e[n,i]));\nconst rail={VINTA:1,VSS:0,VPRE:.5,VPL:.5};\nconst clamp=(v,a=0,b=1)=\u003eMath.max(a,Math.min(b,v));\n// Rule demonstration only: no speed-bin / MR / burst configuration is implied.\nconst timingDefaults={tRCD:16,tRAS:32,tRP:16,tRC:48,tRTP:7.5,tWR:30,tRFC:295};\nconst senseMargin=.01; // 10 mV illustrative input margin, not a JEDEC specification.\nfunction decideRead(delta,margin=senseMargin){return !Number.isFinite(delta)||Math.abs(delta)\u003c=margin?'X':delta\u003e0?1:0;}\nconst scenarios=[\n {id:'read0',group:'Simple cases',name:'Read 0',init:0,ops:['ACT','RD','PRE'],goal:'Open a row whose cell stores 0, read 0, then close the row.'},\n {id:'read1',group:'Simple cases',name:'Read 1',init:1,ops:['ACT','RD','PRE'],goal:'Open a row whose cell stores 1, read 1, then close the row.'},\n {id:'write0',group:'Simple cases',name:'Write 0 (1 → 0)',init:1,ops:['ACT','W0','PRE'],goal:'The write driver changes the original 1 to 0, then the row closes after write restore completes.'},\n {id:'write1',group:'Simple cases',name:'Write 1 (0 → 1)',init:0,ops:['ACT','W1','PRE'],goal:'The write driver changes the original 0 to 1, then the row closes after write restore completes.'},\n {id:'act0',group:'Single operation',name:'ACT：Cell = 0',init:0,ops:['ACT'],goal:'Look only at row activation, charge sharing, and sensing; the row remains open at the end.'},\n {id:'act1',group:'Single operation',name:'ACT：Cell = 1',init:1,ops:['ACT'],goal:'Look only at row activation, charge sharing, and sensing; the row remains open at the end.'},\n {id:'pre0',group:'Single operation',name:'PRE: open-row 0',init:0,open:true,ops:['PRE'],goal:'The initial state has already completed ACT and restore; this plays only row close, sense disable, and equalization.'},\n {id:'pre1',group:'Single operation',name:'PRE: open-row 1',init:1,open:true,ops:['PRE'],goal:'The initial state has already completed ACT and restore; observe how the cell keeps 1 after isolation.'},\n {id:'refresh0',group:'Single operation',name:'Refresh 0',init:.12,ops:['REF'],goal:'The cell low level has leaked up to 0.12 V; refresh restores it near 0 V.'},\n {id:'refresh1',group:'Single operation',name:'Refresh 1',init:.88,ops:['REF'],goal:'The cell high level has leaked down to 0.88 V; refresh restores it near 1 V.'},\n {id:'verify01',group:'Case study',name:'Write 1 → close row → read back',init:0,ops:['ACT','W1','PRE','ACT','RD','PRE'],goal:'Read back after a new ACT to confirm the data was stored in the cell, not merely still latched in the sense amplifier.'},\n {id:'verify10',group:'Case study',name:'Write 0 → close row → read back',init:1,ops:['ACT','W0','PRE','ACT','RD','PRE'],goal:'Watch the full sequence of write flip, isolated retention, and reading 0 back.'},\n {id:'same0',group:'Case study',name:'Rewrite same value 0 → 0',init:0,ops:['ACT','W0','RD','PRE'],goal:'Control actions still occur without a logic flip; at steady state, there should be no continuous charge/discharge current drawn.'},\n {id:'same1',group:'Case study',name:'Rewrite same value 1 → 1',init:1,ops:['ACT','W1','RD','PRE'],goal:'Distinguish the write action from a bit flip, and observe the write driver and column switches.'},\n {id:'rowhit',group:'Case study',name:'Same-row Read → Write → Read',init:0,ops:['ACT','RD','W1','RD','W0','RD','PRE'],goal:'The same row stays open; READ does not reopen WL each time and does not automatically PRE.'},\n {id:'retention',group:'Case study',name:'Write 1 → leakage → refresh → read back',init:0,ops:['ACT','W1','PRE','WAIT','REF','ACT','RD','PRE'],goal:'Connect storage, illustrative leakage, and refresh. REF itself does not send data to DQ.'},\n {id:'timingwait',group:'Timing observation',name:'Wait observation: ACT → READ → PRE → activate again',init:0,timing:{tRCD:120,tRAS:180,tRP:50,tRC:230},ops:['ACT','RD','PRE','ACT','W1','PRE'],goal:'Teaching thresholds are intentionally lengthened so you can observe remaining time for tRCD, tRAS, and tRP/tRC; this is not a DDR5 speed grade.'},\n /*{id:'margin0',group:'Compensation comparison',name:'Weak signal 0 + NMOS mismatch',init:.36,offset:.06,ops:['ACT','RD','PRE'],goal:'The cell has only a weak low signal. Switch BLSA/OCSA to compare sensing under the same mismatch; the result is computed by the model.'},\n {id:'margin1',group:'Compensation comparison',name:'Weak signal 1 + NMOS mismatch',init:.64,offset:-.06,ops:['ACT','RD','PRE'],goal:'The cell has only a weak high signal. Compare offset and read decision with and without compensation.'}*/\n];\nfunction transistor(id,type,a,b,gate,k,vt=.3){return {id,type,a,b,gate,k,vt};}\nfunction netlist(mode,offset=0){\n const oc=mode==='ocsa', l=oc?'SL':'BL',r=oc?'SR':'BLB';\n const list=[\n transistor('P_L','p','LA',l,r,.2),transistor('P_R','p','LA',r,l,.2),\n transistor('N_L','n',l,'LAB','BLB',1,.3+offset/2),transistor('N_R','n',r,'LAB','BL',1,.3-offset/2),\n transistor('P_EN','p','VINTA','LA','@SAP_n',5),transistor('N_EN','n','LAB','VSS','@SAN',5),\n transistor('B_LA','n','LA','VPRE','@BIAS',4),transistor('B_LAB','n','LAB','VPRE','@BIAS',4),\n transistor('M_PL','n','BL','VPRE','@EQ',1),transistor('M_PR','n','BLB','VPRE','@EQ',1),\n transistor('M_EQ','n','BL','BLB','@EQ',1),transistor('M_A','n','BL','CELL','@WL',.5),\n transistor('Y_L','n',l,'LIO','@CSL',2),transistor('Y_R','n',r,'LIOB','@CSL',2),\n transistor('IO_PL','n','LIO','VPRE','@IOEQ',1),transistor('IO_PR','n','LIOB','VPRE','@IOEQ',1),\n transistor('W_PL','p','VINTA','LIO','@WPL',8),transistor('W_PR','p','VINTA','LIOB','@WPR',8),\n transistor('W_NL','n','LIO','VSS','@WNL',8),transistor('W_NR','n','LIOB','VSS','@WNR',8)\n ];\n if(oc)list.push(transistor('ISO_L','n','BL','SL','@ISO',2),transistor('ISO_R','n','BLB','SR','@ISO',2),transistor('OC_L','n','BL','SR','@OC',2),transistor('OC_R','n','BLB','SL','@OC',2));\n return list;\n}\nfunction voltage(name,v,g){return name[0]==='@'?g[name.slice(1)]:(name in ix?v[ix[name]]:rail[name]);}\nfunction mos(d,v,g){\n const a=voltage(d.a,v,g),b=voltage(d.b,v,g),vg=voltage(d.gate,v,g),ds=Math.abs(a-b);\n const over=d.type==='n'?vg-Math.min(a,b)-d.vt:Math.max(a,b)-vg-d.vt;\n const magnitude=over\u003c=0?0:(ds\u003cover?d.k*(over*ds-.5*ds*ds):.5*d.k*over*over);\n return {i:Math.sign(a-b)*magnitude,over,a,b,vg,region:over\u003c=0?'cutoff':ds\u003cover?'linear region':'saturation region'};\n}\nfunction initialG(mode){return {EQ:1.5,BIAS:1.5,WL:0,SAP_n:1,SAN:0,CSL:0,IOEQ:1.5,WPL:1,WPR:1,WNL:0,WNR:0,ISO:mode==='ocsa'?1.5:0,OC:mode==='ocsa'?1.5:0};}\nfunction makeStages(mode,sc,profile){\n const list=[],events=[];let g=initialG(mode),group=-1,op='',cursor=0;\n const clocks={ACT:null,RD:null,PRE:null,WD_REF:null,REF:null};\n const add=(key,title,duration,patch={},extra={})=\u003e{const start={...g};g={...g,...patch};list.push({key,title,duration,startG:start,endG:{...g},group,op,clocks:{...clocks},...extra});cursor+=duration;};\n const mark=type=\u003e{events.push({type,time:cursor,group});if(type in clocks)clocks[type]=cursor;if(type==='ACT'){clocks.RD=null;clocks.WD_REF=null;}};\n const rule=(name,anchor)=\u003eclocks[anchor]===null?null:{name,anchor,origin:clocks[anchor],limit:profile[name]};\n const gate=(target,rules)=\u003e{const checks=rules.filter(Boolean);if(!checks.length)return;const remaining=Math.max(0,...checks.map(r=\u003er.origin+r.limit-cursor));add('timing',`${target}：${remaining\u003e1e-8?'waiting for remaining time':'timing check satisfied'}`,Math.max(.1,remaining),{}, {checks,gateTarget:target,waitAtEntry:remaining});};\n const beforeACT=()=\u003egate('pre-ACT check',[rule('tRP','PRE'),rule('tRC','ACT'),rule('tRFC','REF')]);\n const beforePRE=()=\u003egate('pre-PRE check',[rule('tRAS','ACT'),rule('tRTP','RD'),rule('tWR','WD_REF')]);\n if(sc.open)g={...g,EQ:0,BIAS:0,WL:1.5,SAP_n:0,SAN:1,OC:0};\n function act(refresh=false){\n  add('release','Release precharge',2,{EQ:0,BIAS:0});\n  if(mode==='ocsa'){\n   add('oc','Keep OC on / enable offset sampling',35,{ISO:0,OC:1.5,SAP_n:0,SAN:1});\n   add('hold','Isolate and hold compensation',3,{OC:0,SAP_n:1,SAN:0,BIAS:1.5});\n   add('share','WL on / charge sharing',7,{WL:1.5});\n   add('presense','Presense on isolated bitlines',22,{SAP_n:0,SAN:1,BIAS:0});\n   add('restore','Reconnect bitlines / restore cell',28,{ISO:1.5});\n  }else{\n   add('share','WL on / charge sharing',7,{WL:1.5});\n   add('nsense','N-sense pulls down the low side',15,{SAN:1});\n   add('psense','P-sense pulls up the high side',18,{SAP_n:0});\n   add('restore','Hold WL / complete restore',12);\n  }\n  add('active',refresh?'Refresh data restore complete':'Row remains open',2);\n  if(!refresh)gate('tRCD check',[rule('tRCD','ACT')]);\n }\n function pre(){\n  add('wlclose','Turn off WL / isolate cell',2,{WL:0});\n  add('saoff','Stop sense-amplifier supplies',2,{SAP_n:1,SAN:0});\n  add('equalize','Bitline equalization and precharge',25,{EQ:1.5,BIAS:1.5,ISO:mode==='ocsa'?1.5:0,OC:mode==='ocsa'?1.5:0});\n  add('standby','Return to standby',2);\n }\n for(op of sc.ops){group++;\n  if(op==='ACT'){beforeACT();mark('ACT');act();}\n  if(op==='PRE'){beforePRE();mark('PRE');pre();}\n  if(op==='RD'){\n   mark('RD');\n   add('iorelease','Release I/O precharge',2,{IOEQ:0});\n   add('read','Open column / build read differential',6,{CSL:1.5});\n   add('capture','Sample readout',2,{}, {capture:true});\n   add('readclose','Close column / output this data',2,{CSL:0});\n   add('ioreset','I/O Return to standby',5,{IOEQ:1.5});\n  }\n  if(op==='W0'||op==='W1'){\n   mark(op);\n   const bit=op==='W1'?1:0;\n   add('iorelease','Release I/O precharge',2,{IOEQ:0},{writeBit:bit});\n   add('wdrive','Write driver establishes data',3,{WPL:bit?0:1,WPR:bit?1:0,WNL:bit?0:1,WNR:bit?1:0},{writeBit:bit});\n   add('write','Column open / write cell',18,{CSL:1.5},{writeBit:bit});\n   mark('WD_REF'); // Teaching proxy, not a simulated final external DQ clock edge.\n   add('wclose','Close column / isolate write driver',2,{CSL:0},{writeBit:bit});\n   add('wrecover','Stop drive / write restore',10,{WPL:1,WPR:1,WNL:0,WNR:0},{writeBit:bit});\n   add('ioreset','I/O Return to standby',5,{IOEQ:1.5},{writeBit:bit});\n  }\n  if(op==='REF'){\n   gate('pre-REF check',[rule('tRP','PRE'),rule('tRFC','REF')]);mark('REF');\n   add('refselect','REF / internal refresh address selects row',2);\n   act(true);pre();\n   gate('REF busy time complete',[rule('tRFC','REF')]);\n  }\n  if(op==='WAIT')add('leak','Leakage during retention interval',100,{}, {leak:true});\n }\n return {stages:list,events};\n}\nfunction auditTiming(events,profile,initialOpen=false){\n let act=null,rd=null,pre=null,wr=null,ref=null,open=initialOpen;const results=[];\n for(const e of events){\n  const checks=[];const test=(name,origin)=\u003e{if(origin!==null)checks.push({name,elapsed:e.time-origin,required:profile[name],pass:e.time-origin+1e-7\u003e=profile[name]});};\n  if(e.type==='WD_REF'){wr=e.time;continue;}\n  let stateOK=true;\n  if(e.type==='ACT'){stateOK=!open;test('tRP',pre);test('tRC',act);test('tRFC',ref);act=e.time;rd=null;wr=null;open=true;}\n  if(['RD','W0','W1'].includes(e.type)){stateOK=open;test('tRCD',act);if(e.type==='RD')rd=e.time;}\n  if(e.type==='PRE'){stateOK=open;test('tRAS',act);test('tRTP',rd);test('tWR',wr);pre=e.time;open=false;}\n  if(e.type==='REF'){stateOK=!open;test('tRP',pre);test('tRFC',ref);ref=e.time;}\n  results.push({...e,checks,stateOK,pass:stateOK\u0026\u0026checks.every(c=\u003ec.pass)});\n }\n return results;\n}\nfunction controls(st,t){const q=clamp(t/Math.min(.45,st.duration/4));return Object.fromEntries(Object.keys(st.endG).map(k=\u003e[k,st.startG[k]+(st.endG[k]-st.startG[k])*q]));}\nfunction simulate(mode,scenario){\n const sc=typeof scenario==='string'?scenarios.find(s=\u003es.id===scenario):scenario;\n if(!sc)throw Error('Scenario not found');\n const profile={...timingDefaults,...sc.timing},schedule=makeStages(mode,sc,profile);\n const list=netlist(mode,sc.offset??.012),stages=schedule.stages,closed=[.5,.5,sc.init,.5,.5,.5,.5,.5,.5];\n let v=sc.open?[sc.init,1-sc.init,sc.init,sc.init,1-sc.init,1,0,.5,.5]:closed;\n let samples=[],time=0,lastData=null,expected=sc.init\u003e.5?1:0,lastOpGroup=-1,readLog=[];\n const dt=.003;\n for(let si=0;si\u003cstages.length;si++){\n  const st=stages[si];st.index=si;st.start=time;st.from=samples.length;st.initial=v.slice();st.expectedBefore=expected;\n  if(st.group!==lastOpGroup){lastOpGroup=st.group;}\n  const steps=Math.ceil(st.duration/dt),h=st.duration/steps,stride=Math.max(1,Math.floor(steps/140));\n  for(let n=0;n\u003c=steps;n++){\n   const local=n*h,g=controls(st,local),dv=nodes.map(()=\u003e0);if(sc.earlyWLTime!=null\u0026\u0026time+local\u003e=sc.earlyWLTime)g.WL=0;\n   for(const d of list){const I=mos(d,v,g).i;if(d.a in ix)dv[ix[d.a]]-=I;if(d.b in ix)dv[ix[d.b]]+=I;}\n   if(st.leak)dv[ix.CELL]+=(.5-v[ix.CELL])*.00008;\n   if(st.capture \u0026\u0026 n===steps){const delta=v[ix.LIO]-v[ix.LIOB];lastData=decideRead(delta);readLog.push({stage:si,actual:lastData,expected,delta,valid:lastData!=='X'});}\n   if(n%stride===0||n===steps)samples.push({t:time+local,v:v.slice(),g,stage:si,dq:lastData});\n   if(n!==steps)v=v.map((x,i)=\u003ex+h*dv[i]/caps[i]);\n   if(v.some(x=\u003e!Number.isFinite(x)||x\u003c-.01||x\u003e1.51))throw Error('Circuit values out of range');\n  }\n  if(st.key==='wrecover')expected=st.writeBit;\n  st.final=v.slice();st.to=samples.length-1;time+=st.duration;st.end=time;\n }\n return {mode,sc,list,stages,samples,total:time,readLog,final:v,expected,profile,events:schedule.events,timingAudit:auditTiming(schedule.events,profile,!!sc.open)};\n}\nfunction sampleAt(sim,t){\n t=clamp(t,0,sim.total);let lo=0,hi=sim.samples.length-1;\n while(lo\u003chi){const m=Math.ceil((lo+hi)/2);if(sim.samples[m].t\u003c=t)lo=m;else hi=m-1;}\n const a=sim.samples[lo],b=sim.samples[Math.min(lo+1,sim.samples.length-1)],q=b.t\u003ea.t?(t-a.t)/(b.t-a.t):0;\n const st=sim.stages[a.stage],g=controls(st,t-st.start),v=a.v.map((x,i)=\u003ex+(b.v[i]-x)*q);\n if(sim.sc.earlyWLTime!=null\u0026\u0026t\u003e=sim.sc.earlyWLTime)g.WL=0;\n return {...a,t,v,g,stage:a.stage,j:Object.fromEntries(sim.list.map(d=\u003e[d.id,mos(d,v,g)]))};\n}\nconst api={scenarios,netlist,simulate,sampleAt,controls,nodes,ix,C,rail,mos,timingDefaults,senseMargin,decideRead,auditTiming};\nif(typeof module!=='undefined')module.exports=api;global.DramModel=api;\n})(typeof globalThis!=='undefined'?globalThis:this);\n\n\u003c/script\u003e\n\u003cscript\u003e\n'use strict';\nconst $=id=\u003edocument.getElementById(id),fmt=(x,n=3)=\u003eNumber(x).toFixed(n),C=.02,CB=.2,R=100,VT=.3,K=.03; // pF, kΩ, ns, mA\nconst lessons=[\n {name:'Capacitor and Switch',sub:'Connect, hold, discharge',question:'When the switch opens, does the capacitor voltage disappear immediately?',objective:'Focus only on how current changes the voltage of one capacitor.',stages:['Before charging: get to know the circuit','Connected: the capacitor starts charging','Open: hold the present voltage','Grounded: the capacitor starts discharging'],dur:[2,10,4,10],why:['The switch is not connected yet. The source is 1 V and the capacitor starts at 0 V, but there is no closed conductive path between them.','The switch closes, so the source charges the capacitor through the resistor. As the capacitor voltage approaches the source, the resistor voltage drop shrinks and the current gets smaller.','After the switch opens, the capacitor is isolated from the source. In the ideal model there is no leakage, so it keeps the voltage it had at the instant of opening instead of jumping back to 0 V.','Now the input is tied to 0 V and the switch is closed. Current flows from the capacitor back toward the low-potential terminal, so the capacitor voltage falls gradually.'],watch:['Click the resistor, switch, and capacitor to see what each part does.','Watch the yellow arrow move left to right, then notice the pink Vc waveform flattening out.','There is no current arrow now, but the capacitor still has voltage.','The current direction has reversed. Discharge also takes time; it is not instant reset to zero.'],assume:'Ideal switch and linear RC circuit. R = 100 kΩ, C = 20 fF, and τ = 2 ns are teaching values. Leakage is ignored during the hold segment. In lesson 1, the capacitor bottom plate is grounded.',bridge:'Next, replace the ideal switch with a MOS device and see how the gate decides whether a path conducts.',bridgeTitle:'Next: who controls the switch?'},\n {name:'MOS-Controlled Path',sub:'Separate gate from output',question:'How does the gate voltage control another path?',objective:'Switch between NMOS and PMOS, and separate the control terminal from the charge/discharge path.',stages:['Initial: capacitor is ready','Change gate voltage','Hold gate: observe output','Turn off the gate-controlled path','Hold: capacitor is isolated'],dur:[2,2,12,2,4],why:['Here the initial capacitor voltage is assigned directly: the NMOS experiment starts from 1 V and the PMOS experiment starts from 0 V. The charging circuit from the previous lesson is temporarily omitted.','The gate voltage starts changing. NMOS depends on VGS and PMOS depends on VSG; a clear conductive path forms only after the threshold magnitude is exceeded.','A fixed gate voltage does not mean the output voltage is fixed. As long as current flows, the capacitor voltage keeps changing; near the supply terminal, the current gradually decreases.','The control terminal returns to the cutoff level. The charge/discharge path fades out, and the capacitor keeps the voltage it had when the path stopped.','Gate and output are different nodes. Gate coupling and leakage are ignored here, so after turn-off the capacitor voltage stays unchanged.'],watch:['The NMOS sits below the capacitor and pulls the output down; the PMOS sits above it and pulls the output up.','Try setting the enabled gate near threshold and watch whether current appears.','Color means the conduction condition is met; the arrow appears only when current is large enough.','Notice that the gate waveform changes first; the output response is determined by current.','Switch to the other MOS type and compare active-high versus active-low control.'],assume:'Long-channel square-law MOS demonstration, with |VT| = 0.30 V. Subthreshold behavior, body effect, gate current, and parasitic coupling are ignored. C = 20 fF. This is not a process-accurate model.',bridge:'Place the NMOS between the data line and the storage capacitor, control its gate with WL, and you get a 1T1C cell. The bottom plate is also changed to fixed VPL.',bridgeTitle:'Next: MOS + capacitor → cell'},\n {name:'One DRAM Cell',sub:'Write and isolated retention',question:'How does one transistor leave data in the cell?',objective:'Operate WL to write first and isolate afterward; an ideal driver temporarily represents the bitline.',stages:['Initial: cell and driver are separate','WL rises: access transistor turns on','Hold WL: write the cell','WL falls: isolate the cell','Change the outside: cell still holds'],dur:[2,2,16,2,5],why:['M_A is the access NMOS, with its gate controlled by WL. The cell starts at the opposite voltage from the target; the ideal driver on the left temporarily stands in for the real bitline circuit.','WL rises, M_A begins to conduct, and data is written from the left driver through the path into the cell. The WL gate does not directly inject charge into the cell.','With WL held high, the cell continues moving toward the target voltage. When writing 1 with WL too low, VGS falls as the cell voltage rises, limiting the high level that can be written.','WL falls and the access transistor turns off. The cell is isolated and keeps the voltage it had at turn-off.','The outside data line has switched to the opposite voltage, but WL is still low, so the cell does not follow it. This is the division between access and retention.'],watch:['Choose write 0 or 1, then compare WL = 1.0 V with 1.5 V.','The yellow arrow shows conventional current direction; pink shows the cell voltage.','Write 1 with WL = 1 V: the model limit is about 0.7 V. WL = 1.5 V gives enough headroom to approach 1 V.','What is retained is the present voltage. If isolation happens too early, it does not automatically become a full 0 or 1.','This example ignores leakage. Real DRAM still needs refresh after a retention interval.'],assume:'The left side is an ideal voltage driver, not a complete BL. VPL is fixed at 0.5 V, and Qcell = Ccell(Vcell−VPL). WL is an internal wordline, not an external VPP pin. The model ignores body effect; real high-level transfer limits can be more complex.',bridge:'During a read, the bitline is not held forever by an ideal source. In the next lesson, the driver is removed and a precharged bitline capacitor is connected instead, so you can observe sharing.',bridgeTitle:'Next: remove the ideal driver'},\n {name:'Charge Sharing',sub:'Cell connected to a real load',question:'If the cell is 0 or 1, why does BL move only a little?',objective:'Let two capacitors of different sizes share charge before adding the sense amplifier.',stages:['Prepare: the two capacitors are separate','Connected: charge sharing starts','Wait: approach the common voltage','Isolate: stop at the shared voltage','Next: add the BLB reference'],dur:[2,3,8,3,3],why:['The cell initially stores 0 or 1, and BL starts at 0.5 V. The precharge source has been removed; only the two capacitors and the still-open path remain.','After connection, conventional current flows from the higher-voltage side to the lower-voltage side. BL and the cell voltage both change; the cell voltage is not copied unchanged onto BL.','As the two voltages approach each other, path voltage drop and current approach zero. The shared result is a capacitance-weighted average.','To isolate the sharing result, the cell is temporarily disconnected here. Its original full 0 or 1 has been disturbed: this is not a complete read flow because sensing and restore have not happened yet.','A BLB reference branch still at 0.5 V is now shown. The small BL − BLB difference is the signal the later sense amplifier will amplify; BLB is not connected to this selected cell.'],watch:['CBL is 10 times the cell capacitance, so BL changes much less than the cell.','Read 1: cell → BL. Read 0: BL → cell. Watch the arrow reverse with the data.','Read 1 is about 0.545 V; read 0 is about 0.455 V. These are not full 1 V / 0 V levels.','Real DRAM keeps WL coordinated with sensing and restore; do not treat this early-isolation demo as a complete ACT.','We have reached the sense-amplifier input. The next part handles N-sense, P-sense, and restore.'],assume:'This lesson simplifies the turned-on M_A as RON = 100 kΩ so charge conservation can be shown analytically. CBL = 200 fF and Ccell = 20 fF are teaching parameters; VPL is fixed at 0.5 V; parasitic coupling and leakage are ignored.',bridge:'The first four lessons are complete here: you now know that the sense amplifier receives an input difference of about ±45 mV. Replay read 0/1 if helpful, then use the full version to locate BL, BLB, and the cell. N/P sensing and OCSA appear in later lessons.',bridgeTitle:'Done: the four parts before the sense amplifier'}\n];\n// Lessons 5–8: progressive educational subcircuits, with explicit boundary conditions.\nlessons[3].bridge='Charge sharing has created a small differential. Next we go back and fill in how the bitlines were prepared at 0.5 V in the first place. Lesson 5 adds EQ and the precharge paths.';\nlessons[3].bridgeTitle='Next: connect the precharge circuit';\nlessons.push(\n {name:'Precharge and Equalization',sub:'Create a common starting point',question:'Who prepares BL and BLB at 0.5 V?',objective:'Add only three switches: two to the reference and one between the two lines.',stages:['Initial: previous high and low remain','EQ on: three paths act together','Hold EQ: both lines approach the reference','EQ off: keep the prepared voltage','Connect the cell: a small differential appears'],dur:[2,8,16,3,10],why:['Assume the previous operation left BL/BLB at 1/0 or 0/1. The cell is isolated and the sense amplifier is disabled; this lesson studies only how the bitlines return to a common starting point.','EQ enables M_PL, M_PR, and M_EQ at the same time. The first two paths connect to VPRE; the middle path lets the two lines exchange charge. Equalization and reconnection to the reference act together.','BL and BLB both move toward 0.5 V. As the voltage difference shrinks, current also shrinks; switches staying on does not mean large current keeps flowing.','EQ turns off, and the bitline capacitances retain voltages near 0.5 V. The clamp is released first so the cell small signal is not pulled back by the precharge source.','Only now does WL turn on and M_A connect. The cell shares charge with BL, while BLB keeps the reference voltage. This is the setup that preceded the sharing experiment in lesson 4.'],watch:['The previous residue and this cell data are two different things; this demo chooses the same polarity to make comparison easier.','The yellow arrow follows the current direction set by the actual voltage difference, not by the stage name.','Try switching 0/1: the precharge target is still 0.5 V in both cases.','At this moment the cell is not connected yet; there is no sensing or readout.','Connect the three steps: EQ first, release next, WL last.'],assume:'The three EQ switches are modeled with 50 kΩ on-resistance; M_A uses 100 kΩ. Each bitline is 200 fF and the cell is 20 fF. The SA, leakage, and parasitic coupling are omitted; values are not JEDEC internal-circuit specifications.',bridgeTitle:'Next: how does a small differential become current?',bridge:'Start with one pull-down NMOS, control it with an external gate voltage, and watch the output bitline fall.'},\n {name:'Single N-Sense Device',sub:'Input voltage → pull-down current',question:'If the gate differs only a little, how different is the discharge speed?',objective:'Look at only one NMOS first, using an external voltage in place of the other bitline.',stages:['Initial: gate and output are separate','Pull LAB down: build VGS','Hold gate: bitline discharges','Approach low level: current decreases'],dur:[2,2,12,6],why:['The output BL is preset to 0.5 V. The gate is controlled by an adjustable ideal signal source and is not connected back to the output; lower LAB starts at 0.5 V, so the gate range in this lesson is not enough to turn on the path at first.','After SAN enables, lower LAB moves toward 0 V. Even if the gate does not change, VGS = VG − VS increases, so the NMOS begins to conduct.','With a higher gate, overdrive is larger and discharge is usually faster. Output BL is a capacitive node; as current keeps leaving, its voltage keeps falling.','After BL approaches LAB, the drain-source voltage becomes small and current decreases. The gate may still keep the device conductive, but the output is already near the low level.'],watch:['Slide the gate and replay 0.455 V and 0.500 V separately; do not mistake the gate for the output.','This lesson uses ideally controlled LAB to represent N_EN and its supply rail; SAN is not treated as the current source.','Compare BL and current at the same time, not just the final state where both are near 0 V.','The next lesson replaces the ideal gate source with the real opposite bitline.'],assume:'CBL = 200 fF, βn = 1 mA/V², VT = 0.30 V. This uses a simplified square-law model and ignores subthreshold behavior and body effect. LAB is an ideally driven supply rail; the gate is an independent signal source.',bridgeTitle:'Next: the other bitline controls the gate',bridge:'Add the symmetric second NMOS, hold two external gate signals first, then cross-connect each output back to the other gate.'},\n {name:'Cross-Coupled N-Sense',sub:'The two sides begin to affect each other',question:'After connecting the opposite bitline, why does the difference grow by itself?',objective:'Drive the two devices with fixed gates first, then switch to cross feedback.',stages:['Prepare: start from the shared small differential','External gates: compare the two devices first','Wire-up: replace signal sources with the opposite BL','Positive feedback: the low side keeps falling','Pause and look: the high side has not reached 1 V'],dur:[2,1,.5,18,5],why:['BL starts at the theoretical sharing value from lesson 4, and BLB is 0.5 V. The cell is not connected in this lesson; the previous part output is used as this part initial condition.','The two gates are temporarily controlled by fixed signal sources: N_L uses the initial BLB and N_R uses the initial BL. After LAB falls, the device with the higher gate pulls down more strongly.','Now the two ideal gate sources are removed and replaced with real wires: N_L gate connects to BLB, and N_R gate connects to BL. The two side voltages now control each other, forming feedback.','As the low bitline falls, it lowers the opposite NMOS gate voltage and weakens that pull-down; the opposite side stays relatively higher and keeps the low-side pull-down stronger. The differential grows.','N-sense can pull the low side down, but it cannot pull the high side up to 1 V from the upper supply. The high side is only relatively high; the next lesson adds P-sense.'],watch:['The initial differential is not guessed from the label; the value comes from charge sharing.','At this point both gates are external inputs, marked by small boxes in the diagram; they are not pretending to be cross-connected yet.','Colored lines are gate-signal paths; yellow arrows are the conventional current in conductive paths.','For read 0, N_L usually dominates the pull-down; for read 1, left and right swap. Watch actual VGS and current.','The 0/1 option represents the starting cell data; cell restore is not complete here.'],assume:'Both bitlines are 200 fF. NMOS uses βn = 1 and VT = 0.30 V. The cell and PMOS are not connected yet; the external-gate → feedback switch is a teaching decomposition, not an extra real DRAM command.',bridgeTitle:'Next: pull the high side up to the supply too',bridge:'Keep N-sense, then add cross-coupled PMOS devices and the upper supply switch to form a complete sense core.'},\n {name:'Add P-Sense',sub:'Small differential → full high/low levels',question:'Which PMOS pulls the high side to 1 V?',objective:'Keep the cross coupling, run N before P, and observe upper/lower supplies and latching.',stages:['Initial: upper and lower supply rails at half supply','N-sense: LAB falls','Low side falls: watch PMOS response','P_EN turns on: LA connects to supply','Regenerative amplification: high side rises','Latched: conduction condition does not guarantee large current'],dur:[2,2,12,2,16,5],why:['P_L/P_R are added, with gates also cross-connected to the opposite bitline. LA/LAB start at 0.5 V; P_EN is not yet on. The cell is still temporarily omitted.','LAB is pulled down first, and the two NMOS sides begin to differ in strength. The PMOS devices are already in the circuit; whether they conduct depends on actual VSG, not only the stage name.','When one side gate is already low, the opposite PMOS may conduct even before P_EN turns on. In the model LA has 40 fF capacitance and can briefly supply charge, so LA may fall first.','SAP_n falls, P_EN conducts, and the upper supply provides current that pulls LA toward 1 V. The PMOS whose gate is lower provides the stronger pull-up.','The low side controls the high-side PMOS, and the high side controls the low-side NMOS. Positive feedback amplifies the differential toward about 1 V / 0 V. The energy for regeneration comes from the supplies.','The high and low sides stay stable. Some devices may still meet conduction conditions, but their terminal voltage differences are small, so current is small. This is a sense-amplifier latch state, not the same as restored cell data.'],watch:['P_EN is modeled as an equivalent switch, and LA capacitance is counted as an equivalent load. The model is not a JEDEC-mandated internal topology.','Compare the live values of the two NMOS devices to identify which side pulls down more strongly.','This is why one PMOS may appear to act in the third stage; do not treat stored charge on LA as VINTA already being connected.','For read 0, P_R usually pulls BLB up while P_L cuts off; for read 1, left and right swap.','Compare the high-side voltage from the N-sense lesson; only now does it truly approach 1 V.','The next part reconnects the cell and covers restore, PRE, and READ/WRITE.'],assume:'βn = 1 and βp = 0.2 mA/V²; |VT| = 0.30 V; CBL = CBLB = 200 fF and CLA = 40 fF. P_EN is modeled as a controlled 2 kΩ path. LAB is ideally driven; the cell is not reconnected yet, and full command timing is absent.',bridgeTitle:'Done: from sharing to the sense core',bridge:'Lessons 1-8 have connected precharge, sharing, and N/P sensing. The next part reconnects the cell to show restore, row close, and column read/write; you can also compare the four sensing devices in the full version first.'}\n);\nlet singleGate=.5;\nfunction senseMosCurrent(a,b,g,p=false,beta=1){const m=mosCurrent(a,b,g,p);return {...m,i:m.i*beta/K};}\nfunction makeSenseTrace(){\n bounds=[0];lessons[lesson].dur.forEach(d=\u003ebounds.push(bounds.at(-1)+d));total=bounds.at(-1);trace=[];\n const shared=(.1+.02*bit)/.22;let bl=lesson===4?bit:lesson===5?.5:shared,br=lesson===4?1-bit:.5,cell=bit,la=.5;\n for(let n=0;n\u003c=Math.round(total/.005);n++){\n  const x=n*.005;let k=Math.min(bounds.length-2,bounds.findIndex((end,i)=\u003ei\u003e0\u0026\u0026x\u003cend)-1);if(k\u003c0)k=bounds.length-2;const u=x-bounds[k];\n  let eq=0,wl=0,lab=.5,pen=0,gl=.5,gr=shared,il=0,ir=0,pl=0,pr=0,ic=0,ie=0,ipl=0,ipr=0,ipower=0;\n  if(lesson===4){eq=k===1||k===2?1.5:0;wl=k===4?1.5:0;ie=eq?(bl-br)/50:0;ipl=eq?(.5-bl)/50:0;ipr=eq?(.5-br)/50:0;ic=wl?(bl-cell)/100:0;}\n  else{\n   lab=k===0?.5:k===1?.5*(1-Math.min(1,u/(lesson===6?.8:1.5))):0;\n   gl=lesson===5?singleGate:lesson===6\u0026\u0026k\u003c2?.5:br;\n   gr=lesson===6\u0026\u0026k\u003c2?shared:bl;\n   il=senseMosCurrent(bl,lab,gl).i;ir=lesson\u003e=6?senseMosCurrent(br,lab,gr).i:0;\n   if(lesson===7){pen=k\u003e=3?Math.min(1,(x-bounds[3])/.8):0;pl=senseMosCurrent(la,bl,br,true,.2).i;pr=senseMosCurrent(la,br,bl,true,.2).i;ipower=pen*(1-la)/2;}\n  }\n  trace.push({t:x,k,v:lesson===4?cell:bl,b:br,bl,cell,la,lab,eq,wl,pen,gl,gr,il,ir,pl,pr,ie,ipl,ipr,ipower,g:lesson===4?eq:gl,input:lesson===4?eq:lesson===5?singleGate:shared,i:lesson===4?ic:pl-il,on:lesson===4?!!eq:senseMosCurrent(bl,lab,gl).ov\u003e.001});\n  if(lesson===4){bl+=(ipl-ie-ic)/CB*.005;br+=(ipr+ie)/CB*.005;cell+=ic/C*.005;}\n  else{bl+=(pl-il)/CB*.005;br+=(pr-ir)/CB*.005;if(lesson===7)la+=(ipower-pl-pr)/.04*.005;}\n  bl=Math.max(0,Math.min(1,bl));br=Math.max(0,Math.min(1,br));la=Math.max(0,Math.min(1,la));\n }\n}\nfunction verticalSwitch(x,y,on,id){return part(id,`\u003cg style=\"color:${on?'#70efb5':'#eef5ff'}\"\u003e`+line(x,y-42,x,y-20)+line(x,y+20,x,y+42)+line(x,y-20,on?x:x+23,y+20,'device')+txt(x+30,y+5,id,'small','start')+'\u003c/g\u003e');}\nfunction coreMos(id,x,y,p,side,s){const l=id.endsWith('L'),a=p?s.la:(l?s.bl:s.b),b=p?(l?s.bl:s.b):s.lab,g=p?(l?s.b:s.bl):(l?s.gl:s.gr),j=senseMosCurrent(a,b,g,p,p?.2:1),on=(s.j?.[id]?.over??j.ov)\u003e.001;\n let body=`\u003cg style=\"color:${on?(p?'#ffd174':'#67ddff'):'#eef5ff'}\"\u003e\u003crect x=\"${x-38}\" y=\"${y-44}\" width=\"76\" height=\"88\" class=\"hit\"/\u003e`;\n if(symbol==='switch')body+=line(x,y-45,x,y-20)+line(x,y+20,x,y+45)+line(x,y-20,on?x:x+side*20,y+20,'device')+line(x+side*70,y,x+side*28,y,'device');\n else{body+=line(x,y-45,x,y-22)+line(x,y-22,x+side*10,y-22,'device')+line(x+side*10,y-22,x+side*10,y+22,'device')+line(x+side*10,y+22,x,y+22,'device')+line(x,y+22,x,y+45)+line(x+side*28,y-24,x+side*28,y+24,'device');if(p)body+=`\u003ccircle cx=\"${x+side*38}\" cy=\"${y}\" r=\"5\" class=\"device\"/\u003e`;body+=line(x+side*(p?43:28),y,x+side*70,y,'device');}\n body+=txt(x-side*28,y-8,id,'label',side===1?'end':'start')+'\u003c/g\u003e';return part(id,body);\n}\nfunction signalPath(d,c){return `\u003cpath d=\"${d}\" fill=\"none\" stroke=\"${c}\" stroke-width=\"2.5\"/\u003e`;}\nfunction senseCap(x,y,id,val){return part(id,line(x,y-35,x,y-8)+line(x-23,y-8,x+23,y-8,'device')+line(x-23,y+8,x+23,y+8,'device')+line(x,y+8,x,y+40)+ground(x,y+40)+txt(x,y-48,id+' · 200 fF','small')+txt(x,y+123,fmt(val)+' V','value'));}\nfunction drawSenseCircuit(s){let z=`\u003cdefs\u003e\u003cmarker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto-start-reverse\"\u003e\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#ffd174\"/\u003e\u003c/marker\u003e\u003c/defs\u003e`;\n $('circuit').setAttribute('viewBox','0 0 920 540');\n if(lesson===4){z+=txt(460,37,'VPRE = 0.500 V')+line(260,60,660,60)+line(260,60,260,88)+line(660,60,660,88)+verticalSwitch(260,130,!!s.eq,'M_PL')+verticalSwitch(660,130,!!s.eq,'M_PR')+line(260,172,260,345)+line(660,172,660,345)+line(260,240,410,240)+sw(460,240,!!s.eq,'M_EQ')+line(510,240,660,240)+cap(260,380,'BL','CBL',s.bl)+cap(660,380,'BLB','CBLB',s.b)+txt(450,115,`EQ = ${fmt(s.eq,1)} V`,'small');z+=arrow(230,85,230,175,s.ipl)+arrow(690,85,690,175,s.ipr)+arrow(365,215,550,215,s.ie);if(stage===4){z+=line(80,300,120,300)+fet(170,300,true,false,true,'M_A')+line(220,300,260,300)+line(80,300,80,345)+cap(80,380,'Cell','Cell',s.cell,'VPL = 0.5 V')+txt(130,185,'WL high; EQ already low','small');}z+=txt(460,510,'Three EQ switches are controlled together; the virtual SA is disabled','small');}\n if(lesson===5){z+=txt(150,150,'INPUT · external gate')+txt(150,188,fmt(s.gl)+' V','value')+line(150,220,150,285)+line(150,285,530,285)+coreMos('N_R',600,285,false,-1,{...s,b:s.bl,gr:s.gl})+line(600,240,600,100)+line(600,100,770,100)+line(770,100,770,155)+senseCap(770,190,'BL',s.bl)+line(600,330,600,405)+part('LAB',txt(600,440,'LAB = '+fmt(s.lab)+' V'))+txt(590,73,'OUTPUT · BL '+fmt(s.bl)+' V','label')+arrow(640,225,640,325,s.il)+txt(420,505,'Even with a fixed gate, it can conduct as the source falls','small');}\n if(lesson===6||lesson===7){const p=lesson===7,ny=p?355:260,top=p?275:145,bottom=p?420:350;\n  for(const [x,right]of [[300,false],[600,true]]){const capx=right?790:125;z+=line(x,top,capx,top)+line(capx,top,capx,top+30)+senseCap(capx,top+65,right?'BLB':'BL',right?s.b:s.bl)+line(x,top,x,ny-45)+coreMos(right?'N_R':'N_L',x,ny,false,right?-1:1,s)+line(x,ny+45,x,bottom)+txt(x,top-15,(right?'BLB ':'BL ')+fmt(right?s.b:s.bl)+' V','value')+arrow(x+(right?35:-35),ny-35,x+(right?35:-35),ny+35,right?s.ir:s.il);}\n  z+=line(300,bottom,600,bottom)+part('LAB',line(450,bottom,450,bottom+18)+txt(450,bottom+45,'LAB = '+fmt(s.lab)+' V','small'));\n  if(lesson===6\u0026\u0026stage\u003c2){for(const [x,y,gate,id]of [[370,ny,s.gl,'N_L'],[530,ny,s.gr,'N_R']]){z+=`\u003crect x=\"${x-52}\" y=\"${y-17}\" width=\"104\" height=\"34\" rx=\"5\" fill=\"#162436\" stroke=\"#67ddff\"/\u003e`+txt(x,y+5,fmt(gate)+' V','small');}z+=txt(450,105,'Gates are temporarily controlled by fixed signal sources','small');}\n  else if(!p){z+=signalPath('M300 145 V180 H409 Q420 192 431 180 H480 V260 H530','#67ddff')+signalPath('M600 145 V160 H420 V260 H370','#ffd174')+txt(450,100,'Crossed: BL → N_R; BLB → N_L','small');}\n  if(p){z+=part('P_EN',txt(450,23,'VINTA＝1 V')+line(450,33,450,38)+verticalSwitch(450,80,s.pen\u003e.01,'P_EN')+line(450,122,450,135))+line(300,135,600,135)+line(300,135,300,155)+line(600,135,600,155)+coreMos('P_L',300,200,true,1,s)+coreMos('P_R',600,200,true,-1,s)+line(300,245,300,275)+line(600,245,600,275)+part('LA',txt(655,137,'LA '+fmt(s.la)+' V','small','start'))+txt(80,40,'SAP_n＝'+fmt(1-s.pen,2)+' V','small','start');\n   z+=signalPath('M300 285 H409 Q420 297 431 285 H480 V200 H530 M480 285 V355 H530','#67ddff')+signalPath('M600 270 H491 Q480 258 469 270 H420 V200 H370 M420 270 V355 H370','#ffd174')+arrow(270,165,270,235,s.pl)+arrow(630,165,630,235,s.pr)+arrow(420,45,420,115,s.ipower);}\n  z+=`\u003ccircle cx=\"300\" cy=\"${top}\" r=\"4\" fill=\"#eef5ff\"/\u003e\u003ccircle cx=\"600\" cy=\"${top}\" r=\"4\" fill=\"#eef5ff\"/\u003e`;z+=txt(460,p?510:460,p?'Cell not reconnected yet: this lesson looks only at the sense core':'Pull-down only: the relatively high side is not a full 1 V yet','small');\n }\n $('circuit').innerHTML=z;}\nfunction sensePanels(s){const L=lessons[lesson];$('inputName').textContent=lesson===4?'EQ control':lesson===5?'External gate':'Initial BL − BLB';$('inputValue').textContent=lesson===4?fmt(s.eq,1)+' V':lesson===5?fmt(s.gl)+' V':fmt((((.1+.02*bit)/.22)-.5)*1000,2)+' mV';$('outputName').textContent=lesson===5?'BL output':'Current BL − BLB';$('outputValue').textContent=lesson===5?fmt(s.bl)+' V':fmt((s.bl-s.b)*1000,2)+' mV';$('currentValue').textContent=lesson===4?'Cell '+fmt(s.cell)+' V':'BL '+fmt(s.bl)+'/BLB '+fmt(s.b)+' V';\n if(lesson===4)$('formula').textContent=`EQ high: all three switches conduct together\\nI_PL = (VPRE − BL)/50 kΩ = ${fmt(s.ipl*1000)} µA\\nI_PR = (VPRE − BLB)/50 kΩ = ${fmt(s.ipr*1000)} µA\\nI_EQ(BL→BLB) = (BL − BLB)/50 kΩ\\n= ${fmt(s.ie*1000)} µA\\n\\ndBL/dt = (I_PL − I_EQ − I_Cell)/CBL\\nCurrent BL = ${fmt(s.bl,5)} V\\nCurrent BLB = ${fmt(s.b,5)} V\\n\\nConnect the cell only after releasing EQ\\nVshare ≈ (200×0.5+20×${bit})/220\\n≈ ${fmt((.1+.02*bit)/.22,5)} V`;\n else{\n const pair=lesson===5?[['N_R',s.bl,s.gl,s.il]]:[['N_L',s.bl,s.gl,s.il],['N_R',s.b,s.gr,s.ir]];\n let f=pair.map(([id,v,g,i])=\u003e`${id}：Gate = ${fmt(g)} V\\nVGS = VG − min(VD, VS)\\n= ${fmt(g-Math.min(v,s.lab))} V\\nVov = VGS − 0.300 V\\nI(bitline→LAB) = ${fmt(i*1000)} µA`).join('\\n\\n');\n f+='\\n\\ndV/dt = net current into node/C\\nβn = 1 mA/V²；CBL = 200 fF';\n if(lesson===6)f+='\\n'+(stage\u003c2?'The gate is currently fixed by an external signal source':'The gate is now connected back to the actual opposite bitline');\n if(lesson===7)f+=`\\n\\nP_L：VSG = ${fmt(Math.max(s.la,s.bl)-s.b)} V\\nI(LA→BL) = ${fmt(s.pl*1000)} µA\\nP_R：VSG = ${fmt(Math.max(s.la,s.b)-s.bl)} V\\nI(LA→BLB) = ${fmt(s.pr*1000)} µA\\nβp = 0.2 mA/V²\\n\\nLA = ${fmt(s.la)} V；CLA = 40 fF\\nCLA·dLA/dt = I_PEN − I_PL − I_PR\\nI_PEN = ${fmt(s.ipower*1000)} µA\\nStored current from LA can still appear before P_EN turns on`;\n $('formula').textContent=f;\n }\n}\nfunction senseWave(){const signals=lesson===4?[['bl','BL','#67ddff'],['b','BLB','#ffd174'],['eq','EQ','#70efb5']]:lesson===5?[['bl','BL','#ff91c4'],['gl','Gate','#67ddff'],['lab','LAB','#ffd174']]:[['bl','BL','#67ddff'],['b','BLB','#ffd174'],[lesson===7?'la':'lab',lesson===7?'LA':'LAB','#ff91c4']];$('legend').innerHTML=signals.map(([,n,c])=\u003e`\u003cspan style=\"color:${c}\"\u003e━ ${n}\u003c/span\u003e`).join(' ');let z='';for(const v of [0,.5,1,1.5]){const y=110-v*56;z+=`\u003cpath d=\"M45 ${y}H880\" stroke=\"#283544\" stroke-dasharray=\"3 5\"/\u003e`+txt(23,y+4,String(v),'small');}bounds.forEach(x=\u003ez+=`\u003cpath d=\"M${45+x/total*835} 20V113\" stroke=\"#223442\"/\u003e`);for(const [key,,c]of signals){const pts=trace.filter((s,i)=\u003es.t\u003c=t\u0026\u0026i%15===0);z+=`\u003cpath d=\"${pts.map((s,i)=\u003e(i?'L':'M')+(45+s.t/total*835).toFixed(2)+' '+(110-s[key]*56).toFixed(2)).join(' ')}\" fill=\"none\" stroke=\"${c}\" stroke-width=\"2\"/\u003e`;}z+=`\u003cpath d=\"M${45+t/total*835} 15V115\" stroke=\"white\"/\u003e`+txt(45,133,'0 ns','small','start')+txt(880,133,total+' ns','small','end');$('wave').innerHTML=z;}\n\n// Connect the earlier lessons to the same BLSA netlist used by the full lab.\nlessons[7].bridgeTitle='Next: sensing is complete, but what about the cell?';lessons[7].bridge='Reconnect M_A and the cell to BL, and observe how the sense amplifier amplifies while restoring the stored voltage. Then try closing WL early again.';\nlessons.push(\n {name:'Reconnect Cell / Restore',sub:'Latched is not restored',question:'SA has resolved 0/1; is the cell ready too?',objective:'Reconnect M_A and the cell, comparing normal WL hold with early isolation.',stages:[],dur:[],why:[],watch:[],assume:'Uses the full BLSA teaching netlist with mismatch set to 0. The diagram temporarily omits precharge, bias, and I/O branches, but they still operate according to the learned flow. Early WL close is an intentionally inserted failure experiment, not a normal DDR5 command.',bridgeTitle:'Next: close the row after data restore',bridge:'After cell restore completes, it must be isolated before the bitlines return to half supply. The next lesson adds PRE.'},\n {name:'PRE Row Close',sub:'Isolate first, then equalize',question:'Why does the cell not follow when BL returns to 0.5 V?',objective:'Start from an open row that has been fully restored, then close and precharge step by step.',stages:[],dur:[],why:[],watch:[],assume:'The initial state has already completed ACT, restore, and pre-PRE timing. Only the internal PRE actions are expanded; lower BL/BLB nodes with the same names connect back to the upper ones. Bias circuits are omitted from the diagram but remain in the model.',bridgeTitle:'Next: select one item from the row',bridge:'READ does not open the entire row again. The next lesson starts from an already open row and adds column switches, local I/O, and write drivers.'},\n {name:'Column READ/WRITE',sub:'Read data out or overwrite it',question:'How does data in the SA get sent out or overwritten?',objective:'Choose read or write 0/1, looking only at column actions after the row is open.',stages:[],dur:[],why:[],watch:[],assume:'The starting row has been fully sensed and restored, and column-command prerequisites are met. LIO/LIOB are local I/O. DQ is represented only as a differential sampling endpoint; DQS, serialization, and burst behavior are not simulated. Same-name BL/BLB on the right connect back to the sense amplifier.',bridgeTitle:'Next: connect the complete story',bridge:'Connect precharge, ACT, READ/WRITE, and PRE into a data-continuous flow, then compare refresh with CSL unopened.'},\n {name:'Complete BLSA Flow',sub:'Read, write, verify, refresh',question:'How do these small parts complete one full operation?',objective:'Switch storylines and trace cell, bitline, and I/O data segment by segment.',stages:[],dur:[],why:[],watch:[],assume:'Full BLSA teaching netlist. The view expands the main data paths, while supply-rail bias switches are shown as state text. Timing thresholds are teaching values, not a complete DDR5 compliance check. Refresh expands only one representative row.',bridgeTitle:'BLSA complete: next is OCSA',bridge:'You have connected the cell, sensing, restore, column read/write, and row close. The next part starts from device mismatch and gradually adds OCSA compensation and isolation paths. You can also compare in the full version first.'}\n);\nlet earlyClose=false,accessOp='RD',story='read',fullSim=null;\nconst flowWhy={\n release:['First release bitline precharge and equalization. The cell is not connected yet, preventing the later small differential from being clamped back to VPRE.','This is the EQ branch already learned; here it is simply the first step of ACT.'],\n share:['WL rises, M_A connects, and the cell shares charge with BL. The original full 0/1 in the cell is disturbed, and only a small differential appears on BL.','Watch the cell and BL waveforms together. There is no restore yet and no data sent to DQ.'],\n nsense:['SAN enables and LAB falls; the two NMOS devices begin to differ in pull-down strength. As long as WL remains on, the cell is already changing with BL, so restore does not suddenly start only in the next segment.','For read 0 the low side is BL; for read 1 it is BLB. The result is determined by actual voltage, not by naming.'],\n psense:['P_EN enables, and the upper supply pulls the higher side up through PMOS devices. WL remains on, so the cell continues restoring toward the sensed result.','Resolving high and low in the sense amplifier does not mean the small capacitor reached a full level at the same instant.'],\n restore:['Hold WL and sense supplies so the cell fully restores. Read 1 must be replenished high, and read 0 must be pulled back low; both data values require restore.','Compare normal operation with early WL close: the sense amplifier may still decide correctly, while the cell keeps only the intermediate shared voltage.'],\n active:['The sense amplifier remains latched and WL stays on. Later column reads/writes may occur in the same row, but command timing limits still apply.','The diagram shows SA nodes and the cell together so they are not confused as the same storage location.'],\n wlclose:['Pull WL low first so M_A cuts off and isolates the cell from BL. Then BL can be precharged to 0.5 V without rewriting the cell along with it.','Observe that the cell waveform holds while BL/BLB continue changing afterward.'],\n saoff:['SAP_n rises and SAN falls, stopping the pull-up and pull-down supplies of the sense amplifier. This does not instantly zero every node.','Stop the strong drive first, then equalize, so shorted high/low bitlines are not still fighting through both supplies.'],\n equalize:['EQ enables both precharge paths and M_EQ together. BL/BLB exchange charge and return to VPRE; supply-rail bias circuits also prepare for the next sensing event.','The cell is isolated, so the data remains in the cell. PRE itself is not refresh.'],\n standby:['BL/BLB are near 0.5 V, and the cell keeps the previous data. The next ACT still must satisfy post-PRE limits such as tRP.','This is the prepared state after row close, not clearing the cell to 0.5 V.'],\n iorelease:['Release local I/O precharge first so LIO/LIOB can be data-driven; the bitline sense amplifier remains open-row.','IOEQ and bitline EQ are two different controls; releasing I/O precharge does not re-ACT the row.'],\n read:['CSL turns on Y_L/Y_R, and the data latched in the SA builds a differential on LIO/LIOB. Energy comes from the sense-amplifier supplies, not directly from the small cell driving the external output.','Watch the column switches and the voltages on the two I/O lines.'],\n capture:['At the end of this segment, the sign of LIO − LIOB is sampled to form this read result. Before the sampling point, the display shows not sampled, so it should not be treated as valid output early.','An insufficient differential shows X. This is a teaching validity marker, not a third DQ logic state.'],\n readclose:['CSL closes and isolates the column path. This sampled result is retained, while the SA and cell still hold the row data.','READ completion does not automatically turn WL off; the same row can continue with reads or writes.'],\n ioreset:['Local I/O returns to the precharge reference to prepare for the next data item. This only handles LIO/LIOB; it is not PRE row close.','Keep bitlines BL/BLB distinct from local I/O LIO/LIOB.'],\n wdrive:['The write driver first establishes new LIO/LIOB voltages while CSL remains closed. Write data enters here; changing the cell label is not a completed write.','Choose write 0/write 1, and optionally set the starting cell to the same value to observe same-value rewrite.'],\n write:['CSL connects, and new data changes the sensing nodes through the column path, then writes the cell through M_A. Early in a flip, the new drive may fight the old latched state.','Watch the continuous cell change and actual write current; rewriting the same value may not produce a large flip.'],\n wclose:['Close CSL first to isolate the rewritten sense amplifier from the external write driver; WL is still on at this point.','Do not mistake column-switch closure for cell isolation.'],\n wrecover:['After the write driver stops, the SA keeps the new value and the cell continues restoring. Before row close, write recovery and ACT→PRE limits still must be met.','The teaching model uses the internal write end as the demonstration reference for tWR; real devices define this relative to external data/CK rules.'],\n refselect:['REF selects a row through internal refresh control, then performs sharing, sensing, restore, and closes the row by itself. CSL does not open during refresh, and no new DQ readout is produced.','This demo starts from a slightly degraded cell voltage; refresh must occur while the data is still readable correctly.']\n};\nlet tutorialOffset=.012;\nconst ocWhy={\n release:['First release EQ and supply-rail bias. The cell is not connected yet, so the next measured effect is the sense amplifier own asymmetry.','This example follows the cited standby state: ISO and OC are both high. The compensation stage does not need to raise OC from low again.'],\n oc:['ISO opens while OC remains conducting; sensing supplies turn on. BL connects to SR and BLB to SL, forming a calibration loop that converts mismatch into compensation bias on the nodes.','At this point WL = 0. Unequal BL/BLB does not mean the cell is being read; it means the compensation baseline is being established.'],\n hold:['OC turns off and the bitlines retain the just-created bias; sensing supplies pause and LA/LAB return to bias.','What is held is node charge, not a permanent change in transistor VT. Real circuits are affected by leakage, coupling, and switching noise.'],\n share:['WL connects the cell, and the data causes an additional change on the already compensated BL. ISO and OC remain off.','Before sharing this time, BL is not necessarily exactly 0.5 V; the formula must use the actual initial value for this segment.'],\n presense:['Sensing supplies turn back on, first amplifying the differential on the small-load SL/SR nodes. The outer BL/BLB still connect to NMOS gates and control current, even though both ISO/OC conductive paths are open.','Isolation does not mean no signal at all: gate electric-field control remains. But the cell has not yet been restored by the internal full-swing result.'],\n restore:['ISO reconnects: SL→BL and SR→BLB. WL remains on, so restore current then passes through M_A into the cell.','OC remains off; otherwise it would cross-connect the opposite side again. Only after restore is the data stored robustly.']};\nfor(const [name,sub,question,objective]of [\n ['Why Add Compensation','BLSA mismatch problem','If the seesaw already leans to one side, can it still decide a small signal correctly?','Change the NMOS threshold-voltage difference and observe the sensing result for the same cell data.'],\n ['OCSA: Calibrate Itself First','Isolate → compensate → hold','Why does BL show a differential before the cell is connected?','Look only at ISO/OC and offset sampling; stop at compensation hold instead of playing the full read first.'],\n ['OCSA: Add Data','Sharing → presense → restore','With ISO off, how does the sense amplifier still know the cell data?','Continue from the compensation state, distinguish gate control from conductive path, then reconnect the cell at the end.'],\n ['OCSA: Complete Story','Read / write / refresh','After adding compensation, what changes in the complete read/write flow?','Compare OCSA read, write, write-then-readback, and refresh in the same framework; CSL and EQ are shown in the same diagram.']\n])lessons.push({name,sub,question,objective,stages:[],dur:[],why:[],watch:[],assume:'OCSA is a bitline sense amplifier with offset cancellation; it is not a universal replacement for every BLSA. This ISO/OC example follows US20200227111A1 Fig. 3 and Fig. 6A-E; it is not a transistor-by-transistor recreation of the 2018 SVC paper. Extra switches, calibration time, and parasitic load are the costs.',bridgeTitle:'Connect the next part',bridge:'For the same sensing goal, first handle internal mismatch, then read the small signal from the cell.'});\nlessons[11].bridgeTitle='Next: real transistors are not identical';lessons[11].bridge='Earlier we used a symmetric sense amplifier. Next we add mismatch to see why offset compensation is needed.';\nfunction ocPanels(s){const st=fullSim.stages[stage],L=lessons[lesson];if(lesson===12){$('explain').textContent='BLSA names the bitline sense-amplifier function; OCSA is one implementation class that adds offset compensation. Lower supply voltage reduces the available cell signal, and as devices shrink, left/right mismatch is harder to ignore. When the data differential is close to the offset, positive feedback can amplify the wrong direction. Change the mismatch option and replay sensing.';$('watch').textContent='ΔVT is not the complete input-referred offset Vos of the SA. Currents in the two devices are determined together by instantaneous VGS, VDS, and VT; positive feedback can also amplify the wrong direction.';}\nelse if(ocWhy[st.key]){[$('explain').textContent,$('watch').textContent]=ocWhy[st.key];}\n$('formula').textContent+=`\\n\\nVT,N_L = ${fmt(.3+tutorialOffset/2)} V\\nVT,N_R = ${fmt(.3-tutorialOffset/2)} V\\nΔVT = ${fmt(tutorialOffset*1000,1)} mV\\nI_NL = ${fmt(s.j.N_L.i*1000)} µA\\nI_NR = ${fmt(s.j.N_R.i*1000)} µA\\nΔVBL = ${fmt((s.bl-s.b)*1000)} mV\\nΔVsignal ≈ Ccell/(CBL+Ccell) × (Vcell−VPRE)\\nLower supply → signal margin may shrink\\nDesign concept: |ΔVsignal| must exceed residual offset and noise\\n(ΔVT is not used directly as Vos)`;\nif(lesson\u003e=13){$('inputName').textContent='ISO/OC/WL';$('inputValue').textContent=[s.ctrl.ISO,s.ctrl.OC,s.wl].map(v=\u003efmt(v,1)).join('/')+' V';$('formula').textContent+=`\\n\\nSL = ${fmt(s.sl)} V; SR = ${fmt(s.sr)} V\\nISO: BL↔SL, BLB↔SR\\nOC: BL↔SR, BLB↔SL\\nPresense: ISO=0, OC=0\\nRestore: ISO=1.5, OC=0`;\nif(st.key==='share'){const start=flowSample(st.start);$('formula').textContent+=`\\nVshare ≈ (200×${fmt(start.bl,5)} + 20×${fmt(start.cell,5)})/220\\n= ${fmt((.2*start.bl+.02*start.cell)/.22,5)} V\\nReference BLB ≈ ${fmt(start.b,5)} V`;}}\n$('assumptions').textContent=L.assume+' The model includes NMOS VT mismatch but does not cover all process effects or noise. Internal voltages and durations are teaching choices, not JEDEC-specified topology.';}\nfunction ocConfig(){if(lesson\u003c12)return;const box=$('config');box.insertAdjacentHTML('afterb els(s);else if(lesson\u003e=4)sensePanels(s);drawCircuit(s);drawWave();}\nfunction drawWave(){if(lesson\u003e=8)return flowWave();if(lesson\u003e=4)return senseWave();const colors=['#ff91c4','#67ddff','#ffd174'],keys=lesson===3?['v','b','g']:['v','g','input'];$('legend').innerHTML=(lesson===3?['Cell','BL','WL']:['Vc',lesson===0?'SW':lesson===1?'Gate':'WL','Vin']).map((n,i)=\u003e`\u003cspan style=\"color:${colors[i]}\"\u003e━ ${n}\u003c/span\u003e`).join(' ');let z='';for(const v of [0,.5,1,1.5]){const y=110-v*56;z+=`\u003cpath d=\"M45 ${y}H880\" stroke=\"#283544\" stroke-dasharray=\"3 5\"/\u003e`+txt(23,y+4,String(v),'small');}bounds.forEach(x=\u003e{z+=`\u003cpath d=\"M${45+x/total*835} 20V113\" stroke=\"#223442\"/\u003e`;});for(let j=0;j\u003ckeys.length;j++){const pts=trace.filter((s,i)=\u003es.t\u003c=t\u0026\u0026(i%15===0||Math.abs(s.t-t)\u003c.006));z+=`\u003cpath d=\"${pts.map((s,i)=\u003e(i?'L':'M')+(45+s.t/total*835).toFixed(2)+' '+(110-s[keys[j]]*56).toFixed(2)).join(' ')}\" fill=\"none\" stroke=\"${colors[j]}\" stroke-width=\"2\"/\u003e`;}z+=`\u003cpath d=\"M${45+t/total*835} 15V115\" stroke=\"white\"/\u003e`+txt(45,133,'0 ns','small','start')+txt(880,133,total+' ns','small','end');$('wave').innerHTML=z;}\nfunction stop(){run=false;cancelAnimationFrame(raf);last=0;}\nfunction go(k,play=false){stop();stage=k;t=bounds[k];render();if(play)start(false);}\nfunction start(all=false){stop();if(t\u003e=bounds[stage+1]-.01)t=bounds[stage];auto=all;run=true;last=0;render();raf=requestAnimationFrame(tick);}\nfunction tick(now){if(!run)return;if(last){t+=Math.min(.1,(now-last)/1000)*+$('speed').value*(bounds[stage+1]-bounds[stage])/5;if(t\u003e=bounds[stage+1]){t=bounds[stage+1]-.00001;if(auto\u0026\u0026stage\u003clessons[lesson].stages.length-1){stage++;t=bounds[stage];}else stop();}}last=now;render();if(run)raf=requestAnimationFrame(tick);}\nfunction reset(){stop();stage=0;t=0;makeTrace();render();}\nlet lessonsCollapsed=null;\nfunction syncLessonMenu(){const hi
