"\u003e1.0 V（觀察傳高限制）\u003c/option\u003e\u003c/select\u003e\u003c/label\u003e';if(n===5)c='\u003clabel\u003e外加 Gate \u003cinput id=\"singleGate\" type=\"range\" min=\".3\" max=\".65\" step=\".005\" value=\"'+singleGate+'\"\u003e\u003coutput id=\"singleGateValue\"\u003e'+fmt(singleGate)+' V\u003c/output\u003e\u003c/label\u003e';if(n\u003e0)c+='\u003cbutton id=\"symbol\"\u003eMOS／開關\u003c/button\u003e';c+='\u003cspan class=\"note\"\u003e改輸入會重置本課；點元件看解釋\u003c/span\u003e';$('config').innerHTML=c;if($('bit')){$('bit').value=bit;$('bit').onchange=e=\u003e{bit=+e.target.value;reset();};}if($('wl')){$('wl').value=wlHigh;$('wl').onchange=e=\u003e{wlHigh=+e.target.value;reset();};}if($('type'))$('type').onchange=e=\u003e{mosType=e.target.value;gateOn=mosType==='n'?1:0;$('gate').value=gateOn;$('gateLabel').textContent=fmt(gateOn,2)+' V';reset();};if($('gate'))$('gate').oninput=e=\u003e{gateOn=+e.target.value;$('gateLabel').textContent=fmt(gateOn,2)+' V';reset();};if($('singleGate'))$('singleGate').oninput=e=\u003e{singleGate=+e.target.value;$('singleGateValue').textContent=fmt(singleGate)+' V';reset();};if($('symbol'))$('symbol').onclick=()=\u003e{symbol=symbol==='mos'?'switch':'mos';render();};flowConfig();ocConfig();reset();}\nconst glossary={R:['電阻 R','電阻限制電流，讓充放電需要時間。I＝(Vin−Vc)/R；壓差愈小，電流愈小。'],SW:['理想開關','接通建立導電通路，斷開隔離兩側。它本身不產生電壓；電容上的電位可以在斷開後保留。'],C:['電容 C','電流改變電荷，電荷改變端點電壓。I＝C·dV/dt。此課下極板接地；電壓不是「電流還在流」的證明。'],NMOS:['NMOS','Gate 對低電位通道端的電壓 VGS 超過 VT 後開始明顯導通。這一課放在下拉通路，把輸出電容的電荷帶到接地端。'],PMOS:['PMOS','高電位通道端對 Gate 的電壓 VSG 超過 |VT| 後開始明顯導通。這一課從 VDD 提供電流，將輸出電容拉高。'],M_A:['存取電晶體 M_A','WL 是控制端，左右導電端連接外側與 Cell。第三課使用平方律 MOS；第四課為看清電荷守恆，將導通通路等效成固定 RON。開關圖示不會改變數值模型。'],Cell:['儲存電容 Ccell','20 fF 是教學選值。下極板 VPL 固定 0.5 V；Qcell＝Ccell(Vcell−VPL)。儲存 0 不代表電容兩端電壓為零。'],BL:['位線與等效電容 CBL','位線金屬、元件與連接帶來分布電容，本課集中成 200 fF。它不是說晶片一定另外放一顆 200 fF 離散電容。'],source:['教材與範圍','概念依據：DRAM Circuit Design: Fundamental and High-Speed Topics，第 1.2 節；CMOS VLSI Design 與 Sedra/Smith 的 MOS、電容基本模型。本教學使用理想 RC、簡化長通道 MOS 和電荷守恆教學模型，不是 JEDEC 規定的內部電路或電壓值。第⑨～⑫課加入 Cell 恢復與欄位讀寫；第⑬～⑯課加入 OCSA。來源：https://patents.google.com/patent/US20200227111A1/en 。2018 SVC 論文：https://ieeexplore.ieee.org/document/8330545/ ，它是另一種補償方案；不能把兩者當成同一電路。']};\nfunction detail(id){stop();render();const x=(lesson\u003e=13?({P_L:['左側 PMOS','Gate 接 SR，導電端接 LA 與 SL。對側 SR 低時上拉 SL。'],P_R:['右側 PMOS','Gate 接 SL，導電端接 LA 與 SR。'],N_L:['左側 NMOS','Gate 仍接外側 BLB，導電端接 SL 與 LAB。ISO 關閉時，BLB 仍以 Gate 電場控制電流。'],N_R:['右側 NMOS','Gate 仍接 BL，導電端接 SR 與 LAB。'],Y_L:['左側欄位開關','OCSA 從 SL 接到 LIO；不是直接從外側 BL 讀出。'],Y_R:['右側欄位開關','OCSA 從 SR 接到 LIOB。']})[id]:null)||glossary[id]||[id,'點選輸入，播放本段，觀察元件兩端電壓與電流。'];$('detailTitle').textContent=x[0];$('detailText').textContent=x[1].replaceAll('极','極');$('detail').showModal();}\n$('play').onclick=()=\u003estart(false);$('again').onclick=()=\u003ego(stage,true);$('pause').onclick=()=\u003e{stop();render();};$('all').onclick=()=\u003e{go(0);start(true);};$('next').onclick=()=\u003ego(Math.min(stage+1,lessons[lesson].stages.length-1),true);$('seek').oninput=e=\u003e{const q=+e.target.value;stop();t=bounds[stage]+q/1000*(bounds[stage+1]-bounds[stage])-.000001;t=Math.max(bounds[stage],t);render();};$('bridgeButton').onclick=()=\u003e{if(lesson\u003clessons.length-1)choose(lesson+1);else window.open('https://dram-circuit-lab.tira8697.chatgpt.site','_blank','noopener');};$('close').onclick=()=\u003e$('detail').close();$('source').onclick=()=\u003edetail('source');document.addEventListener('click',e=\u003e{const l=e.target.closest('[data-lesson]'),s=e.target.closest('[data-stage]'),p=e.target.closest('[data-part]');if(l)choose(+l.dataset.lesson);if(s)go(+s.dataset.stage,true);if(p)detail(p.dataset.part);});$('circuit').addEventListener('keydown',e=\u003e{if(e.key==='Enter'||e.key===' '){const p=e.target.closest('[data-part]');if(p){e.preventDefault();detail(p.dataset.part);}}});\nObject.assign(glossary,{BLB:['互補位線 BLB','本次未接所選 Cell 的參考支路。後續也是交叉耦合的另一個感測節點；不是固定不動的理想參考電源。'],N_L:['左側 NMOS','Gate 接 BLB 時，BLB 較高會使左側下拉更強，將 BL 拉低。第⑦課前兩段使用外加 Gate 示範，接線段才改用對側位線。'],N_R:['右側 NMOS','第⑥課 Gate 使用外加訊號；第⑦、⑧課接回 BL。右側的下拉電流會改變 BLB；不是 Gate 在提供這條導電電流。'],P_L:['左側 PMOS','Gate 接 BLB，對側電位低時，從 LA 向 BL 提供上拉電流。是否導通取決於當下 VSG，不只看 P_EN 是否開啟。'],P_R:['右側 PMOS','Gate 接 BL，從 LA 向 BLB 提供上拉電流。LA 在 P_EN 開啟前也可存有電荷。'],LA:['上方供電軌 LA','本課包含 40 fF 等效電容。P_EN 未開時，儲存電荷也可能流經 PMOS；P_EN 開啟後才由 VINTA 持續供應。'],LAB:['下方供電軌 LAB','本課用理想控制軌表示 N_EN 的動作。拉低 LAB 能增加 NMOS 的 VGS；實際控制訊號 SAN 與此供電軌不是同一個節點。'],P_EN:['上拉供電開關','SAP_n 為低時啟用。本課用受控電阻代表供電管，把 VINTA 連到 LA。'],M_PL:['左側預充電開關','EQ 高時將 BL 接向 VPRE。與 M_PR、M_EQ 同時作用。'],M_PR:['右側預充電開關','EQ 高時將 BLB 接向 VPRE。'],M_EQ:['位線等化開關','EQ 高時連接 BL 與 BLB，讓兩條位線交換電荷；另外兩個預充電開關同時連回 VPRE。']});\nObject.assign(glossary,{Y_L:['左側欄位開關','CSL 控制 BL 與 LIO 的通路，READ／WRITE 都會使用它。它不控制 WL。'],Y_R:['右側欄位開關','CSL 同時控制互補支路 BLB 與 LIOB。'],IO_PL:['局部 I/O 預充電','IOEQ 控制，把 LIO 拉回 VPRE；與位線 EQ 不同。'],IO_PR:['互補 I/O 預充電','IOEQ 控制，把 LIOB 拉回 VPRE。'],W_PL:['左側寫入上拉','寫 1 時由 VINTA 向 LIO 提供電流。'],W_NL:['左側寫入下拉','寫 0 時把 LIO 拉向 VSS。'],W_PR:['右側寫入上拉','寫 0 時把互補線 LIOB 拉高。'],W_NR:['右側寫入下拉','寫 1 時把互補線 LIOB 拉低。']});\nObject.assign(glossary,{ISO_L:['左側隔離管','連接 BL 與 SL；預感測時關閉，恢復時接通。'],ISO_R:['右側隔離管','連接 BLB 與 SR。'],OC_L:['交叉補償管','連接 BL 與 SR。此拓撲在待機即導通；校準時 ISO 關閉而 OC 維持導通。'],OC_R:['交叉補償管','連接 BLB 與 SL；校準後關閉，位線保留補償偏壓。'],N_EN:['下拉供電管','SAN 高時把 LAB 拉向 VSS。'],readout:['讀出取樣端','以 LIO−LIOB 的符號與教學裕度判讀，在 capture 段末才更新 DQ。此功能方塊省略局部/全域感測、序列化及外部 PHY。Refresh 不產生新 DQ。'],writerL:['左側寫入驅動','W_PL 上拉 LIO，W_NL 下拉 LIO。圖中以功能方塊收納，模擬仍計算兩顆 MOS 的電流。'],writerR:['右側寫入驅動','W_PR 上拉 LIOB，W_NR 下拉 LIOB，與左側建立相反資料。']});\nchoose(Math.max(0,Math.min(lessons.length-1,(Number((location.hash.match(/^#lesson-(\\d+)$/)||[])[1])||1)-1)));window.BeginnerLab={choose,at,getTrace:()=\u003etrace,getFlowSimulation:()=\u003efullSim,setOffset:x=\u003e{tutorialOffset=x;reset();},setEarly:x=\u003e{earlyClose=x;reset();},setAccess:x=\u003e{accessOp=x;reset();},setStory:x=\u003e{story=x;reset();},setSingleGate:x=\u003e{singleGate=x;reset();},getState:()=\u003e({lesson,stage,t,run,view}),seek:(k,q)=\u003e{go(k);t=bounds[k]+(bounds[k+1]-bounds[k])*q-.00001;t=Math.max(bounds[k],t);render();},setBit:x=\u003e{bit=x;reset();},setMOS:(type,g)=\u003e{mosType=type;gateOn=g;reset();},setWL:x=\u003e{wlHigh=x;reset();}};\n\u003c/script\u003e\u003c/body\u003e\u003c/html\u003e\n", "glossary": "\u003c!doctype html\u003e\u003chtml lang=\"zh-Hant\"\u003e\u003cscript\u003e\n(function(){const originalOpen=window.open;function route(h){if(!h||h[0]==='#')return null;const base=h.split('#')[0].split('?')[0];if(/^https?:/.test(h)\u0026\u0026!h.startsWith('https://dram-circuit-lab.tira8697.chatgpt.site'))return null;const file=base.split('/').pop();return ({'index.html':'index','beginner.html':'beginner','glossary.html':'glossary','flow.html':'flow','':'index'})[file]||(base==='https://dram-circuit-lab.tira8697.chatgpt.site'?'index':null);}\ndocument.addEventListener('click',function(e){const a=e.target.closest('a');if(!a)return;const r=route(a.getAttribute('href'));if(r){e.preventDefault();top.showLab(r);}},true);window.open=function(url,...args){const r=route(String(url));if(r){top.showLab(r);return null;}return originalOpen.call(window,url,...args);};})();\n\u003c/script\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\u003ctitle\u003eDRAM 名詞解釋\u003c/title\u003e\u003cstyle\u003e*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#05070a;color:#edf5ff;font:16px/1.6 system-ui,\"Microsoft JhengHei\",sans-serif}header{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid #263749}nav{display:flex;gap:16px;flex-wrap:wrap}a{color:#73dcff}button,select,input{font:inherit;color:inherit;background:#111f2e;border:1px solid #39546d;border-radius:7px;padding:7px 11px}button{cursor:pointer}button:disabled{opacity:.4}button:hover,a:hover{color:#ffd174}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ffd174;outline-offset:3px}h1{font-size:23px;margin:0}h2{font-size:21px}p{margin:8px 0 16px}.muted{color:#a9bad0;font-size:14px}.panel{background:#0c131d;border:1px solid #293d50;border-radius:10px;padding:16px;min-width:0}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 20px}pre{font:15px/1.7 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#9be5ff}label{display:flex;align-items:center;gap:8px}article{scroll-margin-top:12px}small{font-size:14px}main{max-width:1250px;margin:auto;padding:20px}.intro{max-width:850px}.term-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.badge{font-size:14px;color:#70efb5}h2{margin:4px 0}dt{color:#ffd174;font-size:14px}dd{margin:0 0 12px}.jump{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}@media(max-width:760px){.term-grid{grid-template-columns:1fr}header{display:block}nav{margin-top:8px}}@media print{nav,.jump{display:none}.panel{break-inside:avoid}body{background:white;color:black}}\u003c/style\u003e\u003cheader\u003e\u003ch1\u003eDRAM 名詞解釋\u003c/h1\u003e\u003cnav\u003e\u003ca href=\"beginner.html\"\u003e分段教學\u003c/a\u003e\u003ca href=\"glossary.html\"\u003e名詞解釋\u003c/a\u003e\u003ca href=\"flow.html\"\u003e完整流程\u003c/a\u003e\u003ca href=\"index.html\"\u003e電路實驗室\u003c/a\u003e\u003c/nav\u003e\u003c/header\u003e\u003cmain\u003e\u003cp class=\"intro\"\u003e先分清「外部規格」與「內部電路」。JEDEC 定義命令、接腳與時序；WL、CSL、EQ、ISO 等內部名稱則依電路實作與文獻而定。\u003c/p\u003e\u003cdiv class=\"jump\"\u003e\u003ca href=\"#cat0\"\u003e外部介面\u003c/a\u003e\u003ca href=\"#cat1\"\u003e命令與位址\u003c/a\u003e\u003ca href=\"#cat2\"\u003e內部電路\u003c/a\u003e\u003ca href=\"#cat3\"\u003e電壓與模型\u003c/a\u003e\u003ca href=\"#cat4\"\u003e時序\u003c/a\u003e\u003c/div\u003e\u003csection id=\"cat0\"\u003e\u003ch2\u003e外部介面\u003c/h2\u003e\u003cdiv class=\"term-grid\"\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e外部介面\u003c/span\u003e\u003ch2\u003eCS_n\u003c/h2\u003e\u003cp class=\"muted\"\u003eChip Select／晶片選擇\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e外部命令選擇訊號，參與命令編碼及 Rank 選擇。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e由控制器送到 DRAM；高低狀態依命令真值表解讀。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e不是 CSL；CSL 在晶片內部選欄。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：JESD79-5C §2.6 Table 3\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e外部介面\u003c/span\u003e\u003ch2\u003eCA[13:0]\u003c/h2\u003e\u003cp class=\"muted\"\u003eCommand / Address\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e承載命令碼與位址的外部輸入線。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e控制器透過 CA 送 ACT、READ、WRITE 與對應位址。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003eCA 不是直接接到 WL 或 CSL 的控制電壓。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：JESD79-5C Table 3、30\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e外部介面\u003c/span\u003e\u003ch2\u003eCK_t / CK_c\u003c/h2\u003e\u003cp class=\"muted\"\u003e差動時脈\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e外部命令與位址取樣的時序基準。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e規格以時脈邊緣及時間限制定義何時接受命令。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e不等於動畫內部每顆開關都在同一個邊緣切換。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：JESD79-5C Table 3\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e外部介面\u003c/span\u003e\u003ch2\u003eDQ\u003c/h2\u003e\u003cp class=\"muted\"\u003eData Input / Output\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e雙向資料接腳。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e讀取時 DRAM 輸出，寫入時控制器輸入。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e動畫的 DQ 方塊是判讀結果，省略序列化與實際 PHY。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：JESD79-5C Table 3\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e外部介面\u003c/span\u003e\u003ch2\u003eDQS_t / DQS_c\u003c/h2\u003e\u003cp class=\"muted\"\u003eData Strobe\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e伴隨資料傳輸的差動資料選通信號。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003eREAD 由 DRAM 送出，WRITE 由控制器送入。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003eDQS 不負責選擇 DRAM 內部哪一欄。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：JESD79-5C Table 3\u003c/small\u003e\u003c/article\u003e\u003c/div\u003e\u003c/section\u003e\u003csection id=\"cat1\"\u003e\u003ch2\u003e命令與位址\u003c/h2\u003e\u003cdiv class=\"term-grid\"\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e命令與位址\u003c/span\u003e\u003ch2\u003eACT\u003c/h2\u003e\u003cp class=\"muted\"\u003eActivate／開列\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e選取 Bank 與 Row，開始該列的內部感測與恢復。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e列開啟後，感測器維持這一列的資料。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003eACT 本身不把這整列直接輸出到外部 DQ。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：JESD79-5C Table 30\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e命令與位址\u003c/span\u003e\u003ch2\u003eREAD / RD\u003c/h2\u003e\u003cp class=\"muted\"\u003e讀取命令\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e指定已開啟列中的欄位資料並安排外部讀出。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e欄位選擇後，資料經 I/O 階層送向 DQ。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e同列連續 READ 不需每次重做 ACT。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：JESD79-5C Table 30\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e命令與位址\u003c/span\u003e\u003ch2\u003eWRITE / WR\u003c/h2\u003e\u003cp class=\"muted\"\u003e寫入命令\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e把外部資料寫入所指定的欄位。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e寫入驅動改變感測節點，透過仍開啟的 WL 改寫 Cell。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003eWRITE 結束不能忽略寫入恢復時間就立即 PRE。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：JESD79-5C 命令及時序章節\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e命令與位址\u003c/span\u003e\u003ch2\u003ePRE\u003c/h2\u003e\u003cp class=\"muted\"\u003ePrecharge／預充電命令\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e關閉開啟的列，讓位線回到下一次感測的準備狀態。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e內部先隔離 Cell，再停止感測強驅動並等化。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003ePRE 不會替漏電的 Cell 完成刷新。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：JESD79-5C Table 30；電路教材 §1.2\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e命令與位址\u003c/span\u003e\u003ch2\u003eREF\u003c/h2\u003e\u003cp class=\"muted\"\u003eRefresh／刷新\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e由內部刷新位址控制執行資料恢復。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e示意流程：選列→感測→恢復→關列；不需把資料送到 DQ。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e不是外部控制器逐欄 READ 再 WRITE；單一動畫只代表一列。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：JESD79-5C Refresh；電路教材 §1.2\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e命令與位址\u003c/span\u003e\u003ch2\u003eRow / Column\u003c/h2\u003e\u003cp class=\"muted\"\u003e列位址／欄位址\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003eRow 選一列；Column 選已開啟列中的資料群。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003eACT 提供 Row，READ／WRITE 提供 Column。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e一次 burst 不一定等於只接通一對位線。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：JESD79-5C Table 30\u003c/small\u003e\u003c/article\u003e\u003c/div\u003e\u003c/section\u003e\u003csection id=\"cat2\"\u003e\u003ch2\u003e內部電路\u003c/h2\u003e\u003cdiv class=\"term-grid\"\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e內部電路\u003c/span\u003e\u003ch2\u003eCSL\u003c/h2\u003e\u003cp class=\"muted\"\u003eColumn Select Line／欄選擇線\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e內部欄位解碼與時序控制產生的選擇訊號。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e開啟 Y_L／Y_R，把選中的感測節點接到局部 I/O。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e不是 JEDEC 外部接腳或獨立命令，也不是 CS_n。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：電路名稱；外部對應 READ／WRITE＋Column Address\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e內部電路\u003c/span\u003e\u003ch2\u003eWL\u003c/h2\u003e\u003cp class=\"muted\"\u003eWord Line／字線\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e控制一列 Cell 存取電晶體 Gate 的內部線。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003eWL 高時 M_A 連接 Cell 與 BL；WL 低時隔離保存。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003eWL 電壓不是 Cell 的資料電壓，也不等於外部 VPP 接腳。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：DRAM Circuit Design §1.2\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e內部電路\u003c/span\u003e\u003ch2\u003eCell / Ccell\u003c/h2\u003e\u003cp class=\"muted\"\u003e儲存單元／儲存電容\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e1T1C 中由一顆存取管與一顆電容保存資料。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e固定極板電位時，Qcell = Ccell(Vcell−VPL)。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e存 0 不表示電容兩端的電壓必然為零。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：DRAM Circuit Design §1.2\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e內部電路\u003c/span\u003e\u003ch2\u003eBL / BLB\u003c/h2\u003e\u003cp class=\"muted\"\u003eBit Line／互補位線\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e傳遞 Cell 小訊號的位線對。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003eCell 接入一側，感測器利用兩側差值判讀。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003eBLB 不是全程固定在半電源的理想電壓源。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：DRAM Circuit Design §1.2\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e內部電路\u003c/span\u003e\u003ch2\u003eBLSA\u003c/h2\u003e\u003cp class=\"muted\"\u003eBit-Line Sense Amplifier\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e把微小位線差值再生為明確高低位的感測器。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e使用交叉耦合正回授，並在 WL 開啟時恢復 Cell。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003eBLSA 是功能名稱；並非與 OCSA 完全互斥的分類。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：DRAM Circuit Design §1.2\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e內部電路\u003c/span\u003e\u003ch2\u003eOCSA\u003c/h2\u003e\u003cp class=\"muted\"\u003eOffset-Cancellation Sense Amplifier\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e加入偏移補償的感測器類型。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e先建立補償偏壓，減少失配對後續判讀的影響。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e不是所有 DRAM 都換成同一種 OCSA；不同論文有不同拓撲。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：US20200227111A1 Fig.3、6A–E\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e內部電路\u003c/span\u003e\u003ch2\u003eSL / SR\u003c/h2\u003e\u003cp class=\"muted\"\u003eSABL / SABLB／內部感測節點\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e本教學 OCSA 核心的左右小負載節點。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003eISO 關閉時可先在 SL／SR 預感測，再接回大位線。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003eSL／SR 與外側 BL／BLB 不一定有相同電位。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：US20200227111A1\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e內部電路\u003c/span\u003e\u003ch2\u003eISO\u003c/h2\u003e\u003cp class=\"muted\"\u003eIsolation／隔離控制\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e控制外側位線與同側內部感測節點的通路。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003eISO_L 接 BL↔SL；ISO_R 接 BLB↔SR。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e導電通路隔離後，接在 BL／BLB 的 NMOS Gate 仍可控制電流。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：本教學 OCSA 拓撲\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e內部電路\u003c/span\u003e\u003ch2\u003eOC\u003c/h2\u003e\u003cp class=\"muted\"\u003eOffset Cancellation／補償控制\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e控制交叉補償通路。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003eOC_L 接 BL↔SR；OC_R 接 BLB↔SL。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e此拓撲待機 OC 已高；補償啟動靠切斷 ISO 與啟用感測供電。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：US20200227111A1 Fig.6、8\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e內部電路\u003c/span\u003e\u003ch2\u003eEQ\u003c/h2\u003e\u003cp class=\"muted\"\u003eEqualization／等化控制\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e本模型同時控制 M_EQ、M_PL、M_PR。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003eM_EQ 拉近兩側電位；預充電管把共模拉向 VPRE。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003eEQ 不是 CSL；共享與感測時不可持續把位線等化。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：DRAM Circuit Design §1.2；教學命名\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e內部電路\u003c/span\u003e\u003ch2\u003eLIO / LIOB\u003c/h2\u003e\u003cp class=\"muted\"\u003eLocal I/O／局部資料線\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e連接選中的感測器與後續讀寫電路的資料線對。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003eREAD 把差值送出；WRITE 從此處驅動新資料。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003eLIO 不是晶片外部 DQ 接腳。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：內部電路命名\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e內部電路\u003c/span\u003e\u003ch2\u003eIOEQ\u003c/h2\u003e\u003cp class=\"muted\"\u003e局部 I/O 預充電控制\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e將 LIO／LIOB 準備在教學基準電位。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e讀寫前解除，欄位關閉後可重新啟用。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e與位線 EQ 分開；IOEQ 啟用不表示正在 PRE 關列。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：教學周邊命名\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e內部電路\u003c/span\u003e\u003ch2\u003eM_A / Y_L / Y_R\u003c/h2\u003e\u003cp class=\"muted\"\u003e存取管／欄位管\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003eM_A 由 WL 控制；Y_L、Y_R 由 CSL 控制。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e前者連 Cell 與 BL；後者連感測器與 I/O。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e關閉 CSL 不代表已關閉 WL。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：教學元件標記\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e內部電路\u003c/span\u003e\u003ch2\u003eN_L / N_R / P_L / P_R\u003c/h2\u003e\u003cp class=\"muted\"\u003e交叉耦合感測核心\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003eNMOS 負責下拉，PMOS 負責上拉。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e由 Gate、Source、Drain 的即時電位決定導通與電流。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e導通不一定有顯著電流；兩端沒有壓差時電流可接近零。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：MOS 模型與電路教材\u003c/small\u003e\u003c/article\u003e\u003c/div\u003e\u003c/section\u003e\u003csection id=\"cat3\"\u003e\u003ch2\u003e電壓與模型\u003c/h2\u003e\u003cdiv class=\"term-grid\"\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e電壓與模型\u003c/span\u003e\u003ch2\u003eVDD / VDDQ / VPP\u003c/h2\u003e\u003cp class=\"muted\"\u003e外部供電名稱\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e分別用於規格定義的供電域；VDDQ 與 I/O 供電相關。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e實際電壓與條件依裝置與 JEDEC 規格。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e教學內部 1 V、WL 1.5 V 不應當成 DDR5 接腳規格值。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：JESD79-5C 電源與電氣規格\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e電壓與模型\u003c/span\u003e\u003ch2\u003eVPRE / VPL / VINTA\u003c/h2\u003e\u003cp class=\"muted\"\u003e內部預充電／極板／感測供電\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e本例分別為 0.5 V、0.5 V、1 V。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003eVPRE 準備位線；VPL 是 Cell 下極板；VINTA 提供感測能量。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e相同數值不表示是同一條實體電源線；也不是 JEDEC 指定的內部值。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：教學選值及電路文獻\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e電壓與模型\u003c/span\u003e\u003ch2\u003eLA / LAB / SAP_n / SAN\u003c/h2\u003e\u003cp class=\"muted\"\u003e感測供電軌／啟用控制\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003eLA、LAB 是供電節點；SAP_n、SAN 是本模型供電管的控制。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003eSAP_n 低啟用上拉，SAN 高啟用下拉。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e控制訊號與受控制的供電軌是不同節點。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：教學拓撲命名\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e電壓與模型\u003c/span\u003e\u003ch2\u003eVT / ΔVT / Vos\u003c/h2\u003e\u003cp class=\"muted\"\u003e臨界電壓／失配／輸入等效偏移\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003eVT 是單管參數；ΔVT 是兩管差；Vos 是整體判讀偏移。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e偏移可能使小訊號被判成錯誤方向。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e不能把 ΔVT 直接當作所有電路的 Vos。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：MOS 與感測器分析\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e電壓與模型\u003c/span\u003e\u003ch2\u003eCharge Sharing\u003c/h2\u003e\u003cp class=\"muted\"\u003e電荷共享\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003eCell 與位線電容接通後重新分配電荷。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003eVshare ≈ (CBL·VBL,初+Ccell·Vcell,初)/(CBL+Ccell)。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e此式需固定極板電位，並忽略其他通路與耦合；OCSA 要用補償後初值。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：DRAM Circuit Design §1.2\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e電壓與模型\u003c/span\u003e\u003ch2\u003ePositive Feedback / Restore\u003c/h2\u003e\u003cp class=\"muted\"\u003e正回授／資料恢復\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e正回授放大差值；恢復將已判讀的電位寫回 Cell。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e讀 0 與讀 1 都需要恢復。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003eSA 已鎖存不代表 Cell 已充分恢復。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：DRAM Circuit Design §1.2\u003c/small\u003e\u003c/article\u003e\u003c/div\u003e\u003c/section\u003e\u003csection id=\"cat4\"\u003e\u003ch2\u003e時序\u003c/h2\u003e\u003cdiv class=\"term-grid\"\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e時序\u003c/span\u003e\u003ch2\u003etRCD\u003c/h2\u003e\u003cp class=\"muted\"\u003eACT 到讀寫命令的最小間隔\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e限制開列後何時能接受相應欄位命令。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e從 ACT 參考事件起算，感測在其中進行。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e不是感測做完後才另加一整段 tRCD。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：JEDEC 命令時序\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e時序\u003c/span\u003e\u003ch2\u003etRAS / tRP / tRC\u003c/h2\u003e\u003cp class=\"muted\"\u003e列開啟／預充電／列循環時間\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e限制 ACT→PRE、PRE→後續 ACT 與同 Bank ACT→ACT 等時序。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e電路狀態與時間條件都滿足，才能進入下一操作。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e不能把 tRAS 完全等同動畫 Restore 一段。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：JEDEC 命令時序\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e時序\u003c/span\u003e\u003ch2\u003etRTP / tWR\u003c/h2\u003e\u003cp class=\"muted\"\u003e讀到預充電／寫入恢復\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e約束讀寫後何時允許 PRE。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e需遵守所選模式、burst 與規格的起算定義。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e動畫內部寫入末端只是 tWR 教學參考，非完整外部 CK／DQ 定義。\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003e依據：JEDEC 命令時序\u003c/small\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003e時序\u003c/span\u003e\u003ch2\u003etRFC\u003c/h2\u003e\u003cp class=\"muted\"\u003e刷新恢復時間\u003c/p\u003e\u003cdl\u003e\u003cdt\u003e是什麼\u003c/dt\u003e\u003cdd\u003e限制相應刷新操作之後的命令時序。\u003c/dd\u003e\u003cdt\u003e在流程中的工作\u003c/dt\u003e\u003cdd\u003e本流程圖以 REF 忙碌結束檢查表示。\u003c/dd\u003e\u003cdt\u003e容易混淆\u003c/dt\u003e\u003cdd\u003e實際值依刷新類型與裝置等條件，不是所有 DDR5 固定 295 ns。\u003c/dd\u003e\u003c/dl\u003e\u003csmall .clockpass{color:#75f1be}.clockwait{color:#ffbf5b}.timingbody details{margin:16px 0}.timingbody summary{cursor:pointer;font-size:14px}.timingbody h3{font-size:16px}#timingInputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}#timingInputs label{display:grid;grid-template-columns:50px 1fr 18px;align-items:center;gap:4px;font-size:13px}#timingInputs input{width:100%;min-width:0;background:#080d14;color:#fff;border:1px solid #466078;border-radius:4px;padding:6px}#timingApplied{font-size:13px;color:#75f1be}.commandrow{display:grid;grid-template-columns:50px 1fr 1fr;gap:5px;padding:8px 0;border-bottom:1px solid #233343;font-size:13px}.commandrow small{grid-column:1/-1;color:#acbdd0}\n.timing-details\u003esummary{cursor:pointer;padding:12px 18px;color:var(--cyan);font-size:14px}.timing-details{border-top:1px solid var(--line)}\n\n/* Only annotation overlays; original circuit geometry and toolbar are preserved. */\n.teaching-badge{cursor:pointer}.teaching-box{fill:#070c12;fill-opacity:.97;stroke:currentColor;stroke-width:1.5}.teaching-leader{fill:none;stroke:currentColor;stroke-width:1.4;stroke-dasharray:3 5;pointer-events:none;opacity:.7}.teaching-name{fill:currentColor;font-weight:650}.teaching-short{fill:#f4f7fc}.teaching-live{fill:#bccddd}.teaching-badge:hover .teaching-box,.teaching-badge:focus .teaching-box{stroke-width:3}#teachingToggle{cursor:pointer}#teachingToggle text{fill:#c9e5f5}#teachingDetail{position:fixed;z-index:50;overflow:auto;overscroll-behavior:contain;background:#080e16;color:#e7eff8;border:1px solid var(--teaching-color);border-radius:12px;box-shadow:0 18px 65px #000c;padding:16px;cursor:auto;font-size:16px;line-height:1.75}#teachingDetail[hidden]{display:none}.teaching-head{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--teaching-color)}.teaching-head button{min-width:40px}#teachingStage,.teaching-foot{font-size:14px;color:#aebdd0}#teachingEquation{font-family:ui-monospace,monospace;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;background:#101c29;border-radius:7px;padding:12px;color:#d7edff}#teachingText p{margin:14px 0}#teachingDetail button:focus-visible{outline:2px solid var(--teaching-color)}\n\u003c/style\u003e\u003c/head\u003e\n\u003cbody\u003e\n\u003cheader class=\"topbar\"\u003e\u003cdiv class=\"brand\"\u003e\u003cspan class=\"brandmark\"\u003e∥\u003c/span\u003e\u003cdiv\u003e\u003cstrong\u003eDRAM Circuit Lab\u003c/strong\u003e\u003csmall\u003eSee how data changes from one cell\u003c/small\u003e\u003c/div\u003e\u003c/div\u003e\u003cnav aria-label=\"Circuit Architecture\"\u003e\u003cbutton class=\"tab selected\" data-mode=\"blsa\" aria-pressed=\"true\"\u003e01 \u003cb\u003eBLSA\u003c/b\u003e\u003cspan\u003eBitline Sensing\u003c/span\u003e\u003c/button\u003e\u003cbutton class=\"tab\" data-mode=\"ocsa\" aria-pressed=\"false\"\u003e02 \u003cb\u003eOCSA\u003c/b\u003e\u003cspan\u003eOffset Compensation\u003c/span\u003e\u003c/button\u003e\u003c/nav\u003e\u003ca href=\"glossary.html\"\u003eGlossary\u003c/a\u003e\u003ca href=\"flow.html\"\u003eFull Flow\u003c/a\u003e\u003cbutton id=\"sourceBtn\" class=\"quiet\"\u003eModel and Sources\u003c/button\u003e\u003c/header\u003e\n\u003cmain\u003e\n\u003csection class=\"casebar\"\u003e\u003cdiv class=\"casepicker\"\u003e\u003clabel for=\"caseSelect\"\u003eCASE STUDY \u003cspan id=\"caseCount\"\u003e17 Cases\u003c/span\u003e\u003c/label\u003e\u003cselect id=\"caseSelect\" aria-label=\"Choose a story line\"\u003e\u003c/select\u003e\u003c/div\u003e\u003cp id=\"caseGoal\"\u003e\u003c/p\u003e\u003c/section\u003e\n\u003cdiv class=\"workspace\"\u003e\n\u003csection class=\"circuit-panel panel\"\u003e\n\u003csection class=\"toolbar\" aria-label=\"Playback Controls\"\u003e\u003cdiv class=\"playcontrols\"\u003e\u003cbutton id=\"playAll\" class=\"primary\"\u003e▶ Play All\u003c/button\u003e\u003cbutton id=\"pause\" disabled\u003ePause\u003c/button\u003e\u003cbutton id=\"replay\"\u003e↻ This Stage\u003c/button\u003 3e\u003cspan id=\"localSenseLegend\" hidden style=\"color:#aa99ff\"\u003e┄ SABL / SABLB\u003c/span\u003e\u003c/div\u003e\u003csvg id=\"localWave\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Voltages and control signals around the current stage\"\u003e\u003c/svg\u003e\u003cp class=\"scope-note\"\u003eWhite line: current progress · follows the stage\u003c/p\u003e\u003c/aside\u003e\n\u003cdiv class=\"circuit-viewport\" id=\"viewport\"\u003e\u003csvg id=\"circuit\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1100 1160\" role=\"img\" aria-label=\"Complete clickable DRAM circuit\"\u003e\u003c/svg\u003e\u003c/div\u003e\n\u003caside class=\"stage-brief\" aria-label=\"Current Flow Highlights\"\u003e\u003cdiv class=\"brief-heading\"\u003e\u003cstrong\u003eWhat is happening now\u003c/strong\u003e\u003cspan id=\"briefCount\"\u003e\u003c/span\u003e\u003c/div\u003e\u003ch2 id=\"briefStage\"\u003e\u003c/h2\u003e\u003cp id=\"briefWhat\"\u003e\u003c/p\u003e\u003ch3\u003eWhy this is done\u003c/h3\u003e\u003cp id=\"briefWhy\"\u003e\u003c/p\u003e\u003cp id=\"briefWiring\" class=\"brief-note\"\u003e\u003c/p\u003e\u003cdiv id=\"briefTrigger\"\u003e\u003c/div\u003e\u003csection class=\"brief-capacitors\"\u003e\u003ch3\u003eHow the bitline capacitors are changing\u003c/h3\u003e\u003cdiv id=\"briefCaps\"\u003e\u003c/div\u003e\u003cp id=\"briefCapWhy\" class=\"brief-note\"\u003e\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch3\u003eMain branch currents \u003csmall\u003eµA\u003c/small\u003e\u003c/h3\u003e\u003cdiv id=\"briefCurrents\"\u003e\u003c/div\u003e\u003cp class=\"brief-note\"\u003eDirections and values come from the current model; click a component to see its region and detailed parameters.\u003c/p\u003e\u003c/section\u003e\u003c/aside\u003e\n\u003c/div\u003e\n\u003cdiv class=\"sr-only\"\u003e\u003cdiv\u003e\u003cspan class=\"eyebrow\" id=\"architecture\"\u003eBLSA / TRANSISTOR VIEW\u003c/span\u003e\u003ch1 id=\"circuitHeading\"\u003eBitline Sensing Circuit\u003c/h1\u003e\u003c/div\u003e\u003cspan id=\"currentStepCompact\" class=\"compact-step\"\u003e\u003c/span\u003e\u003c/div\u003e\n\u003clabel class=\"scrubber\"\u003e\u003cspan class=\"sr-only\"\u003eDrag through case progress\u003c/span\u003e\u003cinput id=\"scrub\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\" step=\"1\"\u003e\u003c/label\u003e\n\u003c/section\u003e\n\u003caside class=\"explanation\" id=\"explanation\" hidden data-section=\"flow\"\u003e\u003cdiv class=\"detailtabs\"\u003e\u003cbutton data-detail=\"flow\" aria-pressed=\"true\"\u003eFlowchart\u003c/button\u003e\u003cbutton data-detail=\"formula\" aria-pressed=\"false\"\u003eFormulas and Derivations\u003c/button\u003e\u003cbutton id=\"closeExplanation\" aria-label=\"Close Explanation\"\u003e✕\u003c/button\u003e\u003c/div\u003e\u003csection class=\"panel nowpanel\"\u003e\u003cdiv class=\"panelhead\"\u003e\u003cspan class=\"eyebrow\"\u003eCURRENT STEP\u003c/span\u003e\u003cspan id=\"stageCounter\" class=\"counter\"\u003e\u003c/span\u003e\u003c/div\u003e\u003ch2 id=\"stepTitle\"\u003e\u003c/h2\u003e\u003cp id=\"stepIntro\"\u003e\u003c/p\u003e\u003cdiv class=\"statusline\" id=\"stepStatus\"\u003e\u003c/div\u003e\u003cdiv class=\"localprogress\"\u003e\u003cspan id=\"localBar\"\u003e\u003c/span\u003e\u003c/div\u003e\u003c/section\u003e\n\u003csection class=\"panel flowpanel\"\u003e\u003cdiv class=\"panelhead\"\u003e\u003ch2\u003eThis Operation Flow\u003c/h2\u003e\u003cbutton id=\"playOperation\" class=\"mini\"\u003e▶ Play This Operation\u003c/button\u003e\u003c/div\u003e\u003cdiv id=\"flowchart\" class=\"flowchart\"\u003e\u003c/div\u003e\u003c/section\u003e\n\u003csection class=\"panel formulapanel\"\u003e\u003cdiv class=\"panelhead\"\u003e\u003ch2\u003eLive Calculation\u003c/h2\u003e\u003cspan class=\"eyebrow\"\u003eLIVE\u003c/span\u003e\u003c/div\u003e\u003cdiv id=\"formula\"\u003e\u003c/div\u003e\u003cdetails class=\"timing-details\"\u003e\u003csummary\u003eCommand Timing and Teaching Thresholds\u003c/summary\u003e\u003cdiv class=\"timingbody\"\u003e\u003cp class=\"scope-note\"\u003eThis panel checks the seven listed timing relationships. The thresholds are adjustable teaching values; this page does not specify a complete DDR5 speed grade, MR, or burst configuration.\u003c/p\u003e\u003cdiv id=\"timingLive\"\u003e\u003c/div\u003e\u003cdetails\u003e\u003csummary\u003eAdjust teaching thresholds (applying returns to the start)\u003c/summary\u003e\u003cform id=\"timingForm\"\u003e\u003cdiv id=\"timingInputs\"\u003e\u003c/div\u003e\u003cbutton type=\"submit\"\u003eApply\u003c/button\u003e \u003cbutton id=\"resetTiming\" type=\"button\"\u003eRestore Case\u003c/button\u003e\u003cp id=\"timingApplied\" role=\"status\"\u003e\u003c/p\u003e\u003c/form\u003e\u003c/details\u003e\u003cp class=\"formula-note\"\u003etRCD is counted from ACT and overlaps charge sharing, sensing, and restore; only the missing time is waited. Multiple limits use the latest expiry, not a sum.\u003c/p\u003e\u003cp class=\"formula-vars\"\u003eThis model does not simulate external DQ/CK. WD_REF is placed at the end of the internal write stage only to demonstrate the tWR reference event; real tWR is counted from the first CK rising edge after the last write data per JEDEC (JESD79-5C §4.8.2). nCK rounding, tCCD, read/write turnarounds, cross-bank/rank behavior, tFAW, and tREFI scheduling are not checked, so this cannot claim JEDEC compliance.\u003c/p\u003e\u003ch3\u003eIssued Commands\u003c/h3\u003e\u003cdiv id=\"timingLog\"\u003e\u003c/div\u003e\u003c/div\u003e\u003c/details\u003e\u003c/section\u003e\n\u003c/aside\u003e\u003c/div\u003e\n\u003csection class=\"timeline panel\"\u003e\u003cdiv class=\"panelhead\"\u003e\u003ch2\u003eVoltages and Control Signals\u003c/h2\u003e\u003cbutton id=\"focusWave\" class=\"mini\"\u003eExpand Oscilloscope\u003c/button\u003e\u003cspan id=\"timeLabel\"\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"wavelegend\"\u003e\u003cspan style=\"color:#59e2ff\"\u003e━ BL\u003c/span\u003e\u003cspan style=\"color:#ffbf5b\"\u003e━ BLB\u003c/span\u003e\u003cspan style=\"color:#fd83c9\"\u003e━ Cell\u003c/span\u003e\u003cspan id=\"senseLegend\" hidden style=\"color:#aa99ff\"\u003e┄ SABL / SABLB\u003c/span\u003e\u003cspan\u003eBelow: WL / EQ / SAN / SAP_n / CSL / ISO / OC\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"wavewrap\"\u003e\u003csvg id=\"wave\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1260 300\" role=\"img\" aria-label=\"Synchronized voltage and control-signal waveforms\"\u003e\u003c/svg\u003e\u003c/div\u003e\u003c/section\u003e\n\u003cfooter\u003e\u003cspan\u003eSingle-cell teaching model · VINTA = 1.00 V · Ccell = 20 fF · CBL = 200 fF\u003c/span\u003e\u003cspan\u003eAnimation time is slowed down; it does not represent JEDEC minimum timing.\u003c/span\u003e\u003c/footer\u003e\n\u003c/main\u003e\n\u003cdialog id=\"componentDialog\"\u003e\u003cdiv class=\"dialoghead\"\u003e\u003cspan class=\"eyebrow\"\u003eCOMPONENT INSPECTOR\u003c/span\u003e\u003cbutton data-close=\"componentDialog\" aria-label=\"Close Component Description\"\u003e✕\u003c/button\u003e\u003c/div\u003e\u003cdiv id=\"componentBody\"\u003e\u003c/div\u003e\u003cbutton data-close=\"componentDialog\" class=\"primary full\"\u003eBack to Circuit\u003c/button\u003e\u003c/dialog\u003e\n\u003cdialog id=\"sourceDialog\"\u003e\u003cdiv class=\"dialoghead\"\u003e\u003ch2\u003eModel, Naming, and Sources\u003c/h2\u003e\u003cbutton data-close=\"sourceDialog\" aria-label=\"Close Model Description\"\u003e✕\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"prose\"\u003e\n\u003cp\u003e\u003cb\u003eBLSA：\u003c/b\u003eBased on the cross-coupled sensing principle in Keeth et al., DRAM Circuit Design: Fundamental and High-Speed Topics, printed pages 26-28, and the equalization/column-select circuits in Chapter 2, with explicit supply, I/O precharge, and write-driver branches added.\u003c/p\u003e\n\u003cp\u003e\u003cb\u003eOCSA：\u003c/b\u003eThe compensation core follows \u003ca href=\"https://patents.google.com/patent/US20200227111A1/en\" target=\"_blank\" rel=\"noopener\"\u003eUS20200227111A1; Fig. 3, 6A-6E, and 8\u003c/a\u003e, using an architecture that switches connections with ISO and OC. P_L / N_L correspond to patent P2 / N2; P_R / N_R correspond to P1 / N1. During precharge, ISO and OC are both high; during compensation only ISO is lowered, OC remains high, and the sense supply is switched (Fig. 6A-6B). Therefore standby OC = 1.5 V is the intended state for this architecture. Supply biasing, I/O, and write circuits are teaching peripherals. This is not a reproduction of the previously mentioned 2018 SVC paper, and it does not represent any vendor DDR5 netlist.\u003c/p\u003e\n\u003cp\u003e\u003cb\u003eJEDEC：\u003c/b\u003eCommand, external-signal, and timing names are based on the user-provided JESD79-5C_v1.30. BL, WL, CSL, LA, LAB, VINTA, VPRE, and component numbers are internal circuit names, not JEDEC-specified chip-internal netlist names. External VPP is not the WL node in this model.\u003c/p\u003e\n\u003ch3\u003eComputation Method\u003c/h3\u003e\u003cp\u003eNumerical integration uses KCL at each node and long-channel square-law MOS current. All node voltages, branch arrows, and component states come from the same model; they are not pre-drawn voltage curves. Switching between MOS and switch views changes only the drawing.\u003c/p\u003e\u003cdiv class=\"eq\"\u003eC · dV/dt = Σ I\u003csub\u003ein\u003c/sub\u003e − Σ I\u003csub\u003eout\u003c/sub\u003e\u003c/div\u003e\n\u003cp\u003eVINTA = 1 V; VPRE = VPL = 0.5 V; high level for WL/ISO/OC/CSL = 1.5 V (teaching boosted controls); CBL = CBLB = 200 fF, Ccell = 20 fF, OCSA CSABL = CSABLB = 20 fF, and CIO = 50 fF. Both pages use the same NMOS mismatch: VT,N_L = 0.306 V and VT,N_R = 0.294 V. betaP = 0.2 and betaN = 1 mA/V^2; these are example parameters.\u003c/p\u003e\n\u003cp\u003e\u003cb\u003eCapacitance Ratio:\u003c/b\u003eCcell:CBL = 20:200 = 1:10, intentionally showing a small charge-sharing signal. With VINTA = 1 V and VPRE = 0.5 V, the BLSA sharing offset is about +/-45.45 mV. This is not a JEDEC-specified internal capacitance ratio, and it does not claim that all DDR5 uses 1:5 to 1:8. OCSA should use the actual compensated initial BL voltage.\u003c/p\u003e\u003cp\u003e\u003cb\u003eRead Validity:\u003c/b\u003eOnly Delta VIO \u0026gt; +10 mV is interpreted as 1, and Delta VIO \u0026lt; -10 mV as 0; anything else is shown as X. The 10 mV value is a teaching threshold. X is the simulator’s uncertain state, not a third physical logic value on DQ.\u003c/p\u003e\u003cp\u003eSubthreshold conduction, body effect, parasitic coupling, channel-length modulation, junction leakage, and control feedthrough are ignored; only the Leakage case adds an equivalent leakage branch I = G(0.5 - Vcell). The compensation amount is solved by the circuit, is not assumed equal to Delta VT, and is not claimed to eliminate offset completely.\u003c/p\u003e\n\u003ch3\u003eScope and Timing\u003c/h3\u003e\u003cp\u003eThe page shows one bitline pair and one cell. READ/WRITE I/O, column switches, and write drivers are drawn explicitly; serialization, DQS, external DQ drive, and the full DDR5 burst are represented by a functional endpoint. The DQ panel shows the sampled value for this transaction, not a complete pin waveform.\u003c/p\u003e\u003cp\u003eREF demonstrates internal data restore for a selected refreshed row; it does not mean every REF command refreshes only one WL. REFab/REFsb bank scheduling and refresh counters are outside this circuit-level animation.\u003c/p\u003e\u003cp\u003eThe ns values on screen are this example model’s time. This version tracks ACT, READ, PRE, REF, and WD_REF events, automatically waits for and checks the remaining time for tRCD, tRAS, tRP, tRC, tRTP, tWR, and tRFC. The default numbers and the Wait Observation case are teaching settings, not a complete JEDEC speed grade; even passing the listed rules cannot prove a real command sequence is compliant. Actual values and CK-cycle limits must be looked up by density, speed grade, MR, and command sequence.\u003c/p\u003e\n\u003cp\u003eTiming-rule references: JESD79-5C_v1.30 §4.7.2 (printed page 137: tRTP/tRAS/tRP/tRC), §4.8.2 (page 148: tWR reference point), and §4.13 (page 168: REF and tRFC). OCSA compensation behavior is verified only in this model and these cases; PVT, noise, and mismatch-range validation is not complete.\u003c/p\u003e\u003c/div\u003e\u003c/dialog\u003e\n\u003cscript\u003e/* DRAM Circuit Lab. Educational long-channel MOS transient model.\n * Units: V, ns, pF, mA. Not a DDR5 timing or process sign-off model.\n * OCSA core connectivity: US20200227111A1, Fig.3 / Fig.6A–E.\n * Named rail/column/write drivers are explicit illustrative peripheral circuits.\n */\n(function(global){\n'use strict';\nconst C={BL:.2,BLB:.2,CELL:.02,SL:.02,SR:.02,LA:.04,LAB:.04,LIO:.05,LIOB:.05};\nconst nodes=Object.keys(C), caps=nodes.map(n=\u003eC[n]), ix=Object.fromEntries(nodes.map((n,i)=\u003e[n,i]));\nconst rail={VINTA:1,VSS:0,VPRE:.5,VPL:.5};\nconst clamp=(v,a=0,b=1)=\u003eMath.max(a,Math.min(b,v));\n// Rule demonstration only: no speed-bin / MR / burst configuration is implied.\nconst timingDefaults={tRCD:16,tRAS:32,tRP:16,tRC:48,tRTP:7.5,tWR:30,tRFC:295};\nconst senseMargin=.01; // 10 mV illustrative input margin, not a JEDEC specification.\nfunction decideRead(delta,margin=senseMargin){return !Number.isFinite(delta)||Math.abs(delta)\u003c=margin?'X':delta\u003e0?1:0;}\nconst scenarios=[\n {id:'read0',group:'Simple Cases',name:'Read 0',init:0,ops:['ACT','RD','PRE'],goal:'Open the row from a cell storing 0, read 0, then close the row.'},\n {id:'read1',group:'Simple Cases',name:'Read 1',init:1,ops:['ACT','RD','PRE'],goal:'Open the row from a cell storing 1, read 1, then close the row.'},\n {id:'write0',group:'Simple Cases',name:'Write 0 (1 -\u003e 0)',init:1,ops:['ACT','W0','PRE'],goal:'The write driver changes the original 1 to 0, then closes the row after write recovery completes.'},\n {id:'write1',group:'Simple Cases',name:'Write 1 (0 -\u003e 1)',init:0,ops:['ACT','W1','PRE'],goal:'The write driver changes the original 0 to 1, then closes the row after write recovery completes.'},\n {id:'act0',group:'Single Operation',name:'ACT: Cell = 0',init:0,ops:['ACT'],goal:'Focus only on row activation, charge sharing, and sensing; the row stays open at the end.'},\n {id:'act1',group:'Single Operation',name:'ACT: Cell = 1',init:1,ops:['ACT'],goal:'Focus only on row activation, charge sharing, and sensing; the row stays open at the end.'},\n {id:'pre0',group:'Single Operation',name:'PRE: Open-row 0',init:0,open:true,ops:['PRE'],goal:'The initial state has completed ACT and restore; play only row close, sense disable, and equalization.'},\n {id:'pre1',group:'Single Operation',name:'PRE: Open-row 1',init:1,open:true,ops:['PRE'],goal:'The initial state has completed ACT and restore; observe how the cell keeps 1 after isolation.'},\n {id:'refresh0',group:'Single Operation',name:'Refresh 0',init:.12,ops:['REF'],goal:'The cell’s low level has leaked up to 0.12 V; refresh restores it near 0 V.'},\n {id:'refresh1',group:'Single Operation',name:'Refresh 1',init:.88,ops:['REF'],goal:'The cell’s high level has leaked down to 0.88 V; refresh restores it near 1 V.'},\n {id:'verify01',group:'Case study',name:'Write 1 -\u003e Close Row -\u003e Read Back',init:0,ops:['ACT','W1','PRE','ACT','RD','PRE'],goal:'Read back after a new ACT to confirm the data was stored in the cell, not merely latched as 1 in the sense amplifier.'},\n {id:'verify10',group:'Case study',name:'Write 0 -\u003e Close Row -\u003e Read Back',init:1,ops:['ACT','W0','PRE','ACT','RD','PRE'],goal:'Observe the complete sequence of write flipping, isolated retention, and reading 0 back.'},\n {id:'same0',group:'Case study',name:'Rewrite Same Value 0 -\u003e 0',init:0,ops:['ACT','W0','RD','PRE'],goal:'Control actions still occur without a logic flip; at steady state, no continuous charge/discharge should be drawn.'},\n {id:'same1',group:'Case study',name:'Rewrite Same Value 1 -\u003e 1',init:1,ops:['ACT','W1','RD','PRE'],goal:'Separate the write action from bit flipping, and observe the write drivers and column switches.'},\n {id:'rowhit',group:'Case study',name:'Same-row Read -\u003e Write -\u003e Read',init:0,ops:['ACT','RD','W1','RD','W0','RD','PRE'],goal:'The same row remains open; READ does not reopen WL each time and does not automatically PRE.'},\n {id:'retention',group:'Case study',name:'Write 1 -\u003e Leakage -\u003e Refresh -\u003e Read Back',init:0,ops:['ACT','W1','PRE','WAIT','REF','ACT','RD','PRE'],goal:'Connect storage, illustrative leakage, and refresh. REF itself does not send data to DQ.'},\n {id:'timingwait',group:'Timing Observation',name:'Wait Observation: ACT -\u003e READ -\u003e PRE -\u003e Open Row Again',init:0,timing:{tRCD:120,tRAS:180,tRP:50,tRC:230},ops:['ACT','RD','PRE','ACT','W1','PRE'],goal:'Intentionally extend teaching thresholds to observe the remaining time for tRCD, tRAS, and tRP/tRC; this is not a DDR5 speed grade.'},\n /*{id:'margin0',group:'Compensation Comparison',name:'Weak Signal 0 + NMOS Mismatch',init:.36,offset:.06,ops:['ACT','RD','PRE'],goal:'The cell has only a weak low signal. Switch BLSA/OCSA to compare sensing results under the same mismatch; the result is computed by the model.'},\n {id:'margin1',group:'Compensation Comparison',name:'Weak Signal 1 + NMOS Mismatch',init:.64,offset:-.06,ops:['ACT','RD','PRE'],goal:'The cell has only a weak high signal. Compare offset and decision results with and without compensation.'}*/\n];\nfunction transistor(id,type,a,b,gate,k,vt=.3){return {id,type,a,b,gate,k,vt};}\nfunction netlist(mode,offset=0){\n const oc=mode==='ocsa', l=oc?'SL':'BL',r=oc?'SR':'BLB';\n const list=[\n transistor('P_L','p','LA',l,r,.2),transistor('P_R','p','LA',r,l,.2),\n transistor('N_L','n',l,'LAB','BLB',1,.3+offset/2),transistor('N_R','n',r,'LAB','BL',1,.3-offset/2),\n transistor('P_EN','p','VINTA','LA','@SAP_n',5),transistor('N_EN','n','LAB','VSS','@SAN',5),\n transistor('B_LA','n','LA','VPRE','@BIAS',4),transistor('B_LAB','n','LAB','VPRE','@BIAS',4),\n transistor('M_PL','n','BL','VPRE','@EQ',1),transistor('M_PR','n','BLB','VPRE','@EQ',1),\n transistor('M_EQ','n','BL','BLB','@EQ',1),transistor('M_A','n','BL','CELL','@WL',.5),\n transistor('Y_L','n',l,'LIO','@CSL',2),transistor('Y_R','n',r,'LIOB','@CSL',2),\n transistor('IO_PL','n','LIO','VPRE','@IOEQ',1),transistor('IO_PR','n','LIOB','VPRE','@IOEQ',1),\n transistor('W_PL','p','VINTA','LIO','@WPL',8),transistor('W_PR','p','VINTA','LIOB','@WPR',8),\n transistor('W_NL','n','LIO','VSS','@WNL',8),transistor('W_NR','n','LIOB','VSS','@WNR',8)\n ];\n if(oc)list.push(transistor('ISO_L','n','BL','SL','@ISO',2),transistor('ISO_R','n','BLB','SR','@ISO',2),transistor('OC_L','n','BL','SR','@OC',2),transistor('OC_R','n','BLB','SL','@OC',2));\n return list;\n}\nfunction voltage(name,v,g){return name[0]==='@'?g[name.slice(1)]:(name in ix?v[ix[name]]:rail[name]);}\nfunction mos(d,v,g){\n const a=voltage(d.a,v,g),b=voltage(d.b,v,g),vg=voltage(d.gate,v,g),ds=Math.abs(a-b);\n const over=d.type==='n'?vg-Math.min(a,b)-d.vt:Math.max(a,b)-vg-d.vt;\n const magnitude=over\u003c=0?0:(ds\u003cover?d.k*(over*ds-.5*ds*ds):.5*d.k*over*over);\n return {i:Math.sign(a-b)*magnitude,over,a,b,vg,region:over\u003c=0?'cutoff':ds\u003cover?'linear region':'saturation region'};\n}\nfunction initialG(mode){return {EQ:1.5,BIAS:1.5,WL:0,SAP_n:1,SAN:0,CSL:0,IOEQ:1.5,WPL:1,WPR:1,WNL:0,WNR:0,ISO:mode==='ocsa'?1.5:0,OC:mode==='ocsa'?1.5:0};}\nfunction makeStages(mode,sc,profile){\n const list=[],events=[];let g=initialG(mode),group=-1,op='',cursor=0;\n const clocks={ACT:null,RD:null,PRE:null,WD_REF:null,REF:null};\n const add=(key,title,duration,patch={},extra={})=\u003e{const start={...g};g={...g,...patch};list.push({key,title,duration,startG:start,endG:{...g},group,op,clocks:{...clocks},...extra});cursor+=duration;};\n const mark=type=\u003e{events.push({type,time:cursor,group});if(type in clocks)clocks[type]=cursor;if(type==='ACT'){clocks.RD=null;clocks.WD_REF=null;}};\n const rule=(name,anchor)=\u003eclocks[anchor]===null?null:{name,anchor,origin:clocks[anchor],limit:profile[name]};\n const gate=(target,rules)=\u003e{const checks=rules.filter(Boolean);if(!checks.length)return;const remaining=Math.max(0,...checks.map(r=\u003er.origin+r.limit-cursor));add('timing',`${target}:${remaining\u003e1e-8?'wait remaining time':'timing check satisfied'}`,Math.max(.1,remaining),{}, {checks,gateTarget:target,waitAtEntry:remaining});};\n const beforeACT=()=\u003egate('Pre-ACT Check',[rule('tRP','PRE'),rule('tRC','ACT'),rule('tRFC','REF')]);\n const beforePRE=()=\u003egate('Pre-PRE Check',[rule('tRAS','ACT'),rule('tRTP','RD'),rule('tWR','WD_REF')]);\n if(sc.open)g={...g,EQ:0,BIAS:0,WL:1.5,SAP_n:0,SAN:1,OC:0};\n function act(refresh=false){\n  add('release','Release Precharge',2,{EQ:0,BIAS:0});\n  if(mode==='ocsa'){\n   add('oc','OC Stays On / Enable Offset Sampling',35,{ISO:0,OC:1.5,SAP_n:0,SAN:1});\n   add('hold','Isolate and Hold Compensation',3,{OC:0,SAP_n:1,SAN:0,BIAS:1.5});\n   add('share','WL On / Charge Sharing',7,{WL:1.5});\n   add('presense','Isolated-bitline Presense',22,{SAP_n:0,SAN:1,BIAS:0});\n   add('restore','Reconnect Bitlines / Restore Cell',28,{ISO:1.5});\n  }else{\n   add('share','WL On / Charge Sharing',7,{WL:1.5});\n   add('nsense','N-sense Pulls the Low Side Down',15,{SAN:1});\n   add('psense','P-sense Pulls the High Side Up',18,{SAP_n:0});\n   add('restore','Keep WL / Complete Restore',12);\n  }\n  add('active',refresh?'Refresh Data Restore Complete':'Row Held Open',2);\n  if(!refresh)gate('tRCD Check',[rule('tRCD','ACT')]);\n }\n function pre(){\n  add('wlclose','Close WL / Isolate Cell',2,{WL:0});\n  add('saoff','Disable Sense-amplifier Supply',2,{SAP_n:1,SAN:0});\n  add('equalize','Bitline Equalization and Precharge',25,{EQ:1.5,BIAS:1.5,ISO:mode==='ocsa'?1.5:0,OC:mode==='ocsa'?1.5:0});\n  add('standby','Return to Standby',2);\n }\n for(op of sc.ops){group++;\n  if(op==='ACT'){beforeACT();mark('ACT');act();}\n  if(op==='PRE'){beforePRE();mark('PRE');pre();}\n  if(op==='RD'){\n   mark('RD');\n   add('iorelease','Release I/O Precharge',2,{IOEQ:0});\n   add('read','Open Column / Build Read Differential',6,{CSL:1.5});\n   add('capture','Read Endpoint Sample',2,{}, {capture:true});\n   add('readclose','Close Column / Output This Sample',2,{CSL:0});\n   add('ioreset','I/O Return to Standby',5,{IOEQ:1.5});\n  }\n  if(op==='W0'||op==='W1'){\n   mark(op);\n   const bit=op==='W1'?1:0;\n   add('iorelease','Release I/O Precharge',2,{IOEQ:0},{writeBit:bit});\n   add('wdrive','Write Driver Establishes Data',3,{WPL:bit?0:1,WPR:bit?1:0,WNL:bit?0:1,WNR:bit?1:0},{writeBit:bit});\n   add('write','Column On / Write Cell',18,{CSL:1.5},{writeBit:bit});\n   mark('WD_REF'); // Teaching proxy, not a simulated final external DQ clock edge.\n   add('wclose','Close Column / Isolate Write Driver',2,{CSL:0},{writeBit:bit});\n   add('wrecover','Stop Driver / Write Recovery',10,{WPL:1,WPR:1,WNL:0,WNR:0},{writeBit:bit});\n   add('ioreset','I/O Return to Standby',5,{IOEQ:1.5},{writeBit:bit});\n  }\n  if(op==='REF'){\n   gate('Pre-REF Check',[rule('tRP','PRE'),rule('tRFC','REF')]);mark('REF');\n   add('refselect','REF / Internal Refresh Row Select',2);\n   act(true);pre();\n   gate('REF Busy Done',[rule('tRFC','REF')]);\n  }\n  if(op==='WAIT')add('leak','Retention Leakage',100,{}, {leak:true});\n }\n return {stages:list,events};\n}\nfunction auditTiming(events,profile,initialOpen=false){\n let act=null,rd=null,pre=null,wr=null,ref=null,open=initialOpen;const results=[];\n for(const e of events){\n  const checks=[];const test=(name,origin)=\u003e{if(origin!==null)checks.push({name,elapsed:e.time-origin,required:profile[name],pass:e.time-origin+1e-7\u003e=profile[name]});};\n  if(e.type==='WD_REF'){wr=e.time;continue;}\n  let stateOK=true;\n  if(e.type==='ACT'){stateOK=!open;test('tRP',pre);test('tRC',act);test('tRFC',ref);act=e.time;rd=null;wr=null;open=true;}\n  if(['RD','W0','W1'].includes(e.type)){stateOK=open;test('tRCD',act);if(e.type==='RD')rd=e.time;}\n  if(e.type==='PRE'){stateOK=open;test('tRAS',act);test('tRTP',rd);test('tWR',wr);pre=e.time;open=false;}\n  if(e.type==='REF'){stateOK=!open;test('tRP',pre);test('tRFC',ref);ref=e.time;}\n  results.push({...e,checks,stateOK,pass:stateOK\u0026\u0026checks.every(c=\u003ec.pass)});\n }\n return results;\n}\nfunction controls(st,t){const q=clamp(t/Math.min(.45,st.duration/4));return Object.fromEntries(Object.keys(st.endG).map(k=\u003e[k,st.startG[k]+(st.endG[k]-st.startG[k])*q]));}\nfunction simulate(mode,scenario){\n const sc=typeof scenario==='string'?scenarios.find(s=\u003es.id===scenario):scenario;\n if(!sc)throw Error('Case not found');\n const profile={...timingDefaults,...sc.timing},schedule=makeStages(mode,sc,profile);\n const list=netlist(mode,sc.offset??.012),stages=schedule.stages,closed=[.5,.5,sc.init,.5,.5,.5,.5,.5,.5];\n let v=sc.open?[sc.init,1-sc.init,sc.init,sc.init,1-sc.init,1,0,.5,.5]:closed;\n let samples=[],time=0,lastData=null,expected=sc.init\u003e.5?1:0,lastOpGroup=-1,readLog=[];\n const dt=.003;\n for(let si=0;si\u003cstages.length;si++){\n  const st=stages[si];st.index=si;st.start=time;st.from=samples.length;st.initial=v.slice();st.expectedBefore=expected;\n  if(st.group!==lastOpGroup){lastOpGroup=st.group;}\n  const steps=Math.ceil(st.duration/dt),h=st.duration/steps,stride=Math.max(1,Math.floor(steps/140));\n  for(let n=0;n\u003c=steps;n++){\n   const local=n*h,g=controls(st,local),dv=nodes.map(()=\u003e0);\n   for(const d of list){const I=mos(d,v,g).i;if(d.a in ix)dv[ix[d.a]]-=I;if(d.b in ix)dv[ix[d.b]]+=I;}\n   if(st.leak)dv[ix.CELL]+=(.5-v[ix.CELL])*.00008;\n   if(st.capture \u0026\u0026 n===steps){const delta=v[ix.LIO]-v[ix.LIOB];lastData=decideRead(delta);readLog.push({stage:si,actual:lastData,expected,delta,valid:lastData!=='X'});}\n   if(n%str : after WRITE, write recovery and related command intervals must be met. tWR is tied to the specified reference point for the last write data, not simply counted from the WRITE command.';if(st.op==='PRE')return 'JEDEC: PRE -\u003e next ACT must satisfy tRP, and previous ACT -\u003e this ACT must satisfy tRC; before issuing PRE, related limits from the previous ACT/READ/WRITE must also be satisfied.';return 'Retention time is heavily compressed; this example does not use the model to infer tREFI or actual retention time.';}\nfunction formula(st,s){const v=n=\u003es.v[M.ix[n]],d=st.initial,V0=d[M.ix.CELL],B0=d[M.ix.BL],qCell=.02*(v('CELL')-.5)*1000,diff=(v('BL')-v('BLB'))*1000,local=s.t-st.start;\n let eq='',val='',note='',vars='';\n const sumNode=n=\u003e{let total=0;for(const dev of sim.list){if(dev.a===n)total-=s.j[dev.id].i;if(dev.b===n)total+=s.j[dev.id].i;}return total;};\n const k=st.key;\n if(k==='timing'){\n  eq='t\u003csub\u003eremaining\u003c/sub\u003e = max(0, max[t\u003csub\u003eorigin,i\u003c/sub\u003e + T\u003csub\u003ei\u003c/sub\u003e - t\u003csub\u003enow\u003c/sub\u003e])';\n  val=timingRows(st,s.t);note='All limits count in parallel and the latest expiry wins; tRAS, tRTP, and tWR are not added together. Values are teaching thresholds, not a chip-compliance conclusion.';vars='tRCD/tRAS/tRC count from ACT; tRP from PRE; tRTP from READ; tRFC from REF; tWR uses the explicit WD_REF teaching reference event in the diagram.';\n }else if(k==='share'){\n  const target=(.2*B0+.02*V0)/.22;\n  eq='V\u003csub\u003eshare\u003c/sub\u003e = (C\u003csub\u003eBL\u003c/sub\u003eV\u003csub\u003eBL,0\u003c/sub\u003e + C\u003csub\u003ecell\u003c/sub\u003eV\u003csub\u003ecell,0\u003c/sub\u003e) / (C\u003csub\u003eBL\u003c/sub\u003e + C\u003csub\u003ecell\u003c/sub\u003e)';\n  val=`Sharing final value ~= (200 x ${F(B0)} + 20 x ${F(V0)}) / 220 = \u003cstrong\u003e${F(target)} V\u003c/strong\u003e\u003cbr\u003eNow BL = ${F(v('BL'))} V; Cell = ${F(v('CELL'))} V\u003cbr\u003e ',\n wrecover:'Give the cell enough time to charge or discharge so closing WL too early does not store a partial value.',\n wlclose:'Isolate the cell first so returning the bitlines to midlevel later does not corrupt data.',\n saoff:'Stop strong pull-up/pull-down first, then equalize the bitlines so they do not fight each other.',\n equalize:'Let the next cell signal start from the same bitline reference and avoid decisions affected by residual voltage.',\n standby:'The bitlines are ready for the next operation, and the isolated cell stores charge by itself.',\n refselect:'Refresh first selects the row to restore, then performs internal sensing; no external DQ output is needed.',\n leak:'Use equivalent leakage to illustrate charge loss during retention and why periodic refresh is needed.'\n};\nfunction drawStageBrief(s=state){\n if(!sim||!s||!document.body.classList.contains('focus-circuit'))return;\n const st=sim.stages[s.stage],nodeName=n=\u003e({SL:'SABL',SR:'SABLB',CELL:'Cell'}[n]||n);\n $('briefCount').textContent=(s.stage+1)+' / '+sim.stages.length;\n $('briefStage').textContent=st.op+' · '+st.title;\n $('briefWhat').textContent=st.key==='nsense'?'SAN rises and pulls shared lower node LAB down through N_EN; VGS of N_L/N_R increases accordingly.':description(st);\n $('briefWhy').textContent=stageReasons[st.key]||'Let the next operation start from a stable circuit state.';\n $('briefWiring').textContent=mode==='blsa'?'Gate wiring: BLB connects to P_L and N_L; BL connects to P_R and N_R.':'Left gates: P_L connects to SABLB and N_L connects to BLB; when ISO is off, these two nodes remain separate. The right side is symmetric.';\n if(['nsense','presense','oc'].includes(st.key)){\n  const cards=['N_L','N_R'].map(id=\u003e{\n   const d=sim.list.find(d=\u003ed.id===id),j=s.j[id],source=j.a\u003c=j.b?d.a:d.b,vgs=j.vg-Math.min(j.a,j.b);\n   return `\u003cdiv data-gate-device=\"${id}\" title=\"Gate ${F(j.vg,3)} V；Source ${nodeName(source)} ${F(Math.min(j.a,j.b),3)} V\"\u
