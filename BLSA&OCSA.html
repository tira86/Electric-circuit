aw MOS; lesson 4 replaces the on path with fixed RON to make charge conservation clear. The switch symbol does not change the numeric model.'],Cell:['Storage capacitor Ccell','20 fF is a teaching value. The bottom plate VPL is fixed at 0.5 V; Qcell = Ccell(Vcell−VPL). Storing 0 does not mean the voltage across the capacitor is zero.'],BL:['Bitline and equivalent capacitance CBL','Bitline metal, devices, and connections create distributed capacitance, lumped here as 200 fF. This does not mean a chip must contain a separate discrete 200 fF capacitor.'],source:['Sources and scope','Conceptual basis: DRAM Circuit Design: Fundamental and High-Speed Topics, section 1.2; and the basic MOS/capacitor models from CMOS VLSI Design and Sedra/Smith. This tutorial uses ideal RC, simplified long-channel MOS, and charge-conservation teaching models. It is not a JEDEC-specified internal circuit or voltage value. Lessons 9-12 add cell restore and column read/write; lessons 13-16 add OCSA. Source: https://patents.google.com/patent/US20200227111A1/en. 2018 SVC paper: https://ieeexplore.ieee.org/document/8330545/; it is another compensation scheme and should not be treated as the same circuit.']};\nfunction detail(id){stop();render();const x=(lesson\u003e=13?({P_L:['Left PMOS','Gate connects to SR, and the conductive terminals connect LA and SL. When the opposite SR is low, it pulls SL up.'],P_R:['Right PMOS','Gate connects to SL, and the conductive terminals connect LA and SR.'],N_L:['Left NMOS','Gate still connects to outer BLB, and the conductive terminals connect SL and LAB. When ISO is off, BLB still controls current through the gate electric field.'],N_R:['Right NMOS','Gate still connects to BL, and the conductive terminals connect SR and LAB.'],Y_L:['Left column switch','OCSA connects SL to LIO; it does not read directly from the outer BL.'],Y_R:['Right column switch','OCSA connects SR to LIOB.']})[id]:null)||glossary[id]||[id,'Choose an input, play this segment, and observe terminal voltages and current for the component.'];$('detailTitle').textContent=x[0];$('detailText').textContent=x[1];$('detail').showModal();}\n$('play').onclick=()=\u003estart(false);$('again').onclick=()=\u003ego(stage,true);$('pause').onclick=()=\u003e{stop();render();};$('all').onclick=()=\u003e{go(0);start(true);};$('next').onclick=()=\u003ego(Math.min(stage+1,lessons[lesson].stages.length-1),true);$('seek').oninput=e=\u003e{const q=+e.target.value;stop();t=bounds[stage]+q/1000*(bounds[stage+1]-bounds[stage])-.000001;t=Math.max(bounds[stage],t);render();};$('bridgeButton').onclick=()=\u003e{if(lesson\u003clessons.length-1)choose(lesson+1);else window.open('https://dram-circuit-lab.tira8697.chatgpt.site','_blank','noopener');};$('close').onclick=()=\u003e$('detail').close();$('source').onclick=()=\u003edetail('source');document.addEventListener('click',e=\u003e{const l=e.target.closest('[data-lesson]'),s=e.target.closest('[data-stage]'),p=e.target.closest('[data-part]');if(l)choose(+l.dataset.lesson);if(s)go(+s.dataset.stage,true);if(p)detail(p.dataset.part);});$('circuit').addEventListener('keydown',e=\u003e{if(e.key==='Enter'||e.key===' '){const p=e.target.closest('[data-part]');if(p){e.preventDefault();detail(p.dataset.part);}}});\nObject.assign(glossary,{BLB:['Complementary bitline BLB','The reference branch not connected to the selected cell this time. Later it is also the other cross-coupled sensing node, not a fixed ideal reference source.'],N_L:['Left NMOS','When the gate connects to BLB, a higher BLB makes the left pull-down stronger and pulls BL lower. The first two stages of lesson 7 use an external-gate demo; the wiring stage switches to the opposite bitline.'],N_R:['Right NMOS','Lesson 6 uses an external signal for the gate; lessons 7 and 8 connect it back to BL. The right-side pull-down current changes BLB; the gate is not supplying this conductive current.'],P_L:['Left PMOS','Gate connects to BLB. When the opposite-side voltage is low, it provides pull-up current from LA to BL. Whether it conducts depends on the current VSG, not only on whether P_EN is enabled.'],P_R:['Right PMOS','Gate connects to BL and provides pull-up current from LA to BLB. LA may also store charge before P_EN turns on.'],LA:['Upper supply rail LA','This lesson includes 40 fF equivalent capacitance. Before P_EN turns on, stored charge may also flow through a PMOS; after P_EN turns on, VINTA provides the sustained supply.'],LAB:['Lower supply rail LAB','This lesson uses an ideally controlled rail to represent N_EN action. Pulling LAB down increases NMOS VGS; the real control signal SAN and this supply rail are not the same node.'],P_EN:['Pull-up supply switch','Enabled when SAP_n is low. This lesson represents the supply device with a controlled resistor connecting VINTA to LA.'],M_PL:['Left precharge switch','When EQ is high, it connects BL to VPRE. It acts together with M_PR and M_EQ.'],M_PR:['Right precharge switch','When EQ is high, it connects BLB to VPRE.'],M_EQ:['Bitline equalization switch','When EQ is high, it connects BL and BLB so the two bitlines exchange charge; the other two precharge switches also connect back to VPRE.']});\nObject.assign(glossary,{Y_L:['Left column switch','CSL controls the path between BL and LIO, used by both READ and WRITE. It does not control WL.'],Y_R:['Right column switch','CSL also controls the complementary branch between BLB and LIOB.'],IO_PL:['Local I/O precharge','Controlled by IOEQ, it pulls LIO back to VPRE; it is different from bitline EQ.'],IO_PR:['Complementary I/O precharge','Controlled by IOEQ, it pulls LIOB back to VPRE.'],W_PL:['Left write pull-up','When writing 1, VINTA supplies current to LIO.'],W_NL:['Left write pull-down','When writing 0, it pulls LIO toward VSS.'],W_PR:['Right write pull-up','When writing 0, it pulls the complementary line LIOB high.'],W_NR:['Right write pull-down','When writing 1, it pulls the complementary line LIOB low.']});\nObject.assign(glossary,{ISO_L:['Left isolation device','Connects BL and SL; off during presense, on during restore.'],ISO_R:['Right isolation device','Connects BLB and SR.'],OC_L:['Cross-compensation device','Connects BL and SR. In this topology it is already conducting in standby; during calibration, ISO is off while OC remains on.'],OC_R:['Cross-compensation device','Connects BLB and SL; after calibration it turns off and the bitlines retain the compensation bias.'],N_EN:['Pull-down supply device','When SAN is high, it pulls LAB toward VSS.'],readout:['Readout sampling endpoint','Reads the sign of LIO−LIOB with the teaching margin, updating DQ only at the end of capture. This functional block omits local/global sensing, serialization, and external PHY. Refresh does not produce new DQ.'],writerL:['Left write driver','W_PL pulls LIO up and W_NL pulls LIO down. The diagram groups them in a functional block, but the simulation still computes both MOS currents.'],writerR:['Right write driver','W_PR pulls LIOB up and W_NR pulls LIOB down, establishing the opposite data from the left side.']});\nchoose(Math.max(0,Math.min(lessons.length-1,(Number((location.hash.match(/^#lesson-(\\d+)$/)||[])[1])||1)-1)));window.BeginnerLab={choose,at,getTrace:()=\u003etrace,getFlowSimulation:()=\u003efullSim,setOffset:x=\u003e{tutorialOffset=x;reset();},setEarly:x=\u003e{earlyClose=x;reset();},setAccess:x=\u003e{accessOp=x;reset();},setStory:x=\u003e{story=x;reset();},setSingleGate:x=\u003e{singleGate=x;reset();},getState:()=\u003e({lesson,stage,t,run,view}),seek:(k,q)=\u003e{go(k);t=bounds[k]+(bounds[k+1]-bounds[k])*q-.00001;t=Math.max(bounds[k],t);render();},setBit:x=\u003e{bit=x;reset();},setMOS:(type,g)=\u003e{mosType=type;gateOn=g;reset();},setWL:x=\u003e{wlHigh=x;reset();}};\n\u003c/script\u003e\u003c/body\u003e\u003c/html\u003e\n", "glossary": "\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003cscript\u003e\n(function(){const originalOpen=window.open;function route(h){if(!h||h[0]==='#')return null;const base=h.split('#')[0].split('?')[0];if(/^https?:/.test(h)\u0026\u0026!h.startsWith('https://dram-circuit-lab.tira8697.chatgpt.site'))return null;const file=base.split('/').pop();return ({'index.html':'index','beginner.html':'beginner','glossary.html':'glossary','flow.html':'flow','':'index'})[file]||(base==='https://dram-circuit-lab.tira8697.chatgpt.site'?'index':null);}\ndocument.addEventListener('click',function(e){const a=e.target.closest('a');if(!a)return;const r=route(a.getAttribute('href'));if(r){e.preventDefault();top.showLab(r);}},true);window.open=function(url,...args){const r=route(String(url));if(r){top.showLab(r);return null;}return originalOpen.call(window,url,...args);};})();\n\u003c/script\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\n\u003ctitle\u003eDRAM Glossary\u003c/title\u003e\n\u003cstyle\u003e*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#05070a;color:#edf5ff;font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif}header{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid #263749}nav{display:flex;gap:16px;flex-wrap:wrap}a{color:#73dcff}button,select,input{font:inherit;color:inherit;background:#111f2e;border:1px solid #39546d;border-radius:7px;padding:7px 11px}button{cursor:pointer}button:disabled{opacity:.4}button:hover,a:hover{color:#ffd174}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ffd174;outline-offset:3px}h1{font-size:23px;margin:0}h2{font-size:21px}p{margin:8px 0 16px}.muted{color:#a9bad0;font-size:14px}.panel{background:#0c131d;border:1px solid #293d50;border-radius:10px;padding:16px;min-width:0}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 20px}pre{font:15px/1.7 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#9be5ff}label{display:flex;align-items:center;gap:8px}article{scroll-margin-top:12px}small{font-size:14px}main{max-width:1250px;margin:auto;padding:20px}.intro{max-width:850px}.term-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.badge{font-size:14px;color:#70efb5}h2{margin:4px 0}dt{color:#ffd174;font-size:14px}dd{margin:0 0 12px}.jump{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}@media(max-width:760px){.term-grid{grid-template-columns:1fr}header{display:block}nav{margin-top:8px}}@media print{nav,.jump{display:none}.panel{break-inside:avoid}body{background:white;color:black}}\u003c/style\u003e\n\u003cheader\u003e\n  \u003ch1\u003eDRAM Glossary\u003c/h1\u003e\n  \u003cnav\u003e\u003ca href=\"beginner.html\"\u003eStep-by-Step Lessons\u003c/a\u003e\u003ca href=\"glossary.html\"\u003eGlossary\u003c/a\u003e\u003ca href=\"flow.html\"\u003eComplete Flow\u003c/a\u003e\u003ca href=\"index.html\"\u003eCircuit Lab\u003c/a\u003e\u003c/nav\u003e\n\u003c/header\u003e\n\u003cmain\u003e\n  \u003cp class=\"intro\"\u003eFirst separate the external specification from the internal circuit. JEDEC defines commands, pins, and timing; internal names such as WL, CSL, EQ, and ISO depend on the circuit implementation and the literature being used.\u003c/p\u003e\n  \u003cdiv class=\"jump\"\u003e\u003ca href=\"#cat0\"\u003eExternal Interface\u003c/a\u003e\u003ca href=\"#cat1\"\u003eCommands and Addresses\u003c/a\u003e\u003ca href=\"#cat2\"\u003eInternal Circuit\u003c/a\u003e\u003ca href=\"#cat3\"\u003eVoltages and Models\u003c/a\u003e\u003ca href=\"#cat4\"\u003eTiming\u003c/a\u003e\u003c/div\u003e\n  \u003csection id=\"cat0\"\u003e\u003ch2\u003eExternal Interface\u003c/h2\u003e\u003cdiv class=\"term-grid\"\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eExternal Interface\u003c/span\u003e\u003ch2\u003eCS_n\u003c/h2\u003e\u003cp class=\"muted\"\u003eChip Select\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eAn external command-select signal used in command encoding and Rank selection.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eIt is driven by the controller into the DRAM; its high and low states are interpreted according to the command truth table.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eIt is not CSL; CSL selects a column inside the chip.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: JESD79-5C Sec. 2.6 Table 3\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eExternal Interface\u003c/span\u003e\u003ch2\u003eCA[13:0]\u003c/h2\u003e\u003cp class=\"muted\"\u003eCommand / Address\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eExternal input lines that carry command codes and addresses.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eThe controller sends ACT, READ, WRITE, and the corresponding addresses through CA.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eCA is not a control voltage wired directly to WL or CSL.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: JESD79-5C Tables 3 and 30\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eExternal Interface\u003c/span\u003e\u003ch2\u003eCK_t / CK_c\u003c/h2\u003e\u003cp class=\"muted\"\u003eDifferential clock\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eThe timing reference for sampling external commands and addresses.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eThe specification defines when commands are accepted using clock edges and timing limits.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eIt does not mean every internal switch in the animation toggles on the same edge.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: JESD79-5C Table 3\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eExternal Interface\u003c/span\u003e\u003ch2\u003eDQ\u003c/h2\u003e\u003cp class=\"muted\"\u003eData Input / Output\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eBidirectional data pins.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eDuring a read, DRAM drives them; during a write, the controller drives them.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eThe DQ block in the animation is the interpreted data result, with serialization and the real PHY omitted.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: JESD79-5C Table 3\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eExternal Interface\u003c/span\u003e\u003ch2\u003eDQS_t / DQS_c\u003c/h2\u003e\u003cp class=\"muted\"\u003eData Strobe\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eA differential data strobe that accompanies data transfers.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eFor READ it is driven by the DRAM; for WRITE it is driven by the controller.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eDQS does not choose which internal DRAM column is selected.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: JESD79-5C Table 3\u003c/small\u003e\u003c/article\u003e\n  \u003c/div\u003e\u003c/section\u003e\n  \u003csection id=\"cat1\"\u003e\u003ch2\u003eCommands and Addresses\u003c/h2\u003e\u003cdiv class=\"term-grid\"\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eCommands and Addresses\u003c/span\u003e\u003ch2\u003eACT\u003c/h2\u003e\u003cp class=\"muted\"\u003eActivate / row activation\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eSelects a Bank and Row, starting internal sensing and restore for that row.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eAfter row activation, the sense amplifier holds the data from that row.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eACT itself does not send the entire row directly to external DQ.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: JESD79-5C Table 30\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eCommands and Addresses\u003c/span\u003e\u003ch2\u003eREAD / RD\u003c/h2\u003e\u003cp class=\"muted\"\u003eRead command\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eSpecifies column data within an activated row and schedules an external read.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eAfter column select, data moves through the I/O hierarchy toward DQ.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eConsecutive READ commands to the same row do not require ACT to be repeated each time.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: JESD79-5C Table 30\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eCommands and Addresses\u003c/span\u003e\u003ch2\u003eWRITE / WR\u003c/h2\u003e\u003cp class=\"muted\"\u003eWrite command\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eWrites external data into the specified column location.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eWrite drivers change the sense nodes, then rewrite the Cell through the still-enabled WL.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eAfter WRITE, PRE cannot immediately ignore the required write recovery time.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: JESD79-5C command and timing sections\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eCommands and Addresses\u003c/span\u003e\u003ch2\u003ePRE\u003c/h2\u003e\u003cp class=\"muted\"\u003ePrecharge command\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eCloses the active row and returns the bitlines to the prepared state for the next sense operation.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eInternally, the Cell is isolated first; then strong sensing drive is stopped and the bitlines are equalized.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003ePRE does not refresh a leaky Cell by itself.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: JESD79-5C Table 30; circuit lesson Sec. 1.2\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eCommands and Addresses\u003c/span\u003e\u003ch2\u003eREF\u003c/h2\u003e\u003cp class=\"muted\"\u003eRefresh\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003ePerforms data restore under control of an internal refresh address.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eSchematic flow: select row \u0026rarr; sense \u0026rarr; restore \u0026rarr; close row; data does not need to be sent to DQ.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eIt is not the external controller reading and then writing every column; one animation represents only one row.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: JESD79-5C Refresh; circuit lesson Sec. 1.2\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eCommands and Addresses\u003c/span\u003e\u003ch2\u003eRow / Column\u003c/h2\u003e\u003cp class=\"muted\"\u003eRow address / column address\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eRow selects one row; Column selects a data group inside an activated row.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eACT supplies the Row, while READ and WRITE supply the Column.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eOne burst does not necessarily mean only one bitline pair is connected.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: JESD79-5C Table 30\u003c/small\u003e\u003c/article\u003e\n  \u003c/div\u003e\u003c/section\u003e  \u003csection id=\"cat2\"\u003e\u003ch2\u003eInternal Circuit\u003c/h2\u003e\u003cdiv class=\"term-grid\"\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eInternal Circuit\u003c/span\u003e\u003ch2\u003eCSL\u003c/h2\u003e\u003cp class=\"muted\"\u003eColumn Select Line\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eA select signal generated by internal column decoding and timing control.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eIt turns on Y_L and Y_R, connecting the selected sense nodes to local I/O.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eIt is not a JEDEC external pin or standalone command, and it is not CS_n.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: circuit naming; external counterpart is READ/WRITE plus Column Address\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eInternal Circuit\u003c/span\u003e\u003ch2\u003eWL\u003c/h2\u003e\u003cp class=\"muted\"\u003eWordline\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eAn internal line that controls the gates of the access transistors for one row of Cells.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eWhen WL is high, M_A connects the Cell to BL; when WL is low, the Cell is isolated for retention.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eWL voltage is not the Cell data voltage, and it is not the external VPP pin.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: DRAM Circuit Design Sec. 1.2\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eInternal Circuit\u003c/span\u003e\u003ch2\u003eCell / Ccell\u003c/h2\u003e\u003cp class=\"muted\"\u003eStorage cell / storage capacitor\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eIn 1T1C DRAM, data is held by one access transistor and one capacitor.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eWith a fixed plate potential, Qcell = Ccell(Vcell\u0026minus;VPL).\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eStoring 0 does not mean the voltage across the capacitor must be zero.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: DRAM Circuit Design Sec. 1.2\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eInternal Circuit\u003c/span\u003e\u003ch2\u003eBL / BLB\u003c/h2\u003e\u003cp class=\"muted\"\u003eBitline / complementary bitline\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eA bitline pair that carries the small signal from the Cell.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eThe Cell connects to one side, and the sense amplifier resolves the data from the difference between the two sides.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eBLB is not an ideal voltage source held at half supply for the entire operation.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: DRAM Circuit Design Sec. 1.2\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eInternal Circuit\u003c/span\u003e\u003ch2\u003eBLSA\u003c/h2\u003e\u003cp class=\"muted\"\u003eBit-Line Sense Amplifier\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eA sense amplifier that regenerates a tiny bitline difference into clear high and low levels.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eIt uses cross-coupled positive feedback and restores the Cell while WL is enabled.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eBLSA is a functional name; it is not a category that is completely exclusive from OCSA.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: DRAM Circuit Design Sec. 1.2\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eInternal Circuit\u003c/span\u003e\u003ch2\u003eOCSA\u003c/h2\u003e\u003cp class=\"muted\"\u003eOffset-Cancellation Sense Amplifier\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eA sense amplifier type that adds offset compensation.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eIt first establishes a compensation bias to reduce the effect of mismatch on the later decision.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eNot every DRAM uses the same OCSA; different papers use different topologies.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: US20200227111A1 Figs. 3 and 6A-E\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eInternal Circuit\u003c/span\u003e\u003ch2\u003eSL / SR\u003c/h2\u003e\u003cp class=\"muted\"\u003eSABL / SABLB; internal sense nodes\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eThe left and right small-load nodes at the core of this teaching OCSA.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eWhen ISO is off, SL and SR can be pre-sensed first and then reconnected to the large bitlines.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eSL/SR and the outer BL/BLB do not necessarily have the same voltage.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: US20200227111A1\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eInternal Circuit\u003c/span\u003e\u003ch2\u003eISO\u003c/h2\u003e\u003cp class=\"muted\"\u003eIsolation control\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eControls the conduction path between the outer bitlines and the same-side internal sense nodes.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eISO_L connects BL\u0026harr;SL; ISO_R connects BLB\u0026harr;SR.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eAfter the conducting path is isolated, NMOS gates connected to BL/BLB can still control current.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: this teaching OCSA topology\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eInternal Circuit\u003c/span\u003e\u003ch2\u003eOC\u003c/h2\u003e\u003cp class=\"muted\"\u003eOffset Cancellation / compensation control\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eControls the cross-coupled compensation paths.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eOC_L connects BL\u0026harr;SR; OC_R connects BLB\u0026harr;SL.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eIn this topology, OC is already high in standby; compensation starts by cutting off ISO and enabling the sense supply.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: US20200227111A1 Figs. 6 and 8\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eInternal Circuit\u003c/span\u003e\u003ch2\u003eEQ\u003c/h2\u003e\u003cp class=\"muted\"\u003eEqualization control\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eIn this model it controls M_EQ, M_PL, and M_PR together.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eM_EQ pulls the two sides toward each other; the precharge transistors pull the common mode toward VPRE.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eEQ is not CSL; during charge sharing and sensing, the bitlines must not remain equalized.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: DRAM Circuit Design Sec. 1.2; teaching names\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eInternal Circuit\u003c/span\u003e\u003ch2\u003eLIO / LIOB\u003c/h2\u003e\u003cp class=\"muted\"\u003eLocal I/O\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eA data-line pair that connects the selected sense amplifier to later read/write circuitry.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eREAD sends the differential value outward; WRITE drives new data from this point.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eLIO is not the external DQ pin of the chip.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: internal circuit naming\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eInternal Circuit\u003c/span\u003e\u003ch2\u003eIOEQ\u003c/h2\u003e\u003cp class=\"muted\"\u003eLocal I/O precharge control\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003ePrepares LIO/LIOB at the teaching reference voltage.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eIt is released before read/write activity and can be re-enabled after column access closes.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eIt is separate from bitline EQ; enabling IOEQ does not mean the row is being closed by PRE.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: teaching peripheral naming\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eInternal Circuit\u003c/span\u003e\u003ch2\u003eM_A / Y_L / Y_R\u003c/h2\u003e\u003cp class=\"muted\"\u003eAccess transistor / column transistors\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eM_A is controlled by WL; Y_L and Y_R are controlled by CSL.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eM_A connects the Cell and BL; Y_L/Y_R connect the sense amplifier and I/O.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eTurning off CSL does not mean WL has been turned off.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: teaching component labels\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eInternal Circuit\u003c/span\u003e\u003ch2\u003eN_L / N_R / P_L / P_R\u003c/h2\u003e\u003cp class=\"muted\"\u003eCross-coupled sensing core\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eThe NMOS devices pull down, and the PMOS devices pull up.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eConduction and current are determined by the instantaneous gate, source, and drain voltages.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eConduction does not always imply large current; when there is no voltage difference across a device, current can be near zero.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: MOS model and circuit lesson\u003c/small\u003e\u003c/article\u003e\n  \u003c/div\u003e\u003c/section\u003e  \u003csection id=\"cat3\"\u003e\u003ch2\u003eVoltages and Models\u003c/h2\u003e\u003cdiv class=\"term-grid\"\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eVoltages and Models\u003c/span\u003e\u003ch2\u003eVDD / VDDQ / VPP\u003c/h2\u003e\u003cp class=\"muted\"\u003eExternal supply names\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eSupply domains defined by the specification; VDDQ is associated with I/O supply.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eThe actual voltages and conditions depend on the device and the JEDEC specification.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eThe teaching values of internal 1 V and WL 1.5 V should not be treated as DDR5 pin specification values.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: JESD79-5C power and electrical specifications\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eVoltages and Models\u003c/span\u003e\u003ch2\u003eVPRE / VPL / VINTA\u003c/h2\u003e\u003cp class=\"muted\"\u003eInternal precharge, plate, and sense supply\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eIn this example, the values are 0.5 V, 0.5 V, and 1 V respectively.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eVPRE prepares the bitlines; VPL is the lower Cell plate; VINTA supplies energy for sensing.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eEqual numeric values do not mean they are the same physical supply line, nor are they JEDEC-specified internal values.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: teaching choices and circuit literature\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eVoltages and Models\u003c/span\u003e\u003ch2\u003eLA / LAB / SAP_n / SAN\u003c/h2\u003e\u003cp class=\"muted\"\u003eSense supply rails / enable controls\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eLA and LAB are supply nodes; SAP_n and SAN are the controls for the supply transistors in this model.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eSAP_n low enables pull-up, and SAN high enables pull-down.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eThe control signals and the controlled supply rails are different nodes.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: teaching topology names\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eVoltages and Models\u003c/span\u003e\u003ch2\u003eVT / \u0026Delta;VT / Vos\u003c/h2\u003e\u003cp class=\"muted\"\u003eThreshold voltage / mismatch / input-referred offset\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eVT is a single-device parameter; \u0026Delta;VT is the difference between two devices; Vos is the overall decision offset.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eOffset can cause a small signal to be resolved in the wrong direction.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003e\u0026Delta;VT cannot be treated directly as the Vos of every circuit.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: MOS and sense-amplifier analysis\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eVoltages and Models\u003c/span\u003e\u003ch2\u003eCharge Sharing\u003c/h2\u003e\u003cp class=\"muted\"\u003eCharge sharing\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eCharge is redistributed after the Cell capacitor and bitline capacitance are connected.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eVshare \u0026asymp; (CBL\u0026middot;VBL,initial+Ccell\u0026middot;Vcell,initial)/(CBL+Ccell).\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eThis expression assumes a fixed plate potential and ignores other paths and coupling; for OCSA, use the post-compensation initial values.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: DRAM Circuit Design Sec. 1.2\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eVoltages and Models\u003c/span\u003e\u003ch2\u003ePositive Feedback / Restore\u003c/h2\u003e\u003cp class=\"muted\"\u003ePositive feedback / data restore\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003ePositive feedback amplifies the difference; restore writes the resolved voltage back into the Cell.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eBoth read 0 and read 1 require restore.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eA latched sense amplifier does not mean the Cell has already been fully restored.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: DRAM Circuit Design Sec. 1.2\u003c/small\u003e\u003c/article\u003e\n  \u003c/div\u003e\u003c/section\u003e\n  \u003csection id=\"cat4\"\u003e\u003ch2\u003eTiming\u003c/h2\u003e\u003cdiv class=\"term-grid\"\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eTiming\u003c/span\u003e\u003ch2\u003etRCD\u003c/h2\u003e\u003cp class=\"muted\"\u003eMinimum interval from ACT to a read or write command\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eLimits when the corresponding column command can be accepted after row activation.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eIt is counted from the ACT reference event, with sensing taking place within that interval.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eIt is not an additional full tRCD period that starts only after sensing is complete.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: JEDEC command timing\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eTiming\u003c/span\u003e\u003ch2\u003etRAS / tRP / tRC\u003c/h2\u003e\u003cp class=\"muted\"\u003eRow active, precharge, and row cycle time\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eTiming limits for ACT\u0026rarr;PRE, PRE\u0026rarr;next ACT, and same-Bank ACT\u0026rarr;ACT operations.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eThe circuit state and timing conditions must both be satisfied before the next operation can begin.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003etRAS should not be equated completely with only the Restore segment in the animation.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: JEDEC command timing\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eTiming\u003c/span\u003e\u003ch2\u003etRTP / tWR\u003c/h2\u003e\u003cp class=\"muted\"\u003eRead-to-precharge / write recovery\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eConstrains when PRE is allowed after a read or write.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eThe starting point depends on the selected mode, burst behavior, and the specification definition.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eThe internal write endpoint in the animation is only a teaching reference for tWR, not the complete external CK/DQ definition.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: JEDEC command timing\u003c/small\u003e\u003c/article\u003e\n    \u003carticle class=\"panel\"\u003e\u003cspan class=\"badge\"\u003eTiming\u003c/span\u003e\u003ch2\u003etRFC\u003c/h2\u003e\u003cp class=\"muted\"\u003eRefresh recovery time\u003c/p\u003e\u003cdl\u003e\u003cdt\u003eWhat it is\u003c/dt\u003e\u003cdd\u003eLimits command timing after the corresponding refresh operation.\u003c/dd\u003e\u003cdt\u003eRole in the flow\u003c/dt\u003e\u003cdd\u003eIn this flow diagram, it is shown as the REF busy-end check.\u003c/dd\u003e\u003cdt\u003eCommon confusion\u003c/dt\u003e\u003cdd\u003eThe actual value depends on refresh type, device, and other conditions; not every DDR5 device uses a fixed 295 ns.\u003c/dd\u003e\u003c/dl\u003e\u003csmall class=\"muted\"\u003eSource: JEDEC refresh timing\u003c/small\u003e\u003c/article\u003e\n  \u003c/div\u003e\u003c/section\u003e\n  \u003cp class=\"muted\"\u003eMaterials: user-provided JESD79-5C_v1.30 and \u003ccite\u003eDRAM Circuit Design: Fundamental and High-Speed Topics\u003c/cite\u003e Sec. 1.2. OCSA topology: \u003ca href=\"https://patents.google.com/patent/US20200227111A1/en\" target=\"_blank\" rel=\"noopener\"\u003eUS20200227111A1\u003c/a\u003e. Teaching names and model values do not represent a specific production DDR5 chip.\u003c/p\u003e\n\u003c/main\u003e\n\u003c/html\u003e", "flow": "\u003c!doctype html\u003e\u003chtml lang=\"en\"\u003e\u003chead\u003e\u003cscript\u003e\n(function(){const originalOpen=window.open;function route(h){if(!h||h[0]==='#')return null;const base=h.split('#')[0].split('?')[0];if(/^https?:/.test(h)\u0026\u0026!h.startsWith('https://dram-circuit-lab.tira8697.chatgpt.site'))return null;const file=base.split('/').pop();return ({'index.html':'index','beginner.html':'beginner','glossary.html':'glossary','flow.html':'flow','':'index'})[file]||(base==='https://dram-circuit-lab.tira8697.chatgpt.site'?'index':null);}\ndocument.addEventListener('click',function(e){const a=e.target.closest('a');if(!a)return;const r=route(a.getAttribute('href'));if(r){e.preventDefault();top.showLab(r);}},true);window.open=function(url,...args){const r=route(String(url));if(r){top.showLab(r);return null;}return originalOpen.call(window,url,...args);};})();\n\u003c/script\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\u003ctitle\u003eDRAM Full-Flow Guide\u003c/title\u003e\u003cstyle\u003e*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#05070a;color:#edf5ff;font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Arial,sans-serif}header{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid #263749}nav{display:flex;gap:16px;flex-wrap:wrap}a{color:#73dcff}button,select,input{font:inherit;color:inherit;background:#111f2e;border:1px solid #39546d;border-radius:7px;padding:7px 11px}button{cursor:pointer}button:disabled{opacity:.4}button:hover,a:hover{color:#ffd174}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ffd174;outline-offset:3px}h1{font-size:23px;margin:0}h2{font-size:21px}p{margin:8px 0 16px}.muted{color:#a9bad0;font-size:14px}.panel{background:#0c131d;border:1px solid #293d50;border-radius:10px;padding:16px;min-width:0}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 20px}pre{font:15px/1.7 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#9be5ff}label{display:flex;align-items:center;gap:8px}article{scroll-margin-top:12px}small{font-size:14px}\nmain.focus{grid-template-columns:1fr!important}main.focus .map,main.focus .explain{display:none}body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{flex-shrink:0}.toolbar{flex-shrink:0}main{padding:0 14px 14px;display:grid;grid-template-columns:230px minmax(0,1fr) 310px;gap:12px;flex:1;min-height:0}.map{overflow:auto}.map h2{margin:0 0 10px}.step{display:block;width:100%;text-align:left;font-size:14px;padding:8px;position:relative;margin-bottom:16px}.step:not(:last-child):after{content:'down';font-size:11px;transform:translateX(-50%);position:absolute;bottom:-21px;left:50%;color:#90aec6}.step[aria-current=true]{border-color:#67ddff;background:#153449;color:#9cecff}.step small{display:block;color:#a9bad0}.stage{display:flex;flex-direction:column;padding:0;overflow:hidden}.stage h2{font-size:18px;padding:10px 14px;margin:0;border-bottom:1px solid #293d50}.illustration{flex:1;min-height:0;background:black;position:relative}iframe{border:0;width:100%;height:100%;display:block}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;border-top:1px solid #293d50}#scrub{flex:1;min-width:90px}.explain{overflow:auto}.explain h2{margin-top:0}.status{padding:8px 14px;color:#ff9dcb;background:#101925;font-size:14px}#loading{position:absolute;inset:0;display:grid;place-items:center;background:black}#loading[hidden]{display:none}details{border-top:1px solid #293d50;margin-top:14px;padding-top:12px}.hint{padding:0 20px 8px;margin:0}@media(max-width:1050px){main{grid-template-columns:190px minmax(0,1fr)}.explain{grid-column:1/-1;max-height:240px}.illustration{min-height:280px}body{height:auto;overflow:auto}main{display:grid;grid-template-rows:570px auto}}@media(max-width:620px){header{display:block}main{display:flex;flex-direction:column}.map{max-height:180px}.stage{height:650px}.explain{max-height:none}nav{gap:10px}h1{font-size:20px}}\n\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\u003cheader\u003e\u003ch1\u003eFull Flow - Step by Step\u003c/h1\u003e\u003cnav\u003e\u003ca href=\"beginner.html\"\u003eSegment Lessons\u003c/a\u003e\u003ca href=\"glossary.html\"\u003eGlossary\u003c/a\u003e\u003ca href=\"flow.html\"\u003eFull Flow\u003c/a\u003e\u003ca href=\"index.html\"\u003eCircuit Lab\u003c/a\u003e\u003c/nav\u003e\u003c/header\u003e\u003cdiv class=\"toolbar\"\u003e\u003clabel\u003eArchitecture \u003cselect id=\"mode\"\u003e\u003coption value=\"blsa\"\u003eBLSA\u003c/option\u003e\u003coption value=\"ocsa\"\u003eOCSA\u003c/option\u003e\u003c/select\u003e\u003c/label\u003e\u003clabel\u003eStory \u003cselect id=\"story\"\u003e\u003coption value=\"read\"\u003eACT → READ → PRE\u003c/option\u003e\u003coption value=\"write\"\u003eACT → WRITE → PRE\u003c/option\u003e\u003coption value=\"verify\"\u003eflip write -\u003e close row -\u003e read back\u003c/option\u003e\u003coption value=\"refresh\"\u003eRefresh\u003c/option\u003e\u003c/select\u003e\u003c/label\u003e\u003clabel\u003eData / write target \u003cselect id=\"bit\"\u003e\u003coption value=\"0\"\u003e0\u003c/option\u003e\u003coption value=\"1\"\u003e1\u003c/option\u003e\u003c/select\u003e\u003c/label\u003e\u003clabel\u003eSpeed \u003cselect id=\"speed\"\u003e\u003coption value=\".5\"\u003e0.5×\u003c/option\u003e\u003coption value=\"1\" selected\u003e1×\u003c/option\u003e\u003coption value=\"2\"\u003e2×\u003c/option\u003e\u003c/select\u003e\u003c/label\u003e\u003cbutton id=\"focus\" aria-pressed=\"false\"\u003eEnlarge Circuit\u003c/button\u003e\u003c/div\u003e\u003cp class=\"hint muted\"\u003eThe left side is the full sequence for the selected story. Select any step to play from that segment. The circuit and timing use a teaching model and do not expand the external PHY.\u003c/p\u003e\u003cmain\u003e\u003csection class=\"panel map\" aria-label=\"Story flow diagram\"\u003e\u003ch2\u003eFlow Map\u003c/h2\u003e\u003cdiv id=\"steps\"\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"panel stage\"\u003e\u003ch2 id=\"title\"\u003eLoading circuit...\u003c/h2\u003e\u003cdiv class=\"illustration\"\u003e\u003ciframe id=\"lab\" title=\"Synchronized circuit animation\" src=\"about:blank\"\u003e\u003c/iframe\u003e\u003cdiv id=\"loading\"\u003ePreparing circuit model...\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"status\" id=\"status\"\u003e\u003c/div\u003e\u003cdiv class=\"controls\"\u003e\u003cbutton id=\"prev\"\u003ePrevious Segment\u003c/button\u003e\u003cbutton id=\"play\"\u003ePlay Segment\u003c/button\u003e\u003cbutton id=\"pause\"\u003ePause\u003c/button\u003e\u003cbutton id=\"next\"\u003eNext Segment\u003c/button\u003e\u003cbutton id=\"all\"\u003ePlay All from Start\u003c/button\u003e\u003cinput id=\"scrub\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\" aria-label=\"Segment progress\"\u003e\u003c/div\u003e\u003c/section\u003e\u003caside class=\"panel explain\"\u003e\u003ch2 id=\"heading\"\u003eWhat is this step doing?\u003c/h2\u003e\u003cp id=\"explanation\"\u003e\u003c/p\u003e\u003cp id=\"watch\"\u003e\u003c/p\u003e\u003ca href=\"glossary.html\" target=\"_blank\" rel=\"noopener\"\u003eOpen glossary\u003c/a\u003e\u003cdetails open\u003e\u003csummary\u003eFormula and Current Values\u003c/summary\u003e\u003cpre id=\"formula\"\u003e\u003c/pre\u003e\u003c/details\u003e\u003cdetails\u003e\u003csummary\u003eScope and Assumptions\u003c/summary\u003e\u003cp class=\"muted\" id=\"assumptions\"\u003e\u003c/p\u003e\u003c/details\u003e\u003c/aside\u003e\u003c/main\u003e\u003cscript\u003e\nconst $=id=\u003edocument.getElementById(id);const stageNames={release:'Release precharge/equalization',oc:'OC stays on / sample offset',hold:'Isolate and hold compensation',share:'WL on / charge sharing',presense:'Pre-sense isolated bitlines',nsense:'N-sense pulls down the low side',psense:'P-sense pulls up the high side',restore:'Keep WL on / complete restore',active:'Row remains active',wlclose:'Close WL / isolate cell',saoff:'Disable sense-amplifier supply',equalize:'Bitline equalization and precharge',standby:'Return to standby',iorelease:'Release I/O precharge',read:'Column select / build read differential',capture:'Readout sampling',readclose:'Close column / output this datum',ioreset:'I/O returns to standby',wdrive:'Write driver establishes data',write:'Column on / write cell',wclose:'Close column / isolate write driver',wrecover:'Stop driver / write recovery',refselect:'REF / internal refresh row select',leak:'Retention leakage interval'};\nconst flowNotes={release:['First release bitline precharge and equalization. The cell is still disconnected, so the later small signal will not be clamped back to VPRE.','This is the EQ branch from the segment lessons; here it is the first step of row activation.'],share:['WL rises, M_A conducts, and the cell shares charge with BL. The cell no longer holds a full 0 or 1, while BL moves only by a small differential.','Watch both Cell and BL. Nothing has been restored yet, and no data has reached DQ.'],nsense:['SAN enables the pull-down side and LAB falls. The two NMOS devices begin to differ in pull-down strength. While WL is still on, the cell is already following BL, so restore is not a sudden later event.','For read 0 the low side is BL; for read 1 it is BLB. The actual voltage decides the result, not the node name.'],psense:['P_EN turns on, and the upper supply pulls the higher side up through the PMOS pair. WL remains on, so the cell continues moving toward the sensed value.','The sense amplifier has resolved the high and low sides, but the small cell capacitor has not reached a full rail in the same instant.'],restore:['Keep WL and sense power enabled so the cell can fully restore. A read 1 must be topped up; a read 0 must be pulled back down. Both data values need restore.','Compare normal operation with early WL close: the sense amplifier may still decide correctly, while the cell only keeps the charge-sharing midpoint.'],active:['The sense amplifier stays latched and WL remains on. Later column reads or writes may use this open row, subject to command timing limits.','The diagram shows both the sense-amplifier node and the cell so they are not mistaken for the same storage location.'],wlclose:['WL is pulled low first. M_A turns off and isolates the cell from BL. Then BL can be precharged to 0.5 V without rewriting the cell.','The cell waveform should hold while BL and BLB keep changing later.'],saoff:['SAP_n rises and SAN falls, turning off the pull-up and pull-down supplies for the sense amplifier. This does not instantly zero every node.','Strong drive is stopped before equalization, avoiding a fight between the supplies while the high and low bitlines are shorted.'],equalize:['EQ enables both precharge paths and M_EQ at the same time. BL and BLB exchange charge and return toward VPRE; the supply-rail bias paths also prepare the next sense operation.','The cell is isolated, so data remains in the cell. PRE by itself is not refresh.'],standby:['BL and BLB are near 0.5 V, and the cell preserves the previous data. The next ACT must still satisfy limits such as tRP after PRE.','This is the closed-row ready state, not a reset of the cell to 0.5 V.'],iorelease:['Local I/O precharge is released so LIO and LIOB can be driven by data. The bitline sense amplifier remains in the active row state.','IOEQ and bitline EQ are different controls. Releasing I/O precharge does not activate a row again.'],read:['CSL connects Y_L and Y_R, so the data latched in the sense amplifier creates a differential on LIO and LIOB. The energy comes from sense-amplifier supply, not directly from the tiny cell.','Watch the column switches and the two local I/O voltages.'],capture:['At the end of this segment, the sign of LIO minus LIOB is sampled to form the read result. Before that sampling point, \"not sampled yet\" must not be treated as valid output.','If the differential is too small, the guide shows X as a teaching validity mark, not a third DQ logic value.'],readclose:['CSL closes and isolates the column path. The sampled result is retained, while the sense amplifier and cell still hold row data.','A READ does not automatically close WL; the same row may continue with more reads or writes.'],ioreset:['Local I/O returns to its precharge reference for the next data item. This resets LIO and LIOB only; it is not row precharge.','Keep BL/BLB separate from the local I/O pair LIO/LIOB.'],wdrive:['The write driver first establishes the new LIO and LIOB levels while CSL is still off. Write data enters here; changing a cell label is not a completed write.','Choose write 0 or write 1. You can also set the starting cell to the same value to see a same-value rewrite.'],write:['CSL turns on. New data changes the sense nodes through the column path, then writes the cell through M_A. Early in a flip, the new driver may oppose the old latched state.','Watch the continuous cell movement and the actual write current. A same-value rewrite may show little voltage change.'],wclose:['CSL closes first, isolating the rewritten sense amplifier from the external write driver. WL is still on at this point.','Do not confuse closing the column switch with isolating the cell.'],wrecover:['After the write driver stops, the sense amplifier holds the new value and the cell continues restoring. Before PRE, write recovery and ACT-to-PRE timing still have to be met.','The teaching model uses the internal write endpoint as a tWR reference. Real devices define this through external data and CK rules.'],refselect:['REF internally selects a row, then performs sharing, sensing, restore, and row close. No CSL is opened, and no new DQ readout is produced.','This demo starts from a slightly degraded cell voltage. Refresh must happen while the data is still readable.'],timing:['This segment only waits out timing that is not yet satisfied. Timing starts from the original command event and overlaps sensing and restore; it is not an extra full wait after circuit action completes.','Use the formula pane to see each limit, anchor event, elapsed time, and remaining time.'],oc:['ISO opens while OC stays on, and sense power is enabled. BL connects to SR and BLB connects to SL, creating a calibration loop that converts mismatch into a compensating node bias.','WL is 0 here. A BL/BLB difference does not mean the cell is being read; the circuit is building the compensation reference.'],hold:['OC closes and the bitlines retain the just-created bias. Sense power pauses and LA/LAB return to their bias levels.','The held value is node charge, not a permanent change to transistor VT. A real circuit is affected by leakage, coupling, and switching noise.'],presense:['Sense power turns on again and first amplifies the difference on the smaller SL/SR load. The outer BL/BLB nodes still control the NMOS gates even though ISO and OC conduction paths are open.','Isolation does not mean no signal at all: the gate field still controls current. But the cell has not yet been restored by the internal full-swing result.']};\nfunction enStage(st){if(st.key==='timing'){const r=st.waitAtEntry\u003e1e-8?'wait remaining time':'timing check satisfied';return {...st,title:(st.gateTarget||'Command')+' check: '+r};}return {...st,title:stageNames[st.key]||st.key};}\nfunction guideText(st,s){const p=flowNotes[st.key]||['Hold the current circuit state.','Observe the present node voltages.'];let f=`Vcell = ${s.cell.toFixed(5)} V\\nVBL = ${s.bl.toFixed(5)} V\\nVBLB = ${s.b.toFixed(5)} V\\nDQ = ${s.dq===null?'not sampled yet':s.dq}`;if(st.checks)f+='\\n\\n'+st.checks.map(r=\u003e`${r.name}: elapsed ${((s.t||0)-r.origin).toFixed(2)} ns / limit ${r.limit} ns`).join('\\n');f+='\\n\\nThis is a teaching model for bitline sensing, restore, row activation, column select, precharge/equalization, refresh, and offset compensation. It is not a full DDR5 timing sign-off model.';return {explain:p[0],watch:p[1],formula:f};}\nfunction scrubFrameText(){if(!doc)return;doc.documentElement.lang='en';doc.querySelectorAll('text,tspan,[aria-label]').forEach(el=\u003e{if(el.hasAttribute('aria-label'))el.setAttribute('aria-label','circuit signal diagram');if(/[\\u3400-\\u9fff]/.test(el.textContent))el.textContent=el.textContent.replace(/[\\u3400-\\u9fff\\u3000-\\u303f\\uff00-\\uffef]+/g,'').trim();});}$('focus').onclick=()=\u003e{const on=document.querySelector('main').classList.toggle('focus');$('focus').setAttribute('aria-pressed',String(on));$('focus').textContent=on?'Restore Flow and Explanation':'Enlarge Circuit';};let api,doc,sim,k=0,q=0,playing=false,all=false,last=0,raf=0,lastPaint=0;\nfunction stop(){playing=false;cancelAnimationFrame(raf);last=0;$('pause').disabled=true;}\nfunction setup(){if(!api)return;stop();api.choose($('mode').value==='ocsa'?15:11);api.setBit(+$('bit').value);api.setStory($('story').value);sim=api.getFlowSimulation();k=0;q=0;$('steps').innerHTML=sim.stages.map((raw,i)=\u003e{const s=enStage(raw);return `\u003cbutton class=\"step\" data-step=\"${i}\" aria-current=\"false\"\u003e\u003cb\u003e${i+1}. ${s.title}\u003c/b\u003e\u003csmall\u003e${s.op} - ${s.duration.toFixed(1)} ns (model)\u003c/small\u003e\u003c/button\u003e`;}).join('');draw();}\nfunction draw(){if(!api)return;api.seek(k,q);const s=api.getState().view,st=enStage(sim.stages[k]),g=guideText(sim.stages[k],s);scrubFrameText();doc.body.classList.toggle('paused',!playing);$('title').textContent=`${k+1} / ${sim.stages.length} - ${st.title}`;$('heading').textContent=(st.op?st.op+' - ':'')+st.title;$('explanation').textContent=g.explain;$('watch').textContent=g.watch;$('formula').textContent=g.formula;$('assumptions').textContent='Teaching model with idealized internal nodes, selected timing thresholds, and simplified peripheral circuits. External PHY, burst behavior, process sign-off, and complete JEDEC compliance checks are outside this view.';$('status').textContent=`Cell ${s.cell.toFixed(3)} V  BL ${s.bl.toFixed(3)} V  BLB ${s.b.toFixed(3)} V  DQ ${s.dq===null?'not sampled yet':s.dq}  ${playing?'playing':'paused'}`;$('scrub').value=Math.round(q*1000);$('prev').disabled=k===0;$('next').disabled=k===sim.stages.length-1;$('pause').disabled=!playing;document.querySelectorAll('.step').forEach((el,i)=\u003eel.setAttribute('aria-current',String(k===i)));}\nfunction goto(i,run=true){if(!sim)return;stop();k=Math.max(0,Math.min(sim.stages.length-1,i));q=0;draw();if(run)start(false);}\nfunction start(chain=false){if(!api)return;stop();if(q\u003e=1)q=0;all=chain;playing=true;last=0;draw();raf=requestAnimationFrame(tick);}\nfunction tick(now){if(!playing)return;if(last)q+=Math.min((now-last)/1000,.15)*+$('speed').value/5;last=now;if(q\u003e=1){q=1;draw();if(all\u0026\u0026k\u003csim.stages.length-1){k++;q=0;document.querySelectorAll('.step')[k].scrollIntoView({block:'nearest'});}else stop();}if(now-lastPaint\u003e50||!playing){draw();lastPaint=now;}if(playing)raf=requestAnimationFrame(tick);}\n$('lab').onload=()=\u003e{try{doc=$('lab').contentDocument;api=$('lab').contentWindow.BeginnerLab;if(!api)throw Error('model');const css=doc.createElement('style');css.textContent='html,body{height:100%!important;overflow:hidden!important}body{display:block!important}header,#lessons,aside,.scope,.question,.config,.controls{display:none!important}main{display:block!important;height:100%!important;padding:0!important;margin:0!important;min-height:0!important}.workspace{height:100%!important;border:0!important;border-radius:0!important}.canvas{height:100%!important;min-height:0!important;flex:1!important}.canvas svg{height:100%!important;width:100%!important}';doc.head.append(css);doc.addEventListener('click',e=\u003e{if(e.target.closest('[data-part]'))stop();},true);setup();$('loading').hidden=true;}catch(e){$('loading').textContent='The circuit did not load. Refresh the page, or enter from Segment Lessons.';}};\nfor(const id of ['mode','story','bit'])$(id).onchange=setup;$('steps').onclick=e=\u003e{const b=e.target.closest('[data-step]');if(b)goto(+b.dataset.step);};$('play').onclick=()=\u003estart(false);$('pause').onclick=()=\u003e{stop();draw();};$('prev').onclick=()=\u003egoto(k-1);$('next').onclick=()=\u003egoto(k+1);$('all').onclick=()=\u003e{goto(0,false);start(true);};$('scrub').oninput=()=\u003e{if(!api)return;stop();q=+$('scrub').value/1000;draw();};window.FlowGuide={setup,goto,draw,getState:()=\u003e({k,q,playing,sim})};\ntop.mountLab(document.getElementById('lab'),'beginner');\n\u003c/script\u003e\u003c/body\u003e\u003c/html\u003e\n\n\n"}};

let language='zh',currentPage='index';

function updateShell(){const c=labels[language];document.documentElement.lang=language==='zh'?'zh-Hant':'en';document.title=c.title;document.getElementById('brand').textContent=c.brand;document.getElementById('note').textContent=c.note;document.querySelectorAll('[data-page]').forEach(b=>{b.textContent=c[b.dataset.page];b.setAttribute('aria-current',String(b.dataset.page===currentPage));});document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.lang===language)));}
window.showLab=function(name){if(!activePages()[name])name='index';currentPage=name;updateShell();const old=document.getElementById('content'),fresh=document.createElement('iframe');fresh.id='content';fresh.title=labels[language].frame;fresh.src='about:blank';old.replaceWith(fresh);mountLab(fresh,name);};
