span style=\"color:#ffbf5b\"\u003e━ BLB\u003c/span\u003e\u003cspan style=\"color:#fd83c9\"\u003e━ Cell\u003c/span\u003e\u003cspan id=\"localSenseLegend\" hidden style=\"color:#aa99ff\"\u003e┄ SABL / SABLB\u003c/span\u003e\u003c/div\u003e\u003csvg id=\"localWave\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"目前階段附近的電壓與控制訊號\"\u003e\u003c/svg\u003e\u003cp class=\"scope-note\"\u003e白線：目前進度 · 隨階段切換\u003c/p\u003e\u003c/aside\u003e\n\u003cdiv class=\"circuit-viewport\" id=\"viewport\"\u003e\u003csvg id=\"circuit\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1100 1160\" role=\"img\" aria-label=\"可點選元件的 DRAM 完整電路\"\u003e\u003c/svg\u003e\u003c/div\u003e\n\u003caside class=\"stage-brief\" aria-label=\"當前流程重點\"\u003e\u003cdiv class=\"brief-heading\"\u003e\u003cstrong\u003e現在在做什麼\u003c/strong\u003e\u003cspan id=\"briefCount\"\u003e\u003c/span\u003e\u003c/div\u003e\u003ch2 id=\"briefStage\"\u003e\u003c/h2\u003e\u003cp id=\"briefWhat\"\u003e\u003c/p\u003e\u003ch3\u003e為什麼要這樣做\u003c/h3\u003e\u003cp id=\"briefWhy\"\u003e\u003c/p\u003e\u003cp id=\"briefWiring\" class=\"brief-note\"\u003e\u003c/p\u003e\u003cdiv id=\"briefTrigger\"\u003e\u003c/div\u003e\u003csection class=\"brief-capacitors\"\u003e\u003ch3\u003e位線電容正在怎麼變\u003c/h3\u003e\u003cdiv id=\"briefCaps\"\u003e\u003c/div\u003e\u003cp id=\"briefCapWhy\" class=\"brief-note\"\u003e\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch3\u003e主要支路電流 \u003csmall\u003eµA\u003c/small\u003e\u003c/h3\u003e\u003cdiv id=\"briefCurrents\"\u003e\u003c/div\u003e\u003cp class=\"brief-note\"\u003e方向與數值來自目前模型；點元件可看工作區與詳細參數。\u003c/p\u003e\u003c/section\u003e\u003c/aside\u003e\n\u003c/div\u003e\n\u003cdiv class=\"sr-only\"\u003e\u003cdiv\u003e\u003cspan class=\"eyebrow\" id=\"architecture\"\u003eBLSA / TRANSISTOR VIEW\u003c/span\u003e\u003ch1 id=\"circuitHeading\"\u003e位線感測電路\u003c/h1\u003e\u003c/div\u003e\u003cspan id=\"currentStepCompact\" class=\"compact-step\"\u003e\u003c/span\u003e\u003c/div\u003e\n\u003clabel class=\"scrubber\"\u003e\u003cspan class=\"sr-only\"\u003e拖曳案例進度\u003c/span\u003e\u003cinput id=\"scrub\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\" step=\"1\"\u003e\u003c/label\u003e\n\u003c/section\u003e\n\u003caside class=\"explanation\" id=\"explanation\" hidden data-section=\"flow\"\u003e\u003cdiv class=\"detailtabs\"\u003e\u003cbutton data-detail=\"flow\" aria-pressed=\"true\"\u003e流程圖\u003c/button\u003e\u003cbutton data-detail=\"formula\" aria-pressed=\"false\"\u003e公式與推導\u003c/button\u003e\u003cbutton id=\"closeExplanation\" aria-label=\"關閉說明\"\u003e✕\u003c/button\u003e\u003c/div\u003e\u003csection class=\"panel nowpanel\"\u003e\u003cdiv class=\"panelhead\"\u003e\u003cspan class=\"eyebrow\"\u003eCURRENT STEP\u003c/span\u003e\u003cspan id=\"stageCounter\" class=\"counter\"\u003e\u003c/span\u003e\u003c/div\u003e\u003ch2 id=\"stepTitle\"\u003e\u003c/h2\u003e\u003cp id=\"stepIntro\"\u003e\u003c/p\u003e\u003cdiv class=\"statusline\" id=\"stepStatus\"\u003e\u003c/div\u003e\u003cdiv class=\"localprogress\"\u003e\u003cspan id=\"localBar\"\u003e\u003c/span\u003e\u003c/div\u003e\u003c/section\u003e\n\u003csection class=\"panel flowpanel\"\u003e\u003cdiv class=\"panelhead\"\u003e\u003ch2\u003e本操作流程\u003c/h2\u003e\u003cbutton id=\"playOperation\" class=\"mini\"\u003e▶ 播放本操作\u003c/button\u003e\u003c/div\u003e\u003cdiv id=\"flowchart\" class=\"flowchart\"\u003e\u003c/div\u003e\u003c/section\u003e\n\u003csection class=\"panel formulapanel\"\u003e\u003cdiv class=\"panelhead\"\u003e\u003ch2\u003e正在發生的計算\u003c/h2\u003e\u003cspan class=\"eyebrow\"\u003eLIVE\u003c/span\u003e\u003c/div\u003e\u003cdiv id=\"formula\"\u003e\u003c/div\u003e\u003cdetails class=\"timing-details\"\u003e\u003csummary\u003e命令時序與教學門檻\u003c/summary\u003e\u003cdiv class=\"timingbody\"\u003e\u003cp class=\"scope-note\"\u003e這裡驗證所列的 7 項時間關係。門檻是可調教學值；本頁沒有指定完整 DDR5 速度等級、MR 或 burst 組態。\u003c/p\u003e\u003cdiv id=\"timingLive\"\u003e\u003c/div\u003e\u003cdetails\u003e\u003csummary\u003e調整教學門檻（套用會回到起點）\u003c/summary\u003e\u003cform id=\"timingForm\"\u003e\u003cdiv id=\"timingInputs\"\u003e\u003c/div\u003e\u003cbutton type=\"submit\"\u003e套用\u003c/button\u003e \u003cbutton id=\"resetTiming\" type=\"button\"\u003e還原案例\u003c/button\u003e\u003cp id=\"timingApplied\" role=\"status\"\u003e\u003c/p\u003e\u003c/form\u003e\u003c/details\u003e\u003cp class=\"formula-note\"\u003etRCD 從 ACT 起算，和共享、感測、恢復重疊；只等待不足的部分。多個限制取最晚到期時間，不逐一相加。\u003c/p\u003e\u003cp class=\"formula-vars\"\u003e本模型未模擬外部 DQ／CK。WD_REF 放在內部寫入階段末端，僅示範 tWR 的參考事件；真實 tWR 應依 JEDEC 最後寫入資料後的第一個 CK 上升緣起算（JESD79-5C §4.8.2）。尚未檢查 nCK 取整、tCCD、讀寫轉向、跨 bank／rank、tFAW 或 tREFI 排程，不能據此宣稱 JEDEC 合規。\u003c/p\u003e\u003ch3\u003e已發出命令\u003c/h3\u003e\u003cdiv id=\"timingLog\"\u003e\u003c/div\u003e\u003c/div\u003e\u003c/details\u003e\u003c/section\u003e\n\u003c/aside\u003e\u003c/div\u003e\n\u003csection class=\"timeline panel\"\u003e\u003cdiv class=\"panelhead\"\u003e\u003ch2\u003e電壓與控制訊號\u003c/h2\u003e\u003cbutton id=\"focusWave\" class=\"mini\"\u003e放大示波器\u003c/button\u003e\u003cspan id=\"timeLabel\"\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"wavelegend\"\u003e\u003cspan style=\"color:#59e2ff\"\u003e━ BL\u003c/span\u003e\u003cspan style=\"color:#ffbf5b\"\u003e━ BLB\u003c/span\u003e\u003cspan style=\"color:#fd83c9\"\u003e━ Cell\u003c/span\u003e\u003cspan id=\"senseLegend\" hidden style=\"color:#aa99ff\"\u003e┄ SABL / SABLB\u003c/span\u003e\u003cspan\u003e下方：WL / EQ / SAN / SAP_n / CSL / ISO / OC\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"wavewrap\"\u003e\u003csvg id=\"wave\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1260 300\" role=\"img\" aria-label=\"同步電壓及控制訊號波形\"\u003e\u003c/svg\u003e\u003c/div\u003e\u003c/section\u003e\n\u003cfooter\u003e\u003cspan\u003e單 Cell 教學模型 · VINTA = 1.00 V · Ccell = 20 fF · CBL = 200 fF\u003c/span\u003e\u003cspan\u003e動畫時間經放慢；不代表 JEDEC 最小時序。\u003c/span\u003e\u003c/footer\u003e\n\u003c/main\u003e\n\u003cdialog id=\"componentDialog\"\u003e\u003cdiv class=\"dialoghead\"\u003e\u003cspan class=\"eyebrow\"\u003eCOMPONENT INSPECTOR\u003c/span\u003e\u003cbutton data-close=\"componentDialog\" aria-label=\"關閉元件說明\"\u003e✕\u003c/button\u003e\u003c/div\u003e\u003cdiv id=\"componentBody\"\u003e\u003c/div\u003e\u003cbutton data-close=\"componentDialog\" class=\"primary full\"\u003e回到電路\u003c/button\u003e\u003c/dialog\u003e\n\u003cdialog id=\"sourceDialog\"\u003e\u003cdiv class=\"dialoghead\"\u003e\u003ch2\u003e模型、命名與來源\u003c/h2\u003e\u003cbutton data-close=\"sourceDialog\" aria-label=\"關閉模型說明\"\u003e✕\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"prose\"\u003e\n\u003cp\u003e\u003cb\u003eBLSA：\u003c/b\u003e依 Keeth 等《DRAM Circuit Design: Fundamental and High-Speed Topics》印刷頁 26–28 的交叉耦合感測原理，以及第 2 章的等化／欄位選擇電路，加入顯式供電、I/O 預充電和寫入驅動支路。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003eOCSA：\u003c/b\u003e補償核心依 \u003ca href=\"https://patents.google.com/patent/US20200227111A1/en\" target=\"_blank\" rel=\"noopener\"\u003eUS20200227111A1，Fig. 3、6A–6E、8\u003c/a\u003e，採 ISO 與 OC 切換連線的架構。P_L / N_L 對應專利 P₂ / N₂；P_R / N_R 對應 P₁ / N₁。預充電時 ISO、OC 同為高；補償時只降低 ISO，OC 保持高，並切換感測供電（Fig. 6A–6B）。因此待機 OC 為 1.5 V 是此架構的預定狀態。供電偏壓、I/O 及寫入為教學周邊實作。這不是先前提及的 2018 SVC 論文重現，也不代表任一廠商 DDR5 網表。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003eJEDEC：\u003c/b\u003e命令、外部訊號與時序名稱以使用者提供的 JESD79-5C_v1.30 為依據。BL、WL、CSL、LA、LAB、VINTA、VPRE 與元件編號屬內部電路名稱，並非 JEDEC 指定晶片內部網表。外部 VPP 不等於本模型的 WL 節點。\u003c/p\u003e\n\u003ch3\u003e計算方式\u003c/h3\u003e\u003cp\u003e以各節點 KCL 和長通道平方律 MOS 電流進行數值積分。所有節點電壓、支路箭頭與元件狀態由同一模型產生；不是事先畫好的電壓曲線。MOS／開關切換只改圖示。\u003c/p\u003e\u003cdiv class=\"eq\"\u003eC · dV/dt = Σ I\u003csub\u003ein\u003c/sub\u003e − Σ I\u003csub\u003eout\u003c/sub\u003e\u003c/div\u003e\n\u003cp\u003eVINTA = 1 V；VPRE = VPL = 0.5 V；WL／ISO／OC／CSL 的高電位 = 1.5 V（教學升壓控制）；CBL = CBLB = 200 fF，Ccell = 20 fF，OCSA 的 CSABL = CSABLB = 20 fF，CIO = 50 fF。兩頁使用同樣 NMOS 失配：VT,N_L = 0.306 V、VT,N_R = 0.294 V。βP = 0.2、βN = 1 mA/V²；這些是示例參數。\u003c/p\u003e\n\u003cp\u003e\u003cb\u003e電容比例：\u003c/b\u003eCcell:CBL = 20:200 = 1:10，刻意示範較小的共享訊號；在 VINTA = 1 V、VPRE = 0.5 V 時，BLSA 共享差值約 ±45.45 mV。這不是 JEDEC 規定的內部電容比例，也不宣稱所有 DDR5 都是 1:5～1:8。OCSA 應代入實際補償後的 BL 起始電壓。\u003c/p\u003e\u003cp\u003e\u003cb\u003e讀出有效性：\u003c/b\u003e只有 ΔVIO \u0026gt; +10 mV 判 1、ΔVIO \u0026lt; −10 mV 判 0；其餘顯示 X。10 mV 為教學門檻，X 為模擬器的不確定狀態，並非實體 DQ 的第三種邏輯值。\u003c/p\u003e\u003cp\u003e忽略次臨界、體效應、寄生耦合、通道長度調變、接面漏電與控制饋通；只有「漏電」案例加入 I = G(0.5 − Vcell) 的等效漏電支路。補償量由電路求出，不假設等於 ΔVT，也不宣稱完全消除偏移。\u003c/p\u003e\n\u003ch3\u003e範圍與時間\u003c/h3\u003e\u003cp\u003e展示一個位線對及一顆 Cell。READ／WRITE 的 I/O、欄位開關和寫入驅動器明確畫出；序列化、DQS、外部 DQ 驅動與完整 DDR5 burst 用功能端點表示。DQ 面板表示本筆取樣資料，不是完整接腳波形。\u003c/p\u003e\u003cp\u003eREF 示範內部刷新所選列的資料恢復；不表示每個 REF 命令只刷新一條 WL。REFab／REFsb 的銀行排程與刷新計數器不在本電路層動畫範圍。\u003c/p\u003e\u003cp\u003e畫面中的 ns 是此示例模型的時間。新版會追蹤 ACT、READ、PRE、REF、WD_REF 事件，對 tRCD、tRAS、tRP、tRC、tRTP、tWR、tRFC 自動等待剩餘時間並檢查。預設數字及「等待觀察」案例是教學設定，不是完整 JEDEC 速度等級；即使通過所列規則，仍不能判定真實命令序列合規。實際值與 CK 週期限制需依密度、速度等級、MR 和命令序列查表。\u003c/p\u003e\n\u003cp\u003e時序規則參考：JESD79-5C_v1.30 §4.7.2（印刷頁 137：tRTP／tRAS／tRP／tRC）、§4.8.2（頁 148：tWR 參考點）、§4.13（頁 168：REF 與 tRFC）。OCSA 補償效果僅在本模型與案例驗證，未完成 PVT、雜訊及失配範圍驗證。\u003c/p\u003e\u003c/div\u003e\u003c/dialog\u003e\n\u003cscript\u003e/* DRAM Circuit Lab. Educational long-channel MOS transient model.\n * Units: V, ns, pF, mA. Not a DDR5 timing or process sign-off model.\n * OCSA core connectivity: US20200227111A1, Fig.3 / Fig.6A–E.\n * Named rail/column/write drivers are explicit illustrative peripheral circuits.\n */\n(function(global){\n'use strict';\nconst C={BL:.2,BLB:.2,CELL:.02,SL:.02,SR:.02,LA:.04,LAB:.04,LIO:.05,LIOB:.05};\nconst nodes=Object.keys(C), caps=nodes.map(n=\u003eC[n]), ix=Object.fromEntries(nodes.map((n,i)=\u003e[n,i]));\nconst rail={VINTA:1,VSS:0,VPRE:.5,VPL:.5};\nconst clamp=(v,a=0,b=1)=\u003eMath.max(a,Math.min(b,v));\n// Rule demonstration only: no speed-bin / MR / burst configuration is implied.\nconst timingDefaults={tRCD:16,tRAS:32,tRP:16,tRC:48,tRTP:7.5,tWR:30,tRFC:295};\nconst senseMargin=.01; // 10 mV illustrative input margin, not a JEDEC specification.\nfunction decideRead(delta,margin=senseMargin){return !Number.isFinite(delta)||Math.abs(delta)\u003c=margin?'X':delta\u003e0?1:0;}\nconst scenarios=[\n {id:'read0',group:'簡單案例',name:'讀出 0',init:0,ops:['ACT','RD','PRE'],goal:'從儲存 0 的 Cell 開列，讀出 0，再關列。'},\n {id:'read1',group:'簡單案例',name:'讀出 1',init:1,ops:['ACT','RD','PRE'],goal:'從儲存 1 的 Cell 開列，讀出 1，再關列。'},\n {id:'write0',group:'簡單案例',name:'寫入 0（1 → 0）',init:1,ops:['ACT','W0','PRE'],goal:'寫入驅動器將原本的 1 改成 0，完成寫入恢復後關列。'},\n {id:'write1',group:'簡單案例',name:'寫入 1（0 → 1）',init:0,ops:['ACT','W1','PRE'],goal:'寫入驅動器將原本的 0 改成 1，完成寫入恢復後關列。'},\n {id:'act0',group:'單一操作',name:'ACT：Cell = 0',init:0,ops:['ACT'],goal:'只看開列、共享與感測；最後保持列開啟。'},\n {id:'act1',group:'單一操作',name:'ACT：Cell = 1',init:1,ops:['ACT'],goal:'只看開列、共享與感測；最後保持列開啟。'},\n {id:'pre0',group:'單一操作',name:'PRE：已開列的 0',init:0,open:true,ops:['PRE'],goal:'起始已完成 ACT 與恢復；只播放關列、停用感測與等化。'},\n {id:'pre1',group:'單一操作',name:'PRE：已開列的 1',init:1,open:true,ops:['PRE'],goal:'起始已完成 ACT 與恢復；觀察 Cell 隔離後如何保留 1。'},\n {id:'refresh0',group:'單一操作',name:'Refresh 0',init:.12,ops:['REF'],goal:'Cell 的低電位已因漏電升到 0.12 V；刷新將它恢復到接近 0 V。'},\n {id:'refresh1',group:'單一操作',name:'Refresh 1',init:.88,ops:['REF'],goal:'Cell 的高電位已因漏電降到 0.88 V；刷新將它恢復到接近 1 V。'},\n {id:'verify01',group:'Case study',name:'寫 1 → 關列 → 重新讀回',init:0,ops:['ACT','W1','PRE','ACT','RD','PRE'],goal:'重新 ACT 後再讀回，確認資料保存在 Cell，而不只是感測器仍鎖存 1。'},\n {id:'verify10',group:'Case study',name:'寫 0 → 關列 → 重新讀回',init:1,ops:['ACT','W0','PRE','ACT','RD','PRE'],goal:'觀察寫入翻轉、隔離保存與重新讀出 0 的完整連續過程。'},\n {id:'same0',group:'Case study',name:'同值重寫 0 → 0',init:0,ops:['ACT','W0','RD','PRE'],goal:'沒有邏輯翻轉仍有控制動作；穩態下不應畫出持續充放電。'},\n {id:'same1',group:'Case study',name:'同值重寫 1 → 1',init:1,ops:['ACT','W1','RD','PRE'],goal:'區分寫入動作與位元翻轉，觀察寫入驅動器和欄位開關。'},\n {id:'rowhit',group:'Case study',name:'同列 Read → Write → Read',init:0,ops:['ACT','RD','W1','RD','W0','RD','PRE'],goal:'同一列保持開啟；READ 不會每次重新開啟 WL，也不會自動 PRE。'},\n {id:'retention',group:'Case study',name:'寫 1 → 漏電 → Refresh → 讀回',init:0,ops:['ACT','W1','PRE','WAIT','REF','ACT','RD','PRE'],goal:'把儲存、示意漏電與刷新串起來。REF 本身不將資料送到 DQ。'},\n {id:'timingwait',group:'時序觀察',name:'等待觀察：ACT → READ → PRE → 再開列',init:0,timing:{tRCD:120,tRAS:180,tRP:50,tRC:230},ops:['ACT','RD','PRE','ACT','W1','PRE'],goal:'刻意延長教學門檻，觀察 tRCD、tRAS、tRP／tRC 的剩餘時間；這不是 DDR5 速度等級。'},\n /*{id:'margin0',group:'補償比較',name:'弱訊號 0＋NMOS 失配',init:.36,offset:.06,ops:['ACT','RD','PRE'],goal:'Cell 只有微弱低訊號。切換 BLSA／OCSA，比較相同失配下的感測結果；結果由模型計算。'},\n {id:'margin1',group:'補償比較',name:'弱訊號 1＋NMOS 失配',init:.64,offset:-.06,ops:['ACT','RD','PRE'],goal:'Cell 只有微弱高訊號。比較有無補償的偏移與判讀結果。'}*/\n];\nfunction transistor(id,type,a,b,gate,k,vt=.3){return {id,type,a,b,gate,k,vt};}\nfunction netlist(mode,offset=0){\n const oc=mode==='ocsa', l=oc?'SL':'BL',r=oc?'SR':'BLB';\n const list=[\n transistor('P_L','p','LA',l,r,.2),transistor('P_R','p','LA',r,l,.2),\n transistor('N_L','n',l,'LAB','BLB',1,.3+offset/2),transistor('N_R','n',r,'LAB','BL',1,.3-offset/2),\n transistor('P_EN','p','VINTA','LA','@SAP_n',5),transistor('N_EN','n','LAB','VSS','@SAN',5),\n transistor('B_LA','n','LA','VPRE','@BIAS',4),transistor('B_LAB','n','LAB','VPRE','@BIAS',4),\n transistor('M_PL','n','BL','VPRE','@EQ',1),transistor('M_PR','n','BLB','VPRE','@EQ',1),\n transistor('M_EQ','n','BL','BLB','@EQ',1),transistor('M_A','n','BL','CELL','@WL',.5),\n transistor('Y_L','n',l,'LIO','@CSL',2),transistor('Y_R','n',r,'LIOB','@CSL',2),\n transistor('IO_PL','n','LIO','VPRE','@IOEQ',1),transistor('IO_PR','n','LIOB','VPRE','@IOEQ',1),\n transistor('W_PL','p','VINTA','LIO','@WPL',8),transistor('W_PR','p','VINTA','LIOB','@WPR',8),\n transistor('W_NL','n','LIO','VSS','@WNL',8),transistor('W_NR','n','LIOB','VSS','@WNR',8)\n ];\n if(oc)list.push(transistor('ISO_L','n','BL','SL','@ISO',2),transistor('ISO_R','n','BLB','SR','@ISO',2),transistor('OC_L','n','BL','SR','@OC',2),transistor('OC_R','n','BLB','SL','@OC',2));\n return list;\n}\nfunction voltage(name,v,g){return name[0]==='@'?g[name.slice(1)]:(name in ix?v[ix[name]]:rail[name]);}\nfunction mos(d,v,g){\n const a=voltage(d.a,v,g),b=voltage(d.b,v,g),vg=voltage(d.gate,v,g),ds=Math.abs(a-b);\n const over=d.type==='n'?vg-Math.min(a,b)-d.vt:Math.max(a,b)-vg-d.vt;\n const magnitude=over\u003c=0?0:(ds\u003cover?d.k*(over*ds-.5*ds*ds):.5*d.k*over*over);\n return {i:Math.sign(a-b)*magnitude,over,a,b,vg,region:over\u003c=0?'截止':ds\u003cover?'線性區':'飽和區'};\n}\nfunction initialG(mode){return {EQ:1.5,BIAS:1.5,WL:0,SAP_n:1,SAN:0,CSL:0,IOEQ:1.5,WPL:1,WPR:1,WNL:0,WNR:0,ISO:mode==='ocsa'?1.5:0,OC:mode==='ocsa'?1.5:0};}\nfunction makeStages(mode,sc,profile){\n const list=[],events=[];let g=initialG(mode),group=-1,op='',cursor=0;\n const clocks={ACT:null,RD:null,PRE:null,WD_REF:null,REF:null};\n const add=(key,title,duration,patch={},extra={})=\u003e{const start={...g};g={...g,...patch};list.push({key,title,duration,startG:start,endG:{...g},group,op,clocks:{...clocks},...extra});cursor+=duration;};\n const mark=type=\u003e{events.push({type,time:cursor,group});if(type in clocks)clocks[type]=cursor;if(type==='ACT'){clocks.RD=null;clocks.WD_REF=null;}};\n const rule=(name,anchor)=\u003eclocks[anchor]===null?null:{name,anchor,origin:clocks[anchor],limit:profile[name]};\n const gate=(target,rules)=\u003e{const checks=rules.filter(Boolean);if(!checks.length)return;const remaining=Math.max(0,...checks.map(r=\u003er.origin+r.limit-cursor));add('timing',`${target}：${remaining\u003e1e-8?'等待剩餘時間':'時序檢查已滿足'}`,Math.max(.1,remaining),{}, {checks,gateTarget:target,waitAtEntry:remaining});};\n const beforeACT=()=\u003egate('ACT 前檢查',[rule('tRP','PRE'),rule('tRC','ACT'),rule('tRFC','REF')]);\n const beforePRE=()=\u003egate('PRE 前檢查',[rule('tRAS','ACT'),rule('tRTP','RD'),rule('tWR','WD_REF')]);\n if(sc.open)g={...g,EQ:0,BIAS:0,WL:1.5,SAP_n:0,SAN:1,OC:0};\n function act(refresh=false){\n  add('release','釋放預充電',2,{EQ:0,BIAS:0});\n  if(mode==='ocsa'){\n   add('oc','OC 保持導通／啟用偏移取樣',35,{ISO:0,OC:1.5,SAP_n:0,SAN:1});\n   add('hold','隔離並保持補償量',3,{OC:0,SAP_n:1,SAN:0,BIAS:1.5});\n   add('share','WL 開啟／電荷共享',7,{WL:1.5});\n   add('presense','隔離位線的預感測',22,{SAP_n:0,SAN:1,BIAS:0});\n   add('restore','接回位線／恢復 Cell',28,{ISO:1.5});\n  }else{\n   add('share','WL 開啟／電荷共享',7,{WL:1.5});\n   add('nsense','N-sense 拉低低側',15,{SAN:1});\n   add('psense','P-sense 拉高高側',18,{SAP_n:0});\n   add('restore','保持 WL／完成恢復',12);\n  }\n  add('active',refresh?'刷新資料恢復完成':'列保持開啟',2);\n  if(!refresh)gate('tRCD 檢查',[rule('tRCD','ACT')]);\n }\n function pre(){\n  add('wlclose','關閉 WL／隔離 Cell',2,{WL:0});\n  add('saoff','停止感測器供電',2,{SAP_n:1,SAN:0});\n  add('equalize','位線等化與預充電',25,{EQ:1.5,BIAS:1.5,ISO:mode==='ocsa'?1.5:0,OC:mode==='ocsa'?1.5:0});\n  add('standby','回到待機',2);\n }\n for(op of sc.ops){group++;\n  if(op==='ACT'){beforeACT();mark('ACT');act();}\n  if(op==='PRE'){beforePRE();mark('PRE');pre();}\n  if(op==='RD'){\n   mark('RD');\n   add('iorelease','解除 I/O 預充電',2,{IOEQ:0});\n   add('read','開啟欄位／建立讀出差值',6,{CSL:1.5});\n   add('capture','讀出端取樣',2,{}, {capture:true});\n   add('readclose','關閉欄位／輸出本筆資料',2,{CSL:0});\n   add('ioreset','I/O 回到待機',5,{IOEQ:1.5});\n  }\n  if(op==='W0'||op==='W1'){\n   mark(op);\n   const bit=op==='W1'?1:0;\n   add('iorelease','解除 I/O 預充電',2,{IOEQ:0},{writeBit:bit});\n   add('wdrive','寫入驅動器建立資料',3,{WPL:bit?0:1,WPR:bit?1:0,WNL:bit?0:1,WNR:bit?1:0},{writeBit:bit});\n   add('write','欄位開啟／寫入 Cell',18,{CSL:1.5},{writeBit:bit});\n   mark('WD_REF'); // Teaching proxy, not a simulated final external DQ clock edge.\n   add('wclose','關閉欄位／隔離寫入驅動',2,{CSL:0},{writeBit:bit});\n   add('wrecover','停止驅動／寫入恢復',10,{WPL:1,WPR:1,WNL:0,WNR:0},{writeBit:bit});\n   add('ioreset','I/O 回到待機',5,{IOEQ:1.5},{writeBit:bit});\n  }\n  if(op==='REF'){\n   gate('REF 前檢查',[rule('tRP','PRE'),rule('tRFC','REF')]);mark('REF');\n   add('refselect','REF／內部刷新位址選列',2);\n   act(true);pre();\n   gate('REF 忙碌結束',[rule('tRFC','REF')]);\n  }\n  if(op==='WAIT')add('leak','保持期間的漏電',100,{}, {leak:true});\n }\n return {stages:list,events};\n}\nfunction auditTiming(events,profile,initialOpen=false){\n let act=null,rd=null,pre=null,wr=null,ref=null,open=initialOpen;const results=[];\n for(const e of events){\n  const checks=[];const test=(name,origin)=\u003e{if(origin!==null)checks.push({name,elapsed:e.time-origin,required:profile[name],pass:e.time-origin+1e-7\u003e=profile[name]});};\n  if(e.type==='WD_REF'){wr=e.time;continue;}\n  let stateOK=true;\n  if(e.type==='ACT'){stateOK=!open;test('tRP',pre);test('tRC',act);test('tRFC',ref);act=e.time;rd=null;wr=null;open=true;}\n  if(['RD','W0','W1'].includes(e.type)){stateOK=open;test('tRCD',act);if(e.type==='RD')rd=e.time;}\n  if(e.type==='PRE'){stateOK=open;test('tRAS',act);test('tRTP',rd);test('tWR',wr);pre=e.time;open=false;}\n  if(e.type==='REF'){stateOK=!open;test('tRP',pre);test('tRFC',ref);ref=e.time;}\n  results.push({...e,checks,stateOK,pass:stateOK\u0026\u0026checks.every(c=\u003ec.pass)});\n }\n return results;\n}\nfunction controls(st,t){const q=clamp(t/Math.min(.45,st.duration/4));return Object.fromEntries(Object.keys(st.endG).map(k=\u003e[k,st.startG[k]+(st.endG[k]-st.startG[k])*q]));}\nfunction simulate(mode,scenario){\n const sc=typeof scenario==='string'?scenarios.find(s=\u003es.id===scenario):scenario;\n if(!sc)throw Error('找不到案例');\n const profile={...timingDefaults,...sc.timing},schedule=makeStages(mode,sc,profile);\n const list=netlist(mode,sc.offset??.012),stages=schedule.stages,closed=[.5,.5,sc.init,.5,.5,.5,.5,.5,.5];\n let v=sc.open?[sc.init,1-sc.init,sc.init,sc.init,1-sc.init,1,0,.5,.5]:closed;\n let samples=[],time=0,lastData=null,expected=sc.init\u003e.5?1:0,lastOpGroup=-1,readLog=[];\n const dt=.003;\n for(let si=0;si\u003cstages.length;si++){\n  const st=stages[si];st.index=si;st.start=time;st.from=samples.length;st.initial=v.slice();st.expectedBefore=expected;\n  if(st.group!==lastOpGroup){lastOpGroup=st.group;}\n  const steps=Math.ceil(st.duration/dt),h=st.duration/steps,stride=Math.max(1,Math.floor(steps/140));\n  for(let n=0;n\u003c=steps;n++){\n   const local=n*h,g=controls(st,local),dv=nodes 復資料，WRITE 時把新電位傳進 Cell。','Cell 與位線失去資料交換路徑。'],\n Y_L:['左欄位選擇開關','CSL 開啟時，將左感測節點接到 LIO。讀取時讓 I/O 建立差值；寫入時讓外部寫入驅動克服原本的鎖存狀態。','本位線對的資料無法傳到局部 I/O，也無法由該 I/O 寫入。'],\n Y_R:['右欄位選擇開關','CSL 控制右感測節點與 LIOB 的雙向連接。它與 Y_L 一起傳遞差動訊號。','差動 I/O 缺少另一半路徑。'],\n IO_PL:['LIO 預充電開關','IOEQ 為高時把 LIO 拉回 VPRE。Read／Write 前先關閉，避免基準源和讀寫路徑互相對抗。','I/O 初始狀態可能受前次資料影響。'],\n IO_PR:['LIOB 預充電開關','和 IO_PL 對稱地準備另一條 I/O 線。這是局部 I/O 的預充電，不等於 PRE 命令關閉整列。','局部差動 I/O 的起始偏壓不完整。'],\n W_PL:['LIO 寫入上拉管','寫 1 時啟用，從 VINTA 提供電流到 LIO，再經 Y_L 到感測節點與 Cell。WRITE 結束後關閉。','無法經左 I/O 主動寫入高電位。'],\n W_PR:['LIOB 寫入上拉管','寫 0 時啟用，將互補 I/O 拉高，配合左側下拉，迫使感測器翻轉。','差動寫 0 的互補高側驅動缺失。'],\n W_NL:['LIO 寫入下拉管','寫 0 時啟用，將 LIO 電流導向 VSS。若原本為 1，會先與感測器上拉競爭，直到再生方向翻轉。','無法主動將左側新資料拉到 0。'],\n W_NR:['LIOB 寫入下拉管','寫 1 時啟用，將互補 I/O 拉低。這個低電位也促使左 PMOS 更強導通。','差動寫 1 的互補低側驅動缺失。'],\n ISO_L:['左側隔離開關','連接 BL 與 SABL。補償和預感測時斷開，恢復／讀寫時接通。隔離只斷開導電連線，不斷開 BL 對感測 NMOS Gate 的控制。','無法把感測結果接回 Cell，或無法隔離大位線電容。'],\n ISO_R:['右側隔離開關','連接 BLB 與 SABLB，與 ISO_L 同步。讓內部小電容節點先感測，再接回大位線電容。','互補側無法正確隔離與恢復。'],\n OC_L:['左側交叉補償開關','預充電時 OC 已為高；補償時保持高電位，BL 持續接到 SABLB。這使 Gate 接 BL 的 N_R 形成近似 diode-connected 接法，讓元件失配轉換成可保持的位線偏壓。','補償取樣回路缺少一側。'],\n OC_R:['右側交叉補償開關','OC 在預充電及補償時為高，使 BLB 接到 SABL，使 N_L 形成近似 diode-connected 接法。OC 斷開後，位線電容保留補償偏壓。','無法建立成對的補償狀態。']\n};\nconst nodeDefs={LEAK:['保持期間的等效漏電','本例用從 Cell 通往 VPL 的等效電導示範資料衰減：Ileak = G(Vcell − VPL)。G = 0.00008 mA/V。只在漏電案例期間啟用，不代表真實漏電只有單一路徑。'],\n BL:['位線 Bit Line','本例 Cell 接在 BL。存取時與 Cell 共享電荷；之後感測器把這個小差值放大。本模型對 VSS 的等效負載為 200 fF，與 20 fF 的 Cell 形成 1:10 比例，初始共享差值約 ±45.45 mV；這是教學選值，不是 DDR5 固定規格。'],BLB:['互補位線 Complementary Bit Line','本例未選中 Cell 的另一側參考位線。BLSA 起始為 VPRE；OCSA 補償後它可能帶有補償偏壓。'],CELL:['Cell 儲存節點','1T1C 的電容上極板，20 fF。下極板 VPL 固定 0.5 V，因此 Q = Ccell(Vcell − VPL)；儲存 0 不代表電容的電荷一定為零。'],SL:['SABL：內部左感測位線','OCSA 小電容節點，等效 20 fF。ISO_L 接通才與大位線 BL 導電相連；P_L/N_L 在此驅動。'],SR:['SABLB：內部右感測位線','OCSA 的互補感測節點，等效 20 fF。ISO_R 接到 BLB；OC_L 則交叉接到 BL。'],LA:['上方感測供電軌','PMOS source 共用節點；P_EN 啟用時靠近 VINTA，偏壓時靠近 VPRE。內部名稱沿用 OCSA 文獻。'],LAB:['下方感測供電軌','NMOS source 共用節點；N_EN 啟用時靠近 VSS，偏壓時靠近 VPRE。不同文獻也使用 SAN、NLAT 等名稱。'],LIO:['局部資料線','由欄位開關與感測節點雙向交換資料。READ 建立差值，WRITE 由明確畫出的驅動對主動提供電位。等效 50 fF。'],LIOB:['互補局部資料線','和 LIO 構成差動 I/O。取樣依 LIO − LIOB 的符號判斷資料，不使用案例名稱硬編碼結果。'],VINTA:['內部陣列感測電源','教學模型設定為 1.00 V。不是宣稱外部 DDR5 VDD 必須等於 1.00 V；實際內部調節由實作決定。'],VSS:['接地參考','本模型 0 V，是電壓測量的共同基準。'],VPRE:['位線預充電基準','本例 0.50 V，取 VINTA/2。內部參考名稱，非 JEDEC 規定的外部接腳名稱。'],VPL:['Cell 下極板電壓','本例固定 0.50 V。計算 Cell 電容電荷時須使用 Vcell − VPL。'],WL:['字線 Word Line','控制存取管 M_A。模型高電位 1.50 V，低電位 0 V。升壓有助 NMOS 傳遞完整高電位；WL 不是外部 VPP 接腳。'],EQ:['位線等化／預充電控制','控制 M_EQ、M_PL、M_PR；模型高電位 1.5 V。這是內部控制訊號，不是獨立的外部 DDR5 命令。'],BIAS:['感測供電軌偏壓控制','控制 B_LA、B_LAB，在停止感測時把供電軌接回 VPRE。'],CSL:['欄位選擇 Column Select','控制 Y_L/Y_R，選出此感測器的資料。不同於外部晶片選擇 CS_n；CSL 是晶片內部解碼結果。'],SAN:['N-sense 啟用控制','控制接地 NMOS N_EN，模型高電位 1 V。SAN 為高，LAB 才會被接地開關拉低。'],SAP_n:['P-sense 低有效控制','控制 PMOS 供電管 P_EN；0 V 時導通，1 V 時關閉。'],IOEQ:['局部 I/O 預充電控制','控制 IO_PL、IO_PR，準備 LIO/LIOB。可在列仍開啟時作用，與位線 PRE 不同。'],ISO:['隔離控制','OCSA 的 ISO_L/ISO_R gate。1.5 V 接通；0 V 隔離大位線與內部感測位線。'],OC:['偏移補償控制','OCSA 的 OC_L/OC_R gate。預充電時為 1.5 V，補償時保持高電位；這兩階段均保持交叉連接。共享／預感測時降為 0 V，隔離保存的補償量。']\n};\nfunction setupCases(){$('caseCount').textContent=M.scenarios.length+' 個案例';let last='';for(const s of M.scenarios){if(s.group!==last){last=s.group;const group=document.createElement('optgroup');group.label=last;$('caseSelect').appendChild(group);}const o=document.createElement('option');o.value=s.id;o.textContent=s.name;$('caseSelect').lastElementChild.appendChild(o);}}\nfunction chip(id){return `\u003cbutton class=\"chip\" data-part=\"${id}\" style=\"color:${colors[id]||'#cad7e8'}\"\u003e${id}\u003c/button\u003e`;}\nfunction partIds(key){const oc=mode==='ocsa',core=['N_L','N_R','P_L','P_R'];const map={release:['M_EQ','M_PL','M_PR'],oc:['ISO_L','ISO_R','OC_L','OC_R','P_EN','N_EN',...core],hold:['OC_L','OC_R','B_LA','B_LAB'],share:['M_A'],nsense:['N_EN','N_L','N_R'],psense:['P_EN','P_L','P_R'],presense:['P_EN','N_EN',...core],restore:oc?['ISO_L','ISO_R','M_A',...core]:['M_A',...core],active:['M_A',...core],iorelease:['IO_PL','IO_PR'],read:['Y_L','Y_R'],capture:['Y_L','Y_R'],readclose:['Y_L','Y_R'],ioreset:['IO_PL','IO_PR'],wdrive:['W_PL','W_PR','W_NL','W_NR'],write:['Y_L','Y_R','M_A','W_PL','W_PR','W_NL','W_NR'],wclose:['Y_L','Y_R'],wrecover:['M_A',...core],wlclose:['M_A'],saoff:['P_EN','N_EN'],equalize:['M_EQ','M_PL','M_PR','B_LA','B_LAB',...(oc?['ISO_L','ISO_R','OC_L','OC_R']:[])],standby:['M_EQ','M_PL','M_PR'],refselect:[],leak:['CELL']};return map[key]||[];}\nfunction description(st){if(st.key==='timing')return st.waitAtEntry\u003e1e-8?'保持目前電路狀態，只等待尚未滿足的時序。計時從下列原始事件起算，不在本階段重新歸零；所有適用限制都滿足後，才繼續操作。':'從原始事件累計的時間已滿足本次門檻，不再額外等待完整的 tRCD 等間隔。本檢查顯示階段保留 0.1 ns 模型保持時間，方便單獨播放。';const bit=st.expectedBefore,oc=mode==='ocsa';return ({release:'先解除位線的短接與基準連接，讓即將出現的小電壓差不被預充電回路消除。',oc:'WL 保持關閉。ISO 從高變低，OC 延續預充電時的高電位，保持交叉連接；同時啟用 P_EN／N_EN，使 LA 上升、LAB 下降，開始取樣失配。OC 在這一步沒有新的上升緣。',hold:'斷開 OC，保留位線上的補償電位；停止感測供電並恢復供電軌偏壓，準備接入 Cell。',share:`WL 上升，M_A 導通。Cell 和 BL 的電荷重新分配；${oc?'以補償後的 BL 電位為起點，不能假設仍為 0.5 V。':'BL 只偏移一小段，還沒有完整的 0／1。'}`,nsense:'SAN 啟用使 LAB 下降。兩顆 NMOS 的電流開始分出大小，較低的位線被拉得更低；恢復也開始發生。',psense:'SAP_n 降低，LA 上升。較低位線控制對側 PMOS 提供更多上拉電流，正回授把高側拉高。',presense:'ISO 和 OC 都關閉。NMOS Gate 仍感知 BL／BLB，感測輸出在較小的 SABL／SABLB 電容上先放大。',restore:oc?'ISO 接通，把內部感測結果送回大位線。WL 仍開啟，Cell 的儲存電位也被恢復。':'保持感測器供電及 WL 開啟，讓電荷共享時被擾動的 Cell 恢復到完整儲存電位。',active:`目前列保持開啟，感測器鎖存資料。${st.op==='REF'?'刷新接著會自行關列；沒有讀出到 DQ。':'後續 READ／WRITE 還須通過從 ACT 起算的 tRCD 檢查，不需要再次 ACT。'}`,iorelease:'先關閉局部 I/O 的預充電開關，避免 VPRE 基準源抵抗接下來的資料傳遞。',read:'CSL 打開兩個欄位開關，感測器在 LIO／LIOB 上建立差動資料。WL 保持開啟。',capture:'讀出功能端點在這個階段結束時取樣 LIO − LIOB。畫面的本筆 DQ 由實際差值決定。',readclose:'欄位開關關閉。本筆取樣資料交給後級輸出；此處以功能端點表示，不模擬完整 DQS／burst。',ioreset:'將局部 I/O 拉回基準，準備下一筆資料。這不會關閉 WL，也不等同 PRE 命令。',wdrive:`寫入驅動器先建立 LIO = ${st.writeBit}、LIOB = ${1-st.writeBit} 的目標電位，欄位開關仍關閉。`,write:`CSL 接通，新資料經 I/O 到感測器，再經 WL 寫入 Cell。${bit===st.writeBit?'這次重寫相同資料，可能沒有位元翻轉，但控制動作依然發生。':'開始時可能與原本的鎖存驅動相抗，之後再生方向翻轉。'}`,wclose:'先斷開欄位開關，將完成寫入的感測器與 I/O 驅動隔離；此刻 WL 仍保持開啟。',wrecover:'寫入驅動器停止，感測器繼續維持新資料，留時間讓 Cell 充分恢復後才能關列。',wlclose:'先把 WL 拉低，切斷 Cell 和 BL 的通路。接下來位線回到半電源，Cell 才不會跟著被改寫。',saoff:'停止上拉與下拉供電。在這之後才啟用位線等化，避免直接短接仍被強力驅動的高低位線。',equalize:'EQ 同時啟用 M_EQ、M_PL、M_PR：兩線等化與接回 VPRE 共同作用。Cell 已隔離，保留先前資料。',standby:'位線已回到預充電基準，感測器停止放大。已隔離的 Cell 保存資料，等待下一次操作。',refselect:'REF 由內部刷新控制選列，接著執行感測與恢復。此動畫只展開一條代表性列，欄位 I/O 保持關閉。',leak:'以等效漏電讓 Cell 電位緩慢靠近 0.5 V。位線仍在預充電；稍後 Refresh 才重新恢復 Cell。'})[st.key]||'';}\nfunction timing(st){if(st.op==='REF')return 'JEDEC：REFab／REFsb 的忙碌時間與排程需查 tRFC 等規範。這裡展開代表性列的內部循環，未將各子步驟等同外部命令。';if(st.op==='ACT')return 'JEDEC：ACT → READ/WRITE 受 tRCD 約束；ACT → PRE 也受 tRAS 約束。內部 N/P 啟用順序依電路實作。';if(st.op==='RD')return 'JEDEC：READ 的輸出延遲、burst 與 READ → PRE 的 tRTP 另有約束。畫面的取樣時刻是教學模型，不是 CL 數值。';if(st.op[0]==='W')return 'JEDEC：WRITE 後須滿足寫入恢復及相關命令間隔。tWR 與最後寫入資料的規範參考點相關，不是從 WRITE 命令簡單計時。';if(st.op==='PRE')return 'JEDEC：PRE → 下一次 ACT 須滿足 tRP，前次 ACT → 本次 ACT 也須滿足 tRC；發出 PRE 前也必須滿足前次 ACT／READ／WRITE 的相關限制。';return '保持時間被大幅壓縮；本例不是以此模型推定 tREFI 或實際 retention time。';}\nfunction formula(st,s){const v=n=\u003es.v[M.ix[n]],d=st.initial,V0=d[M.ix.CELL],B0=d[M.ix.BL],qCell=.02*(v('CELL')-.5)*1000,diff=(v('BL')-v('BLB'))*1000,local=s.t-st.start;\n let eq='',val='',note='',vars='';\n const sumNode=n=\u003e{let total=0;for(const dev of sim.list){if(dev.a===n)total-=s.j[dev.id].i;if(dev.b===n)total+=s.j[dev.id].i;}return total;};\n const k=st.key;\n if(k==='timing'){\n  eq='t\u003csub\u003eremaining\u003c/sub\u003e = max(0, max[t\u003csub\u003eorigin,i\u003c/sub\u003e + T\u003csub\u003ei\u003c/sub\u003e − t\u003csub\u003enow\u003c/sub\u003e])';\n  val=timingRows(st,s.t);note='各限制平行計時，取最晚到期者；不是把 tRAS、tRTP、tWR 相加。數值為教學門檻，非晶片合規結論。';vars='tRCD／tRAS／tRC 從 ACT 起算；tRP 從 PRE；tRTP 從 READ；tRFC 從 REF；tWR 使用圖中明示的 WD_REF 教學參考事件。';\n }else if(k==='share'){\n  const target=(.2*B0+.02*V0)/.22;\n  eq='V\u003csub\u003eshare\u003c/sub\u003e = (C\u003csub\u003eBL\u003c/sub\u003eV\u003csub\u003eBL,0\u003c/sub\u003e + C\u003csub\u003ecell\u003c/sub\u003eV\u003csub\u003ecell,0\u003c/sub\u003e) / (C\u003csub\u003eBL\u003c/sub\u003e + C\u003csub\u003ecell\u003c/sub\u003e)';\n  val=`共享終值 ≈ (200 × ${F(B0)} + 20 × ${F(V0)}) / 220 = \u003cstrong\u003e${F(target)} V\u003c/strong\u003e\u003cbr\u003e現在 BL = ${F(v('BL'))} V；Cell = ${F(v('CELL'))} V\u003cbr\u003e現在 ΔV = BL − BLB = ${F(diff,2)} mV`;\n  note='Ccell:CBL = 1:10 是用來示範小訊號的教學選值，非 JEDEC 內部電容規格。上式是隔離條件下的電荷共享終值；動畫使用 C·dV/dt = I 持續更新過渡。OCSA 必須代入補償後的起始位線電位。';vars='C 用 fF；VBL,0 與 Vcell,0 是本階段開始前的實際值。Cell 下極板電位固定，故共享式中的常數項相消。';\n }else if(k==='oc'||k==='hold'){\n  eq='ΔV\u003csub\u003ecomp\u003c/sub\u003e = V\u003csub\u003eBLB\u003c/sub\u003e − V\u003csub\u003eBL\u003c/sub\u003e\u003cbr\u003eI\u003csub\u003eP,L\u003c/sub\u003e − I\u003csub\u003eN,L\u003c/sub\u003e + I\u003csub\u003eISO,L\u003c/sub\u003e + I\u003csub\u003eOC,R\u003c/sub\u003e = C\u003csub\u003eSABL\u003c/sub\u003e · dV\u003csub\u003eSABL\u003c/sub\u003e/dt';\n  val=`ΔVT,N = 0.306 − 0.294 = 12 mV\u003cbr\u003e現在 ΔVcomp = \u003cstrong\u003e${F(-diff,2)} mV\u003c/strong\u003e\u003cbr\u003eIOC,L = ${F(s.j.OC_L.i*1000,2)} µA；IOC,R = ${F(s.j.OC_R.i*1000,2)} µA`;\n  note=k==='oc'?'OC 將 NMOS 的 Gate 與 Drain 交叉接合。電流平衡建立補償偏壓；由完整回路求解，不把 ΔVcomp 強制設成 ΔVT。':'OC 斷開後，位線電容保持補償電荷。此模型仍包含控制切換期間的有限導通，但忽略 clock feedthrough。';vars='電流正方向以元件說明的 A→B 為準；補償量包含 PMOS 回授及偏壓影響。';\n }else if(['nsense','psense','presense'].includes(k)){\n  const l=mode==='ocsa'?'SL':'BL',r=mode==='ocsa'?'SR':'BLB',il=sumNode(l),ir=sumNode(r);\n  eq='C\u003csub\u003eL\u003c/sub\u003e dV\u003csub\u003eL\u003c/sub\u003e/dt = ΣI\u003csub\u003eL,in\u003c/sub\u003e − ΣI\u003csub\u003eL,out\u003c/sub\u003e\u003cbr\u003eC\u003csub\u003eR\u003c/sub\u003e dV\u003csub\u003eR\u003c/sub\u003e/dt = ΣI\u003csub\u003eR,in\u003c/sub\u003e − ΣI\u003csub\u003eR,out\u003c/sub\u003e';\n  val=`左側淨電流 = ${F(il*1000,2)} µA；右側 = ${F(ir*1000,2)} µA\u003cbr\u003edVL/dt = ${F(il/M.C[l],3)} V/ns；dVR/dt = ${F(ir/M.C[r],3)} V/ns\u003cbr\u003e輸出差值 VL − VR = \u003cstrong\u003e${F((v(l)-v(r))*1000,2)} mV\u003c/strong\u003e`;\n  note= k==='nsense'?'先比較兩顆 Side===1?'end':'start','font-size':17},g);\n const control=d.gate[0]==='@'?d.gate.slice(1):({SL:'SABL',SR:'SABLB'}[d.gate]||d.gate);\n if(!core)text(horizontal?(id==='M_EQ'?90:0):gateSide*45,horizontal?(labelBelow?-17:(id==='M_EQ'?40:47)):5,control,{'text-anchor':horizontal?'middle':gateSide===1?'start':'end',class:'smalltext'},g);\n const arrow=wire([[horizontal?-12:-20,horizontal?-15:10],[horizontal?12:-20,horizontal?-15:-10]],g,'arrow');\n let gateState=null;\n if(id==='N_L'||id==='N_R')gateState=text(id==='N_L'?-48:48,42,'',{'text-anchor':id==='N_L'?'end':'start',class:'gate-state'},g);\n viewParts[id]={g,arm,arrow,x,y,horizontal,d,sw,gateSide,gateState};\n}\nfunction capacitor(x,y,name,label,lower='VSS',from=null){const g=svgEl('g',{'data-part':name,role:'button',tabindex:'0','aria-label':label+' 電容說明',class:'part'});(capParts[name]??=[]).push(g);wire([[x,y-28],[x,y-6]],g,'device');wire([[x-15,y-6],[x+15,y-6]],g,'device');wire([[x-15,y+6],[x+15,y+6]],g,'device');wire([[x,y+6],[x,y+26]],g,'device');text(x+23,y+5,label,{class:'smalltext'},g);tagNode(x,y+46,lower);if(from)tagNode(x,y-35,from);\n text(name==='CELL'?15:x+23,y+(name==='CELL'?94:72),'',{class:'cap-state'},g);\n svgEl('path',{class:'cap-flow',transform:`translate(${x-30} ${y})`},undefined,g);\n return g;}\n// In-circuit teaching annotations. The numerical model and wiring are untouched.\nlet teachingOn=true,teachingSelection=null,teachingItems=[],teachingStamp='';\nconst teachingSlots={\n P_L:[216,350,170,70,400,375],P_R:[732,350,170,70,700,375],\n N_L:[216,525,170,70,400,555],N_R:[732,525,170,70,700,555],\n M_A:[12,310,180,82,130,430],CELL:[244,682,230,80,60,560],\n M_EQ:[625,91,235,80,550,180],M_PL:[240,80,255,80,200,110],\n N_EN:[605,670,252,82,550,680],P_EN:[635,234,255,80,550,275],\n Y_L:[1150,325,300,88,1300,180],Y_R:[1150,670,300,80,1300,550],\n W_PL:[1150,325,300,88,1520,118],W_NL:[1150,325,300,88,1520,242],\n IO_PL:[1150,325,300,88,1403,242],OC_L:[450,685,290,80,300,844],\n ISO_L:[225,680,280,82,300,480],LA:[635,234,255,80,550,335]\n};\nfunction teachingData(st,s){\n const v=n=\u003es.v[M.ix[n]],fmt=x=\u003eF(x,3),oc=mode==='ocsa';\n const cell=fmt(v('CELL')),share=(.2*st.initial[M.ix.BL]+.02*st.initial[M.ix.CELL])/.22;\n const item=(id,title,short,live,paragraphs,eq='')=\u003e({id,title,short,live,paragraphs,eq});\n const overview='BLSA 像敏感的蹺蹺板：先讓 BL／BLB 平衡，Cell 給出微小差值，再由有電源供應的正回授放大成高、低電位。它是電壓差感測電路；絕對電位仍影響 MOS 能否正常工作。';\n const restore='電荷共享會改變 Cell 原本的儲存電位，因此 DRAM 讀取具有破壞性。感測放大的同時就開始恢復；後續保持 WL 與感測供電，才讓儲存 1 接近高電位、儲存 0 接近低電位。';\n const refresh=st.op==='REF'?'本次是 REF：列由內部刷新控制選取，CSL 全程關閉，恢復後自行關列。動畫只展開一條代表性列，沒有把資料送到 DQ，也不代表對外發出 ACT／PRE 命令。':'';\n if(['nsense','psense','presense'].includes(st.key))return ['N_L','N_R','P_L','P_R'].map(id=\u003e{\n  const d=sim.list.find(d=\u003ed.id===id),j=s.j[id],isN=d.type==='n',drive=j.over+d.vt,on=j.over\u003e0,other=id.endsWith('L')?'右':'左';\n  const gate=({SL:'SABL',SR:'SABLB'}[d.gate]||d.gate);\n  let explanation=isN?`Gate 接 ${gate}，${gate} 與下方 LAB 的電位差決定它能否汲取電流。對側 Gate 電位較高的一管通常下拉較強，使低側更低；另一管因 Gate 降低而逐漸截止。`: `Gate 接${other}側 ${gate}。Gate 越低，VSG 越大，這一側 PMOS 越容易提供上拉電流。現在 ${drive.toFixed(3)} V ${on?'\u003e':'≤'} |VT| = ${d.vt.toFixed(3)} V，因此${on?'具備導通條件':'截止'}。`;\n  const pEarly=st.key==='nsense'\u0026\u0026!isN;\n  if(pEarly)explanation+=' 此刻 P_EN 尚未啟用，但 LA 不是零電位：模型的 40 fF 供電軌電容先前保留約 0.5 V。若 VSG 足夠，這顆 PMOS 仍可能從 LA 暫存電荷取得短暫電流；這不是 VINTA 已接通。';\n  const nDetail=st.key==='nsense'?'本模型快速降低 LAB，因此兩顆 NMOS 可先一起導通，之後才分出強弱、其中一管截止；不表示三顆管子全程同時工作。N 先 P 後是本例啟用方式，實際延遲及重疊取決於電路設計。':'';\n  const read0='例如讀 0：BL 起始較低 → N_L 的 Gate（BLB）較高 → N_L 較強 → BL 再降 → N_R 逐漸截止。之後 P_R 因 Gate＝BL 降低而導通，P_L 則因 Gate＝BLB 較高而截止。讀 1 時左右角色對調。';\n  return item(id,id+' · '+j.region,on?(pEarly?(Math.abs(j.i)\u003e.000025?'LA 暫存電荷參與':'導通但電流極小'):'已具備導通條件'):'閘源電壓不足',`${isN?'VGS':'VSG'} ${fmt(drive)} V`,[overview,explanation,nDetail,oc?'ISO 關閉時，NMOS Gate 仍接 BL／BLB；PMOS Gate 則接 SABL／SABLB。大位線與內部感測節點不可混為一談。':read0,refresh,'顏色表示過驅電壓超過 1 mV 的顯示門檻；電流箭頭表示 |I| \u003e 0.025 µA。已導通也可能近乎無電流；標籤邊框沿用元件識別色，不表示元件一定正在導通。'].filter(Boolean),`${isN?'VGS = VG − min(VA, VB)':'VSG = max(VA, VB) − VG'} = ${fmt(drive)} V\\nVov = ${fmt(drive)} − ${fmt(d.vt)} = ${fmt(j.over)} V\\nI (${d.a} → ${d.b}) = ${F(j.i*1000,3)} µA\\nLA = ${fmt(v('LA'))} V；LAB = ${fmt(v('LAB'))} V`);\n });\n const tables={\n release:[item('M_EQ','釋放預充電','先拿掉蹺蹺板的支撐',`EQ = ${fmt(s.g.EQ)} V`,[overview,'EQ 降低，使 M_EQ、M_PL、M_PR 關閉；WL 尚未開啟。BL／BLB 的電位暫由電容保留，之後才接入 Cell。若仍接在 VPRE，小差值會被预充電回路抹去。','這裡的浮接是指沒有預充電源主動箝住；仍存在電容及其他元件連接。'], '起始 BL ≈ BLB ≈ VPRE = 0.500 V'),item('M_A','Cell 仍被隔離','小砝碼還沒有放上去',`WL = ${fmt(s.g.WL)} V`,['存取管 M_A 的 Gate 由 WL 控制。目前保持關閉，先讓位線準備好。','BLB 是這次讀取的參考支路，沒有連接本次選中的 Cell；不代表實體 BLB 上永遠沒有其他 Cell。'])],\n share:[item('M_A','WL 開啟／共享','小水杯接上大水桶',`WL = ${fmt(s.g.WL)} V`,['WL 升高，使 M_A 接通 Cell 與 BL。儲存 1 時 BL 上升一點，儲存 0 時 BL 下降一點。BLB 在這個共享模型中不參與選中 Cell 的電荷重分配。','20 fF : 200 fF = 1:10 是教學選值。從 0.5 V 起算：存 1 為 (200×0.5+20×1)/220 ≈ 0.545 V；存 0 為 (200×0.5+20×0)/220 ≈ 0.455 V。BL 只變動約 ±45.45 mV；弱訊號、OCSA 補償後的初值會不同。','模型 WL 高位為 1.5 V，高於陣列電源 1.0 V。NMOS 要傳遞高位，需保留足夠的 VGS；升壓 WL 有助避免高位受臨界電壓限制。WL 是內部字線，不等同外部 VPP 接腳，實際電位由設計決定。'],`Vshare = (CBL·VBL,初 + Ccell·Vcell,初)/(CBL+Ccell)\\n= (200×${fmt(st.initial[M.ix.BL])}+20×${fmt(st.initial[M.ix.CELL])})/220\\n= ${fmt(share)} V\\n目前 ΔV = BL − BLB = ${F((v('BL')-v('BLB'))*1000,2)} mV`),item('CELL','破壞性讀取','共享會改變 Cell 電位',`Cell = ${cell} V`,[restore,'蹺蹺板的微小傾斜是電壓差；再生所需能量來自感測電源，不是 Cell 的小電荷自己憑空放大。'],`Qcell = Ccell·(Vcell − VPL)\\n= 20 fF × (${cell} − 0.500) V`)],\n restore:[item(oc?'ISO_L':'M_A','恢復 Cell','保持連接，補足高／低位',`Cell = ${cell} V`,[restore,oc?'ISO 接回位線，把內部 SABL／SABLB 的感測結果送到大位線，再經 M_A 恢復 Cell。':'WL 仍開啟，感測器持續驅動 BL。沒有新的控制邊緣，不代表恢復已停止。','tRAS 是 ACT 到 PRE 的最小時間，包含感測、恢復等需求，不等於本動畫單獨的 Restore 段。太早關閉 WL，Cell 可能未充分恢復。',refresh].filter(Boolean),'Icell = Ccell·dVcell/dt\\nACT → PRE ≥ tRAS')],\n active:[item('M_A','列保持開啟','SA 保存資料，Cell 仍連接',`WL = ${fmt(s.g.WL)} V`,['SA 的正回授維持高、低兩側，形成列緩衝器的鎖存狀態。同一列可再 READ／WRITE，不必每筆重新 ACT。','READ／WRITE 還須滿足從 ACT 起算的 tRCD 及其他命令時序，不能只看到感測完成就立即發命令。',refresh].filter(Boolean),'tREAD/WRITE − tACT ≥ tRCD'),item('Y_L',refresh?'刷新不輸出 DQ':'欄位 I/O 等候命令',refresh?'CSL 全程關閉':'READ 選出鎖存資料',`CSL = ${fmt(s.g.CSL)} V`,[refresh||'READ 開啟欄位通路，把感測器資料送到 LIO／LIOB。WRITE 則由寫入驅動器提供新電位，經相同通路改寫 SA 和 Cell。','這裡只畫讀出功能端點，沒有展開完整 DDR5 burst／DQS 輸出鏈。'])],\n wlclose:[item('M_A','先關 WL','讓 Cell 保留恢復後的資料',`WL = ${fmt(s.g.WL)} V`,['M_A 先截止，把 Cell 與 BL 隔離。接著 BL／BLB 才能回到半電源。若 Cell 還連著，它也會跟著趨近 0.5 V，破壞儲存狀態。','這是本模型的 PRE 內部順序；對外 PRE 命令啟動一串內部動作，不是外部控制器逐顆切換開關。',refresh].filter(Boolean),`Cell = ${cell} V；BL 隨後回到 0.500 V`)],\n saoff:[item('P_EN','停止上拉供電','先讓強驅動退出',`SAP_n = ${fmt(s.g.SAP_n)} V`,['SAP_n 拉高，P_EN 關閉；SAN 拉低，N_EN 關閉。供電開關停止驅動，不等於所有感測管立刻截止。','本模型先停用供電再等化，避免等化回路連接仍被強力上拉／下拉的兩線而產生不必要的貫通電流。']),item('N_EN','停止下拉供電','N_EN 由 SAN 控制',`SAN = ${fmt(s.g.SAN)} V`,['下拉供電切斷後，BL／BLB 電位暫由電容保留。下一步將兩線拉回共同基準。'])],\n equalize:[item('M_EQ','等化兩條位線','蹺蹺板回到平衡位置',`ΔV = ${F((v('BL')-v('BLB'))*1000,2)} mV`,[overview,'EQ 同時啟用 M_EQ、M_PL、M_PR。M_EQ 提供兩線間電荷交換路徑，另兩顆管子同時接回 VPRE；不是先等化完才開始預充電。','此刻 WL 已關閉，所以位線變成 0.5 V 不會把 Cell 也改成 0.5 V。',refresh].filter(Boolean),'BL → VPRE；BLB → VPRE\\nΔV → 0；VPRE = 0.500 V')],\n standby:[item('M_PL','預充電待機','兩端等高，等下次選列',`BL = ${fmt(v('BL'))} V`,[overview,'M_PL／M_PR 接到 VPRE，M_EQ 等化兩線。P_EN／N_EN 停用感測驅動，供電軌由偏壓回路準備；Cell 隔離保存資料。','兩線比較可以降低共同擾動的影響，但失配與差動雜訊仍可能造成誤判。BLB 是參考支路，不代表其絕對電位不重要。',refresh].filter(Boolean),'BL ≈ BLB ≈ VINTA/2；WL = 0')],\n refselect:[item('M_A','內部選擇刷新列','恢復資料，不開 CSL',`Cell = ${cell} V`,[refresh,'功能上會經過共享、感測、恢復，再關列及預充電。沒有外部 READ，仍然必須把被共享擾動的 Cell 恢復。','Refresh 是 DRAM 內部控制的操作，並非控制器發一組外部 ACT／PRE 就完全等同 REF；多列排程與忙碌時間由裝置與模式決定。'],'REF：感測 → 恢復 → 關列；CSL = 0')],\n oc:[item('OC_L','OC 維持交叉連接','先建立補償偏壓',`OC = ${fmt(s.g.OC)} V`,['OC 從預充電時就保持高電位；此階段是 ISO 斷開及感測供電啟用，沒有新的 OC 上升緣。','交叉補償通路使 NMOS 形成取樣失配的回路。這是本頁引用拓撲的教學模型；並非所有 OCSA 的唯一接法。'],'BL ↔ SABLB；BLB ↔ SABL'),item('ISO_L','隔離大位線','ISO 降低',`ISO = ${fmt(s.g.ISO)} V`,['隔離開關斷開直接通路，補償交叉通路仍由 OC 維持。之後 OC 才斷開，保留補償狀態。'])],\n hold:[item('OC_L','保存補償量','OC 現在斷開',`OC = ${fmt(s.g.OC)} V`,[' eight:650}.current{fill:none;stroke:var(--gold);stroke-width:4;stroke-dasharray:9 9;animation:flow .8s linear infinite}.paused .current{animation-play-state:paused}.hot{filter:drop-shadow(0 0 5px currentColor)}@keyframes flow{to{stroke-dashoffset:-36}}dialog{background:#0e1823;color:var(--ink);border:1px solid #56849c;border-radius:12px;width:min(540px,92vw);max-height:80vh;overflow:auto;padding:22px}dialog::backdrop{background:#000a}dialog h2{margin:0 0 14px}dialog p{line-height:1.8}dialog button{float:right}.sr{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden}@media(min-width:1500px){main{grid-template-columns:minmax(0,1fr) 390px}.guide p{font-size:16px}}@media(max-width:950px){#lessons{grid-template-columns:repeat(3,1fr)}main{height:auto;min-height:0;grid-template-columns:1fr;grid-template-rows:560px 190px auto}.guide{grid-column:1;grid-row:3}.scope{grid-row:2}.canvas{min-height:240px}#lessons{padding:10px;gap:5px}#lessons button{padding:7px;font-size:14px}#lessons span{font-size:12px}header small{display:none}main{padding:0 10px 15px}}@media(max-height:740px) and (min-width:951px){header{padding:8px 18px}#lessons{padding:8px 20px}main{height:calc(100dvh - 182px);min-height:490px;grid-template-rows:minmax(280px,1fr) 145px}.question{padding:8px 14px}.question h1{font-size:18px}.controls{padding:6px 10px}}@media(prefers-reduced-motion:reduce){.current{animation:none}}\n\n#lessons[hidden]{display:none}.header-actions{display:flex;align-items:center;gap:14px}header{flex-shrink:0}.header-actions button{font-size:14px;white-space:nowrap}\n@media(min-width:951px){body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}#lessons{flex-shrink:0}main{height:auto;min-height:0;flex:1;grid-template-rows:minmax(0,1fr) 145px;padding-top:10px}.canvas{min-height:0}.question,.config,.controls{flex-shrink:0}}\n@media(max-width:950px){header{padding:8px 10px}.header-actions{gap:8px}header strong{font-size:16px}.header-actions a{font-size:12px}}\n@keyframes conductingPulse{50%{opacity:.55}}.conducting{animation:conductingPulse 1.2s ease-in-out infinite}.paused .conducting{animation-play-state:paused}@media(prefers-reduced-motion:reduce){.conducting{animation:none}}\n\u003c/style\u003e\u003c/head\u003e\u003cbody class=\"paused\"\u003e\n\u003cheader\u003e\u003cdiv\u003e\u003cstrong\u003eDRAM 起步\u003c/strong\u003e\u003csmall\u003e先懂一個部分，再把它接起來\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"header-actions\"\u003e\u003ca href=\"glossary.html\"\u003e名詞解釋\u003c/a\u003e\u003ca href=\"flow.html\"\u003e完整流程\u003c/a\u003e\u003cbutton id=\"toggleLessons\" aria-controls=\"lessons\" aria-expanded=\"true\"\u003e收起課程選單 ▴\u003c/button\u003e\u003ca href=\"https://dram-circuit-lab.tira8697.chatgpt.site\" target=\"_blank\" rel=\"noopener\"\u003e完整電路 ↗\u003c/a\u003e\u003c/div\u003e\u003c/header\u003e\n\u003cnav id=\"lessons\" aria-label=\"課程\"\u003e\u003c/nav\u003e\n\u003cmain\u003e\u003csection class=\"panel workspace\"\u003e\u003cdiv class=\"question\"\u003e\u003cdiv\u003e\u003ch1 id=\"question\"\u003e\u003c/h1\u003e\u003cp id=\"objective\"\u003e\u003c/p\u003e\u003c/div\u003e\u003cspan class=\"pill\" id=\"lessonIndex\"\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"canvas\"\u003e\u003csvg id=\"circuit\" viewBox=\"0 0 920 480\" role=\"group\" aria-label=\"本課互動電路\"\u003e\u003c/svg\u003e\u003c/div\u003e\u003cdiv class=\"config\" id=\"config\"\u003e\u003c/div\u003e\u003cdiv class=\"controls\"\u003e\u003cbutton id=\"play\" class=\"primary\"\u003e▶ 播放這一段\u003c/button\u003e\u003cbutton id=\"pause\" disabled\u003e暫停\u003c/button\u003e\u003cbutton id=\"again\"\u003e↺ 重播\u003c/button\u003e\u003cbutton id=\"next\"\u003e下一段 →\u003c/button\u003e\u003clabel\u003e\u003cspan class=\"sr\"\u003e速度\u003c/span\u003e\u003cselect id=\"speed\"\u003e\u003coption value=\".5\"\u003e0.5×\u003c/option\u003e\u003coption value=\"1\" selected\u003e1×\u003c/option\u003e\u003coption value=\"2\"\u003e2×\u003c/option\u003e\u003c/select\u003e\u003c/label\u003e\u003cinput id=\"seek\" aria-label=\"本段進度\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\"\u003e\u003cbutton id=\"all\"\u003e本課連播\u003c/button\u003e\u003c/div\u003e\u003c/section\u003e\n\u003caside class=\"panel guide\"\u003e\u003cdiv class=\"eyebrow\"\u003eINPUT → CIRCUIT → OUTPUT\u003c/div\u003e\u003cdiv class=\"io\"\u003e\u003cdiv\u003e\u003csmall id=\"inputName\"\u003e\u003c/small\u003e\u003cstrong id=\"inputValue\"\u003e\u003c/strong\u003e\u003csmall\u003e本段控制／初始條件\u003c/small\u003e\u003c/div\u003e\u003cdiv\u003e\u003csmall id=\"outputName\"\u003e\u003c/small\u003e\u003cstrong id=\"outputValue\"\u003e\u003c/strong\u003e\u003csmall id=\"currentValue\"\u003e\u003c/small\u003e\u003c/div\u003e\u003c/div\u003e\u003ch2 id=\"stageTitle\"\u003e\u003c/h2\u003e\u003cp id=\"explain\"\u003e\u003c/p\u003e\u003cp id=\"watch\"\u003e\u003c/p\u003e\u003cdiv id=\"steps\" aria-label=\"本課分段\"\u003e\u003c/div\u003e\u003cdetails id=\"math\" open\u003e\u003csummary\u003e公式：關係 → 代入 → 結果\u003c/summary\u003e\u003cpre id=\"formula\"\u003e\u003c/pre\u003e\u003c/details\u003e\u003cdetails\u003e\u003csummary\u003e這一課的假設與名詞\u003c/summary\u003e\u003cp id=\"assumptions\" class=\"note\"\u003e\u003c/p\u003e\u003cbutton id=\"source\"\u003e教材依據\u003c/button\u003e\u003c/details\u003e\u003cdiv class=\"bridge\"\u003e\u003cstrong id=\"bridgeTitle\"\u003e\u003c/strong\u003e\u003cp id=\"bridgeText\"\u003e\u003c/p\u003e\u003cbutton id=\"bridgeButton\"\u003e\u003c/button\u003e\u003c/div\u003e\u003c/aside\u003e\n\u003csection class=\"panel scope\"\u003e\u003cdiv class=\"scope-head\"\u003e\u003cstrong\u003e本課示波器 \u003cspan id=\"legend\"\u003e\u003c/span\u003e\u003c/strong\u003e\u003cspan id=\"clock\"\u003e\u003c/span\u003e\u003c/div\u003e\u003csvg id=\"wave\" viewBox=\"0 0 900 135\" role=\"img\" aria-label=\"隨動畫更新的電壓波形\"\u003e\u003c/svg\u003e\u003c/section\u003e\u003c/main\u003e\n\u003cdialog id=\"detail\"\u003e\u003cbutton id=\"close\"\u003e關閉 ✕\u003c/button\u003e\u003ch2 id=\"detailTitle\"\u003e\u003c/h2\u003e\u003cp id=\"detailText\"\u003e\u003c/p\u003e\u003c/dialog\u003e\n\u003cscript data-tutorial-model\u003e\n/* DRAM Circuit Lab. Educational long-channel MOS transient model.\n * Units: V, ns, pF, mA. Not a DDR5 timing or process sign-off model.\n * OCSA core connectivity: US20200227111A1, Fig.3 / Fig.6A–E.\n * Named rail/column/write drivers are explicit illustrative peripheral circuits.\n */\n(function(global){\n'use strict';\nconst C={BL:.2,BLB:.2,CELL:.02,SL:.02,SR:.02,LA:.04,LAB:.04,LIO:.05,LIOB:.05};\nconst nodes=Object.keys(C), caps=nodes.map(n=\u003eC[n]), ix=Object.fromEntries(nodes.map((n,i)=\u003e[n,i]));\nconst rail={VINTA:1,VSS:0,VPRE:.5,VPL:.5};\nconst clamp=(v,a=0,b=1)=\u003eMath.max(a,Math.min(b,v));\n// Rule demonstration only: no speed-bin / MR / burst configuration is implied.\nconst timingDefaults={tRCD:16,tRAS:32,tRP:16,tRC:48,tRTP:7.5,tWR:30,tRFC:295};\nconst senseMargin=.01; // 10 mV illustrative input margin, not a JEDEC specification.\nfunction decideRead(delta,margin=senseMargin){return !Number.isFinite(delta)||Math.abs(delta)\u003c=margin?'X':delta\u003e0?1:0;}\nconst scenarios=[\n {id:'read0',group:'簡單案例',name:'讀出 0',init:0,ops:['ACT','RD','PRE'],goal:'從儲存 0 的 Cell 開列，讀出 0，再關列。'},\n {id:'read1',group:'簡單案例',name:'讀出 1',init:1,ops:['ACT','RD','PRE'],goal:'從儲存 1 的 Cell 開列，讀出 1，再關列。'},\n {id:'write0',group:'簡單案例',name:'寫入 0（1 → 0）',init:1,ops:['ACT','W0','PRE'],goal:'寫入驅動器將原本的 1 改成 0，完成寫入恢復後關列。'},\n {id:'write1',group:'簡單案例',name:'寫入 1（0 → 1）',init:0,ops:['ACT','W1','PRE'],goal:'寫入驅動器將原本的 0 改成 1，完成寫入恢復後關列。'},\n {id:'act0',group:'單一操作',name:'ACT：Cell = 0',init:0,ops:['ACT'],goal:'只看開列、共享與感測；最後保持列開啟。'},\n {id:'act1',group:'單一操作',name:'ACT：Cell = 1',init:1,ops:['ACT'],goal:'只看開列、共享與感測；最後保持列開啟。'},\n {id:'pre0',group:'單一操作',name:'PRE：已開列的 0',init:0,open:true,ops:['PRE'],goal:'起始已完成 ACT 與恢復；只播放關列、停用感測與等化。'},\n {id:'pre1',group:'單一操作',name:'PRE：已開列的 1',init:1,open:true,ops:['PRE'],goal:'起始已完成 ACT 與恢復；觀察 Cell 隔離後如何保留 1。'},\n {id:'refresh0',group:'單一操作',name:'Refresh 0',init:.12,ops:['REF'],goal:'Cell 的低電位已因漏電升到 0.12 V；刷新將它恢復到接近 0 V。'},\n {id:'refresh1',group:'單一操作',name:'Refresh 1',init:.88,ops:['REF'],goal:'Cell 的高電位已因漏電降到 0.88 V；刷新將它恢復到接近 1 V。'},\n {id:'verify01',group:'Case study',name:'寫 1 → 關列 → 重新讀回',init:0,ops:['ACT','W1','PRE','ACT','RD','PRE'],goal:'重新 ACT 後再讀回，確認資料保存在 Cell，而不只是感測器仍鎖存 1。'},\n {id:'verify10',group:'Case study',name:'寫 0 → 關列 → 重新讀回',init:1,ops:['ACT','W0','PRE','ACT','RD','PRE'],goal:'觀察寫入翻轉、隔離保存與重新讀出 0 的完整連續過程。'},\n {id:'same0',group:'Case study',name:'同值重寫 0 → 0',init:0,ops:['ACT','W0','RD','PRE'],goal:'沒有邏輯翻轉仍有控制動作；穩態下不應畫出持續充放電。'},\n {id:'same1',group:'Case study',name:'同值重寫 1 → 1',init:1,ops:['ACT','W1','RD','PRE'],goal:'區分寫入動作與位元翻轉，觀察寫入驅動器和欄位開關。'},\n {id:'rowhit',group:'Case study',name:'同列 Read → Write → Read',init:0,ops:['ACT','RD','W1','RD','W0','RD','PRE'],goal:'同一列保持開啟；READ 不會每次重新開啟 WL，也不會自動 PRE。'},\n {id:'retention',group:'Case study',name:'寫 1 → 漏電 → Refresh → 讀回',init:0,ops:['ACT','W1','PRE','WAIT','REF','ACT','RD','PRE'],goal:'把儲存、示意漏電與刷新串起來。REF 本身不將資料送到 DQ。'},\n {id:'timingwait',group:'時序觀察',name:'等待觀察：ACT → READ → PRE → 再開列',init:0,timing:{tRCD:120,tRAS:180,tRP:50,tRC:230},ops:['ACT','RD','PRE','ACT','W1','PRE'],goal:'刻意延長教學門檻，觀察 tRCD、tRAS、tRP／tRC 的剩餘時間；這不是 DDR5 速度等級。'},\n /*{id:'margin0',group:'補償比較',name:'弱訊號 0＋NMOS 失配',init:.36,offset:.06,ops:['ACT','RD','PRE'],goal:'Cell 只有微弱低訊號。切換 BLSA／OCSA，比較相同失配下的感測結果；結果由模型計算。'},\n {id:'margin1',group:'補償比較',name:'弱訊號 1＋NMOS 失配',init:.64,offset:-.06,ops:['ACT','RD','PRE'],goal:'Cell 只有微弱高訊號。比較有無補償的偏移與判讀結果。'}*/\n];\nfunction transistor(id,type,a,b,gate,k,vt=.3){return {id,type,a,b,gate,k,vt};}\nfunction netlist(mode,offset=0){\n const oc=mode==='ocsa', l=oc?'SL':'BL',r=oc?'SR':'BLB';\n const list=[\n transistor('P_L','p','LA',l,r,.2),transistor('P_R','p','LA',r,l,.2),\n transistor('N_L','n',l,'LAB','BLB',1,.3+offset/2),transistor('N_R','n',r,'LAB','BL',1,.3-offset/2),\n transistor('P_EN','p','VINTA','LA','@SAP_n',5),transistor('N_EN','n','LAB','VSS','@SAN',5),\n transistor('B_LA','n','LA','VPRE','@BIAS',4),transistor('B_LAB','n','LAB','VPRE','@BIAS',4),\n transistor('M_PL','n','BL','VPRE','@EQ',1),transistor('M_PR','n','BLB','VPRE','@EQ',1),\n transistor('M_EQ','n','BL','BLB','@EQ',1),transistor('M_A','n','BL','CELL','@WL',.5),\n transistor('Y_L','n',l,'LIO','@CSL',2),transistor('Y_R','n',r,'LIOB','@CSL',2),\n transistor('IO_PL','n','LIO','VPRE','@IOEQ',1),transistor('IO_PR','n','LIOB','VPRE','@IOEQ',1),\n transistor('W_PL','p','VINTA','LIO','@WPL',8),transistor('W_PR','p','VINTA','LIOB','@WPR',8),\n transistor('W_NL','n','LIO','VSS','@WNL',8),transistor('W_NR','n','LIOB','VSS','@WNR',8)\n ];\n if(oc)list.push(transistor('ISO_L','n','BL','SL','@ISO',2),transistor('ISO_R','n','BLB','SR','@ISO',2),transistor('OC_L','n','BL','SR','@OC',2),transistor('OC_R','n','BLB','SL','@OC',2));\n return list;\n}\nfunction voltage(name,v,g){return name[0]==='@'?g[name.slice(1)]:(name in ix?v[ix[name]]:rail[name]);}\nfunction mos(d,v,g){\n const a=voltage(d.a,v,g),b=voltage(d.b,v,g),vg=voltage(d.gate,v,g),ds=Math.abs(a-b);\n const over=d.type==='n'?vg-Math.min(a,b)-d.vt:Math.max(a,b)-vg-d.vt;\n const magnitude=over\u003c=0?0:(ds\u003cover?d.k*(over*ds-.5*ds*ds):.5*d.k*over*over);\n return {i:Math.sign(a-b)*magnitude,over,a,b,vg,region:over\u003c=0?'截止':ds\u003cover?'線性區':'飽和區'};\n}\nfunction initialG(mode){return {EQ:1.5,BIAS:1.5,WL:0,SAP_n:1,SAN:0,CSL:0,IOEQ:1.5,WPL:1,WPR:1,WNL:0,WNR:0,ISO:mode==='ocsa'?1.5:0,OC:mode==='ocsa'?1.5:0};}\nfunction makeStages(mode,sc,profile){\n const list=[],events=[];let g=initialG(mode),group=-1,op='',cursor=0;\n const clocks={ACT:null,RD:null,PRE:null,WD_REF:null,REF:null};\n const add=(key,title,duration,patch={},extra={})=\u003e{const start={...g};g={...g,...patch};list.push({key,title,duration,startG:start,endG:{...g},group,op,clocks:{...clocks},...extra});cursor+=duration;};\n const mark=type=\u003e{events.push({type,time:cursor,group});if(type in clocks pleAt(sim,t){\n t=clamp(t,0,sim.total);let lo=0,hi=sim.samples.length-1;\n while(lo\u003chi){const m=Math.ceil((lo+hi)/2);if(sim.samples[m].t\u003c=t)lo=m;else hi=m-1;}\n const a=sim.samples[lo],b=sim.samples[Math.min(lo+1,sim.samples.length-1)],q=b.t\u003ea.t?(t-a.t)/(b.t-a.t):0;\n const st=sim.stages[a.stage],g=controls(st,t-st.start),v=a.v.map((x,i)=\u003ex+(b.v[i]-x)*q);\n if(sim.sc.earlyWLTime!=null\u0026\u0026t\u003e=sim.sc.earlyWLTime)g.WL=0;\n return {...a,t,v,g,stage:a.stage,j:Object.fromEntries(sim.list.map(d=\u003e[d.id,mos(d,v,g)]))};\n}\nconst api={scenarios,netlist,simulate,sampleAt,controls,nodes,ix,C,rail,mos,timingDefaults,senseMargin,decideRead,auditTiming};\nif(typeof module!=='undefined')module.exports=api;global.DramModel=api;\n})(typeof globalThis!=='undefined'?globalThis:this);\n\n\u003c/script\u003e\n\u003cscript\u003e\n'use strict';\nconst $=id=\u003edocument.getElementById(id),fmt=(x,n=3)=\u003eNumber(x).toFixed(n),C=.02,CB=.2,R=100,VT=.3,K=.03; // pF, kΩ, ns, mA\nconst lessons=[\n {name:'電容與開關',sub:'接通、保持、放電',question:'開關斷開，電容電壓會立刻消失嗎？',objective:'只看電流如何改變一顆電容的電壓。',stages:['充電前：先認識電路','接通：電容開始充電','斷開：保持目前電位','接地：電容開始放電'],dur:[2,10,4,10],why:['開關還沒接通。電源是 1 V，電容初始 0 V，兩者之間沒有閉合的導電通路。','開關接通，電源經過電阻對電容充電。電容電壓愈接近電源，電阻兩端壓差愈小，電流也愈小。','開關斷開後，電容與電源隔離。理想模型沒有漏電，所以它保留斷開瞬間的電壓；不會自己跳回 0 V。','現在把輸入端改接 0 V，並接通開關。電流由電容流回低電位端，電容電壓逐漸下降。'],watch:['點電阻、開關、電容，可以先看它們各自做什麼。','看黃色箭頭由左往右，再看粉紅色 Vc 波形逐漸變平。','此時沒有電流箭頭，但電容仍然有電壓。','電流方向反過來了。放電也需要時間，不是瞬間歸零。'],assume:'理想開關與線性 RC 電路；R＝100 kΩ、C＝20 fF、τ＝2 ns 為教學數值。保持段忽略漏電。第一課電容下極板接地。',bridge:'接下來把這顆理想開關換成 MOS，看看 Gate 如何決定能不能導電。',bridgeTitle:'下一步：誰來控制開關？'},\n {name:'MOS 控制通路',sub:'Gate 與輸出分開看',question:'Gate 的電壓，怎麼控制另一條通路？',objective:'切換 NMOS／PMOS，分清控制端與充放電通路。',stages:['初始：電容已準備好','改變 Gate 電壓','保持 Gate：觀察輸出','關閉 Gate 通路','保持：電容已隔離'],dur:[2,2,12,2,4],why:['這裡先指定電容的初始電壓：NMOS 實驗從 1 V 開始，PMOS 實驗從 0 V 開始；前一課的充電電路暫時省略。','Gate 電壓開始變化。NMOS 看 VGS，PMOS 看 VSG；超過臨界電壓大小，才建立明顯導電通路。','Gate 電壓固定，不代表輸出電壓也固定。只要有電流，電容電壓就會繼續改變；接近電源端時，電流逐漸變小。','控制端回到截止電位。充放電通路逐漸停止；電容保留停止時的電位。','Gate 和輸出是不同節點。這裡忽略 Gate 耦合與漏電，所以關閉後，電容電位維持不變。'],watch:['NMOS 放在電容下方拉低輸出；PMOS 放在電容上方拉高輸出。','試把啟用 Gate 設在臨界值附近，觀察有沒有電流。','有顏色表示具備導通條件；箭頭只在電流足夠大時顯示。','看 Gate 波形先改變，輸出反應由電流決定。','再切換另一種 MOS，比較高有效與低有效控制。'],assume:'長通道平方律 MOS 示範，|VT|＝0.30 V；忽略次臨界、body effect、Gate 電流與寄生耦合。C＝20 fF。不是製程精準模型。',bridge:'把 NMOS 改放在資料線與儲存電容之間，Gate 改由 WL 控制，就組成 1T1C Cell。下極板也改成固定 VPL。',bridgeTitle:'下一步：MOS ＋ 電容 → Cell'},\n {name:'一顆 DRAM Cell',sub:'寫入與隔離保存',question:'一顆電晶體，怎麼把資料留在 Cell？',objective:'操作 WL，先寫入，再隔離；暫用理想驅動器代表位線。',stages:['初始：Cell 與驅動器分開','WL 升高：接通存取管','維持 WL：寫入 Cell','WL 降低：隔離 Cell','改變外側：Cell 仍保存'],dur:[2,2,16,2,5],why:['M_A 是存取 NMOS，Gate 由 WL 控制。Cell 從與目標相反的電位開始；左側理想驅動器暫時代替真正的位線電路。','WL 升高，M_A 開始導通，資料由左側驅動器經通路寫到 Cell。Gate 的 WL 不直接把電荷送進 Cell。','保持 WL，Cell 繼續向目標電位靠近。寫 1 時若 WL 太低，VGS 會隨 Cell 電位上升而減少，限制可寫入的高位。','WL 降低，存取管關閉。Cell 被隔離，保留關閉瞬間的電位。','外側資料線已改成相反電位，但 WL 仍低，Cell 不跟著改變。這就是「存取」與「保存」的分工。'],watch:['選寫入 0／1，再比較 WL＝1.0 V 與 1.5 V。','黃色箭頭表示傳統電流方向；粉紅色顯示 Cell 電位。','寫 1、WL＝1 V：模型上限約 0.7 V。WL＝1.5 V 才有足夠裕度接近 1 V。','保存的是當下電位；若太早隔離，不能自動補成完整的 0／1。','本例忽略漏電。實際 DRAM 保存一段時間後仍需要刷新。'],assume:'左側是理想電壓驅動器，非完整 BL。VPL 固定 0.5 V；Qcell＝Ccell(Vcell−VPL)。WL 是內部字線，不是外部 VPP 接腳。模型忽略 body effect，實際傳高限制可能更複雜。',bridge:'讀取時，位線不會一直被理想電源固定。下一課撤掉驅動器，改接一顆已預充電的位線電容，觀察共享。',bridgeTitle:'下一步：撤掉理想驅動器'},\n {name:'電荷共享',sub:'Cell 接上真正的負載',question:'Cell 是 0 或 1，為什麼 BL 只動一點點？',objective:'讓兩顆不同大小的電容共享電荷，先不加入感測器。',stages:['準備：兩個電容分開','接通：開始電荷共享','等待：靠近共同電位','隔離：停在共享後的電位','接下來：加入 BLB 基準'],dur:[2,3,8,3,3],why:['Cell 初始是 0 或 1；BL 初始為 0.5 V。預充電源已移除，現在只剩兩顆電容與尚未接通的通路。','接通後，傳統電流由電位高的一側流向低的一側。BL 與 Cell 的電位同時改變，不是把 Cell 的電壓原封不動複製到 BL。','當兩側電壓接近，通路壓差與電流也接近零。共享結果是按電容大小加權的平均值。','為了單獨看清共享結果，這裡暫時隔離 Cell。它原來的完整 0／1 已被擾動：這不是完整讀取流程，還沒有感測與恢復。','現在顯示一條仍在 0.5 V 的 BLB 參考支路。BL − BLB 的微小差值，就是後續感測器要放大的訊號；BLB 沒有接上本次 Cell。'],watch:['CBL 是 Cell 的 10 倍，所以 BL 的改變會比 Cell 小得多。','讀 1：Cell → BL；讀 0：BL → Cell。觀察箭頭會隨資料反向。','讀 1 約 0.545 V；讀 0 約 0.455 V。不是完整的 1 V／0 V。','真正 DRAM 會讓 WL 配合感測與恢復；不能把這個示範的提早隔離當成完整 ACT。','我們已走到感測器的輸入端。下一部分才處理 N-sense、P-sense 與恢復。'],assume:'本課把已開啟的 M_A 簡化為 RON＝100 kΩ，以解析式呈現電荷守恆。CBL＝200 fF、Ccell＝20 fF 是教學參數；VPL 固定 0.5 V；忽略寄生耦合與漏電。',bridge:'前四課到這裡完成：你已知道感測器拿到的輸入，是約 ±45 mV 的差值。可先重播讀 0／1，再到完整版定位 BL、BLB、Cell；N／P 感測與 OCSA 將在後續課程展開。',bridgeTitle:'已完成：感測器之前的四個部分'}\n];\n// Lessons 5–8: progressive educational subcircuits, with explicit boundary conditions.\nlessons[3].bridge='共享已產生微小差值。接下來回頭補上：位線最初的 0.5 V 是怎麼準備好的？第⑤課加入 EQ 與預充電通路。';\nlessons[3].bridgeTitle='下一步：把預充電電路接進來';\nlessons.push(\n {name:'預充電與等化',sub:'建立共同起點',question:'BL 與 BLB 的 0.5 V，是誰準備的？',objective:'只加入三個開關：兩個接基準、一個連接兩線。',stages:['初始：上次留下高、低位','EQ 開啟：三條通路一起動','維持 EQ：兩線接近基準','EQ 關閉：保留準備好的電位','接入 Cell：小差值出現'],dur:[2,8,16,3,10],why:['先假設前一次操作留下 BL／BLB＝1／0 或 0／1。Cell 此時隔離，感測器已停用；這一課只研究位線如何回到共同起點。','EQ 同時啟用 M_PL、M_PR、M_EQ。前兩條通路連到 VPRE；中間通路讓兩線交換電荷。等化與接回基準是同時作用。','BL、BLB 都向 0.5 V 靠近。壓差減少，電流也變小；開關仍開啟，不代表一直有大電流。','EQ 關閉，位線電容保留接近 0.5 V 的電位。先解除箝位，Cell 的小訊號才不會被預充電源拉回去。','現在才讓 WL 開啟、M_A 接通。Cell 與 BL 共享電荷，BLB 保留參考電位。這就是第四課共享實驗的前置準備。'],watch:['上次殘留值與這次 Cell 資料是兩件事；本示範選同一極性方便比較。','黃色箭頭顯示實際壓差決定的電流方向，不以階段名稱硬畫。','試切換 0／1：預充電的目標仍然都是 0.5 V。','此時 Cell 還沒接上；沒有感測或讀出。','把「先 EQ、再放開、再 WL」三步連起來看。'],assume:'三個 EQ 開關以 50 kΩ 導通電阻等效；M_A 使用 100 kΩ。每條位線 200 fF，Cell 20 fF。省略 SA、漏電與寄生耦合；數值不是 JEDEC 內部電路規範。',bridgeTitle:'下一步：小差值如何變成電流？',bridge:'先拿一顆下拉 NMOS，用外加 Gate 電壓控制它，觀察輸出位線如何下降。'},\n {name:'單顆 N-sense',sub:'輸入電壓 → 下拉電流',question:'Gate 只差一點點，放電速度會差多少？',objective:'先只看一顆 NMOS，暫用外加電壓代替另一條位線。',stages:['初始：Gate 與輸出分開','拉低 LAB：建立 VGS','保持 Gate：位線放電','接近低位：電流減少'],dur:[2,2,12,6],why:['輸出 BL 預先置於 0.5 V。Gate 由可調理想訊號源控制，並沒有接回輸出；下方 LAB 起始 0.5 V，使本課範圍內的 Gate 不足以開啟通路。','SAN 啟用後，下方 LAB 朝 0 V 下降。即使 Gate 不變，VGS＝VG−VS 也會增加，NMOS 因而開始導通。','Gate 較高時，過驅電壓較大，通常放電更快。輸出 BL 是一顆有電容的節點，電流持續流出，電壓就持續下降。','BL 接近 LAB 後，汲源壓差變小，電流減少。Gate 可能仍使元件導通，但輸出已接近低位。'],watch:['滑動 Gate，分別重播 0.455 V 與 0.500 V；不要把 Gate 誤認成輸出。','本課用理想控制的 LAB 代表 N_EN 及其供電軌，沒有把控制訊號 SAN 當成電流來源。','比較同一時間的 BL 與電流，而不是只比較最後都接近 0 V 的結果。','下一課才把 Gate 的理想訊號源換成真正的對側位線。'],assume:'CBL＝200 fF，βn＝1 mA/V²，VT＝0.30 V。簡化平方律、忽略次臨界與 body effect。LAB 是理想驅動的供電軌；Gate 是獨立訊號源。',bridgeTitle:'下一步：另一條位線來控制 Gate',bridge:'加上對稱的第二顆 NMOS，先維持兩個外加 Gate 訊號，再把兩側輸出交叉接回 Gate。'},\n {name:'交叉耦合 N-sense',sub:'兩側開始互相影響',question:'接回對側位線，為什麼差距會自己變大？',objective:'先用固定 Gate 驅動兩管，再切換為交叉回授。',stages:['準備：從共享的小差值起步','外加 Gate：先比較兩管','接線：用對側 BL 取代訊號源','正回授：低側越來越低','停下來看：高側還沒到 1 V'],dur:[2,1,.5,18,5],why:['BL 初始為第四課共享的理論值，BLB 為 0.5 V。此課暫不接 Cell，將上一部分的輸出當成本部分初始條件。','兩顆 Gate 暫由固定訊號源控制：N_L 取初始 BLB，N_R 取初始 BL。LAB 降低後，Gate 較高的一管下拉較強。','現在撤掉兩個理想 Gate 訊號源，換成實線：N_L Gate 接 BLB，N_R Gate 接 BL。兩側電位開始互相控制，這才形成回授。','低位線降低，會降低對側 NMOS 的 Gate 電壓，讓對側下拉變弱；對側相對較高，又讓低側下拉保持較強。差值因而擴大。','N-sense 能把低側拉低，卻沒有從上方電源把高側拉到 1 V 的能力。高側只是相對較高；下一課需要加入 P-sense。'],watch:['初始差值不是從標籤猜出的，數值使用電容共享的結果。','此時兩個 Gate 是外加輸入，圖中用小框標出，不假裝已交叉相連。','彩色連線是 Gate 訊號路徑；黃色箭頭才是導電通路的傳統電流。','讀 0 通常由 N_L 主導下拉；讀 1 則左右對調。觀察實際 VGS 和電流。','0／1 選項代表起始 Cell 資料；這裡尚未完成 Cell 恢復。'],assume:'兩條位線均為 200 fF；NMOS 使用 βn＝1、VT＝0.30 V。Cell 與 PMOS 暫未接入；外加 Gate → 回授的切換是教學拆解，不是真實 DRAM 額外命令。',bridgeTitle:'下一步：把高側也補到電源',bridge:'保留 N-sense，再加入交叉耦合 PMOS 與上方供電開關，形成完整的感測核心。'},\n {name:'加入 P-sense',sub:'微小差值 → 完整高低位',question:'哪一顆 PMOS 會把高側拉到 1 V？',objective:'保留交叉耦合，先 N 後 P，觀察上下供電與鎖存。',stages:['初始：上下供電軌在半電源','N-sense：LAB 降低','低側下降：留意 PMOS 的反應','P_EN 開啟：LA 接向電源','再生放大：高側拉高','鎖存：有導通不一定有大電流'],dur:[2,2,12,2,16,5],why:['加入 P_L／P_R，Gate 同樣交叉接到對側位線。LA／LAB 初始為 0.5 V；P_EN 尚未開啟。Cell 仍暫時省略。','先拉低 LAB，NMOS 兩側開始分出強弱。此時 PMOS 也已在電路裡，是否導通取決於實際 VSG，不是只看階段名稱。','當某側 Gate 已很低，即使 P_EN 還關著，對側 PMOS 也可能導通。模型的 LA 有 40 fF 電容，能短暫提供電荷；因此 LA 可能先下降。','SAP_n 降低，P_EN 導通，上方電源提供電流把 LA 拉向 1 V。Gate 較低的一側 PMOS 提供較強上拉。','低側控制高側的 PMOS，高側控制低側的 NMOS；正回授將差值放大成接近 1 V／0 V。再生所需能量來自供電。','高側與低側保持穩定；某些管子仍符合導通條件，但兩端壓差很小，電流也很小。這個狀態是感測器鎖存，不等於 Cell 已恢復。'],watch:['P_EN 用開關等效，LA 電容以等效負載計算；模型不是 JEDEC 強制內部拓撲。','對照兩顆 NMOS 的即時數值，辨別哪一側下拉較強。','這正是第三階段會看到某顆 PMOS 先有動作的原因；不要把 LA 暫存電荷當成 VINTA 已接通。','讀 0 時通常 P_R 上拉 BLB，P_L 截止；讀 1 左右對調。','比較 N-sense 課的高側電位，現在才真正接近 1 V。','下一部分再接回 Cell，學 Restore、PRE、READ／WRITE。'],assume:'βn＝1、βp＝0.2 mA/V²；|VT|＝0.30 V；CBL＝CBLB＝200 fF，CLA＝40 fF。P_EN 用受控 n part(id,`\u003cg style=\"color:${on?'#70efb5':'#eef5ff'}\"\u003e`+line(x,y-42,x,y-20)+line(x,y+20,x,y+42)+line(x,y-20,on?x:x+23,y+20,'device')+txt(x+30,y+5,id,'small','start')+'\u003c/g\u003e');}\nfunction coreMos(id,x,y,p,side,s){const l=id.endsWith('L'),a=p?s.la:(l?s.bl:s.b),b=p?(l?s.bl:s.b):s.lab,g=p?(l?s.b:s.bl):(l?s.gl:s.gr),j=senseMosCurrent(a,b,g,p,p?.2:1),on=(s.j?.[id]?.over??j.ov)\u003e.001;\n let body=`\u003cg style=\"color:${on?(p?'#ffd174':'#67ddff'):'#eef5ff'}\"\u003e\u003crect x=\"${x-38}\" y=\"${y-44}\" width=\"76\" height=\"88\" class=\"hit\"/\u003e`;\n if(symbol==='switch')body+=line(x,y-45,x,y-20)+line(x,y+20,x,y+45)+line(x,y-20,on?x:x+side*20,y+20,'device')+line(x+side*70,y,x+side*28,y,'device');\n else{body+=line(x,y-45,x,y-22)+line(x,y-22,x+side*10,y-22,'device')+line(x+side*10,y-22,x+side*10,y+22,'device')+line(x+side*10,y+22,x,y+22,'device')+line(x,y+22,x,y+45)+line(x+side*28,y-24,x+side*28,y+24,'device');if(p)body+=`\u003ccircle cx=\"${x+side*38}\" cy=\"${y}\" r=\"5\" class=\"device\"/\u003e`;body+=line(x+side*(p?43:28),y,x+side*70,y,'device');}\n body+=txt(x-side*28,y-8,id,'label',side===1?'end':'start')+'\u003c/g\u003e';return part(id,body);\n}\nfunction signalPath(d,c){return `\u003cpath d=\"${d}\" fill=\"none\" stroke=\"${c}\" stroke-width=\"2.5\"/\u003e`;}\nfunction senseCap(x,y,id,val){return part(id,line(x,y-35,x,y-8)+line(x-23,y-8,x+23,y-8,'device')+line(x-23,y+8,x+23,y+8,'device')+line(x,y+8,x,y+40)+ground(x,y+40)+txt(x,y-48,id+' · 200 fF','small')+txt(x,y+123,fmt(val)+' V','value'));}\nfunction drawSenseCircuit(s){let z=`\u003cdefs\u003e\u003cmarker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto-start-reverse\"\u003e\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#ffd174\"/\u003e\u003c/marker\u003e\u003c/defs\u003e`;\n $('circuit').setAttribute('viewBox','0 0 920 540');\n if(lesson===4){z+=txt(460,37,'VPRE＝0.500 V')+line(260,60,660,60)+line(260,60,260,88)+line(660,60,660,88)+verti ${fmt(s.b,5)} V\\n\\n解除 EQ 後才接入 Cell\\nVshare ≈ (200×0.5+20×${bit})/220\\n≈ ${fmt((.1+.02*bit)/.22,5)} V`;\n else{\n const pair=lesson===5?[['N_R',s.bl,s.gl,s.il]]:[['N_L',s.bl,s.gl,s.il],['N_R',s.b,s.gr,s.ir]];\n let f=pair.map(([id,v,g,i])=\u003e`${id}：Gate = ${fmt(g)} V\\nVGS = VG − min(VD, VS)\\n= ${fmt(g-Math.min(v,s.lab))} V\\nVov = VGS − 0.300 V\\nI(位線→LAB) = ${fmt(i*1000)} µA`).join('\\n\\n');\n f+='\\n\\ndV/dt = I淨流入/C\\nβn = 1 mA/V²；CBL = 200 fF';\n if(lesson===6)f+='\\n'+(stage\u003c2?'目前 Gate 由外加訊號源固定':'現在 Gate 接回實際對側位線');\n if(lesson===7)f+=`\\n\\nP_L：VSG = ${fmt(Math.max(s.la,s.bl)-s.b)} V\\nI(LA→BL) = ${fmt(s.pl*1000)} µA\\nP_R：VSG = ${fmt(Math.max(s.la,s.b)-s.bl)} V\\nI(LA→BLB) = ${fmt(s.pr*1000)} µA\\nβp = 0.2 mA/V²\\n\\nLA = ${fmt(s.la)} V；CLA = 40 fF\\nCLA·dLA/dt = I_PEN − I_PL − I_PR\\nI_PEN = ${fmt(s.ipower*1000)} µA\\nP_EN 未開時仍可能有 LA 暫存電流`;\n $('formula').textContent=f;\n }\n}\nfunction senseWave(){const signals=lesson===4?[['bl','BL','#67ddff'],['b','BLB','#ffd174'],['eq','EQ','#70efb5']]:lesson===5?[['bl','BL','#ff91c4'],['gl','Gate','#67ddff'],['lab','LAB','#ffd174']]:[['bl','BL','#67ddff'],['b','BLB','#ffd174'],[lesson===7?'la':'lab',lesson===7?'LA':'LAB','#ff91c4']];$('legend').innerHTML=signals.map(([,n,c])=\u003e`\u003cspan style=\"color:${c}\"\u003e━ ${n}\u003c/span\u003e`).join(' ');let z='';for(const v of [0,.5,1,1.5]){const y=110-v*56;z+=`\u003cpath d=\"M45 ${y}H880\" stroke=\"#283544\" stroke-dasharray=\"3 5\"/\u003e`+txt(23,y+4,String(v),'small');}bounds.forEach(x=\u003ez+=`\u003cpath d=\"M${45+x/total*835} 20V113\" stroke=\"#223442\"/\u003e`);for(const [key,,c]of signals){const pts=trace.filter((s,i)=\u003es.t\u003c=t\u0026\u0026i%15===0);z+=`\u003cpath d=\"${pts.map((s,i)=\u003e(i?'L':'M')+(45+s.t/total*835).toFixed(2)+' '+(110-s[key]*56).toFixed(2)).join(' ')}\" fill=\"none\" stroke=\"${c}\" stroke-width=\"2\"/\u003e`;}z+=`\u003cpath d=\"M${45+t/total*835} 15V115\" stroke=\"white\"/\u003e`+txt(45,133,'0 ns','small','start')+txt(880,133,total+' ns','small','end');$('wave').innerHTML=z;}\n\n// Connect the earlier lessons to the same BLSA netlist used by the full lab.\nlessons[7].bridgeTitle='下一步：感測完成，Cell 呢？';lessons[7].bridge='把 M_A 與 Cell 接回 BL，觀察感測器如何一邊放大，一邊恢復儲存電位；再試一次提早關閉 WL。';\nlessons.push(\n {name:'接回 Cell／恢復',sub:'鎖存不等於恢復完成',question:'SA 已分出 0／1，Cell 也準備好了嗎？',objective:'接回 M_A 和 Cell，比較正常保持 WL 與提早隔離。',stages:[],dur:[],why:[],watch:[],assume:'使用完整版 BLSA 教學網表，失配設為 0。圖中暫省略預充電、偏壓及 I/O 支路；它們仍按已學流程作用。提早關 WL 是故意插入的失敗實驗，不是正常 DDR5 命令。',bridgeTitle:'下一步：資料恢復後再關列',bridge:'Cell 恢復完成後，必須先隔離它，再讓位線回到半電源。下一課加入 PRE。'},\n {name:'PRE 關列',sub:'先隔離，再等化',question:'為什麼 BL 回到 0.5 V，Cell 不會跟著變？',objective:'從已開列且充分恢復的狀態起步，逐段關閉與預充電。',stages:[],dur:[],why:[],watch:[],assume:'起始已完成 ACT、恢復及 PRE 前置時序。只展開 PRE 內部動作；下方同名 BL／BLB 節點連回上方。偏壓回路在圖中省略，但仍存在於模型。',bridgeTitle:'下一步：從列裡選出一筆資料',bridge:'READ 不會把整列再打開一次。下一課從已開列的狀態加入欄位開關、局部 I/O 與寫入驅動器。'},\n {name:'欄位 READ／WRITE',sub:'取出資料，或改寫資料',question:'SA 裡的資料，怎麼送出去或被改寫？',objective:'選讀取或寫入 0／1，只看已開列後的欄位動作。',stages:[],dur:[],why:[],watch:[],assume:'起始列已充分感測、恢復並滿足欄位命令前置時序。LIO／LIOB 是局部 I/O；DQ 只以差動取樣端點表示，不模擬 DQS、序列化與 burst。右側同名 BL／BLB 接回感測器。',bridgeTitle:'下一步：串起完整故事',bridge:'把預充電、ACT、READ／WRITE、PRE 串成有資料連續性的流程，再比較不開 CSL 的 Refresh。'},\n {name:'完整 BLSA 流程',sub:'讀、寫、驗證、刷新',question:'這些小部分，怎麼完成一次完整操作？',objective:'切換故事線，逐段追蹤 Cell、位線與 I/O 的資料。',stages:[],dur:[],why:[],watch:[],assume:'完整 BLSA 教學網表；畫面展開主要資料通路，供電軌偏壓開關以狀態文字表示。時間門檻為教學值，並非完整 DDR5 合規檢查。Refresh 只展開一條代表性列。',bridgeTitle:'完成 BLSA：下一部分是 OCSA',bridge:'你已連起 Cell、感測、恢復、欄位讀寫與關列。下一部分將從元件失配開始，逐步加入 OCSA 的補償與隔離通路。也可先到完整版對照。'}\n);\nlet earlyClose=false,accessOp='RD',story='read',fullSim=null;\nconst flowWhy={\n release:['先解除位線預充電與等化。Cell 還沒接上，避免稍後的小差值被 VPRE 箝回去。','這是已學過的 EQ 支路；現在只把它當成 ACT 的第一步。'],\n share:['WL 升高，M_A 接通，Cell 和 BL 共享電荷。Cell 原本的完整 0／1 被改變，BL 只出現微小差值。','同步看 Cell 與 BL 波形。還沒有恢復，也沒有資料送到 DQ。'],\n nsense:['SAN 啟用，LAB 降低；兩顆 NMOS 開始分出下拉強弱。只要 WL 還開著，Cell 也已隨 BL 變化，恢復不是等下一段才突然開始。','讀 0 的低側是 BL，讀 1 的低側是 BLB；根據實際電位決定，不靠名稱指定結果。'],\n psense:['P_EN 啟用，上方電源經 PMOS 拉高較高的一側。WL 保持開啟，Cell 會繼續朝感測結果恢復。','感測器分出高低位，不代表小電容已在同一瞬間到達完整電位。'],\n restore:['保持 WL 與感測供電，讓 Cell 充分恢復。讀 1 時補到高位，讀 0 時拉回低位；兩種資料都需要恢復。','比較正常與提早關 WL：感測器可能仍判對，Cell 卻只保留共享後的中間電位。'],\n active:['感測器保持鎖存，WL 仍開啟。可以在同一列進行後續欄位讀寫，但還必須符合命令時間限制。','本圖同時顯示 SA 節點和 Cell，避免把兩者當成同一個儲存位置。'],\n wlclose:['先把 WL 拉低，M_A 截止，Cell 與 BL 隔離。這樣之後 BL 預充到 0.5 V，Cell 才不會被一起改寫。','觀察 Cell 波形維持，而後續 BL／BLB 會繼續改變。'],\n saoff:['SAP_n 拉高、SAN 拉低，停止感測器的上拉與下拉供電。不是把每個節點瞬間歸零。','先停止強驅動，再等化，避免高低位線被短接時仍由兩端電源對抗。'],\n equalize:['EQ 同時啟用兩條預充電通路與 M_EQ。BL／BLB 交換電荷並回到 VPRE；供電軌偏壓回路也準備下一次感測。','Cell 已隔離，資料仍留在 Cell；PRE 本身不等於刷新。'],\n standby:['BL／BLB 已接近 0.5 V，Cell 保存先前資料。下一次 ACT 仍需要滿足 PRE 後的 tRP 等限制。','這是關列後的準備狀態，不是把 Cell 清成 0.5 V。'],\n iorelease:['先解除局部 I/O 預充電，讓 LIO／LIOB 可以被資料驅動；位線感測器仍保持開列。','IOEQ 與位線 EQ 是兩組不同控制；解除 I/O 預充電不會重新 ACT。'],\n read:['CSL 接通 Y_L／Y_R，SA 已鎖存的資料在 LIO／LIOB 建立差值。能量由感測器供電提供，不是小 Cell 直接推動外部輸出。','看欄位開關和兩條 I/O 的電位變化。'],\n capture:['在本段末端取樣 LIO − LIOB 的符號，形成這筆讀出結果。尚未到取樣點時顯示尚未取樣，不能提前當成有效輸出。','差值不足會顯示 X：這是教學有效性標記，不是 DQ 的第三種邏輯。'],\n readclose:['CSL 關閉，欄位通路隔離；這筆取樣結果保留，SA 和 Cell 仍維持列資料。','READ 完成不會自動把 WL 關閉；同列可以繼續讀寫。'],\n ioreset:['局部 I/O 回到預充電基準，為下一筆資料準備。這只處理 LIO／LIOB，不是 PRE 關列。','分清位線 BL／BLB 與局部 I/O LIO／LIOB。'],\n wdrive:['先由寫入驅動器建立新的 LIO／LIOB 電位，CSL 暫時關閉。寫入資料從這裡進入，並非修改 Cell 標籤就算寫完。','選擇寫 0／寫 1，也可把起始 Cell 設成相同值觀察同值重寫。'],\n write:['CSL 接通，新資料經欄位通路改變感測節點，再經 M_A 寫入 Cell。翻轉初期，新驅動可能與舊鎖存狀態對抗。','看 Cell 的連續變化與實際寫入電流；重寫同值可能沒有大幅翻轉。'],\n wclose:['先關閉 CSL，把已改寫的感測器與外側寫入驅動隔離；WL 此時仍開啟。','不要把欄位開關關閉誤認成 Cell 已被隔離。'],\n wrecover:['寫入驅動停止後，SA 繼續維持新值，Cell 繼續恢復。關列前還需滿足寫入恢復與 ACT→PRE 的限制。','教學模型把內部寫入末端作為 tWR 的示範參考；真實裝置須依外部資料／CK 定義判定。'],\n refselect:['REF 由內部刷新控制選列，接著共享、感測、恢復，再自行關列。整個刷新過程不開 CSL，也不產生新的 DQ 讀出。','本示範從稍微劣化的 Cell 電位開始；刷新必須在資料仍可正確判讀時進行。']\n};\nlet tutorialOffset=.012;\nconst ocWhy={\n release:['先釋放 EQ 與供電軌偏壓。Cell 尚未接入，因此接下來量到的是感測器本身的不對稱。','本例沿用文獻待機：ISO、OC 都高。補償階段不需要再把 OC 從低拉高。'],\n oc:['ISO 斷開，OC 保持導通；感測供電啟用。BL 接 SR、BLB 接 SL，形成校準回路，讓失配轉成節點上的補償偏壓。','此時 WL＝0。BL／BLB 不相等不代表正在讀 Cell，而是在建立補償基準。'],\n hold:['OC 關閉，位線保留剛建立的偏壓；暫停感測供電並把 LA／LAB 拉回偏壓。','保持的是節點電荷，不是永久改變晶體管 VT。真實電路會受漏電、耦合與切換雜訊影響。'],\n share:['WL 接通 Cell，資料在已帶補償偏壓的 BL 上造成額外變化。ISO 與 OC 仍關閉。','這次共享前 BL 不一定恰好 0.5 V；公式要代入本段實際初值。'],\n presense:['重新啟用感測供電，在小負載 SL／SR 上先放大差值。外側 BL／BLB 接 NMOS Gate，仍控制電流，雖然 ISO／OC 的導電通路都斷開。','隔離不等於完全沒有訊號：Gate 的電場控制仍在；但 Cell 此時還沒有被內部滿幅結果恢復。'],\n restore:['ISO 重新接通：SL→BL、SR→BLB。WL 仍開啟，因此恢復電流再經 M_A 到 Cell。','OC 保持關閉，否則會把相反側交叉接回；恢復後才能保存穩固的資料。']};\nfor(const [name,sub,question,objective]of [\n ['為什麼加入補償','BLSA 的失配問題','蹺蹺板自己就偏一邊，還能判對小訊號嗎？','改變 NMOS 臨界電壓差，觀察同一筆 Cell 資料的感測結果。'],\n ['OCSA：先校準自己','隔離 → 補償 → 保持','Cell 還沒接入，BL 為什麼先有差值？','只看 ISO／OC 與偏移取樣；停在補償量保持，不先播放整個讀取。'],\n ['OCSA：加入資料','共享 → 預感測 → 恢復','ISO 關著，感測器怎麼還知道 Cell 資料？','延續補償狀態，分辨 Gate 控制與導電通路，最後接回 Cell。'],\n ['OCSA：完整故事','讀／寫／刷新','加了补償之後，完整讀寫有哪些不同？'.replace('补','補'),'在相同框架比較 OCSA 讀、寫、寫後讀回與刷新；CSL 與 EQ 都在同圖。']\n])lessons.push({name,sub,question,objective,stages:[],dur:[],why:[],watch:[],assume:'OCSA 是具有 offset cancellation 的位線感測器，不是所有 BLSA 的統一替代品。此 ISO／OC 例依 US20200227111A1 Fig.3、6A–E；不是 2018 SVC 論文的逐管重製。額外開關、校準時間與寄生負載是代價。',bridgeTitle:'把下一部分接起來',bridge:'同一個感測目的，先處理自身失配，再讀出 Cell 的小訊號。'});\nlessons[11].bridgeTitle='下一步：真實電晶體不完全一樣';lessons[11].bridge='先前使用對稱感測器。接下來加入失配，看看為什麼需要偏移補償。';\nfunction ocPanels(s){const st=fullSim.stages[stage],L=lessons[lesson];if(lesson===12){$('explain').textContent='BLSA 是位線感測器的功能名稱；OCSA 是加入偏移補償的一類實作。降低供電會使可用的 Cell 訊號變小；元件縮小後，左右失配也更難忽略。當資料差值與偏移相近，正回授可能把錯誤方向放大。改變失配選項，再重播感測。';$('watch').textContent='ΔVT 不等於整個 SA 的輸入等效偏移 Vos。兩顆管的電流由即時 VGS、VDS 與 VT 一起決定；正回授也會把錯誤方向放大。';}\nelse if(ocWhy[st.key]){[$('explain').textContent,$('watch').textContent]=ocWhy[st.key];}\n$('formula').textContent+=`\\n\\nVT,N_L = ${fmt(.3+tutorialOffset/2)} V\\nVT,N_R = ${fmt(.3-tutorialOffset/2)} V\\nΔVT = ${fmt(tutorialOffset*1000,1)} mV\\nI_NL = ${fmt(s.j.N_L.i*1000)} µA\\nI_NR = ${fmt(s.j.N_R.i*1000)} µA\\nΔVBL = ${fmt((s.bl-s.b)*1000)} mV\\nΔVsignal ≈ Ccell/(CBL+Ccell) × (Vcell−VPRE)\\n降低供電 → 訊號裕量可能縮小\\n設計概念：|ΔVsignal| 須超過殘餘偏移與雜訊\\n（不是用 ΔVT 直接充當 Vos）`;\nif(lesson\u003e=13){$('inputName').textContent='ISO／OC／WL';$('inputValue').textContent=[s.ctrl.ISO,s.ctrl.OC,s.wl].map(v=\u003efmt(v,1)).join('／')+' V';$('formula').textContent+=`\\n\\nSL = ${fmt(s.sl)} V；SR = ${fmt(s.sr)} V\\nISO：BL↔SL，BLB↔SR\\nOC：BL↔SR，BLB↔SL\\n預感測：ISO=0，OC=0\\n恢復：ISO=1.5，OC=0`;\nif(st.key==='share'){const start=flowSample(st.start);$('formula').textContent+=`\\nVshare ≈ (200×${fmt(start.bl,5)} + 20×${fmt(start.cell,5)})/220\\n= ${fmt((.2*start.bl+.02*start.cell)/.22,5)} V\\n基準 BLB ≈ ${fmt(start.b,5)} V`;}}\n$('assumptions').textContent=L.assume+' 模型含 NMOS VT 失配，未涵蓋所有製程與雜訊。內部電壓及持續時間是教學選值；不是 JEDEC 指定拓撲。';}\nfunction ocConfig(){if(lesson\u003c12)return;const box=$('config');box.insertAdjacentHTML('afterbegin','\u003clabel\u003eΔVT \u003cselect id=\"offset\"\u003e\u003coption value=\"0\"\u003e0 mV\u003c/option\u003e\u003coption value=\"0.012\"\u003e+12 mV\u003c/option\u003e\u003coption value=\"0.06\"\u003e+60 mV\u003c/option\u003e\u003coption value=\"-0.06\"\u003e−60 mV\u003c/option\u003e\u003c/select\u003e\u003c/label\u003e');$('offset').value=String(tutorialOffset);$('offset').onchange=e=\u003e{tutorialOffset=+e.target.value;reset();};}\n\nfunction makeFlowTrace(){\n const M=window.DramModel;let sc={id:'tutorial',init:bit,offset:0,ops:['ACT']};\n if(lesson===9)sc={...sc,open:true,ops:['PRE']};\n if(lesson===10)sc={...sc,open:true,ops:[accessOp]};\n if(lesson===11||lesson===15){if(story==='read')sc.ops=['ACT','RD','PRE'];if(story==='write'||story==='verify'){sc.init=1-bit;sc.ops=['ACT','W'+bit,'PRE'];if(story==='verify')sc.ops.push('ACT','RD','PRE');}if(story==='refresh'){sc.init=bit?.88:.12;sc.ops=['REF'];}}\n if(lesson\u003e=12)sc.offset=tutorialOffset;\n fullSim=M.simulate(lesson\u003e=13?'ocsa':'blsa',sc);\n if(lesson===13){const last=fullSim.stages.findIndex(s=\u003es.key==='hold');fullSim.stages=fullSim.stages.slice(0,last+1);fullSim.total=fullSim.stages.at(-1).end;fullSim.samples=fullSim.samples.filter(s=\u003es.t\u003c=fullSim.
