label>\u003cselect id=\"speed\" aria-label=\"播放速度\">\u003coption value=\".25\">0.25×\u003c/option>\u003coption value=\".5\">0.5×\u003c/option>\u003coption value=\"1\" selected>1×\u003c/option>\u003coption value=\"2\">2×\u003c/option>\u003coption value=\"4\">4×\u003c/option>\u003c/select>\u003c/label>\u003cbutton id=\"symbolBtn\" aria-pressed=\"false\">MOS ⇄ 開關\u003c/button>\u003clabel class=\"check\">\u003cinput type=\"checkbox\" id=\"pulse\" checked>閃爍\u003c/label>\u003c/div>\u003cdiv class=\"zoomtools\">\u003cbutton id=\"focusCircuit\">放大電路\u003c/button>\u003cbutton id=\"explainBtn\" aria-expanded=\"false\" aria-controls=\"explanation\">流程／公式\u003c/button>\u003c/div>\u003c/section>\n\u003cdiv class=\"readouts\" id=\"readouts\">\u003c/div>\n\u003cdiv class=\"circuit-stage\">\n\u003caside class=\"local-scope\" aria-label=\"當前階段示波器\">\u003cdiv class=\"scope-head\">\u003cstrong>當前波形\u003c/strong>\u003cspan id=\"localScopeTime\">\u003c/span>\u003c/div>\u003cp id=\"localScopeStage\">\u003c/p>\u003cdiv class=\"scope-legend\">\u003cspan style=\"color:#59e2ff\">━ BL\u003c/span>\u003cspan style=\"color:#ffbf5b\">━ BLB\u003c/span>\u003cspan style=\"color:#fd83c9\">━ Cell\u003c/span>\u003cspan id=\"localSenseLegend\" hidden style=\"color:#aa99ff\">┄ SABL / SABLB\u003c/span>\u003c/div>\u003csvg id=\"localWave\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"目前階段附近的電壓與控制訊號\">\u003c/svg>\u003cp class=\"scope-note\">白線：目前進度 · 隨階段切換\u003c/p>\u003c/aside>\n\u003cdiv class=\"circuit-viewport\" id=\"viewport\">\u003csvg id=\"circuit\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1100 1160\" role=\"img\" aria-label=\"可點選元件的 DRAM 完整電路\">\u003c/svg>\u003c/div>\n\u003caside class=\"stage-brief\" aria-label=\"當前流程重點\">\u003cdiv class=\"brief-heading\">\u003cstrong>現在在做什麼\u003c/strong>\u003cspan id=\"briefCount\">\u003c/span>\u003c/div>\u003ch2 id=\"briefStage\">\u003c/h2>\u003cp id=\"briefWhat\">\u003c/p>\u003ch3>為什麼要這樣做\u003c/h3>\u003cp id=\"briefWhy\">\u003c/p>\u003cp id=\"briefWiring\" class=\"brief-note\">\u003c/p>\u003cdiv id=\"briefTrigger\">\u003c/div>\u003csection class=\"brief-capacitors\">\u003ch3>位線電容正在怎麼變\u003c/h3>\u003cdiv id=\"briefCaps\">\u003c/div>\u003cp id=\"briefCapWhy\" class=\"brief-note\">\u003c/p>\u003c/section>\u003csection>\u003ch3>主要支路電流 \u003csmall>µA\u003c/small>\u003c/h3>\u003cdiv id=\"briefCurrents\">\u003c/div>\u003cp class=\"brief-note\">方向與數值來自目前模型；點元件可看工作區與詳細參數。\u003c/p>\u003c/section>\u003c/aside>\n\u003c/div>\n\u003cdiv class=\"sr-only\">\u003cdiv>\u003cspan class=\"eyebrow\" id=\"architecture\">BLSA / TRANSISTOR VIEW\u003c/span>\u003ch1 id=\"circuitHeading\">位線感測電路\u003c/h1>\u003c/div>\u003cspan id=\"currentStepCompact\" class=\"compact-step\">\u003c/span>\u003c/div>\n\u003clabel class=\"scrubber\">\u003cspan class=\"sr-only\">拖曳案例進度\u003c/span>\u003cinput id=\"scrub\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\" step=\"1\">\u003c/label>\n\u003c/section>\n\u003caside class=\"explanation\" id=\"explanation\" hidden data-section=\"flow\">\u003cdiv class=\"detailtabs\">\u003cbutton data-detail=\"flow\" aria-pressed=\"true\">流程圖\u003c/button>\u003cbutton data-detail=\"formula\" aria-pressed=\"false\">公式與推導\u003c/button>\u003cbutton id=\"closeExplanation\" aria-label=\"關閉說明\">✕\u003c/button>\u003c/div>\u003csection class=\"panel nowpanel\">\u003cdiv class=\"panelhead\">\u003cspan class=\"eyebrow\">CURRENT STEP\u003c/span>\u003cspan id=\"stageCounter\" class=\"counter\">\u003c/span>\u003c/div>\u003ch2 id=\"stepTitle\">\u003c/h2>\u003cp id=\"stepIntro\">\u003c/p>\u003cdiv class=\"statusline\" id=\"stepStatus\">\u003c/div>\u003cdiv class=\"localprogress\">\u003cspan id=\"localBar\">\u003c/span>\u003c/div>\u003c/section>\n\u003csection class=\"panel flowpanel\">\u003cdiv class=\"panelhead\">\u003ch2>本操作流程\u003c/h2>\u003cbutton id=\"playOperation\" class=\"mini\">▶ 播放本操作\u003c/button>\u003c/div>\u003cdiv id=\"flowchart\" class=\"flowchart\">\u003c/div>\u003c/section>\n\u003csection class=\"panel formulapanel\">\u003cdiv class=\"panelhead\">\u003ch2>正在發生的計算\u003c/h2>\u003cspan class=\"eyebrow\">LIVE\u003c/span>\u003c/div>\u003cdiv id=\"formula\">\u003c/div>\u003cdetails class=\"timing-details\">\u003csummary>命令時序與教學門檻\u003c/summary>\u003cdiv class=\"timingbody\">\u003cp class=\"scope-note\">這裡驗證所列的 7 項時間關係。門檻是可調教學值；本頁沒有指定完整 DDR5 速度等級、MR 或 burst 組態。\u003c/p>\u003cdiv id=\"timingLive\">\u003c/div>\u003cdetails>\u003csummary>調整教學門檻（套用會回到起點）\u003c/summary>\u003cform id=\"timingForm\">\u003cdiv id=\"timingInputs\">\u003c/div>\u003cbutton type=\"submit\">套用\u003c/button> \u003cbutton id=\"resetTiming\" type=\"button\">還原案例\u003c/button>\u003cp id=\"timingApplied\" role=\"status\">\u003c/p>\u003c/form>\u003c/details>\u003cp class=\"formula-note\">tRCD 從 ACT 起算，和共享、感測、恢復重疊；只等待不足的部分。多個限制取最晚到期時間，不逐一相加。\u003c/p>\u003cp class=\"formula-vars\">本模型未模擬外部 DQ／CK。WD_REF 放在內部寫入階段末端，僅示範 tWR 的參考事件；真實 tWR 應依 JEDEC 最後寫入資料後的第一個 CK 上升緣起算（JESD79-5C §4.8.2）。尚未檢查 nCK 取整、tCCD、讀寫轉向、跨 bank／rank、tFAW 或 tREFI 排程，不能據此宣稱 JEDEC 合規。\u003c/p>\u003ch3>已發出命令\u003c/h3>\u003cdiv id=\"timingLog\">\u003c/div>\u003c/div>\u003c/details>\u003c/section>\n\u003c/aside>\u003c/div>\n\u003csection class=\"timeline panel\">\u003cdiv class=\"panelhead\">\u003ch2>電壓與控制訊號\u003c/h2>\u003cbutton id=\"focusWave\" class=\"mini\">放大示波器\u003c/button>\u003cspan id=\"timeLabel\">\u003c/span>\u003c/div>\u003cdiv class=\"wavelegend\">\u003cspan style=\"color:#59e2ff\">━ BL\u003c/span>\u003cspan style=\"color:#ffbf5b\">━ BLB\u003c/span>\u003cspan style=\"color:#fd83c9\">━ Cell\u003c/span>\u003cspan id=\"senseLegend\" hidden style=\"color:#aa99ff\">┄ SABL / SABLB\u003c/span>\u003cspan>下方：WL / EQ / SAN / SAP_n / CSL / ISO / OC\u003c/span>\u003c/div>\u003cdiv class=\"wavewrap\">\u003csvg id=\"wave\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1260 300\" role=\"img\" aria-label=\"同步電壓及控制訊號波形\">\u003c/svg>\u003c/div>\u003c/section>\n\u003cfooter>\u003cspan>單 Cell 教學模型 · VINTA = 1.00 V · Ccell = 20 fF · CBL = 200 fF\u003c/span>\u003cspan>動畫時間經放慢；不代表 JEDEC 最小時序。\u003c/span>\u003c/footer>\n\u003c/main>\n\u003cdialog id=\"componentDialog\">\u003cdiv class=\"dialoghead\">\u003cspan class=\"eyebrow\">COMPONENT INSPECTOR\u003c/span>\u003cbutton data-close=\"componentDialog\" aria-label=\"關閉元件說明\">✕\u003c/button>\u003c/div>\u003cdiv id=\"componentBody\">\u003c/div>\u003cbutton data-close=\"componentDialog\" class=\"primary full\">回到電路\u003c/button>\u003c/dialog>\n\u003cdialog id=\"sourceDialog\">\u003cdiv class=\"dialoghead\">\u003ch2>模型、命名與來源\u003c/h2>\u003cbutton data-close=\"sourceDialog\" aria-label=\"關閉模型說明\">✕\u003c/button>\u003c/div>\u003cdiv class=\"prose\">\n\u003cp>\u003cb>BLSA：\u003c/b>依 Keeth 等《DRAM Circuit Design: Fundamental and High-Speed Topics》印刷頁 26–28 的交叉耦合感測原理，以及第 2 章的等化／欄位選擇電路，加入顯式供電、I/O 預充電和寫入驅動支路。\u003c/p>\n\u003cp>\u003cb>OCSA：\u003c/b>補償核心依 \u003ca href=\"https://patents.google.com/patent/US20200227111A1/en\" target=\"_blank\" rel=\"noopener\">US20200227111A1，Fig. 3、6A–6E、8\u003c/a>，採 ISO 與 OC 切換連線的架構。P_L / N_L 對應專利 P₂ / N₂；P_R / N_R 對應 P₁ / N₁。預充電時 ISO、OC 同為高；補償時只降低 ISO，OC 保持高，並切換感測供電（Fig. 6A–6B）。因此待機 OC 為 1.5 V 是此架構的預定狀態。供電偏壓、I/O 及寫入為教學周邊實作。這不是先前提及的 2018 SVC 論文重現，也不代表任一廠商 DDR5 網表。\u003c/p>\n\u003cp>\u003cb>JEDEC：\u003c/b>命令、外部訊號與時序名稱以使用者提供的 JESD79-5C_v1.30 為依據。BL、WL、CSL、LA、LAB、VINTA、VPRE 與元件編號屬內部電路名稱，並非 JEDEC 指定晶片內部網表。外部 VPP 不等於本模型的 WL 節點。\u003c/p>\n\u003ch3>計算方式\u003c/h3>\u003cp>以各節點 KCL 和長通道平方律 MOS 電流進行數值積分。所有節點電壓、支路箭頭與元件狀態由同一模型產生；不是事先畫好的電壓曲線。MOS／開關切換只改圖示。\u003c/p>\u003cdiv class=\"eq\">C · dV/dt = Σ I\u003csub>in\u003c/sub> − Σ I\u003csub>out\u003c/sub>\u003c/div>\n\u003cp>VINTA = 1 V；VPRE = VPL = 0.5 V；WL／ISO／OC／CSL 的高電位 = 1.5 V（教學升壓控制）；CBL = CBLB = 200 fF，Ccell = 20 fF，OCSA 的 CSABL = CSABLB = 20 fF，CIO = 50 fF。兩頁使用同樣 NMOS 失配：VT,N_L = 0.306 V、VT,N_R = 0.294 V。βP = 0.2、βN = 1 mA/V²；這些是示例參數。\u003c/p>\n\u003cp>\u003cb>電容比例：\u003c/b>Ccell:CBL = 20:200 = 1:10，刻意示範較小的共享訊號；在 VINTA = 1 V、VPRE = 0.5 V 時，BLSA 共享差值約 ±45.45 mV。這不是 JEDEC 規定的內部電容比例，也不宣稱所有 DDR5 都是 1:5～1:8。OCSA 應代入實際補償後的 BL 起始電壓。\u003c/p>\u003cp>\u003cb>讀出有效性：\u003c/b>只有 ΔVIO &gt; +10 mV 判 1、ΔVIO &lt; −10 mV 判 0；其餘顯示 X。10 mV 為教學門檻，X 為模擬器的不確定狀態，並非實體 DQ 的第三種邏輯值。\u003c/p>\u003cp>忽略次臨界、體效應、寄生耦合、通道長度調變、接面漏電與控制饋通；只有「漏電」案例加入 I = G(0.5 − Vcell) 的等效漏電支路。補償量由電路求出，不假設等於 ΔVT，也不宣稱完全消除偏移。\u003c/p>\n\u003ch3>範圍與時間\u003c/h3>\u003cp>展示一個位線對及一顆 Cell。READ／WRITE 的 I/O、欄位開關和寫入驅動器明確畫出；序列化、DQS、外部 DQ 驅動與完整 DDR5 burst 用功能端點表示。DQ 面板表示本筆取樣資料，不是完整接腳波形。\u003c/p>\u003cp>REF 示範內部刷新所選列的資料恢復；不表示每個 REF 命令只刷新一條 WL。REFab／REFsb 的銀行排程與刷新計數器不在本電路層動畫範圍。\u003c/p>\u003cp>畫面中的 ns 是此示例模型的時間。新版會追蹤 ACT、READ、PRE、REF、WD_REF 事件，對 tRCD、tRAS、tRP、tRC、tRTP、tWR、tRFC 自動等待剩餘時間並檢查。預設數字及「等待觀察」案例是教學設定，不是完整 JEDEC 速度等級；即使通過所列規則，仍不能判定真實命令序列合規。實際值與 CK 週期限制需依密度、速度等級、MR 和命令序列查表。\u003c/p>\n\u003cp>時序規則參考：JESD79-5C_v1.30 §4.7.2（印刷頁 137：tRTP／tRAS／tRP／tRC）、§4.8.2（頁 148：tWR 參考點）、§4.13（頁 168：REF 與 tRFC）。OCSA 補償效果僅在本模型與案例驗證，未完成 PVT、雜訊及失配範圍驗證。\u003c/p>\u003c/div>\u003c/dialog>\n\u003cscript>/* DRAM Circuit Lab. Educational long-channel MOS transient model.\n * Units: V, ns, pF, mA. Not a DDR5 timing or process sign-off model.\n * OCSA core connectivity: US20200227111A1, Fig.3 / Fig.6A–E.\n * Named rail/column/write drivers are explicit illustrative peripheral circuits.\n */\n(function(global){\n'use strict';\nconst C={BL:.2,BLB:.2,CELL:.02,SL:.02,SR:.02,LA:.04,LAB:.04,LIO:.05,LIOB:.05};\nconst nodes=Object.keys(C), caps=nodes.map(n=>C[n]), ix=Object.fromEntries(nodes.map((n,i)=>[n,i]));\nconst rail={VINTA:1,VSS:0,VPRE:.5,VPL:.5};\nconst clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));\n// Rule demonstration only: no speed-bin / MR / burst configuration is implied.\nconst timingDefaults={tRCD:16,tRAS:32,tRP:16,tRC:48,tRTP:7.5,tWR:30,tRFC:295};\nconst senseMargin=.01; // 10 mV illustrative input margin, not a JEDEC specification.\nfunction decideRead(delta,margin=senseMargin){return !Number.isFinite(delta)||Math.abs(delta)\u003c=margin?'X':delta>0?1:0;}\nconst scenarios=[\n {id:'read0',group:'簡單案例',name:'讀出 0',init:0,ops:['ACT','RD','PRE'],goal:'從儲存 0 的 Cell 開列，讀出 0，再關列。'},\n {id:'read1',group:'簡單案例',name:'讀出 1',init:1,ops:['ACT','RD','PRE'],goal:'從儲存 1 的 Cell 開列，讀出 1，再關列。'},\n {id:'write0',group:'簡單案例',name:'寫入 0（1 → 0）',init:1,ops:['ACT','W0','PRE'],goal:'寫入驅動器將原本的 1 改成 0，完成寫入恢復後關列。'},\n {id:'write1',group:'簡單案例',name:'寫入 1（0 → 1）',init:0,ops:['ACT','W1','PRE'],goal:'寫入驅動器將原本的 0 改成 1，完成寫入恢復後關列。'},\n {id:'act0',group:'單一操作',name:'ACT：Cell = 0',init:0,ops:['ACT'],goal:'只看開列、共享與感測；最後保持列開啟。'},\n {id:'act1',group:'單一操作',name:'ACT：Cell = 1',init:1,ops:['ACT'],goal:'只看開列、共享與感測；最後保持列開啟。'},\n {id:'pre0',group:'單一操作',name:'PRE：已開列的 0',init:0,open:true,ops:['PRE'],goal:'起始已完成 ACT 與恢復；只播放關列、停用感測與等化。'},\n {id:'pre1',group:'單一操作',name:'PRE：已開列的 1',init:1,open:true,ops:['PRE'],goal:'起始已完成 ACT 與恢復；觀察 Cell 隔離後如何保留 1。'},\n {id:'refresh0',group:'單一操作',name:'Refresh 0',init:.12,ops:['REF'],goal:'Cell 的低電位已因漏電升到 0.12 V；刷新將它恢復到接近 0 V。'},\n {id:'refresh1',group:'單一操作',name:'Refresh 1',init:.88,ops:['REF'],goal:'Cell 的高電位已因漏電降到 0.88 V；刷新將它恢復到接近 1 V。'},\n {id:'verify01',group:'Case study',name:'寫 1 → 關列 → 重新讀回',init:0,ops:['ACT','W1','PRE','ACT','RD','PRE'],goal:'重新 ACT 後再讀回，確認資料保存在 Cell，而不只是感測器仍鎖存 1。'},\n {id:'verify10',group:'Case study',name:'寫 0 → 關列 → 重新讀回',init:1,ops:['ACT','W0','PRE','ACT','RD','PRE'],goal:'觀察寫入翻轉、隔離保存與重新讀出 0 的完整連續過程。'},\n {id:'same0',group:'Case study',name:'同值重寫 0 → 0',init:0,ops:['ACT','W0','RD','PRE'],goal:'沒有邏輯翻轉仍有控制動作；穩態下不應畫出持續充放電。'},\n {id:'same1',group:'Case study',name:'同值重寫 1 → 1',init:1,ops:['ACT','W1','RD','PRE'],goal:'區分寫入動作與位元翻轉，觀察寫入驅動器和欄位開關。'},\n {id:'rowhit',group:'Case study',name:'同列 Read → Write → Read',init:0,ops:['ACT','RD','W1','RD','W0','RD','PRE'],goal:'同一列保持開啟；READ 不會每次重新開啟 WL，也不會自動 PRE。'},\n {id:'retention',group:'Case study',name:'寫 1 → 漏電 → Refresh → 讀回',init:0,ops:['ACT','W1','PRE','WAIT','REF','ACT','RD','PRE'],goal:'把儲存、示意漏電與刷新串起來。REF 本身不將資料送到 DQ。'},\n {id:'timingwait',group:'時序觀察',name:'等待觀察：ACT → READ → PRE → 再開列',init:0,timing:{tRCD:120,tRAS:180,tRP:50,tRC:230},ops:['ACT','RD','PRE','ACT','W1','PRE'],goal:'刻意延長教學門檻，觀察 tRCD、tRAS、tRP／tRC 的剩餘時間；這不是 DDR5 速度等級。'},\n /*{id:'margin0',group:'補償比較',name:'弱訊號 0＋NMOS 失配',init:.36,offset:.06,ops:['ACT','RD','PRE'],goal:'Cell 只有微弱低訊號。切換 BLSA／OCSA，比較相同失配下的感測結果；結果由模型計算。'},\n {id:'margin1',group:'補償比較',name:'弱訊號 1＋NMOS 失配',init:.64,offset:-.06,ops:['ACT','RD','PRE'],goal:'Cell 只有微弱高訊號。比較有無補償的偏移與判讀結果。'}*/\n];\nfunction transistor(id,type,a,b,gate,k,vt=.3){return {id,type,a,b,gate,k,vt};}\nfunction netlist(mode,offset=0){\n const oc=mode==='ocsa', l=oc?'SL':'BL',r=oc?'SR':'BLB';\n const list=[\n transistor('P_L','p','LA',l,r,.2),transistor('P_R','p','LA',r,l,.2),\n transistor('N_L','n',l,'LAB','BLB',1,.3+offset/2),transistor('N_R','n',r,'LAB','BL',1,.3-offset/2),\n transistor('P_EN','p','VINTA','LA','@SAP_n',5),transistor('N_EN','n','LAB','VSS','@SAN',5),\n transistor('B_LA','n','LA','VPRE','@BIAS',4),transistor('B_LAB','n','LAB','VPRE','@BIAS',4),\n transistor('M_PL','n','BL','VPRE','@EQ',1),transistor('M_PR','n','BLB','VPRE','@EQ',1),\n transistor('M_EQ','n','BL','BLB','@EQ',1),transistor('M_A','n','BL','CELL','@WL',.5),\n transistor('Y_L','n',l,'LIO','@CSL',2),transistor('Y_R','n',r,'LIOB','@CSL',2),\n transistor('IO_PL','n','LIO','VPRE','@IOEQ',1),transistor('IO_PR','n','LIOB','VPRE','@IOEQ',1),\n transistor('W_PL','p','VINTA','LIO','@WPL',8),transistor('W_PR','p','VINTA','LIOB','@WPR',8),\n transistor('W_NL','n','LIO','VSS','@WNL',8),transistor('W_NR','n','LIOB','VSS','@WNR',8)\n ];\n if(oc)list.push(transistor('ISO_L','n','BL','SL','@ISO',2),transistor('ISO_R','n','BLB','SR','@ISO',2),transistor('OC_L','n','BL','SR','@OC',2),transistor('OC_R','n','BLB','SL','@OC',2));\n return list;\n}\nfunction voltage(name,v,g){return name[0]==='@'?g[name.slice(1)]:(name in ix?v[ix[name]]:rail[name]);}\nfunction mos(d,v,g){\n const a=voltage(d.a,v,g),b=voltage(d.b,v,g),vg=voltage(d.gate,v,g),ds=Math.abs(a-b);\n const over=d.type==='n'?vg-Math.min(a,b)-d.vt:Math.max(a,b)-vg-d.vt;\n const magnitude=over\u003c=0? ual:lastData,expected,delta,valid:lastData!=='X'});}\n   if(n%stride===0||n===steps)samples.push({t:time+local,v:v.slice(),g,stage:si,dq:lastData});\n   if(n!==steps)v=v.map((x,i)=>x+h*dv[i]/caps[i]);\n   if(v.some(x=>!Number.isFinite(x)||x\u003c-.01||x>1.51))throw Error('電路數值超出範圍');\n  }\n  if(st.key==='wrecover')expected=st.writeBit;\n  st.final=v.slice();st.to=samples.length-1;time+=st.duration;st.end=time;\n }\n return {mode,sc,list,stages,samples,total:time,readLog,final:v,expected,profile,events:schedule.events,timingAudit:auditTiming(schedule.events,profile,!!sc.open)};\n}\nfunction sampleAt(sim,t){\n t=clamp(t,0,sim.total);let lo=0,hi=sim.samples.length-1;\n while(lo\u003chi){const m=Math.ceil((lo+hi)/2);if(sim.samples[m].t\u003c=t)lo=m;else hi=m-1;}\n const a=sim.samples[lo],b=sim.samples[Math.min(lo+1,sim.samples.length-1)],q=b.t>a.t?(t-a.t)/(b.t-a.t):0;\n const st=sim.stages[a.stage],g=controls(st,t-st.start),v=a.v.map((x,i)=>x+(b.v[i]-x)*q);\n return {...a,t,v,g,stage:a.stage,j:Object.fromEntries(sim.list.map(d=>[d.id,mos(d,v,g)]))};\n}\nconst api={scenarios,netlist,simulate,sampleAt,controls,nodes,ix,C,rail,mos,timingDefaults,senseMargin,decideRead,auditTiming};\nif(typeof module!=='undefined')module.exports=api;global.DramModel=api;\n})(typeof globalThis!=='undefined'?globalThis:this);\n\u003c/script>\u003cscript>(function(){\n'use strict';\nconst M=window.DramModel,$=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';\nconst F=(x,n=3)=>Math.abs(x)\u003c.5*10**(-n)?(0).toFixed(n):x.toFixed(n),clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));\nlet mode='blsa',caseId='read0',symbol='mos',sim=null,state=null,time=0,running=false,stopAt=0,lastFrame=0,raf=0,selectedPart=null,lastStage=-1,viewParts={},nodeValues={},waveCursor=null,waveLayout={left:54,width:1150},capParts={},leakGroup=null,cache=new Map(),timingOverrides=null;\nconst colors={P_L:'#ff9871',P_R:'#ffbf5b',N_L:'#59e2ff',N_R:'#a69aff',P_EN:'#ffc86a',N_EN:'#68aaff',B_LA:'#a4d977',B_LAB:'#a4d977',M_PL:'#75f1be',M_PR:'#75f1be',M_EQ:'#75f1be',M_A:'#fd83c9',Y_L:'#ffea69',Y_R:'#ffea69',IO_PL:'#77d7ab',IO_PR:'#77d7ab',W_PL:'#ff9561',W_PR:'#ff9561',W_NL:'#ff9561',W_NR:'#ff9561',ISO_L:'#57f1dc',ISO_R:'#57f1dc',OC_L:'#d9a3ff',OC_R:'#d9a3ff',CELL:'#fd83c9',BL:'#59e2ff',BLB:'#ffbf5b',SL:'#59e2ff',SR:'#ffbf5b',LA:'#ffc86a',LAB:'#68aaff',LIO:'#ffe976',LIOB:'#ffe976'};\nconst defs={\n P_L:['左側 PMOS 感測管','由右側感測節點控制，提供左側節點的上拉電流。右側越低，這一側 PMOS 的 VSG 越大；它與另一側 NMOS 共同形成正回授。','若缺少這顆元件，左側無法主動恢復到完整高電位。'],\n P_R:['右側 PMOS 感測管','由左側感測節點控制，提供右側上拉電流。它不接受單獨的數位開啟命令，導通強弱取決於節點電壓。','缺少它，讀 0 時右側高電位無法有效恢復。'],\n N_L:['左側 NMOS 感測管','Gate 接 BLB；汲取左側感測節點的電流到 LAB。在 OCSA 中，ISO 斷開時 Gate 仍讀取 BLB，Drain 則位於 SABL，兩者不是同一對節點。','缺少它，左側的低電位不能有效建立。'],\n N_R:['右側 NMOS 感測管','Gate 接 BL；將右側節點的電流送到 LAB。BL 稍高時，這顆管子的放電能力增強，開始建立差動判讀。','缺少它，右側低電位不能有效建立。'],\n P_EN:['P-sense 供電開關','將內部感測電源 VINTA 接到 LA。Gate 訊號 SAP_n 為低時導通；高時停用。不是外部 ACT 命令本身。','沒有上拉供電，PMOS 感測對無法替高位線補充電荷。'],\n N_EN:['N-sense 接地開關','SAN 為高時將 LAB 拉向 VSS。LAB 是共用 source rail；它下降後，NMOS 感測對開始放電。','沒有回流到 VSS 的路徑，低位線無法被持續拉低。'],\n B_LA:['上方感測電源偏壓開關','BIAS 接通時使 LA 回到 VPRE。OCSA 在保持／共享階段也使用它，停用供電後恢復供電軌偏壓。這是顯式畫出的教學周邊。','感測供電軌會保留前次電荷，不能可靠回到中性起始狀態。'],\n B_LAB:['下方感測電源偏壓開關','將 LAB 接回 VPRE，使兩顆 NMOS 不再具有正常感測時的接地 source。與供電／接地開關按順序交替控制。','下方供電軌無法回到預充電條件。'],\n M_PL:['BL 預充電開關','EQ 啟用時，將 BL 連到 VPRE，補足或移除等化後的共模誤差。它和 M_EQ 的功能不同：一個提供基準，一個拉近兩線電位。','只做兩線短接不能保證電位精確等於 VPRE。'],\n M_PR:['BLB 預充電開關','EQ 啟用時，將 BLB 連到 VPRE。與 M_PL、M_EQ 一起準備下一次小訊號判讀。','參考位線可能保留前次操作的偏差。'],\n M_EQ:['位線等化開關','EQ 啟用時短接 BL 與 BLB，使差動電壓趨近零。它必須在電荷共享前關閉，否則 Cell 的微小訊號會被抹掉。','兩線起始差值可能被誤判為儲存資料。'],\n M_A:['Cell 存取電晶體','由 WL 控制，連接 BL 與儲存節點。ACT 時負責電荷共享，感測後保持導通以恢復資料，WRITE 時把新電位傳進 Cell。','Cell 與位線失去資料交換路徑。'],\n Y_L:['左欄位選擇開關','CSL 開啟時，將左感測節點接到 LIO。讀取時讓 I/O 建立差值；寫入時讓外部寫入驅動克服原本的鎖存狀態。','本位線對的資料無法傳到局部 I/O，也無法由該 I/O 寫入。'],\n Y_R:['右欄位選擇開關','CSL 控制右感測節點與 LIOB 的雙向連接。它與 Y_L 一起傳遞差動訊號。','差動 I/O 缺少另一半路徑。'],\n IO_PL:['LIO 預充電開關','IOEQ 為高時把 LIO 拉回 VPRE。Read／Write 前先關閉，避免基準源和讀寫路徑互相對抗。','I/O 初始狀態可能受前次資料影響。'],\n IO_PR:['LIOB 預充電開關','和 IO_PL 對稱地準備另一條 I/O 線。這是局部 I/O 的預充電，不等於 PRE 命令關閉整列。','局部差動 I/O 的起始偏壓不完整。'],\n W_PL:['LIO 寫入上拉管','寫 1 時啟用，從 VINTA 提供電流到 LIO，再經 Y_L 到感測節點與 Cell。WRITE 結束後關閉。','無法經左 I/O 主動寫入高電位。'],\n W_PR:['LIOB 寫入上拉管','寫 0 時啟用，將互補 I/O 拉高，配合左側下拉，迫使感測器翻轉。','差動寫 0 的互補高側驅動缺失。'],\n W_NL:['LIO 寫入下拉管','寫 0 時啟用，將 LIO 電流導向 VSS。若原本為 1，會先與感測器上拉競爭，直到再生方向翻轉。','無法主動將左側新資料拉到 0。'],\n W_NR:['LIOB 寫入下拉管','寫 1 時啟用，將互補 I/O 拉低。這個低電位也促使左 PMOS 更強導通。','差動寫 1 的互補低側驅動缺失。'],\n ISO_L:['左側隔離開關','連接 BL 與 SABL。補償和預感測時斷開，恢復／讀寫時接通。隔離只斷開導電連線，不斷開 BL 對感測 NMOS Gate 的控制。','無法把感測結果接回 Cell，或無法隔離大位線電容。'],\n ISO_R:['右側隔離開關','連接 BLB 與 SABLB，與 ISO_L 同步。讓內部小電容節點先感測，再接回大位線電容。','互補側無法正確隔離與恢復。'],\n OC_L:['左側交叉補償開關','預充電時 OC 已為高；補償時保持高電位，BL 持續接到 SABLB。這使 Gate 接 BL 的 N_R 形成近似 diode-connected 接法，讓元件失配轉換成可保持的位線偏壓。','補償取樣回路缺少一側。'],\n OC_R:['右側交叉補償開關','OC 在預充電及補償時為高，使 BLB 接到 SABL，使 N_L 形成近似 diode-connected 接法。OC 斷開後，位線電容保留補償偏壓。','無法建立成對的補償狀態。']\n};\nconst nodeDefs={LEAK:['保持期間的等效漏電','本例用從 Cell 通往 VPL 的等效電導示範資料衰減：Ileak = G(Vcell − VPL)。G = 0.00008 mA/V。只在漏電案例期間啟用，不代表真實漏電只有單一路徑。'],\n BL:['位線 Bit Line','本例 Cell 接在 BL。存取時與 Cell 共享電荷；之後感測器把這個小差值放大。本模型對 VSS 的等效負載為 200 fF，與 20 fF 的 Cell 形成 1:10 比例，初始共享差值約 ±45.45 mV；這是教學選值，不是 DDR5 固定規格。'],BLB:['互補位線 Complementary Bit Line','本例未選中 Cell 的另一側參考位線。BLSA 起始為 VPRE；OCSA 補償後它可能帶有補償偏壓。'],CELL:['Cell 儲存節點','1T1C 的電容上極板，20 fF。下極板 VPL 固定 0.5 V，因此 Q = Ccell(Vcell − VPL)；儲存 0 不代表電容的電荷一定為零。'],SL:['SABL：內部左感測位線','OCSA 小電容節點，等效 20 fF。ISO_L 接通才與大位線 BL 導電相連；P_L/N_L 在此驅動。'],SR:['SABLB：內部右感測位線','OCSA 的互補感測節點，等效 20 fF。ISO_R 接到 BLB；OC_L 則交叉接到 BL。'],LA:['上方感測供電軌','PMOS source 共用節點；P_EN 啟用時靠近 VINTA，偏壓時靠近 VPRE。內部名稱沿用 OCSA 文獻。'],LAB:['下方感測供電軌','NMOS source 共用節點；N_EN 啟用時靠近 VSS，偏壓時靠近 VPRE。不同文獻也使用 SAN、NLAT 等名稱。'],LIO:['局部資料線','由欄位開關與感測節點雙向交換資料。READ 建立差值，WRITE 由明確畫出的驅動對主動提供電位。等效 50 fF。'],LIOB:['互補局部資料線','和 LIO 構成差動 I/O。取樣依 LIO − LIOB 的符號判斷資料，不使用案例名稱硬編碼結果。'],VINTA:['內部陣列感測電源','教學模型設定為 1.00 V。不是宣稱外部 DDR5 VDD 必須等於 1.00 V；實際內部調節由實作決定。'],VSS:['接地參考','本模型 0 V，是電壓測量的共同基準。'],VPRE:['位線預充電基準','本例 0.50 V，取 VINTA/2。內部參考名稱，非 JEDEC 規定的外部接腳名稱。'],VPL:['Cell 下極板電壓','本例固定 0.50 V。計算 Cell 電容電荷時須使用 Vcell − VPL。'],WL:['字線 Word Line','控制存取管 M_A。模型高電位 1.50 V，低電位 0 V。升壓有助 NMOS 傳遞完整高電位；WL 不是外部 VPP 接腳。'],EQ:['位線等化／預充電控制','控制 M_EQ、M_PL、M_PR；模型高電位 1.5 V。這是內部控制訊號，不是獨立的外部 DDR5 命令。'],BIAS:['感測供電軌偏壓控制','控制 B_LA、B_LAB，在停止感測時把供電軌接回 VPRE。'],CSL:['欄位選擇 Column Select','控制 Y_L/Y_R，選出此感測器的資料。不同於外部晶片選擇 CS_n；CSL 是晶片內部解碼結果。'],SAN:['N-sense 啟用控制','控制接地 NMOS N_EN，模型高電位 1 V。SAN 為高，LAB 才會被接地開關拉低。'],SAP_n:['P-sense 低有效控制','控制 PMOS 供電管 P_EN；0 V 時導通，1 V 時關閉。'],IOEQ:['局部 I/O 預充電控制','控制 IO_PL、IO_PR，準備 LIO/LIOB。可在列仍開啟時作用，與位線 PRE 不同。'],ISO:['隔離控制','OCSA 的 ISO_L/ISO_R gate。1.5 V 接通；0 V 隔離大位線與內部感測位線。'],OC:['偏移補償控制','OCSA 的 OC_L/OC_R gate。預充電時為 1.5 V，補償時保持高電位；這兩階段均保持交叉連接。共享／預感測時降為 0 V，隔離保存的補償量。']\n};\nfunction setupCases(){$('caseCount').textContent=M.scenarios.length+' 個案例';let last='';for(const s of M.scenarios){if(s.group!==last){last=s.group;const group=document.createElement('optgroup');group.label=last;$('caseSelect').appendChild(group);}const o=document.createElement('option');o.value=s.id;o.textContent=s.name;$('caseSelect').lastElementChild.appendChild(o);}}\nfunction chip(id){return `\u003cbutton class=\"chip\" data-part=\"${id}\" style=\"color:${colors[id]||'#cad7e8'}\">${id}\u003c/button>`;}\nfunction partIds(key){const oc=mode==='ocsa',core=['N_L','N_R','P_L','P_R'];const map={release:['M_EQ','M_PL','M_PR'],oc:['ISO_L','ISO_R','OC_L','OC_R','P_EN','N_EN',...core],hold:['OC_L','OC_R','B_LA','B_LAB'],share:['M_A'],nsense:['N_EN','N_L','N_R'],psense:['P_EN','P_L','P_R'],presense:['P_EN','N_EN',...core],restore:oc?['ISO_L','ISO_R','M_A',...core]:['M_A',...core],active:['M_A',...core],iorelease:['IO_PL','IO_PR'],read:['Y_L','Y_R'],capture:['Y_L','Y_R'],readclose:['Y_L','Y_R'],ioreset:['IO_PL','IO_PR'],wdrive:['W_PL','W_PR','W_NL','W_NR'],write:['Y_L','Y_R','M_A','W_PL','W_PR','W_NL','W_NR'],wclose:['Y_L','Y_R'],wrecover:['M_A',...core],wlclose:['M_A'],saoff:['P_EN','N_EN'],equalize:['M_EQ','M_PL','M_PR','B_LA','B_LAB',...(oc?['ISO_L','ISO_R','OC_L','OC_R']:[])],standby:['M_EQ','M_PL','M_PR'],refselect:[],leak:['CELL']};return map[key]||[];}\nfunction description(st){if(st.key==='timing')return st.waitAtEntry>1e-8?'保持目前電路狀態，只等待尚未滿足的時序。計時從下列原始事件起算，不在本階段重新歸零；所有適用限制都滿足後，才繼續操作。':'從原始事件累計的時間已滿足本次門檻，不再額外等待完整的 tRCD 等間隔。本檢查顯示階段保留 0.1 ns 模型保持時間，方便單獨播放。';const bit=st.expectedBefore,oc=mode==='ocsa';return ({release:'先解除位線的短接與基準連接，讓即將出現的小電壓差不被預充電回路消除。',oc:'WL 保持關閉。ISO 從高變低，OC 延續預充電時的高電位，保持交叉連接；同時啟用 P_EN／N_EN，使 LA 上升、LAB 下降，開始取樣失配。OC 在這一步沒有新的上升緣。',hold:'斷開 OC，保留位線上的補償電位；停止感測供電並恢復供電軌偏壓，準備接入 Cell。',share:`WL 上升，M_A 導通。Cell 和 BL 的電荷重新分配；${oc?'以補償後的 BL 電位為起點，不能假設仍為 0.5 V。':'BL 只偏移一小段，還沒有完整的 0／1。'}`,nsense:'SAN 啟用使 LAB 下降。兩顆 NMOS 的電流開始分出大小，較低的位線被拉得更低；恢復也開始發生。',psense:'SAP_n 降低，LA 上升。較低位線控制對側 PMOS 提供更多上拉電流，正回授把高側拉高。',presense:'ISO 和 OC 都關閉。NMOS Gate 仍感知 BL／BLB，感測輸出在較小的 SABL／SABLB 電容上先放大。',restore:oc?'ISO 接通，把內部感測結果送回大位線。WL 仍開啟，Cell 的儲存電位也被恢復。':'保持感測器供電及 WL 開啟，讓電荷共享時被擾動的 Cell 恢復到完整儲存電位。',active:`目前列保持開啟，感測器鎖存資料。${st.op==='REF'?'刷新接著會自行關列；沒有讀出到 DQ。':'後續 READ／WRITE 還須通過從 ACT 起算的 tRCD 檢查，不需要再次 ACT。'}`,iorelease:'先關閉局部 I/O 的預充電開關，避免 VPRE 基準源抵抗接下來的資料傳遞。',read:'CSL 打開兩個欄位開關，感測器在 LIO／LIOB 上建立差動資料。WL 保持開啟。',capture:'讀出功能端點在這個階段結束時取樣 LIO − LIOB。畫面的本筆 DQ 由實際差值決定。',readclose:'欄位開關關閉。本筆取樣資料交給後級輸出；此處以功能端點表示，不模擬完整 DQS／burst。',ioreset:'將局部 I/O 拉回基準，準備下一筆資料。這不會關閉 WL，也不等同 PRE 命令。',wdrive:`寫入驅動器先建立 LIO = ${st.writeBit}、LIOB = ${1-st.writeBit} 的目標電位，欄位開關仍關閉。`,write:`CSL 接通，新資料經 I/O 到感測器，再經 WL 寫入 Cell。${bit===st.writeBit?'這次重寫相同資料，可能沒有位元翻轉，但控制動作依然發生。':'開始時可能與原本的鎖存驅動相抗，之後再生方向翻轉。'}`,wclose:'先斷開欄位開關，將完成寫入的感測器與 I/O 驅動隔離；此刻 WL 仍保持開啟。',wrecover:'寫入驅動器停止，感測器繼續維持新資料，留時間讓 Cell 充分恢復後才能關列。',wlclose:'先把 WL 拉低，切斷 Cell 和 BL 的通路。接下來位線回到半電源，Cell 才不會跟著被改寫。',saoff:'停止上拉與下拉供電。在這之後才啟用位線等化，避免直接短接仍被強力驅動的高低位線。',equalize:'EQ 同時啟用 M_EQ、M_PL、M_PR：兩線等化與接回 VPRE 共同作用。Cell 已隔離，保留先前資料。',standby:'位線已回到預充電基準，感測器停止放大。已隔離的 Cell 保存資料，等待下一次操作。',refselect:'REF 由內部刷新控制選列，接著執行感測與恢復。此動畫只展開一條代表性列，欄位 I/O 保持關閉。',leak:'以等效漏電讓 Cell 電位緩慢靠近 0.5 V。位線仍在預充電；稍後 Refresh 才重新恢復 Cell。'})[st.key]||'';}\nfunction timing(st){if(st.op==='REF')return 'JEDEC：REFab／REFsb 的忙碌時間與排程需查 tRFC 等規範。這裡展開代表性列的內部循環，未將各子步驟等同外部命令。';if(st.op==='ACT')return 'JEDEC：ACT → READ/WRITE 受 tRCD 約束；ACT → PRE 也受 tRAS 約束。內部 N/P 啟用順序依電路實作。';if(st.op==='RD')return 'JEDEC：READ 的輸出延遲、burst 與 READ → PRE 的 tRTP 另有約束。畫面的取樣時刻是教學模型，不是 CL 數值。';if(st.op[0]==='W')return 'JEDEC：WRITE 後須滿足寫入恢復及相關命令間隔。tWR 與最後寫入資料的規範參考點相關，不是從 WRITE 命令簡單計時。';if(st.op==='PRE')return 'JEDEC：PRE → 下一次 ACT 須滿足 tRP，前次 ACT → 本次 ACT 也須滿足 tRC；發出 PRE 前也必須滿足前次 ACT／READ／WRITE 的相關限制。';return '保持時間被大幅壓縮；本例不是以此模型推定 tREFI 或實際 retention time。';}\nfunction formula(st,s){const v=n=>s.v[M.ix[n]],d=st.initial,V0=d[M.ix.CELL],B0=d[M.ix.BL],qCell=.02*(v('CELL')-.5)*1000,diff=(v('BL')-v('BLB'))*1000,local=s.t-st.start;\n let eq='',val='',note='',vars='';\n const sumNode=n=>{let total=0;for(const dev of sim.list){if(dev.a===n)total-=s.j[dev.id].i;if(dev.b===n)total+=s.j[dev.id].i;}return total;};\n const k=st.key;\n if(k==='timing'){\n  eq='t\u003csub>remaining\u003c/sub> = max(0, max[t\u003csub>origin,i\u003c/sub> + T\u003csub>i\u003c/sub> − t\u003csub>now\u003c/sub>])';\n  val=timingRows(st,s.t);note='各限制平行計時，取最晚到期者；不是把 tRAS、tRTP、tWR 相加。數值為教學門檻，非晶片合規結論。';vars='tRCD／tRAS／tRC 從 ACT 起算；tRP 從 PRE；tRTP 從 READ；tRFC 從 REF；tWR 使用圖中明示的 WD_REF 教學參考事件。';\n }else if(k==='share'){\n  const target=(.2*B0+.02*V0)/.22;\n  eq='V\u003csub>share\u003c/sub> = (C\u003csub>BL\u003c/sub>V\u003csub>BL,0\u003c/sub> + C\u003csub>cell\u003c/sub>V\u003csub>cell,0\u003c/sub>) / (C\u003csub>BL\u003c/sub> + C\u003csub>cell\u003c/sub>)';\n  val=`共享終值 ≈ (200 × ${F(B0)} + 20 × ${F(V0)}) / 220 = \u003cstrong>${F(target)} V\u003c/strong>\u003cbr>現在 BL = ${F(v('BL'))} V；Cell = ${F(v('CELL'))} V\u003cbr>現在 ΔV = BL − BLB = ${F(diff,2)} mV`;\n  note='Ccell:CBL = 1:10 是用來示範小訊號的教學選值，非 JEDEC 內部電容規格。上式是隔離條件下的電荷共享終值；動畫使用 C·dV/dt = I 持續更新過渡。OCSA 必須代入補償後的起始位線電位。';vars='C 用 fF；VBL,0 與 Vcell,0 是本階段開始前的實際值。Cell 下極板電位固定，故共享式中的常數項相消。';\n }else if(k==='oc'||k==='hold'){\n  eq='ΔV\u003csub>comp\u003c/sub> = V\u003csub>BLB\u003c/sub> − V\u003csub>BL\u003c/sub>\u003cbr>I\u003csub>P,L\u003c/sub> − I\u003csub>N,L\u003c/sub> + I\u003csub>ISO,L\u003c/sub> + I\u003csub>OC,R\u003c/sub> = C\u003csub>SABL\u003c/sub> · dV\u003csub>SABL\u003c/sub>/dt';\n  val=`ΔVT,N = 0.306 − 0.294 = 12 mV\u003cbr>現在 ΔVcomp = \u003cstrong>${F(-diff,2)} mV\u003c/strong>\u003cbr>IOC,L = ${F(s.j.OC_L.i*1000,2)} µA；IOC,R = ${F(s.j.OC_R.i*1000,2)} µA`;\n  note=k==='oc'?'OC 將 NMOS 的 Gate 與 Drain 交叉接合。電流平衡建立補償偏壓；由完整回路求解，不把 ΔVcomp 強制設成 ΔVT。':'OC 斷開後，位線電容保持補償電荷。此模型仍包含控制切換期間的有限導通，但忽略 clock feedthrough。';vars='電流正方向以元件說明的 A→B 為準；補償量包含 PMOS 回授及偏壓影響。';\n }else if(['nsense','psense','presense'].includes(k)){\n  const l=mode==='ocsa'?'SL':'BL',r=mode==='ocsa'?'SR':'BLB',il=sumNode(l),ir=sumNode(r);\n  eq='C\u003csub>L\u003c/sub> dV\u003csub>L\u003c/sub>/dt = ΣI\u003csub>L,in\u003c/sub> − ΣI\u003csub>L,out\u003c/sub>\u003cbr>C\u003csub>R\u003c/sub> dV\u003csub>R\u003c/sub>/dt = ΣI\u003csub>R,in\u003c/sub> − ΣI\u003csub>R,out\u003c/sub>';\n  val=`左側淨電流 = ${F(il*1000,2)} µA；右側 = ${F(ir*1000,2)} µA\u003cbr>dVL/dt = ${F(il/M.C[l],3)} V/ns；dVR/dt = ${F(ir/M.C[r],3)} V/ns\u003cbr>輸出差值 VL − VR = \u003cstrong>${F((v(l)-v(r))*1000,2)} mV\u003c/strong>`;\n  note= k==='nsense'?'先比較兩顆 NMOS 的 VGS 與 VT，電流稍強的一側下降較快。小差值被正回授放大；點 N_L／N_R 可看各自的工作區與電流。': k==='presense'?'ISO 斷開，感測輸出主要充放電的是 20 fF 局部電容。BL／BLB 控制 NMOS Gate；不要把它們與 SABL／SABLB 混成同一節點。':'PMOS 的 VSG 由另一側電位決定。低側更低使高側上拉更強，形成再生；接近電源端時電流逐漸變小。';\n  vars='核心 MOS：Vov > 0 時，線性區 I = β(Vov·VDS − VDS²/2)；飽和區 I = βVov²/2。PMOS 改用 VSG、VSD。';\n }else if(['restore','active','wrecover','wlclose','standby'].includes(k)){\n  eq='Q\u003csub>cell\u003c/sub> = C\u003csub>cell\u003c/sub>(V\u003csub>cell\u003c/sub> − V\u003csub>PL\u003c/sub>)\u003cbr>C\u003csub>cell\u003c/sub> · dV\u003csub>cell\u003c/sub>/dt = I\u003csub>M_A\u003c/sub>';\n  val=`Qcell = 20 × (${F(v('CELL'))} − 0.500) = \u003cstrong>${F(qCell,2)} fC\u003c/strong>\u003cbr>IM_A = ${F(s.j.M_A.i*1000,3)} µA\u003cbr>Vcell = ${F(v('CELL'),4)} V；WL = ${F(s.g.WL,2)} V`;\n  note=k==='wlclose'||k==='standby'?'M_A 截止後，理想保持模型中 I≈0，Cell 電位不再跟隨 BL。儲存 0 的電容電荷也不一定為零，因下極板在 0.5 V。':'恢復與感測在實際電路上重疊；這一階段保留充足時間使 Cell 靠近完整儲存電位。恢復不是額外的外部 WRITE 命令。';vars='正的 IM_A 定義為 BL → Cell；1 fF × 1 V = 1 fC。';\n }else if(['read','capture','readclose'].includes(k)){\n  const dio=(v('LIO')-v('LIOB'))*1000;\n  eq='ΔV\u003csub>IO\u003c/sub> = V\u003csub>LIO\u003c/sub> − V\u003csub>LIOB\u003c/sub>\u003cbr>D\u003csub>sample\u003c/sub> = 1（ΔV\u003csub>IO\u003c/sub> &gt; +10 mV）\u003cbr>= 0（ΔV\u003csub>IO\u003c/sub> &lt; −10 mV）；其餘為 X';\n  val=`ΔVIO = (${F(v('LIO'))} − ${F(v('LIOB'))}) × 1000\u003cbr>= \u003cstrong>${F(dio,2)} mV\u003c/strong>\u003cbr>本筆資料：${k==='capture'&&local\u003cst.duration?'正在建立，階段結束取樣':s.dq===null?'尚未取樣':s.dq}；CSL = ${F(s.g.CSL,2)} V`;\n  note='取樣前須有足夠差動裕量；動畫沒有把案例名稱當成輸出。LIO 與 DQ 之間的讀出、序列化與外部驅動以功能端點表示。';vars='X＝差值不足，無法可靠判定；±10 mV 是教學判讀門檻，不是 JEDEC 規格或特定接收器的實測靈敏度。此處未含實際接收器偏移與雜訊。';\n }else if(['wdrive','write','wclose'].includes(k)){\n  eq='C\u003csub>cell\u003c/sub> · dV\u003csub>cell\u003c/sub>/dt = I\u003csub>M_A\u003c/sub>\u003cbr>C\u003csub>IO\u003c/sub> · dV\u003csub>LIO\u003c/sub>/dt = I\u003csub>W_PL\u003c/sub> − I\u003csub>W_NL\u003c/sub> + I\u003csub>Y_L\u003c/sub> − I\u003csub>IO_PL\u003c/sub>';\n  val=`寫入目標：\u003cstrong>${st.writeBit}\u003c/strong>；目前 Cell = ${F(v('CELL'),4)} V\u003cbr>LIO = ${F(v('LIO'))} V；LIOB = ${F(v('LIOB'))} V\u003cbr>IW_PL = ${F(s.j.W_PL.i*1000,2)} µA；IW_NL = ${F(s.j.W_NL.i*1000,2)} µA`;\n  note='WRITE 初期，驅動器可能與舊的鎖存狀態競爭。模型保留雙方電流；穩態同值重寫時，開關導通不代表持續有大電流。';vars='寫入驅動與欄位開關的強度必須足以改變感測器狀態；本模型的尺寸為示範值。';\n }else if(['equalize','release','saoff'].includes(k)){\n  eq='C\u003csub>BL\u003c/sub> · dV\u003csub>BL\u003c/sub>/dt = ΣI\u003csub>BL,net\u003c/sub>\u003cbr>等化目標：V\u003csub>BL\u003c/sub> = V\u003csub>BLB\u003c/sub> = V\u003csub>PRE\u003c/sub>';\n  val=`BL = ${F(v('BL'))} V；BLB = ${F(v('BLB'))} V\u003cbr>ΔV = \u003cstrong>${F(diff,2)} mV\u003c/strong>\u003cbr>IM_EQ（BL createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;parent.appendChild(e);return e;}\nfunction wire(points,parent=$('circuit'),cls='wire'){return svgEl('path',{d:points.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' '),class:cls},undefined,parent);}\nfunction text(x,y,t,attrs={},parent=$('circuit')){return svgEl('text',{x,y,...attrs},t,parent);}\nfunction dot(x,y){svgEl('circle',{cx:x,cy:y,r:4,class:'junction'});}\nfunction tagNode(x,y,name,anchor='middle',value=false){const display={SL:'SABL',SR:'SABLB',CELL:'Cell'}[name]||name;const g=svgEl('g',{'data-part':name,role:'button',tabindex:'0','aria-label':display+' 節點說明'});svgEl('rect',{x:anchor==='start'?x-5:anchor==='end'?x-110:x-55,y:y-22,width:110,height:value?48:28,fill:'#000'},undefined,g);text(x,y,display,{'text-anchor':anchor,class:'nodename'},g);if(value){const el=text(x,y+23,'',{'text-anchor':anchor,class:'smalltext'},g);(nodeValues[name]??=[]).push(el);}return g;}\nfunction drawDevice(id,x,y,horizontal=false,gateSide=1,labelBelow=false){\n const d=sim.list.find(d=>d.id===id);if(!d)return;\n const core=['P_L','P_R','N_L','N_R'].includes(id),sw=symbol==='switch'&&!core;\n const g=svgEl('g',{class:'part','data-part':id,role:'button',tabindex:'0','aria-label':id+'：'+defs[id][0],transform:`translate(${x} ${y})`});\n const hit=svgEl('rect',{x:horizontal?-52:-38,y:-43,width:horizontal?104:112,height:88,rx:6,class:'hit'},undefined,g);\n const vgroup=svgEl('g',{transform:horizontal?'rotate(-90)':''},undefined,g);\n let arm=null;\n if(sw){wire([[0,-30],[0,-19]],vgroup,'device');wire([[0,19],[0,30]],vgroup,'device');svgEl('circle',{cx:0,cy:-19,r:3.5,class:'contact'},undefined,vgroup);svgEl('circle',{cx:0,cy:19,r:3.5,class:'contact'},undefined,vgroup);arm=wire([[0,-19],[-18,14]],vgroup,'device');wire([[28,0],[8,0]],vgroup,'gatewire').setAttribute('stroke-dasharray','3 4');}\n else{\n  const dx=gateSide*8,gt=gateSide*23;wire([[0,-30],[0,-21],[dx,-21]],vg t teachingSlots={\n P_L:[216,350,170,70,400,375],P_R:[732,350,170,70,700,375],\n N_L:[216,525,170,70,400,555],N_R:[732,525,170,70,700,555],\n M_A:[12,310,180,82,130,430],CELL:[244,682,230,80,60,560],\n M_EQ:[625,91,235,80,550,180],M_PL:[240,80,255,80,200,110],\n N_EN:[605,670,252,82,550,680],P_EN:[635,234,255,80,550,275],\n Y_L:[1150,325,300,88,1300,180],Y_R:[1150,670,300,80,1300,550],\n W_PL:[1150,325,300,88,1520,118],W_NL:[1150,325,300,88,1520,242],\n IO_PL:[1150,325,300,88,1403,242],OC_L:[450,685,290,80,300,844],\n ISO_L:[225,680,280,82,300,480],LA:[635,234,255,80,550,335]\n};\nfunction teachingData(st,s){\n const v=n=>s.v[M.ix[n]],fmt=x=>F(x,3),oc=mode==='ocsa';\n const cell=fmt(v('CELL')),share=(.2*st.initial[M.ix.BL]+.02*st.initial[M.ix.CELL])/.22;\n const item=(id,title,short,live,paragraphs,eq='')=>({id,title,short,live,paragraphs,eq});\n const overview='BLSA 像敏感的蹺蹺板：先讓 BL／BLB 平衡，Cell 給出微小差值，再由有電源供應的正回授放大成高、低電位。它是電壓差感測電路；絕對電位仍影響 MOS 能否正常工作。';\n const restore='電荷共享會改變 Cell 原本的儲存電位，因此 DRAM 讀取具有破壞性。感測放大的同時就開始恢復；後續保持 WL 與感測供電，才讓儲存 1 接近高電位、儲存 0 接近低電位。';\n const refresh=st.op==='REF'?'本次是 REF：列由內部刷新控制選取，CSL 全程關閉，恢復後自行關列。動畫只展開一條代表性列，沒有把資料送到 DQ，也不代表對外發出 ACT／PRE 命令。':'';\n if(['nsense','psense','presense'].includes(st.key))return ['N_L','N_R','P_L','P_R'].map(id=>{\n  const d=sim.list.find(d=>d.id===id),j=s.j[id],isN=d.type==='n',drive=j.over+d.vt,on=j.over>0,other=id.endsWith('L')?'右':'左';\n  const gate=({SL:'SABL',SR:'SABLB'}[d.gate]||d.gate);\n  let explanation=isN?`Gate 接 ${gate}，${gate} 與下方 LAB 的電位差決定它能否汲取電流。對側 Gate 電位較高的一管通常下拉較強，使低側更低；另一管因 Gate 降低而逐漸截止。`: `Gate 接${other}側 ${gate}。Gate 越低，VSG 越大，這一側 PMOS 越容易提供上拉電流。現在 ${drive.toFixed(3)} V ${on?'>':'≤'} |VT| = ${d.vt.toFixed(3)} V，因此${on?'具備導通條件':'截止'}。`;\n  const pEarly=st.key==='nsense'&&!isN;\n  if(pEarly)explanation+=' 此刻 P_EN 尚未啟用，但 LA 不是零電位：模型的 40 fF 供電軌電容先前保留約 0.5 V。若 VSG 足夠，這顆 PMOS 仍可能從 LA 暫存電荷取得短暫電流；這不是 VINTA 已接通。';\n  const nDetail=st.key==='nsense'?'本模型快速降低 LAB，因此兩顆 NMOS 可先一起導通，之後才分出強弱、其中一管截止；不表示三顆管子全程同時工作。N 先 P 後是本例啟用方式，實際延遲及重疊取決於電路設計。':'';\n  const read0='例如讀 0：BL 起始較低 → N_L 的 Gate（BLB）較高 → N_L 較強 → BL 再降 → N_R 逐漸截止。之後 P_R 因 Gate＝BL 降低而導通，P_L 則因 Gate＝BLB 較高而截止。讀 1 時左右角色對調。';\n  return item(id,id+' · '+j.region,on?(pEarly?(Math.abs(j.i)>.000025?'LA 暫存電荷參與':'導通但電流極小'):'已具備導通條件'):'閘源電壓不足',`${isN?'VGS':'VSG'} ${fmt(drive)} V`,[overview,explanation,nDetail,oc?'ISO 關閉時，NMOS Gate 仍接 BL／BLB；PMOS Gate 則接 SABL／SABLB。大位線與內部感測節點不可混為一談。':read0,refresh,'顏色表示過驅電壓超過 1 mV 的顯示門檻；電流箭頭表示 |I| > 0.025 µA。已導通也可能近乎無電流；標籤邊框沿用元件識別色，不表示元件一定正在導通。'].filter(Boolean),`${isN?'VGS = VG − min(VA, VB)':'VSG = max(VA, VB) − VG'} = ${fmt(drive)} V\\nVov = ${fmt(drive)} − ${fmt(d.vt)} = ${fmt(j.over)} V\\nI (${d.a} → ${d.b}) = ${F(j.i*1000,3)} µA\\nLA = ${fmt(v('LA'))} V；LAB = ${fmt(v('LAB'))} V`);\n });\n const tables={\n release:[item('M_EQ','釋放預充電','先拿掉蹺蹺板的支撐',`EQ = ${fmt(s.g.EQ)} V`,[overview,'EQ 降低，使 M_EQ、M_PL、M_PR 關閉；WL 尚未開啟。BL／BLB 的電位暫由電容保留，之後才接入 Cell。若仍接在 VPRE，小差值會被预充電回路抹去。','這裡的浮接是指沒有預充電源主動箝住；仍存在電容及其他元件連接。'], '起始 BL ≈ BLB ≈ VPRE = 0.500 V'),item('M_A','Cell 仍被隔離','小砝碼還沒有放上去',`WL = ${fmt(s.g.WL)} V`,['存取管 M_A 的 Gate 由 WL 控制。目前保持關閉，先讓位線準備好。','BLB 是這次讀取的參考支路，沒有連接本次選中的 Cell；不代表實體 BLB 上永遠沒有其他 Cell。'])],\n share:[item('M_A','WL 開啟／共享','小水杯接上大水桶',`WL = ${fmt(s.g.WL)} V`,['WL 升高，使 M_A 接通 Cell 與 BL。儲存 1 時 BL 上升一點，儲存 0 時 BL 下降一點。BLB 在這個共享模型中不參與選中 Cell 的電荷重分配。','20 fF : 200 fF = 1:10 是教學選值。從 0.5 V 起算：存 1 為 (200×0.5+20×1)/220 ≈ 0.545 V；存 0 為 (200×0.5+20×0)/220 ≈ 0.455 V。BL 只變動約 ±45.45 mV；弱訊號、OCSA 補償後的初值會不同。','模型 WL 高位為 1.5 V，高於陣列電源 1.0 V。NMOS 要傳遞高位，需保留足夠的 VGS；升壓 WL 有助避免高位受臨界電壓限制。WL 是內部字線，不等同外部 VPP 接腳，實際電位由設計決定。'],`Vshare = (CBL·VBL,初 + Ccell·Vcell,初)/(CBL+Ccell)\\n= (200×${fmt(st.initial[M.ix.BL])}+20×${fmt(st.initial[M.ix.CELL])})/220\\n= ${fmt(share)} V\\n目前 ΔV = BL − BLB = ${F((v('BL')-v('BLB'))*1000,2)} mV`),item('CELL','破壞性讀取','共享會改變 Cell 電位',`Cell = ${cell} V`,[restore,'蹺蹺板的微小傾斜是電壓差；再生所需能量來自感測電源，不是 Cell 的小電荷自己憑空放大。'],`Qcell = Ccell·(Vcell − VPL)\\n= 20 fF × (${cell} − 0.500) V`)],\n restore:[item(oc?'ISO_L':'M_A','恢復 Cell','保持連接，補足高／低位',`Cell = ${cell} V`,[restore,oc?'ISO 接回位線，把內部 SABL／SABLB 的感測結果送到大位線，再經 M_A 恢復 Cell。':'WL 仍開啟，感測器持續驅動 BL。沒有新的控制邊緣，不代表恢復已停止。','tRAS 是 ACT 到 PRE 的最小時間，包含感測、恢復等需求，不等於本動畫單獨的 Restore 段。太早關閉 WL，Cell 可能未充分恢復。',refresh].filter(Boolean),'Icell = Ccell·dVcell/dt\\nACT → PRE ≥ tRAS')],\n active:[item('M_A','列保持開啟','SA 保存資料，Cell 仍連接',`WL = ${fmt(s.g.WL)} V`,['SA 的正回授維持高、低兩側，形成列緩衝器的鎖存狀態。同一列可再 READ／WRITE，不必每筆重新 ACT。','READ／WRITE 還須滿足從 ACT 起算的 tRCD 及其他命令時序，不能只看到感測完成就立即發命令。',refresh].filter(Boolean),'tREAD/WRITE − tACT ≥ tRCD'),item('Y_L',refresh?'刷新不輸出 DQ':'欄位 I/O 等候命令',refresh?'CSL 全程關閉':'READ 選出鎖存資料',`CSL = ${fmt(s.g.CSL)} V`,[refresh||'READ 開啟欄位通路，把感測器資料送到 LIO／LIOB。WRITE 則由寫入驅動器提供新電位，經相同通路改寫 SA 和 Cell。','這裡只畫讀出功能端點，沒有展開完整 DDR5 burst／DQS 輸出鏈。'])],\n wlclose:[item('M_A','先關 WL','讓 Cell 保留恢復後的資料',`WL = ${fmt(s.g.WL)} V`,['M_A 先截止，把 Cell 與 BL 隔離。接著 BL／BLB 才能回到半電源。若 Cell 還連著，它也會跟著趨近 0.5 V，破壞儲存狀態。','這是本模型的 PRE 內部順序；對外 PRE 命令啟動一串內部動作，不是外部控制器逐顆切換開關。',refresh].filter(Boolean),`Cell = ${cell} V；BL 隨後回到 0.500 V`)],\n saoff:[item('P_EN','停止上拉供電','先讓強驅動退出',`SAP_n = ${fmt(s.g.SAP_n)} V`,['SAP_n 拉高，P_EN 關閉；SAN 拉低，N_EN 關閉。供電開關停止驅動，不等於所有感測管立刻截止。','本模型先停用供電再等化，避免等化回路連接仍被強力上拉／下拉的兩線而產生不必要的貫通電流。']),item('N_EN','停止下拉供電','N_EN 由 SAN 控制',`SAN = ${fmt(s.g.SAN)} V`,['下拉供電切斷後，BL／BLB 電位暫由電容保留。下一步將兩線拉回共同基準。'])],\n equalize:[item('M_EQ','等化兩條位線','蹺蹺板回到平衡位置',`ΔV = ${F((v('BL')-v('BLB'))*1000,2)} mV`,[overview,'EQ 同時啟用 M_EQ、M_PL、M_PR。M_EQ 提供兩線間電荷交換路徑，另兩顆管子同時接回 VPRE；不是先等化完才開始預充電。','此刻 WL 已關閉，所以位線變成 0.5 V 不會把 Cell 也改成 0.5 V。',refresh].filter(Boolean),'BL → VPRE；BLB → VPRE\\nΔV → 0；VPRE = 0.500 V')],\n standby:[item('M_PL','預充電待機','兩端等高，等下次選列',`BL = ${fmt(v('BL'))} V`,[overview,'M_PL／M_PR 接到 VPRE，M_EQ 等化兩線。P_EN／N_EN 停用感測驅動，供電軌由偏壓回路準備；Cell 隔離保存資料。','兩線比較可以降低共同擾動的影響，但失配與差動雜訊仍可能造成誤判。BLB 是參考支路，不代表其絕對電位不重要。',refresh].filter(Boolean),'BL ≈ BLB ≈ VINTA/2；WL = 0')],\n refselect:[item('M_A','內部選擇刷新列','恢復資料，不開 CSL',`Cell = ${cell} V`,[refresh,'功能上會經過共享、感測、恢復，再關列及預充電。沒有外部 READ，仍然必須把 key);\n $('senseGateLinks').querySelector('.sense-rail').style.display=sensing?'':'none';\n if(leakGroup){leakGroup.style.display=st.key==='leak'?'':'none';leakGroup.style.color=colors.CELL;}\n for(const [id,p]of Object.entries(viewParts)){\n  const j=s.j[id],active=j.over>.001,current=Math.abs(j.i)>.000025,changing=current||(Math.abs(st.endG[p.d.gate.slice(1)]-st.startG[p.d.gate.slice(1)])>.1 &&s.t-st.start\u003c.45),c=active?colors[id]:'#f4f7fc';\n  p.g.style.color=c;p.g.setAttribute('class','part'+(active?' active':'')+(changing?' changing':''));\n  if(p.gateState){p.gateState.style.display=sensing?'':'none';p.gateState.textContent='VGS '+F(j.vg-Math.min(j.a,j.b),3)+' V';}\n  if(p.arm)p.arm.setAttribute('d',active?'M0 -19L0 19':'M0 -19L-18 14');\n  p.arrow.style.display=current?'':'none';\n  if(current){let q=(s.t*.9)%1;const pos=-17+q*34,dir=Math.sign(j.i)*(['M_A','M_PL','M_PR','ISO_R'].includes(id)?-1:1); // Account for devices drawn opposite to netlist A→B orientation.\n   if(p.horizontal){const x=dir*pos;p.arrow.setAttribute('d',`M${x-dir*12} 17 L${x+dir*7} 17 M${x} 11 L${x+dir*7} 17 L${x} 23`);}else{const y=15+q*4,x=-p.gateSide*25;p.arrow.setAttribute('d',`M${x} ${y-dir*12} L${x} ${y+dir*7} M${x-6} ${y} L${x} ${y+dir*7} L${x+6} ${y}`);}}\n }\n for(const [n,els]of Object.entries(nodeValues))for(const el of els)el.textContent=F(s.v[M.ix[n]])+' V';\n}\nfunction drawWaves(){const svg=$('wave');svg.innerHTML='';const W=Math.max(600,svg.clientWidth||1260),H=Math.max(180,svg.clientHeight||200);const signals=['WL','EQ','SAN','SAP_n','CSL',...(mode==='ocsa'?['ISO','OC']:[])];const vh=Math.max(30,H-signals.length*14-34);waveLayout={left:54,width:W-66};svg.setAttribute('viewBox',`0 0 ${W} ${H}`);const x=t=>54+t/sim.total*(W-66),y=v=>20+vh-v*vh;\n for(const v of [0,.5,1]){svgEl('line',{x1:54,y1:y(v),x2:W-12,y2:y(v),stroke:'#263241','stroke-dasharray':'4 5'},undefined,svg);text(12,y(v)+4,F(v,1)+' V',{},svg);}\n for(let i=0;i\u003c=5;i++){const t=sim.total*i/5;svgEl('line',{x1:x(t),y1:22,x2:x(t),y2:H-3,stroke:'#182230'},undefined,svg);text(x(t),16,F(t,0)+' ns',{'text-anchor':'middle'},svg);}\n for(const n of ['BL','BLB','CELL',...(mode==='ocsa'?['SL','SR']:[])]){\n const stride=Math.max(1,Math.floor(sim.samples.length/1100)),samples=sim.samples.filter((_,i)=>i%stride===0);if(samples.at(-1)!==sim.samples.at(-1))samples.push(sim.samples.at(-1));\n svgEl('path',{d:samples.map((s,i)=>(i?'L':'M')+F(x(s.t),1)+' '+F(y(s.v[M.ix[n]]),1)).join(' '),fill:'none',stroke:colors[n],opacity:n==='SL'||n==='SR'?.65:1,'stroke-width':n==='SL'||n==='SR'?1.3:2,'stroke-dasharray':n==='SL'||n==='SR'?'5 4':'none'},undefined,svg);\n }\n for(let j=0;j\u003csignals.length;j++){const n=signals[j],base=vh+36+j*14; text(12,base+2,n,{},svg);let d='';const stride=Math.max(1,Math.floor(sim.samples.length/1000));for(let i=0;i\u003csim.samples.length;i+=stride){const s=sim.samples[i],high=s.g[n]>.5;d+=(i?'L':'M')+F(x(s.t),1)+' '+(base-(high?9:0));}svgEl('path',{d,fill:'none',stroke:n==='WL'?colors.M_A:'#849fba','stroke-width':1.2},undefined,svg);}\n waveCursor=svgEl('line',{x1:54,y1:20,x2:54,y2:H-3,stroke:'#fff','stroke-width':1.4},undefined,svg);\n}\nlet localScopeCache=null;\nfunction drawLocalWaves(){\n if(!sim||!state||!document.body.classList.contains('focus-circuit'))return;\n const scopeStage=M.sampleAt(sim,time).stage;\n const svg=$('localWave'),st=sim.stages[scopeStage],W=svg.clientWidth,H=svg.clientHeight;\n if(W\u003c=0||H\u003c=0)return;\n const left=44,right=W-10,top=24,voltageHeight=110;\n const span=Math.max(st.duration,.001),start=Math.max(0,st.start-span*.15),end=Math.min(sim.total,st.end+span*.15);\n const x=t=>left+(t-start)/(end-start)*(right-left),y=v=>top+(1-v)*voltageHeight;\n if(!localScopeCache||localScopeCache.sim!==sim||localScopeCache.stage!==scopeStage||localScopeCache.W!==W||localScopeCache.H!==H){\n  svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${W} ${H}`);\n  svg.dataset.start=String(start);svg.dataset.end=String(end);svg.dataset.stage=String(scopeStage);\n  const defs=svgEl('defs',{},undefined,svg),clip=svgEl('clipPath',{id:'localScopeClip',clipPathUnits:'userSpaceOnUse'},undefined,defs);\n  const reveal=svgEl('rect',{x:left,y:top-2,width:0,height:H-top+2},undefined,clip);\n  svgEl('rect',{x:x(st.start),y:top,width:x(st.end)-x(st.start),height:H-top-6,fill:'#102231'},undefined,svg);\n  for(const v of [0,.5,1]){\n   svgEl('line',{x1:left,y1:y(v),x2:right,y2:y(v),stroke:'#314255','stroke-dasharray':'3 4'},undefined,svg);\n   text(2,y(v)+3,F(v,1)+' V',{},svg);\n  }\n  for(const [t,anchor] of [[start,'start'],[(start+end)/2,'middle'],[end,'end']]){\n   text(x(t),13,F(t,1),{'text-anchor':anchor},svg);\n   svgEl('line',{x1:x(t),y1:top,x2:x(t),y2:H-6,stroke:'#223344'},undefined,svg);\n  }\n  const samples=[M.sampleAt(sim,start),...sim.samples.filter(s=>s.t>start&&s.t\u003cend),M.sampleAt(sim,end)];\n  const traces=svgEl('g',{'clip-path':'url(#localScopeClip)'},undefined,svg);\n  for(const n of ['BL','BLB','CELL',...(mode==='ocsa'?['SL','SR']:[])]){\n   svgEl('path',{'data-signal':n,d:samples.map((s,i)=>(i?'L':'M')+F(x(s.t),2)+' '+F(y(s.v[M.ix[n]]),2)).join(' '),fill:'none',stroke:colors[n],'stroke-width':1.6,'stroke-dasharray':n==='SL'||n==='SR'?'4 3':'none'},undefined,traces);\n  }\n  const signals=['WL','EQ','SAN','SAP_n','CSL',...(mode==='ocsa'?['ISO','OC']:[])];\n  signals.forEach((n,j)=>{\n   const base=160+j*19;\n   text(2,base+3,n,{},svg);\n   svgEl('line',{x1:left,y1:base,x2:right,y2:base,stroke:'#1c2a39'},undefined,svg);\n   let d='';\n   samples.forEach((s,i)=>{const px=F(x(s.t),2),py=base-(s.g[n]>.5?10:0);d+=i?` H${px} V${py}`:`M${px} ${py}`;});\n   svgEl('path',{'data-signal':n,d,fill:'none',stroke:n==='WL'?colors.M_A:'#9eb9d2','stroke-width':1.3},undefined,traces);\n  });\n  const cursor=svgEl('line',{'data-cursor':'current',x1:left,x2:left,y1:top-2,y2:H-6,stroke:'#fff','stroke-width':1.5},undefined,svg);\n  localScopeCache={sim,stage:scopeStage,W,H,reveal,cursor};\n  $('localScopeStage').textContent=st.op+' · '+st.title;\n  $('localSenseLegend').hidden=mode!=='ocsa';\n }\n const currentX=x(time);\n localScopeCache.reveal.setAttribute('width',Math.max(0,currentX-left));\n localScopeCache.cursor.setAttribute('x1',currentX);localScopeCache.cursor.setAttribute('x2',currentX);\n $('localScopeTime').textContent=F(time,2)+' ns';\n svg.setAttribute('aria-label',st.title+'，目前 '+F(time,2)+' ns，顯示 '+F(start,2)+' 至 '+F(end,2)+' ns');\n}\nconst stageReasons={\n timing:'各時序從原始事件持續計時；只補足剩餘時間，多項限制取最晚到期者。',\n release:'先移除預充電與短接，Cell 造成的小電壓差才不會被抹平。',\n oc:'先量到感測管本身的失配，避免稍後把元件偏差當成 Cell 資料。',\n hold:'保留補償電荷，讓接下來的 Cell 訊號建立在已校正的起點。',\n share:'Cell 太小，無法直接驅動外部資料線；先把資料轉成 BL 的微小電壓差。',\n nsense:'先放大兩條位線的差異，讓低側下降。初期兩顆 NMOS 都可能導通，之後才逐漸分出強弱。',\n psense:'把高側補到接近電源電位，形成穩定的 0／1，並補回 Cell 被共享帶走的電荷。',\n presense:'先驅動較小的 SABL／SABLB 電容，減輕大位線的負擔；NMOS 的 Gate 仍接 BL／BLB。',\n restore:'讀取時的電荷共享會擾動 Cell；必須把感測結果寫回，才能保住原資料。',\n active:'保持感測器鎖存，讓同一列可以接著讀寫，或讓刷新進入關列流程。',\n iorelease:'避免 I/O 預充電源把即將出現的資料差值拉回中間電位。',\n read:'把已感測的資料傳到局部 I/O，而不是讓小 Cell 直接推動輸出。',\n capture:'等 I/O 差值建立後才判讀，降低在過渡期間取到錯誤結果的風險。',\n readclose:'完成傳遞後隔離 I/O，讓感測器繼續保存列資料。',\n ioreset:'清掉上一次 I/O 的殘留資料，準備下一筆傳遞。',\n wdrive:'先在 I/O 建立新資料，再接上感測器，才能明確控制寫入方向。',\n write:'寫入驅動器必須改變舊鎖存狀態，再透過仍開啟的 WL 改寫 Cell。',\n wclose:'先斷開 I/O，讓感測器單獨維持新資料。',\n wrecover:'給 Cell 足夠時間充放電，避免太早關閉 WL 而只存到半套資料。',\n wlclose:'先隔離 Cell，後續把位線拉回中間電位時才不會破壞資料。',\n saoff:'先停止強力上拉／下拉，再等化兩條位線，避免它們互相對抗。',\n equalize:'讓下一次 Cell 訊號從相同的位線基準開始，避免殘留電位影響判讀。',\n standby:'位線準備好下一次操作，已隔離的 Cell 自行保存電荷。',\n refselect:'刷新要先選出待恢復的列，再進行內部感測；不需要對外輸出 DQ。',\n leak:'用等效漏電示範保持期間的電荷流失，說明為什麼需要週期性刷新。'\n};\nfunction drawStageBrief(s=state){\n if(!sim||!s||!document.body.classList.contains('focus-circuit'))return;\n const st=sim.stages[s.stage],nodeName=n=>({SL:'SABL',SR:'SABLB',CELL:'Cell'}[n]||n);\n $('briefCount').textContent=(s.stage+1)+' / '+sim.stages.length;\n $('briefStage').textContent=st.op+' · '+st.title;\n $('briefWhat').textContent=st.key==='nsense'?'SAN 拉高，透過 N_EN 把共用下方節點 LAB 拉低；N_L／N_R 的 VGS 隨之增加。':description(st);\n $('briefWhy').textContent=stageReasons[st.key]||'讓下一個操作在穩定的電路狀態下開始。';\n $('briefWiring').textContent=mode==='blsa'?'Gate 接法：BLB 同時接 P_L、N_L；BL 同時接 P_R、N_R。':'左側 Gate：P_L 接 SABLB，N_L 接 BLB；ISO 關閉時，這兩個節點仍分開。右側為對稱接法。';\n if(['nsense','presense','oc'].includes(st.key)){\n  const cards=['N_L','N_R'].map(id=>{\n   const d=sim.list.find(d=>d.id===id),j=s.j[id],source=j.a\u003c=j.b?d.a:d.b,vgs=j.vg-Math.min(j.a,j.b);\n   return `\u003cdiv data-gate-device=\"${id}\" title=\"Gate ${F(j.vg,3)} V；Source ${nodeName(source)} ${F(Math.min(j.a,j.b),3)} V\">\u003cstrong style=\"color:${colors[id]}\">${id} · ${j.region}\u003c/strong>\u003cspan>Gate ← ${nodeName(d.gate)}\u003c/span>\u003cspan>VGS ${F(vgs,3)} V\u003c/span>\u003cspan>VT ${F(d.vt,3)} V\u003c/span>\u003c/div>`;\n  }).join('');\n  $('briefTrigger').innerHTML=`\u003cdiv class=\"sense-chain\">SAN ${F(s.g.SAN,2)} V → N_EN ${s.j.N_EN.region}\u003cbr>LAB ${F(s.v[M.ix.LAB],3)} V → 改變兩管的 VGS\u003c/div>\u003cdiv class=\"gate-comparison\">${cards}\u003c/div>\u003cp class=\"brief-note\">VGS = Gate − Source；超過 VT 才開始導通。Gate 已畫實線連接；實心點相接，跨線弧不相接。\u003c/p>`;\n }else{\n  const changes=Object.keys(st.endG).filter(k=>st.endG[k]!==st.startG[k]);\n  $('briefTrigger').innerHTML=changes.length?`\u003cdiv class=\"sense-chain\">${changes.slice(0,3).map(k=>`${k}：${F(st.startG[k],1)} → ${F(st.endG[k],1)} V（現在 ${F(s.g[k],2)}）`).join('\u003cbr>')}\u003c/div>`:'';\n }\n if(st.key==='timing')$('briefTrigger').innerHTML=timingRows(st,s.t);\n const currents=['BL','BLB'].map(n=>({n,i:capacitorCurrent(s,n)}));\n if(!$('briefCaps').children.length)$('briefCaps').innerHTML=currents.map(({n})=>`\u003cbutton class=\"brief-cap-row\" data-part=\"${n}\">\u003cspan>\u003c/span>\u003cstrong style=\"color:${colors[n]}\">\u003c/strong>\u003c/button>`).join('');\n currents.forEach(({n,i},index)=>{const row=$('briefCaps').children[index];row.title=`dV/dt = ${F(i/M.C[n]*1000,2)} mV/ns`;row.firstElementChild.textContent=(n==='BL'?'CBL':'CBLB')+' · '+capacitorState(i);row.lastElementChild.textContent=(i>0?'+':'')+F(i*1000,3)+' µA';});\n const bothDischarge=currents.every(c=>c.i\u003c-.000001);\n $('briefCapWhy').textContent=(bothDischarge?'此刻兩邊都在放電，所以都會亮。':'亮起表示有淨充放電電流，不是電容被「開啟」。')+' 這裡＋表示淨流入、電壓上升；−表示淨流出、電壓下降。';\n let ids=partIds(st.key).filter(id=>s.j[id]);\n if(ids.length>5)ids=ids.slice().sort((a,b)=>Math.abs(s.j[b].i)-Math.abs(s.j[a].i)).slice(0,5);\n const branchBox=$('briefCurrents');\n if(branchBox.dataset.ids!==ids.join(',')){\n  branchBox.dataset.ids=ids.join(',');\n  branchBox.innerHTML=ids.map(id=>`\u003cbutton class=\"branch-row\" data-part=\"${id}\">\u003cspan>\u003cstrong style=\"color:${colors[id]}\">${id}\u003c/strong>\u003csmall>\u003c/small>\u003c/span>\u003cspan>\u003c/span>\u003c/button>`).join('')||'\u003cp class=\"brief-note\">這一步沒有額外啟用的 MOS 支路。\u003c/p>';\n }\n ids.forEach((id,index)=>{\n  const d=sim.list.find(d=>d.id===id),j=s.j[id],flow=Math.abs(j.i)\u003c=.000001?'近乎無電流':nodeName(j.i>=0?d.a:d.b)+' → '+nodeName(j.i>=0?d.b:d.a);\n  const row=branchBox.children[index];row.querySelector('small').textContent=flow;row.lastElementChild.textContent=F(Math.abs(j.i)*1000,3);\n });\n}\nconst clockNames={ACT:'ACT 命令',PRE:'PRE 命令',RD:'READ 命令',REF:'REF 命令',WD_REF:'WD_REF 示意最後寫入資料參考點'};\nfunction currentRules(st){return st.checks||[['tRCD','ACT'],['tRAS','ACT'],['tRC','ACT'],['tRP','PRE'],['tRTP','RD'],['tWR','WD_REF'],['tRFC','REF']].filter(([,a])=>st.clocks[a]!==null).map(([name,anchor])=>({name,anchor,origin:st.clocks[anchor],limit:sim.profile[name]}));}\nfunction timingRows(st,t){const rules=currentRules(st);return rules.length?rules.map(r=>{const elapsed=Math.max(0,t-r.origin),left=Math.max(0,r.limit-elapsed);return `\u003cdiv class=\"clockrow\">\u003cb>${r.name}\u003c/b>\u003cspan>${clockNames[r.anchor]} @ ${F(r.origin,2)} ns\u003c/span>\u003cspan>已過 ${F(elapsed,2)} / 門檻 ${F(r.limit,2)} ns\u003c/span>\u003cstrong class=\"${left>1e-7?'clockwait':'clockpass'}\">${left>1 ">速度\u003c/span>\u003cselect id=\"speed\">\u003coption value=\".5\">0.5×\u003c/option>\u003coption value=\"1\" selected>1×\u003c/option>\u003coption value=\"2\">2×\u003c/option>\u003c/select>\u003c/label>\u003cinput id=\"seek\" aria-label=\"本段進度\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\">\u003cbutton id=\"all\">本課連播\u003c/button>\u003c/div>\u003c/section>\n\u003caside class=\"panel guide\">\u003cdiv class=\"eyebrow\">INPUT → CIRCUIT → OUTPUT\u003c/div>\u003cdiv class=\"io\">\u003cdiv>\u003csmall id=\"inputName\">\u003c/small>\u003cstrong id=\"inputValue\">\u003c/strong>\u003csmall>本段控制／初始條件\u003c/small>\u003c/div>\u003cdiv>\u003csmall id=\"outputName\">\u003c/small>\u003cstrong id=\"outputValue\">\u003c/strong>\u003csmall id=\"currentValue\">\u003c/small>\u003c/div>\u003c/div>\u003ch2 id=\"stageTitle\">\u003c/h2>\u003cp id=\"explain\">\u003c/p>\u003cp id=\"watch\">\u003c/p>\u003cdiv id=\"steps\" aria-label=\"本課分段\">\u003c/div>\u003cdetails id=\"math\" open>\u003csummary>公式：關係 → 代入 → 結果\u003c/summary>\u003cpre id=\"formula\">\u003c/pre>\u003c/details>\u003cdetails>\u003csummary>這一課的假設與名詞\u003c/summary>\u003cp id=\"assumptions\" class=\"note\">\u003c/p>\u003cbutton id=\"source\">教材依據\u003c/button>\u003c/details>\u003cdiv class=\"bridge\">\u003cstrong id=\"bridgeTitle\">\u003c/strong>\u003cp id=\"bridgeText\">\u003c/p>\u003cbutton id=\"bridgeButton\">\u003c/button>\u003c/div>\u003c/aside>\n\u003csection class=\"panel scope\">\u003cdiv class=\"scope-head\">\u003cstrong>本課示波器 \u003cspan id=\"legend\">\u003c/span>\u003c/strong>\u003cspan id=\"clock\">\u003c/span>\u003c/div>\u003csvg id=\"wave\" viewBox=\"0 0 900 135\" role=\"img\" aria-label=\"隨動畫更新的電壓波形\">\u003c/svg>\u003c/section>\u003c/main>\n\u003cdialog id=\"detail\">\u003cbutton id=\"close\">關閉 ✕\u003c/button>\u003ch2 id=\"detailTitle\">\u003c/h2>\u003cp id=\"detailText\">\u003c/p>\u003c/dialog>\n\u003cscript data-tutorial-model>\n/* DRAM Circuit Lab. Educational long-channel MOS transient model.\n * Units: V, ns, pF, mA. Not a DDR5 timing or process sign-off model.\n * OCSA core connectivity: US20200227111A1, Fig.3 / Fig.6A–E.\n * Named rail/column/write drivers are explicit illustrative peripheral circuits.\n */\n(function(global){\n'use strict';\nconst C={BL:.2,BLB:.2,CELL:.02,SL:.02,SR:.02,LA:.04,LAB:.04,LIO:.05,LIOB:.05};\nconst nodes=Object.keys(C), caps=nodes.map(n=>C[n]), ix=Object.fromEntries(nodes.map((n,i)=>[n,i]));\nconst rail={VINTA:1,VSS:0,VPRE:.5,VPL:.5};\nconst clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));\n// Rule demonstration only: no speed-bin / MR / burst configuration is implied.\nconst timingDefaults={tRCD:16,tRAS:32,tRP:16,tRC:48,tRTP:7.5,tWR:30,tRFC:295};\nconst senseMargin=.01; // 10 mV illustrative input margin, not a JEDEC specification.\nfunction decideRead(delta,margin=senseMargin){return !Number.isFinite(delta)||Math.abs(delta)\u003c=margin?'X':delta>0?1:0;}\nconst scenarios=[\n {id:'read0',group:'簡單案例',name:'讀出 0',init:0,ops:['ACT','RD','PRE'],goal:'從儲存 0 的 Cell 開列，讀出 0，再關列。'},\n {id:'read1',group:'簡單案例',name:'讀出 1',init:1,ops:['ACT','RD','PRE'],goal:'從儲存 1 的 Cell 開列，讀出 1，再關列。'},\n {id:'write0',group:'簡單案例',name:'寫入 0（1 → 0）',init:1,ops:['ACT','W0','PRE'],goal:'寫入驅動器將原本的 1 改成 0，完成寫入恢復後關列。'},\n {id:'write1',group:'簡單案例',name:'寫入 1（0 → 1）',init:0,ops:['ACT','W1','PRE'],goal:'寫入驅動器將原本的 0 改成 1，完成寫入恢復後關列。'},\n {id:'act0',group:'單一操作',name:'ACT：Cell = 0',init:0,ops:['ACT'],goal:'只看開列、共享與感測；最後保持列開啟。'},\n {id:'act1',group:'單一操作',name:'ACT：Cell = 1',init:1,ops:['ACT'],goal:'只看開列、共享與感測；最後保持列開啟。'},\n {id:'pre0',group:'單一操作',name:'PRE：已開列的 0',init:0,open:true,ops:['PRE'],goal:'起始已完成 ACT 與恢復；只播放關列、停用感測與等化。'},\n {id:'pre1',group:'單一操作',name:'PRE：已開列的 1',init:1,open:true,ops:['PRE'],goal:'起始已完成 ACT 與恢復；觀察 Cell 隔離後如何保留 1。'},\n {id:'refresh0',group:'單一操作',name:'Refresh 0',init:.12,ops:['REF'],goal:'Cell 的低電位已因漏電升到 0.12 V；刷新將它恢復到接近 0 V。'},\n {id:'refresh1',group:'單一操作',name:'Refresh 1',init:.88,ops:['REF'],goal:'Cell 的高電位已因漏電降到 0.88 V；刷新將它恢復到接近 1 V。'},\n {id:'verify01',group:'Case study',name:'寫 1 → 關列 → 重新讀回',init:0,ops:['ACT','W1','PRE','ACT','RD','PRE'],goal:'重新 ACT 後再讀回，確認資料保存在 Cell，而不只是感測器仍鎖存 1。'},\n {id:'verify10',group:'Case study',name:'寫 0 → 關列 → 重新讀回',init:1,ops:['ACT','W0','PRE','ACT','RD','PRE'],goal:'觀察寫入翻轉、隔離保存與重新讀出 0 的完整連續過程。'},\n {id:'same0',group:'Case study',name:'同值重寫 0 → 0',init:0,ops:['ACT','W0','RD','PRE'],goal:'沒有邏輯翻轉仍有控制動作；穩態下不應畫出持續充放電。'},\n {id:'same1',group:'Case study',name:'同值重寫 1 → 1',init:1,ops:['ACT','W1','RD','PRE'],goal:'區分寫入動作與位元翻轉，觀察寫入驅動器和欄位開關。'},\n {id:'rowhit',group:'Case study',name:'同列 Read → Write → Read',init:0,ops:['ACT','RD','W1','RD','W0','RD','PRE'],goal:'同一列保持開啟；READ 不會每次重新開啟 WL，也不會自動 PRE。'},\n {id:'retention',group:'Case study',name:'寫 1 → 漏電 → Refresh → 讀回',init:0,ops:['ACT','W1','PRE','WAIT','REF','ACT','RD','PRE'],goal:'把儲存、示意漏電與刷新串起來。REF 本身不將資料送到 DQ。'},\n {id:'timingwait',group:'時序觀察',name:'等待觀察：ACT → READ → PRE → 再開列',init:0,timing:{tRCD:120,tRAS:180,tRP:50,tRC:230},ops:['ACT','RD','PRE','ACT','W1','PRE'],goal:'刻意延長教學門檻，觀察 tRCD、tRAS、tRP／tRC 的剩餘時間；這不是 DDR5 速度等級。'},\n /*{id:'margin0',group:'補償比較',name:'弱訊號 0＋NMOS 失配',init:.36,offset:.06,ops:['ACT','RD','PRE'],goal:'Cell 只有微弱低訊號。切換 BLSA／OCSA，比較相同失配下的感測結果；結果由模型計算。'},\n {id:'margin1',group:'補償比較',name:'弱訊號 1＋NMOS 失配',init:.64,offset:-.06,ops:['ACT','RD','PRE'],goal:'Cell 只有微弱高訊號。比較有無補償的偏移與判讀結果。'}*/\n];\nfunction transistor(id,type,a,b,gate,k,vt=.3){return {id,type,a,b,gate,k,vt};}\nfunction netlist(mode,offset=0){\n const oc=mode==='ocsa', l=oc?'SL':'BL',r=oc?'SR':'BLB';\n const list=[\n transistor('P_L','p','LA',l,r,.2),transistor('P_R','p','LA',r,l,.2),\n transistor('N_L','n',l,'LAB','BLB',1,.3+offset/2),transistor('N_R','n',r,'LAB','BL',1,.3-offset/2),\n transistor('P_EN','p','VINTA','LA','@SAP_n',5),transistor('N_EN','n','LAB','VSS','@SAN',5),\n transistor('B_LA','n','LA','VPRE','@BIAS',4),transistor('B_LAB','n','LAB','VPRE','@BIAS',4),\n transistor('M_PL','n','BL','VPRE','@EQ',1),transistor('M_PR','n','BLB','VPRE','@EQ',1),\n transistor('M_EQ','n','BL','BLB','@EQ',1),transistor('M_A','n','BL','CELL','@WL',.5),\n transistor('Y_L','n',l,'LIO','@CSL',2),transistor('Y_R','n',r,'LIOB','@CSL',2),\n transistor('IO_PL','n','LIO','VPRE','@IOEQ',1),transistor('IO_PR','n','LIOB','VPRE','@IOEQ',1),\n transistor('W_PL','p','VINTA','LIO','@WPL',8),transistor('W_PR','p','VINTA','LIOB','@WPR',8),\n transistor('W_NL','n','LIO','VSS','@WNL',8),transistor('W_NR','n','LIOB','VSS','@WNR',8)\n ];\n if(oc)list.push(transistor('ISO_L','n','BL','SL','@ISO',2),transistor('ISO_R','n','BLB','SR','@ISO',2),transistor('OC_L','n','BL','SR','@OC',2),transistor('OC_R','n','BLB','SL','@OC',2));\n return list;\n}\nfunction voltage(name,v,g){return name[0]==='@'?g[name.slice(1)]:(name in ix?v[ix[name]]:rail[name]);}\nfunction mos(d,v,g){\n const a=voltage(d.a,v,g),b=voltage(d.b,v,g),vg=voltage(d.gate,v,g),ds=Math.abs(a-b);\n const over=d.type==='n'?vg-Math.min(a,b)-d.vt:Math.max(a,b)-vg-d.vt;\n const magnitude=over\u003c=0?0:(ds\u003cover?d.k*(over*ds-.5*ds*ds):.5*d.k*over*over);\n return {i:Math.sign(a-b)*magnitude,over,a,b,vg,region:over\u003c=0?'截止':ds\u003cover?'線性區':'飽和區'};\n}\nfunction initialG(mode){return {EQ:1.5,BIAS:1.5,WL:0,SAP_n:1,SAN:0,CSL:0,IOEQ:1.5,WPL:1,WPR:1,WNL:0,WNR:0,ISO:mode==='ocsa'?1.5:0,OC:mode==='ocsa'?1.5:0};}\nfunction makeStages(mode,sc,profile){\n const list=[],events=[];let g=initialG(mode),group=-1,op='',cursor=0;\n const clocks={ACT:null,RD:null,PRE:null,WD_REF:null,REF:null};\n const add=(key,title,duration,patch={},extra={})=>{const start={...g};g={...g,...patch};list.push({key,title,duration,startG:start,endG:{...g},group,op,clocks:{...clocks},...extra});cursor+=duration;};\n const mark=type=>{events.push({type,time:cursor,group});if(type in clocks)clocks[type]=cursor;if(type==='ACT'){clocks.RD=null;clocks.WD_REF=null;}};\n const rule=(name,anchor)=>clocks[anchor]===null?null:{name,anchor,origin:clocks[anchor],limit:profile[name]};\n const gate=(target,rules)=>{const checks=rules.filter(Boolean);if(!checks.length)return;const remaining=Math.max(0,...checks.map(r=>r.origin+r.limit-cursor));add('timing',`${target}：${remaining>1e-8?'等待剩餘時間':'時序檢查已滿足'}`,Math.max(.1,remaining),{}, {checks,gateTarget:target,waitAtEntry:remaining});};\n const beforeACT=()=>gate('ACT 前檢查',[rule('tRP','PRE'),rule('tRC','ACT'),rule('tRFC','REF')]);\n const beforePRE=()=>gate('PRE 前檢查',[rule('tRAS','ACT'),rule('tRTP','RD'),rule('tWR','WD_REF')]);\n if(sc.open)g={...g,EQ:0,BIAS:0,WL:1.5,SAP_n:0,SAN:1,OC:0};\n function act(refresh=false){\n  add('release','釋放預充電',2,{EQ:0,BIAS:0});\n  if(mode==='ocsa'){\n   add('oc','OC 保持導通／啟用偏移取樣',35,{ISO:0,OC:1.5,SAP_n:0,SAN:1});\n   add('hold','隔離並保持補償量',3,{OC:0,SAP_n:1,SAN:0,BIAS:1.5});\n   add('share','WL 開啟／電荷共享',7,{WL:1.5});\n   add('presense','隔離位線的預感測',22,{SAP_n:0,SAN:1,BIAS:0});\n   add('restore','接回位線／恢復 Cell',28,{ISO:1.5});\n  }else{\n   add('share','WL 開啟／電荷共享',7,{WL:1.5});\n   add('nsense','N-sense 拉低低側',15,{SAN:1});\n   add('psense','P-sense 拉高高側',18,{SAP_n:0});\n   add('restore','保持 WL／完成恢復',12);\n  }\n  add('active',refresh?'刷新資料恢復完成':'列保持開啟',2);\n  if(!refresh)gate('tRCD 檢查',[rule('tRCD','ACT')]);\n }\n function pre(){\n  add('wlclose','關閉 WL／隔離 Cell',2,{WL:0});\n  add('saoff','停止感測器供電',2,{SAP_n:1,SAN:0});\n  add('equalize','位線等化與預充電',25,{EQ:1.5,BIAS:1.5,ISO:mode==='ocsa'?1.5:0,OC:mode==='ocsa'?1.5:0});\n  add('standby','回到待機',2);\n }\n for(op of sc.ops){group++;\n  if(op==='ACT'){beforeACT();mark('ACT');act();}\n  if(op==='PRE'){beforePRE();mark('PRE');pre();}\n  if(op==='RD'){\n   mark('RD');\n   add('iorelease','解除 I/O 預充電',2,{IOEQ:0});\n   add('read','開啟欄位／建立讀出差值',6,{CSL:1.5});\n   add('capture','讀出端取樣',2,{}, {capture:true});\n   add('readclose','關閉欄位／輸出本筆資料',2,{CSL:0});\n   add('ioreset','I/O 回到待機',5,{IOEQ:1.5});\n  }\n  if(op==='W0'||op==='W1'){\n   mark(op);\n   const bit=op==='W1'?1:0;\n   add('iorelease','解除 I/O 預充電',2,{IOEQ:0},{writeBit:bit});\n   add('wdrive','寫入驅動器建立資料',3,{WPL:bit?0:1,WPR:bit?1:0,WNL:bit?0:1,WNR:bit?1:0},{writeBit:bit});\n   add('write','欄位開啟／寫入 Cell',18,{CSL:1.5},{writeBit:bit});\n   mark('WD_REF'); // Teaching proxy, not a simulated final external DQ clock edge.\n   add('wclose','關閉欄位／隔離寫入驅動',2,{CSL:0},{writeBit:bit});\n   add('wrecover','停止驅動／寫入恢復',10,{WPL:1,WPR:1,WNL:0,WNR:0},{writeBit:bit});\n   add('ioreset','I/O 回到待機',5,{IOEQ:1.5},{writeBit:bit});\n  }\n  if(op==='REF'){\n   gate('REF 前檢查',[rule('tRP','PRE'),rule('tRFC','REF')]);mark('REF');\n   add('refselect','REF／內部刷新位址選列',2);\n   act(true);pre();\n   gate('REF 忙碌結束',[rule('tRFC','REF')]);\n  }\n  if(op==='WAIT')add('leak','保持期間的漏電',100,{}, {leak:true});\n }\n return {stages:list,events};\n}\nfunction auditTiming(events,profile,initialOpen=false){\n let act=null,rd=null,pre=null,wr=null,ref=null,open=initialOpen;const results=[];\n for(const e of events){\n  const checks=[];const test=(name,origin)=>{if(origin!==null)checks.push({name,elapsed:e.time-origin,required:profile[name],pass:e.time-origin+1e-7>=profile[name]});};\n  if(e.type==='WD_REF'){wr=e.time;continue;}\n  let stateOK=true;\n  if(e.type==='ACT'){stateOK=!open;test('tRP',pre);test('tRC',act);test('tRFC',ref);act=e.time;rd=null;wr=null;open=true;}\n  if(['RD','W0','W1'].includes(e.type)){stateOK=open;test('tRCD',act);if(e.type==='RD')rd=e.time;}\n  if(e.type==='PRE'){stateOK=open;test('tRAS',act);test('tRTP',rd);test('tWR',wr);pre=e.time;open=false;}\n  if(e.type==='REF'){stateOK=!open;test('tRP',pre);test('tRFC',ref);ref=e.time;}\n  results.push({...e,checks,stateOK,pass:stateOK&&checks.every(c=>c.pass)});\n }\n return results;\n}\nfunction controls(st,t){const q=clamp(t/Math.min(.45,st.duration/4));return Object.fromEntries(Object.keys(st.endG).map(k=>[k,st.startG[k]+(st.endG[k]-st.startG[k])*q]));}\nfunction simulate(mode,scenario){\n const sc=typeof scenario==='string'?scenarios.find(s=>s.id===scenario):scenario;\n if(!sc)throw Error('找不到案例');\n const profile={...timingDefaults,...sc.timing},schedule=makeStages(mode,sc,profile);\n const list=netlist(mode,sc.offset??.012),stages=schedule.stages,closed=[.5,.5,sc.init,.5,.5,.5,.5,.5,.5];\n let v=sc.open?[sc.init,1-sc.init,sc.init,sc.init,1-sc.init,1,0,.5,.5]:closed;\n let samples=[],time=0,lastData=null,expected=sc.init>.5?1:0,lastOpGroup=-1,readLog=[];\n const dt=.003;\n for(let si=0;si\u003cstages.length;si++){\n  const st=stages[si];st.index=si;st.start=time;st.from=samples.length;st.initial=v.slice();st.expectedBefore=expected;\n  if(st.group!==lastOpGroup){lastOpGroup=st.group;}\n  const steps=Math.ceil(st.duration/dt),h=st.duration/steps,stride=Math.max(1,Math.floor(steps/140));\n  for(let n=0;n\u003c=steps;n++){\n   const local=n*h,g=controls(st,local),dv=nodes.map(()=>0);if(sc.earlyWLTime!=null&&time+local>=sc.earlyWLTime)g.WL=0;\n   for(const d of list){const I=mos(d,v,g).i;if(d.a in ix)dv[ix[d.a]]-=I;if(d.b in ix)dv[ix[d.b]]+=I;}\n   if(st.leak)dv[ix.CELL]+=(.5-v[ix.CELL])*.00008;\n   if(st.capture && n===steps){const delta=v[ix.LIO]-v[ix.LIOB];lastData=decideRead(delta);readLog.push({stage:si,actual:lastData,expected,delta,valid:lastData!=='X'});}\n   if(n%stride===0||n===steps)samples.push({t:time+local,v:v.slice(),g,stage:si,dq:lastData});\n   if(n!==steps)v=v.map((x,i)=>x+h*dv[i]/caps[i]);\n   if(v.some(x=>!Number.isFinite(x)||x\u003c-.01||x>1.51))throw Error('電路數值超出範圍');\n  }\n  if(st.key==='wrecover')expected=st.writeBit;\n  st.final=v.slice();st.to=samples.length-1;time+=st.duration;st.end=time;\n }\n return {mode,sc,list,stages,samples,total:time,readLog,final:v,expected,profile,events:schedule.events,timingAudit:auditTiming(schedule.events,profile,!!sc.open)};\n}\nfunction sampleAt(sim,t){\n t=clamp(t,0,sim.total);let lo=0,hi=sim.samples.length-1;\n while(lo\u003chi){const m=Math.ceil((lo+hi)/2);if(sim.samples[m].t\u003c=t)lo=m;else hi=m-1;}\n const a=sim.samples[lo],b=sim.samples[Math.min(lo+1,sim.samples.length-1)],q=b.t>a.t?(t-a.t)/(b.t-a.t):0;\n const st=sim.stages[a.stage],g=controls(st,t-st.start),v=a.v.map((x,i)=>x+(b.v[i]-x)*q);\n if(sim.sc.earlyWLTime!=null&&t>=sim.sc.earlyWLTime)g.WL=0;\n return {...a,t,v,g,stage:a.stage,j:Object.fromEntries(sim.list.map(d=>[d.id,mos(d,v,g)]))};\n}\nconst api={scenarios,netlist,simulate,sampleAt,controls,nodes,ix,C,rail,mos,timingDefaults,senseMargin,decideRead,auditTiming};\nif(typeof module!=='undefined')module.exports=api;global.DramModel=api;\n})(typeof globalThis!=='undefined'?globalThis:this);\n\n\u003c/script>\n\u003cscript>\n'use strict';\nconst $=id=>document.getElementById(id),fmt=(x,n=3)=>Number(x).toFixed(n),C=.02,CB=.2,R=100,VT=.3,K=.03; // pF, kΩ, ns, mA\nconst lessons=[\n {name:'電容與開關',sub:'接通、保持、放電',question:'開關斷開，電容電壓會立刻消失嗎？',objective:'只看電流如何改變一顆電容的電壓。',stages:['充電前：先認識電路','接通：電容開始充電','斷開：保持目前電位','接地：電容開始放電'],dur:[2,10,4,10],why:['開關還沒接通。電源是 1 V，電容初始 0 V，兩者之間沒有閉合的導電通路。','開關接通，電源經過電阻對電容充電。電容電壓愈接近電源，電阻兩端壓差愈小，電流也愈小。','開關斷開後，電容與電源隔離。理想模型沒有漏電，所以它保留斷開瞬間的電壓；不會自己跳回 0 V。','現在把輸入端改接 0 V，並接通開關。電流由電容流回低電位端，電容電壓逐漸下降。'],watch:['點電阻、開關、電容，可以先看它們各自做什麼。','看黃色箭頭由左往右，再看粉紅色 Vc 波形逐漸變平。','此時沒有電流箭頭，但電容仍然有電壓。','電流方向反過來了。放電也需要時間，不是瞬間歸零。'],assume:'理想開關與線性 RC 電路；R＝100 kΩ、C＝20 fF、τ＝2 ns 為教學數值。保持段忽略漏電。第一課電容下極板接地。',bridge:'接下來把這顆理想開關換成 MOS，看看 Gate 如何決定能不能導電。',bridgeTitle:'下一步：誰來控制開關？'},\n {name:'MOS 控制通路',sub:'Gate 與輸出分開看',question:'Gate 的電壓，怎麼控制另一條通路？',objective:'切換 NMOS／PMOS，分清控制端與充放電通路。',stages:['初始：電容已準備好','改變 Gate 電壓','保持 Gate：觀察輸出','關閉 Gate 通路','保持：電容已隔離'],dur:[2,2,12,2,4],why:['這裡先指定電容的初始電壓：NMOS 實驗從 1 V 開始，PMOS 實驗從 0 V 開始；前一課的充電電路暫時省略。','Gate 電壓開始變化。NMOS 看 VGS，PMOS 看 VSG；超過臨界電壓大小，才建立明顯導電通路。','Gate 電壓固定，不代表輸出電壓也固定。只要有電流，電容電壓就會繼續改變；接近電源端時，電流逐漸變小。','控制端回到截止電位。充放電通路逐漸停止；電容保留停止時的電位。','Gate 和輸出是不同節點。這裡忽略 Gate 耦合與漏電，所以關閉後，電容電位維持不變。'],watch:['NMOS 放在電容下方拉低輸出；PMOS 放在電容上方拉高輸出。','試把啟用 Gate 設在臨界值附近，觀察有沒有電流。','有顏色表示具備導通條件；箭頭只在電流足夠大時顯示。','看 Gate 波形先改變，輸出反應由電流決定。','再切換另一種 MOS，比較高有效與低有效控制。'],assume:'長通道平方律 MOS 示範，|VT|＝0.30 V；忽略次臨界、body effect、Gate 電流與寄生耦合。C＝20 fF。不是製程精準模型。',bridge:'把 NMOS 改放在資料線與儲存電容之間，Gate 改由 WL 控制，就組成 1T1C Cell。下極板也改成固定 VPL。',bridgeTitle:'下一步：MOS ＋ 電容 → Cell'},\n {name:'一顆 DRAM Cell',sub:'寫入與隔離保存',question:'一顆電晶體，怎麼把資料留在 Cell？',objective:'操作 WL，先寫入，再隔離；暫用理想驅動器代表位線。',stages:['初始：Cell 與驅動器分開','WL 升高：接通存取管','維持 WL：寫入 Cell','WL 降低：隔離 Cell','改變外側：Cell 仍保存'],dur:[2,2,16,2,5],why:['M_A 是存取 NMOS，Gate 由 WL 控制。Cell 從與目標相反的電位開始；左側理想驅動器暫時代替真正的位線電路。','WL 升高，M_A 開始導通，資料由左側驅動器經通路寫到 Cell。Gate 的 WL 不直接把電荷送進 Cell。','保持 WL，Cell 繼續向目標電位靠近。寫 1 時若 WL 太低，VGS 會隨 Cell 電位上升而減少，限制可寫入的高位。','WL 降低，存取管關閉。Cell 被隔離，保留關閉瞬間的電位。','外側資料線已改成相反電位，但 WL 仍低，Cell 不跟著改變。這就是「存取」與「保存」的分工。'],watch:['選寫入 0／1，再比較 WL＝1.0 V 與 1.5 V。','黃色箭頭表示傳統電流方向；粉紅色顯示 Cell 電位。','寫 1、WL＝1 V：模型上限約 0.7 V。WL＝1.5 V 才有足夠裕度接近 1 V。','保存的是當下電位；若太早隔離，不能自動補成完整的 0／1。','本例忽略漏電。實際 DRAM 保存一段時間後仍需要刷新。'],assume:'左側是理想電壓驅動器，非完整 BL。VPL 固定 0.5 V；Qcell＝Ccell(Vcell−VPL)。WL 是內部字線，不是外部 VPP 接腳。模型忽略 body effect，實際傳高限制可能更複雜。',bridge:'讀取時，位線不會一直被理想電源固定。下一課撤掉驅動器，改接一顆已預充電的位線電容，觀察共享。',bridgeTitle:'下一步：撤掉理想驅動器'},\n {name:'電荷共享',sub:'Cell 接上真正的負載',question:'Cell 是 0 或 1，為什麼 BL 只動一點點？',objective:'讓兩顆不同大小的電容共享電荷，先不加入感測器。',stages:['準備：兩個電容分開','接通：開始電荷共享','等待：靠近共同電位','隔離：停在共享後的電位','接下來：加入 BLB 基準'],dur:[2,3,8,3,3],why:['Cell 初始是 0 或 1；BL 初始為 0.5 V。預充電源已移除，現在只剩兩顆電容與尚未接通的通路。','接通後，傳統電流由電位高的一側流向低的一側。BL 與 Cell 的電位同時改變，不是把 Cell 的電壓原封不動複製到 BL。','當兩側電壓接近，通路壓差與電流也接近零。共享結果是按電容大小加權的平均值。','為了單獨看清共享結果，這裡暫時隔離 Cell。它原來的完整 0／1 已被擾動：這不是完整讀取流程，還沒有感測與恢復。','現在顯示一條仍在 0.5 V 的 BLB 參考支路。BL − BLB 的微小差值，就是後續感測器要放大的訊號；BLB 沒有接上本次 Cell。'],watch:['CBL 是 Cell 的 10 倍，所以 BL 的改變會比 Cell 小得多。','讀 1：Cell → BL；讀 0：BL → Cell。觀察箭頭會隨資料反向。','讀 1 約 0.545 V；讀 0 約 0.455 V。不是完整的 1 V／0 V。','真正 DRAM 會讓 WL 配合感測與恢復；不能把這個示範的提早隔離當成完整 ACT。','我們已走到感測器的輸入端。下一部分才處理 N-sense、P-sense 與恢復。'],assume:'本課把已開啟的 M_A 簡化為 RON＝100 kΩ，以解析式呈現電荷守恆。CBL＝200 fF、Ccell＝20 fF 是教學參數；VPL 固定 0.5 V；忽略寄生耦合與漏電。',bridge:'前四課到這裡完成：你已知道感測器拿到的輸入，是約 ±45 mV 的差值。可先重播讀 0／1，再到完整版定位 BL、BLB、Cell；N／P 感測與 OCSA 將在後續課程展開。',bridgeTitle:'已完成：感測器之前的四個部分'}\n];\n// Lessons 5–8: progressive educational subcircuits, with explicit boundary conditions.\nlessons[3].bridge='共享已產生微小差值。接下來回頭補上：位線最初的 0.5 V 是怎麼準備好的？第⑤課加入 EQ 與預充電通路。';\nlessons[3].bridgeTitle='下一步：把預充電電路接進來';\nlessons.push(\n {name:'預充電與等化',sub:'建立共同起點',question:'BL 與 BLB 的 0.5 V，是誰準備的？',objective:'只加入三個開關：兩個接基準、一個連接兩線。',stages:['初始：上次留下高、低位','EQ 開啟：三條通路一起動','維持 EQ：兩線接近基準','EQ 關閉：保留準備好的電位','接入 Cell：小差值出現'],dur:[2,8,16,3,10],why:['先假設前一次操作留下 BL／BLB＝1／0 或 0／1。Cell 此時隔離，感測器已停用；這一課只研究位線如何回到共同起點。','EQ 同時啟用 M_PL、M_PR、M_EQ。前兩條通路連到 VPRE；中間通路讓兩線交換電荷。等化與接回基準是同時作用。','BL、BLB 都向 0.5 V 靠近。壓差減少，電流也變小；開關仍開啟，不代表一直有大電流。','EQ 關閉，位線電容保留接近 0.5 V 的電位。先解除箝位，Cell 的小訊號才不會被預充電源拉回去。','現在才讓 WL 開啟、M_A 接通。Cell 與 BL 共享電荷，BLB 保留參考電位。這就是第四課共享實驗的前置準備。'],watch:['上次殘留值與這次 Cell 資料是兩件事；本示範選同一極性方便比較。','黃色箭頭顯示實際壓差決定的電流方向，不以階段名稱硬畫。','試切換 0／1：預充電的目標仍然都是 0.5 V。','此時 Cell 還沒接上；沒有感測或讀出。','把「先 EQ、再放開、再 WL」三步連起來看。'],assume:'三個 EQ 開關以 50 kΩ 導通電阻等效；M_A 使用 100 kΩ。每條位線 200 fF，Cell 20 fF。省略 SA、漏電與寄生耦合；數值不是 JEDEC 內部電路規範。',bridgeTitle:'下一步：小差值如何變成電流？',bridge:'先拿一顆下拉 NMOS，用外加 Gate 電壓控制它，觀察輸出位線如何下降。'},\n {name:'單顆 N-sense',sub:'輸入電壓 → 下拉電流',question:'Gate 只差一點點，放電速度會差多少？',objective:'先只看一顆 NMOS，暫用外加電壓代替另一條位線。',stages:['初始：Gate 與輸出分開','拉低 LAB：建立 VGS','保持 Gate：位線放電','接近低位：電流減少'],dur:[2,2,12,6],why:['輸出 BL 預先置於 0.5 V。Gate 由可調理想訊號源控制，並沒有接回輸出；下方 LAB 起始 0.5 V，使本課範圍內的 Gate 不足以開啟通路。','SAN 啟用後，下方 LAB 朝 0 V 下降。即使 Gate 不變，VGS＝VG−VS 也會增加，NMOS 因而開始導通。','Gate 較高時，過驅電壓較大，通常放電更快。輸出 BL 是一顆有電容的節點，電流持續流出，電壓就持續下降。','BL 接近 LAB 後，汲源壓差變小，電流減少。Gate 可能仍使元件導通，但輸出已接近低位。'],watch:['滑動 Gate，分別重播 0.455 V 與 0.500 V；不要把 Gate 誤認成輸出。','本課用理想控制的 LAB 代表 N_EN 及其供電軌，沒有把控制訊號 SAN 當成電流來源。','比較同一時間的 BL 與電流，而不是只比較最後都接近 0 V 的結果。','下一課才把 Gate 的理想訊號源換成真正的對側位線。'],assume:'CBL＝200 fF，βn＝1 mA/V²，VT＝0.30 V。簡化平方律、忽略次臨界與 body effect。LAB 是理想驅動的供電軌；Gate 是獨立訊號源。',bridgeTitle:'下一步：另一條位線來控制 Gate',bridge:'加上對稱的第二顆 NMOS，先維持兩個外加 Gate 訊號，再把兩側輸出交叉接回 Gate。'},\n {name:'交叉耦合 N-sense',sub:'兩側開始互相影響',question:'接回對側位線，為什麼差距會自己變大？',objective:'先用固定 Gate 驅動兩管，再切換為交叉回授。',stages:['準備：從共享的小差值起步','外加 Gate：先比較兩管','接線：用對側 BL 取代訊號源','正回授：低側越來越低','停下來看：高側還沒到 1 V'],dur:[2,1,.5,18,5],why:['BL 初始為第四課共享的理論值，BLB 為 0.5 V。此課暫不接 Cell，將上一部分的輸出當成本部分初始條件。','兩顆 Gate 暫由固定訊號源控制：N_L 取初始 BLB，N_R 取初始 BL。LAB 降低後，Gate 較高的一管下拉較強。','現在撤掉兩個理想 Gate 訊號源，換成實線：N_L Gate 接 BLB，N_R Gate 接 BL。兩側電位開始互相控制，這才形成回授。','低位線降低，會降低對側 NMOS 的 Gate 電壓，讓對側下拉變弱；對側相對較高，又讓低側下拉保持較強。差值因而擴大。','N-sense 能把低側拉低，卻沒有從上方電源把高側拉到 1 V 的能力。高側只是相對較高；下一課需要加入 P-sense。'],watch:['初始差值不是從標籤猜出的，數值使用電容共享的結果。','此時兩個 Gate 是外加輸入，圖中用小框標出，不假裝已交叉相連。','彩色連線是 Gate 訊號路徑；黃色箭頭才是導電通路的傳統電流。','讀 0 通常由 N_L 主導下拉；讀 1 則左右對調。觀察實際 VGS 和電流。','0／1 選項代表起始 Cell 資料；這裡尚未完成 Cell 恢復。'],assume:'兩條位線均為 200 fF；NMOS 使用 βn＝1、VT＝0.30 V。Cell 與 PMOS 暫未接入；外加 Gate → 回授的切換是教學拆解，不是真實 DRAM 額外命令。',bridgeTitle:'下一步：把高側也補到電源',bridge:'保留 N-sense，再加入交叉耦合 PMOS 與上方供電開關，形成完整的感測核心。'},\n {name:'加入 P-sense',sub:'微小差值 → 完整高低位',question:'哪一顆 PMOS 會把高側拉到 1 V？',objective:'保留交叉耦合，先 N 後 P，觀察上下供電與鎖存。',stages:['初始：上下供電軌在半電源','N-sense：LAB 降低','低側下降：留意 PMOS 的反應','P_EN 開啟：LA 接向電源','再生放大：高側拉高','鎖存：有導通不一定有大電流'],dur:[2,2,12,2,16,5],why:['加入 P_L／P_R，Gate 同樣交叉接到對側位線。LA／LAB 初始為 0.5 V；P_EN 尚未開啟。Cell 仍暫時省略。','先拉低 LAB，NMOS 兩側開始分出強弱。此時 PMOS 也已在電路裡，是否導通取決於實際 VSG，不是只看階段名稱。','當某側 Gate 已很低，即使 P_EN 還關著，對側 PMOS 也可能導通。模型的 LA 有 40 fF 電容，能短暫提供電荷；因此 LA 可能先下降。','SAP_n 降低，P_EN 導通，上方電源提供電流把 LA 拉向 1 V。Gate 較低的一側 PMOS 提供較強上拉。','低側控制高側的 PMOS，高側控制低側的 NMOS；正回授將差值放大成接近 1 V／0 V。再生所需能量來自供電。','高側與低側保持穩定；某些管子仍符合導通條件，但兩端壓差很小，電流也很小。這個狀態是感測器鎖存，不等於 Cell 已恢復。'],watch:['P_EN 用開關等效，LA 電容以等效負載計算；模型不是 JEDEC 強制內部拓撲。','對照兩顆 NMOS 的即時數值，辨別哪一側下拉較強。','這正是第三階段會看到某顆 PMOS 先有動作的原因；不要把 LA 暫存電荷當成 VINTA 已接通。','讀 0 時通常 P_R 上拉 BLB，P_L 截止；讀 1 左右對調。','比較 N-sense 課的高側電位，現在才真正接近 1 V。','下一部分再接回 Cell，學 Restore、PRE、READ／WRITE。'],assume:'βn＝1、βp＝0.2 mA/V²；|VT|＝0.30 V；CBL＝CBLB＝200 fF，CLA＝40 fF。P_EN 用受控 2 kΩ 通路等效。LAB 理想驅動；Cell 暫未接回，沒有完整命令時序。',bridgeTitle:'已完成：從共享走到感測核心',bridge:'第①～⑧課已連起預充電、共享與 N／P 感測。下一部分將把 Cell 接回，展示恢復、關列與欄位讀寫；也可先到完整版對照四顆感測管。'}\n);\nlet singleGate=.5;\nfunction senseMosCurrent(a,b,g,p=false,beta=1){const m=mosCurrent(a,b,g,p);return {...m,i:m.i*beta/K};}\nfunction makeSenseTrace(){\n bounds=[0];lessons[lesson].dur.forEach(d=>bounds.push(bounds.at(-1)+d));total=bounds.at(-1);trace=[];\n const shared=(.1+.02*bit)/.22;let bl=lesson===4?bit:lesson===5?.5:shared,br=lesson===4?1-bit:.5,cell=bit,la=.5;\n for(let n=0;n\u003c=Math.round(total/.005);n++){\n  const x=n*.005;let k=Math.min(bounds.length-2,bounds.findIndex((end,i)=>i>0&&x\u003cend)-1);if(k\u003c0)k=bounds.length-2;const u=x-bounds[k];\n  let eq=0,wl=0,lab=.5,pen=0,gl=.5,gr=shared,il=0,ir=0,pl=0,pr=0,ic=0,ie=0,ipl=0,ipr=0,ipower=0;\n  if(lesson===4){eq=k===1||k===2?1.5:0;wl=k===4?1.5:0;ie=eq?(bl-br)/50:0;ipl=eq?(.5-bl)/50:0;ipr=eq?(.5-br)/50:0;ic=wl?(bl-cell)/100:0;}\n  else{\n   lab=k===0?.5:k===1?.5*(1-Math.min(1,u/(lesson===6?.8:1.5))):0;\n   gl=lesson===5?singleGate:lesson===6&&k\u003c2?.5:br;\n   gr=lesson===6&&k\u003c2?shared:bl;\n   il=senseMosCurrent(bl,lab,gl).i;ir=lesson>=6?senseMosCurrent(br,lab,gr).i:0;\n   if(lesson===7){pen=k>=3?Math.min(1,(x-bounds[3])/.8):0;pl=senseMosCurrent(la,bl,br,true,.2).i;pr=senseMosCurrent(la,br,bl,true,.2).i;ipower=pen*(1-la)/2;}\n  }\n  trace.push({t:x,k,v:lesson===4?cell:bl,b:br,bl,cell,la,lab,eq,wl,pen,gl,gr,il,ir,pl,pr,ie,ipl,ipr,ipower,g:lesson===4?eq:gl,input:lesson===4?eq:lesson===5?singleGate:shared,i:lesson===4?ic:pl-il,on:lesson===4?!!eq:senseMosCurrent(bl,lab,gl).ov>.001});\n  if(lesson===4){bl+=(ipl-ie-ic)/CB*.005;br+=(ipr+ie)/CB*.005;cell+=ic/C*.005;}\n  else{bl+=(pl-il)/CB*.005;br+=(pr-ir)/CB*.005;if(lesson===7)la+=(ipower-pl-pr)/.04*.005;}\n  bl=Math.max(0,Math.min(1,bl));br=Math.max(0,Math.min(1,br));la=Math.max(0,Math.min(1,la));\n }\n}\nfunction verticalSwitch(x,y,on,id){return part(id,`\u003cg style=\"color:${on?'#70efb5':'#eef5ff'}\">`+line(x,y-42,x,y-20)+line(x,y+20,x,y+42)+line(x,y-20,on?x:x+23,y+20,'device')+txt(x+30,y+5,id,'small','start')+'\u003c/g>');}\nfunction coreMos(id,x,y,p,side,s){const l=id.endsWith('L'),a=p?s.la:(l?s.bl:s.b),b=p?(l?s.bl:s.b):s.lab,g=p?(l?s.b:s.bl):(l?s.gl:s.gr),j=senseMosCurrent(a,b,g,p,p?.2:1),on=(s.j?.[id]?.over??j.ov)>.001;\n let body=`\u003cg style=\"color:${on?(p?'#ffd174':'#67ddff'):'#eef5ff'}\">\u003crect x=\"${x-38}\" y=\"${y-44}\" width=\"76\" height=\"88\" class=\"hit\"/>`;\n if(symbol==='switch')body+=line(x,y-45,x,y-20)+line(x,y+20,x,y+45)+line(x,y-20,on?x:x+side*20,y+20,'device')+line(x+side*70,y,x+side*28,y,'device');\n else{body+=line(x,y-45,x,y-22)+line(x,y-22,x+side*10,y-22,'device')+line(x+side*10,y-22,x+side*10,y+22,'device')+line(x+side*10,y+22,x,y+22,'device')+line(x,y+22,x,y+45)+line(x+side*28,y-24,x+side*28,y+24,'device');if(p)body+=`\u003ccircle cx=\"${x+side*38}\" cy=\"${y}\" r=\"5\" class=\"device\"/>`;body+=line(x+side*(p?43:28),y,x+side*70,y,'device');}\n body+=txt(x-side*28,y-8,id,'label',side===1?'end':'start')+'\u003c/g>';return part(id,body);\n}\nfunction signalPath(d,c){return `\u003cpath d=\"${d}\" fill=\"none\" stroke=\"${c}\" stroke-width=\"2.5\"/>`;}\nfunction senseCap(x,y,id,val){return part(id,line(x,y-35,x,y-8)+line(x-23,y-8,x+23,y-8,'device')+line(x-23,y+8,x+23,y+8,'device')+line(x,y+8,x,y+40)+ground(x,y+40)+txt(x,y-48,id+' · 200 fF','small')+txt(x,y+123,fmt(val)+' V','value'));}\nfunction drawSenseCircuit(s){let z=`\u003cdefs>\u003cmarker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#ffd174\"/>\u003c/marker>\u003c/defs>`;\n $('circuit').setAttribute('viewBox','0 0 920 540');\n if(lesson===4){z+=txt(460,37,'VPRE＝0.500 V')+line(260,60,660,60)+line(260,60,260,88)+line(660,60,660,88)+verticalSwitch(260,130,!!s.eq,'M_PL')+verticalSwitch(660,130,!!s.eq,'M_PR')+line(260,172,260,345)+line(660,172,660,345)+line(260,240,410,240)+sw(460,240,!!s.eq,'M_EQ')+line(510,240,660,240)+cap(260,380,'BL','CBL',s.bl)+cap(660,380,'BLB','CBLB',s.b)+txt(450,115,`EQ＝${fmt(s.eq,1)} V`,'small');z+=arrow(230,85,230,175,s.ipl)+arrow(690,85,690,175,s.ipr)+arrow(365,215,550,215,s.ie);if(stage===4){z+=line(80,300,120,300)+fet(170,300,true,false,true,'M_A')+line(220,300,260,300)+line(80,300,80,345)+cap(80,380,'Cell','Cell',s.cell,'
