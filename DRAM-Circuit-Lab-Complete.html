0,275)+part('LA',txt(655,137,'LA '+fmt(s.la)+' V','small','start'))+txt(80,40,'SAP_n＝'+fmt(1-s.pen,2)+' V','small','start');\n   z+=signalPath('M300 285 H409 Q420 297 431 285 H480 V200 H530 M480 285 V355 H530','#67ddff')+signalPath('M600 270 H491 Q480 258 469 270 H420 V200 H370 M420 270 V355 H370','#ffd174')+arrow(270,165,270,235,s.pl)+arrow(630,165,630,235,s.pr)+arrow(420,45,420,115,s.ipower);}\n  z+=`\u003ccircle cx=\"300\" cy=\"${top}\" r=\"4\" fill=\"#eef5ff\"/>\u003ccircle cx=\"600\" cy=\"${top}\" r=\"4\" fill=\"#eef5ff\"/>`;z+=txt(460,p?510:460,p?'Cell 尚未接回：此課只看感測核心':'只做下拉：相對高的一側還不是完整的 1 V','small');\n }\n $('circuit').innerHTML=z;}\nfunction sensePanels(s){const L=lessons[lesson];$('inputName').textContent=lesson===4?'EQ 控制':lesson===5?'外加 Gate':'初始 BL − BLB';$('inputValue').textContent=lesson===4?fmt(s.eq,1)+' V':lesson===5?fmt(s.gl)+' V':fmt((((.1+.02*bit)/.22)-.5)*1000,2)+' mV';$('outputName').textContent=lesson===5?'BL 輸出':'目前 BL − BLB';$('outputValue').textContent=lesson===5?fmt(s.bl)+' V':fmt((s.bl-s.b)*1000,2)+' mV';$('currentValue').textContent=lesson===4?'Cell '+fmt(s.cell)+' V':'BL '+fmt(s.bl)+'／BLB '+fmt(s.b)+' V';\n if(lesson===4)$('formula').textContent=`EQ 高：三個開關同時接通\\nI_PL = (VPRE − BL)/50 kΩ = ${fmt(s.ipl*1000)} µA\\nI_PR = (VPRE − BLB)/50 kΩ = ${fmt(s.ipr*1000)} µA\\nI_EQ(BL→BLB) = (BL − BLB)/50 kΩ\\n= ${fmt(s.ie*1000)} µA\\n\\ndBL/dt = (I_PL − I_EQ − I_Cell)/CBL\\n目前 BL = ${fmt(s.bl,5)} V\\n目前 BLB = ${fmt(s.b,5)} V\\n\\n解除 EQ 後才接入 Cell\\nVshare ≈ (200×0.5+20×${bit})/220\\n≈ ${fmt((.1+.02*bit)/.22,5)} V`;\n else{\n const pair=lesson===5?[['N_R',s.bl,s.gl,s.il]]:[['N_L',s.bl,s.gl,s.il],['N_R',s.b,s.gr,s.ir]];\n let f=pair.map(([id,v,g,i])=>`${id}：Gate = ${fmt(g)} V\\nVGS = VG − min(VD, VS)\\n= ${fmt(g-Math.min(v,s.lab))} V\\nVov = VGS − 0.300 V\\nI(位線→LAB) = ${fmt(i*1000)} µA`).join('\\n\\n');\n f+='\\n\\ndV/dt = I淨流入/C\\nβn = 1 mA/V²；CBL = 200 fF';\n if(lesson===6)f+='\\n'+(stage\u003c2?'目前 Gate 由外加訊號源固定':'現在 Gate 接回實際對側位線');\n if(lesson===7)f+=`\\n\\nP_L：VSG = ${fmt(Math.max(s.la,s.bl)-s.b)} V\\nI(LA→BL) = ${fmt(s.pl*1000)} µA\\nP_R：VSG = ${fmt(Math.max(s.la,s.b)-s.bl)} V\\nI(LA→BLB) = ${fmt(s.pr*1000)} µA\\nβp = 0.2 mA/V²\\n\\nLA = ${fmt(s.la)} V；CLA = 40 fF\\nCLA·dLA/dt = I_PEN − I_PL − I_PR\\nI_PEN = ${fmt(s.ipower*1000)} µA\\nP_EN 未開時仍可能有 LA 暫存電流`;\n $('formula').textContent=f;\n }\n}\nfunction senseWave(){const signals=lesson===4?[['bl','BL','#67ddff'],['b','BLB','#ffd174'],['eq','EQ','#70efb5']]:lesson===5?[['bl','BL','#ff91c4'],['gl','Gate','#67ddff'],['lab','LAB','#ffd174']]:[['bl','BL','#67ddff'],['b','BLB','#ffd174'],[lesson===7?'la':'lab',lesson===7?'LA':'LAB','#ff91c4']];$('legend').innerHTML=signals.map(([,n,c])=>`\u003cspan style=\"color:${c}\">━ ${n}\u003c/span>`).join(' ');let z='';for(const v of [0,.5,1,1.5]){const y=110-v*56;z+=`\u003cpath d=\"M45 ${y}H880\" stroke=\"#283544\" stroke-dasharray=\"3 5\"/>`+txt(23,y+4,String(v),'small');}bounds.forEach(x=>z+=`\u003cpath d=\"M${45+x/total*835} 20V113\" stroke=\"#223442\"/>`);for(const [key,,c]of signals){const pts=trace.filter((s,i)=>s.t\u003c=t&&i%15===0);z+=`\u003cpath d=\"${pts.map((s,i)=>(i?'L':'M')+(45+s.t/total*835).toFixed(2)+' '+(110-s[key]*56).toFixed(2)).join(' ')}\" fill=\"none\" stroke=\"${c}\" stroke-width=\"2\"/>`;}z+=`\u003cpath d=\"M${45+t/total*835} 15V115\" stroke=\"white\"/>`+txt(45,133,'0 ns','small','start')+txt(880,133,total+' ns','small','end');$('wave').innerHTML=z;}\n\n// Connect the earlier lessons to the same BLSA netlist used by the full lab.\nlessons[7].bridgeTitle='下一步：感測完成，Cell 呢？';lessons[7].bridge='把 M_A 與 Cell 接回 BL，觀察感測器如何一邊放大，一邊恢復儲存電位；再試一次提早關閉 WL。';\nlessons.push(\n {name:'接回 Cell／恢復',sub:'鎖存不等於恢復完成',question:'SA 已分出 0／1，Cell 也準備好了嗎？',objective:'接回 M_A 和 Cell，比較正常保持 WL 與提早隔離。',stages:[],dur:[],why:[],watch:[],assume:'使用完整版 BLSA 教學網表，失配設為 0。圖中暫省略預充電、偏壓及 I/O 支路；它們仍按已學流程作用。提早關 WL 是故意插入的失敗實驗，不是正常 DDR5 命令。',bridgeTitle:'下一步：資料恢復後再關列',bridge:'Cell 恢復完成後，必須先隔離它，再讓位線回到半電源。下一課加入 PRE。'},\n {name:'PRE 關列',sub:'先隔離，再等化',question:'為什麼 BL 回到 0.5 V，Cell 不會跟著變？',objective:'從已開列且充分恢復的狀態起步，逐段關閉與預充電。',stages:[],dur:[],why:[],watch:[],assume:'起始已完成 ACT、恢復及 PRE 前置時序。只展開 PRE 內部動作；下方同名 BL／BLB 節點連回上方。偏壓回路在圖中省略，但仍存在於模型。',bridgeTitle:'下一步：從列裡選出一筆資料',bridge:'READ 不會把整列再打開一次。下一課從已開列的狀態加入欄位開關、局部 I/O 與寫入驅動器。'},\n {name:'欄位 READ／WRITE',sub:'取出資料，或改寫資料',question:'SA 裡的資料，怎麼送出去或被改寫？',objective:'選讀取或寫入 0／1，只看已開列後的欄位動作。',stages:[],dur:[],why:[],watch:[],assume:'起始列已充分感測、恢復並滿足欄位命令前置時序。LIO／LIOB 是局部 I/O；DQ 只以差動取樣端點表示，不模擬 DQS、序列化與 burst。右側同名 BL／BLB 接回感測器。',bridgeTitle:'下一步：串起完整故事',bridge:'把預充電、ACT、READ／WRITE、PRE 串成有資料連續性的流程，再比較不開 CSL 的 Refresh。'},\n {name:'完整 BLSA 流程',sub:'讀、寫、驗證、刷新',question:'這些小部分，怎麼完成一次完整操作？',objective:'切換故事線，逐段追蹤 Cell、位線與 I/O 的資料。',stages:[],dur:[],why:[],watch:[],assume:'完整 BLSA 教學網表；畫面展開主要資料通路，供電軌偏壓開關以狀態文字表示。時間門檻為教學值，並非完整 DDR5 合規檢查。Refresh 只展開一條代表性列。',bridgeTitle:'完成 BLSA：下一部分是 OCSA',bridge:'你已連起 Cell、感測、恢復、欄位讀寫與關列。下一部分將從元件失配開始，逐步加入 OCSA 的補償與隔離通路。也可先到完整版對照。'}\n);\nlet earlyClose=false,accessOp='RD',story='read',fullSim=null;\nconst flowWhy={\n release:['先解除位線預充電與等化。Cell 還沒接上，避免稍後的小差值被 VPRE 箝回去。','這是已學過的 EQ 支路；現在只把它當成 ACT 的第一步。'],\n share:['WL 升高，M_A 接通，Cell 和 BL 共享電荷。Cell 原本的完整 0／1 被改變，BL 只出現微小差值。','同步看 Cell 與 BL 波形。還沒有恢復，也沒有資料送到 DQ。'],\n nsense:['SAN 啟用，LAB 降低；兩顆 NMOS 開始分出下拉強弱。只要 WL 還開著，Cell 也已隨 BL 變化，恢復不是等下一段才突然開始。','讀 0 的低側是 BL，讀 1 的低側是 BLB；根據實際電位決定，不靠名稱指定結果。'],\n psense:['P_EN 啟用，上方電源經 PMOS 拉高較高的一側。WL 保持開啟，Cell 會繼續朝感測結果恢復。','感測器分出高低位，不代表小電容已在同一瞬間到達完整電位。'],\n restore:['保持 WL 與感測供電，讓 Cell 充分恢復。讀 1 時補到高位，讀 0 時拉回低位；兩種資料都需要恢復。','比較正常與提早關 WL：感測器可能仍判對，Cell 卻只保留共享後的中間電位。'],\n active:['感測器保持鎖存，WL 仍開啟。可以在同一列進行後續欄位讀寫，但還必須符合命令時間限制。','本圖同時顯示 SA 節點和 Cell，避免把兩者當成同一個儲存位置。'],\n wlclose:['先把 WL 拉低，M_A 截止，Cell 與 BL 隔離。這樣之後 BL 預充到 0.5 V，Cell 才不會被一起改寫。','觀察 Cell 波形維持，而後續 BL／BLB 會繼續改變。'],\n saoff:['SAP_n 拉高、SAN 拉低，停止感測器的上拉與下拉供電。不是把每個節點瞬間歸零。','先停止強驅動，再等化，避免高低位線被短接時仍由兩端電源對抗。'],\n equalize:['EQ 同時啟用兩條預充電通路與 M_EQ。BL／BLB 交換電荷並回到 VPRE；供電軌偏壓回路也準備下一次感測。','Cell 已隔離，資料仍留在 Cell；PRE 本身不等於刷新。'],\n standby:['BL／BLB 已接近 0.5 V，Cell 保存先前資料。下一次 ACT 仍需要滿足 PRE 後的 tRP 等限制。','這是關列後的準備狀態，不是把 Cell 清成 0.5 V。'],\n iorelease:['先解除局部 I/O 預充電，讓 LIO／LIOB 可以被資料驅動；位線感測器仍保持開列。','IOEQ 與位線 EQ 是兩組不同控制；解除 I/O 預充電不會重新 ACT。'],\n read:['CSL 接通 Y_L／Y_R，SA 已鎖存的資料在 LIO／LIOB 建立差值。能量由感測器供電提供，不是小 Cell 直接推動外部輸出。','看欄位開關和兩條 I/O 的電位變化。'],\n capture:['在本段末端取樣 LIO − LIOB 的符號，形成這筆讀出結果。尚未到取樣點時顯示尚未取樣，不能提前當成有效輸出。','差值不足會顯示 X：這是教學有效性標記，不是 DQ 的第三種邏輯。'],\n readclose:['CSL 關閉，欄位通路隔離；這筆取樣結果保留，SA 和 Cell 仍維持列資料。','READ 完成不會自動把 WL 關閉；同列可以繼續讀寫。'],\n ioreset:['局部 I/O 回到預充電基準，為下一筆資料準備。這只處理 LIO／LIOB，不是 PRE 關列。','分清位線 BL／BLB 與局部 I/O LIO／LIOB。'],\n wdrive:['先由寫入驅動器建立新的 LIO／LIOB 電位，CSL 暫時關閉。寫入資料從這裡進入，並非修改 Cell 標籤就算寫完。','選擇寫 0／寫 1，也可把起始 Cell 設成相同值觀察同值重寫。'],\n write:['CSL 接通，新資料經欄位通路改變感測節點，再經 M_A 寫入 Cell。翻轉初期，新驅動可能與舊鎖存狀態對抗。','看 Cell 的連續變化與實際寫入電流；重寫同值可能沒有大幅翻轉。'],\n wclose:['先關閉 CSL，把已改寫的感測器與外側寫入驅動隔離；WL 此時仍開啟。','不要把欄位開關關閉誤認成 Cell 已被隔離。'],\n wrecover:['寫入驅動停止後，SA 繼續維持新值，Cell 繼續恢復。關列前還需滿足寫入恢復與 ACT→PRE 的限制。','教學模型把內部寫入末端作為 tWR 的示範參考；真實裝置須依外部資料／CK 定義判定。'],\n refselect:['REF 由內部刷新控制選列，接著共享、感測、恢復，再自行關列。整個刷新過程不開 CSL，也不產生新的 DQ 讀出。','本示範從稍微劣化的 Cell 電位開始；刷新必須在資料仍可正確判讀時進行。']\n};\nlet tutorialOffset=.012;\nconst ocWhy={\n release:['先釋放 EQ 與供電軌偏壓。Cell 尚未接入，因此接下來量到的是感測器本身的不對稱。','本例沿用文獻待機：ISO、OC 都高。補償階段不需要再把 OC 從低拉高。'],\n oc:['ISO 斷開，OC 保持導通；感測供電啟用。BL 接 SR、BLB 接 SL，形成校準回路，讓失配轉成節點上的補償偏壓。','此時 WL＝0。BL／BLB 不相等不代表正在讀 Cell，而是在建立補償基準。'],\n hold:['OC 關閉，位線保留剛建立的偏壓；暫停感測供電並把 LA／LAB 拉回偏壓。','保持的是節點電荷，不是永久改變晶體管 VT。真實電路會受漏電、耦合與切換雜訊影響。'],\n share:['WL 接通 Cell，資料在已帶補償偏壓的 BL 上造成額外變化。ISO 與 OC 仍關閉。','這次共享前 BL 不一定恰好 0.5 V；公式要代入本段實際初值。'],\n presense:['重新啟用感測供電，在小負載 SL／SR 上先放大差值。外側 BL／BLB 接 NMOS Gate，仍控制電流，雖然 ISO／OC 的導電通路都斷開。','隔離不等於完全沒有訊號：Gate 的電場控制仍在；但 Cell 此時還沒有被內部滿幅結果恢復。'],\n restore:['ISO 重新接通：SL→BL、SR→BLB。WL 仍開啟，因此恢復電流再經 M_A 到 Cell。','OC 保持關閉，否則會把相反側交叉接回；恢復後才能保存穩固的資料。']};\nfor(const [name,sub,question,objective]of [\n ['為什麼加入補償','BLSA 的失配問題','蹺蹺板自己就偏一邊，還能判對小訊號嗎？','改變 NMOS 臨界電壓差，觀察同一筆 Cell 資料的感測結果。'],\n ['OCSA：先校準自己','隔離 → 補償 → 保持','Cell 還沒接入，BL 為什麼先有差值？','只看 ISO／OC 與偏移取樣；停在補償量保持，不先播放整個讀取。'],\n ['OCSA：加入資料','共享 → 預感測 → 恢復','ISO 關著，感測器怎麼還知道 Cell 資料？','延續補償狀態，分辨 Gate 控制與導電通路，最後接回 Cell。'],\n ['OCSA：完整故事','讀／寫／刷新','加了补償之後，完整讀寫有哪些不同？'.replace('补','補'),'在相同框架比較 OCSA 讀、寫、寫後讀回與刷新；CSL 與 EQ 都在同圖。']\n])lessons.push({name,sub,question,objective,stages:[],dur:[],why:[],watch:[],assume:'OCSA 是具有 offset cancellation 的位線感測器，不是所有 BLSA 的統一替代品。此 ISO／OC 例依 US20200227111A1 Fig.3、6A–E；不是 2018 SVC 論文的逐管重製。額外開關、校準時間與寄生負載是代價。',bridgeTitle:'把下一部分接起來',bridge:'同一個感測目的，先處理自身失配，再讀出 Cell 的小訊號。'});\nlessons[11].bridgeTitle='下一步：真實電晶體不完全一樣';lessons[11].bridge='先前使用對稱感測器。接下來加入失配，看看為什麼需要偏移補償。';\nfunction ocPanels(s){const st=fullSim.stages[stage],L=lessons[lesson];if(lesson===12){$('explain').textContent='BLSA 是位線感測器的功能名稱；OCSA 是加入偏移補償的一類實作。降低供電會使可用的 Cell 訊號變小；元件縮小後，左右失配也更難忽略。當資料差值與偏移相近，正回授可能把錯誤方向放大。改變失配選項，再重播感測。';$('watch').textContent='ΔVT 不等於整個 SA 的輸入等效偏移 Vos。兩顆管的電流由即時 VGS、VDS 與 VT 一起決定；正回授也會把錯誤方向放大。';}\nelse if(ocWhy[st.key]){[$('explain').textContent,$('watch').textContent]=ocWhy[st.key];}\n$('formula').textContent+=`\\n\\nVT,N_L = ${fmt(.3+tutorialOffset/2)} V\\nVT,N_R = ${fmt(.3-tutorialOffset/2)} V\\nΔVT = ${fmt(tutorialOffset*1000,1)} mV\\nI_NL = ${fmt(s.j.N_L.i*1000)} µA\\nI_NR = ${fmt(s.j.N_R.i*1000)} µA\\nΔVBL = ${fmt((s.bl-s.b)*1000)} mV\\nΔVsignal ≈ Ccell/(CBL+Ccell) × (Vcell−VPRE)\\n降低供電 → 訊號裕量可能縮小\\n設計概念：|ΔVsignal| 須超過殘餘偏移與雜訊\\n（不是用 ΔVT 直接充當 Vos）`;\nif(lesson>=13){$('inputName').textContent='ISO／OC／WL';$('inputValue').textContent=[s.ctrl.ISO,s.ctrl.OC,s.wl].map(v=>fmt(v,1)).join('／')+' V';$('formula').textContent+=`\\n\\nSL = ${fmt(s.sl)} V；SR = ${fmt(s.sr)} V\\nISO：BL↔SL，BLB↔SR\\nOC：BL↔SR，BLB↔SL\\n預感測：ISO=0，OC=0\\n恢復：ISO=1.5，OC=0`;\nif(st.key==='share'){const start=flowSample(st.start);$('formula').textContent+=`\\nVshare ≈ (200×${fmt(start.bl,5)} + 20×${fmt(start.cell,5)})/220\\n= ${fmt((.2*start.bl+.02*start.cell)/.22,5)} V\\n基準 BLB ≈ ${fmt(start.b,5)} V`;}}\n$('assumptions').textContent=L.assume+' 模型含 NMOS VT 失配，未涵蓋所有製程與雜訊。內部電壓及持續時間是教學選值；不是 JEDEC 指定拓撲。';}\nfunction ocConfig(){if(lesson\u003c12)return;const box=$('config');box.insertAdjacentHTML('afterbegin','\u003clabel>ΔVT \u003cselect id=\"offset\">\u003coption value=\"0\">0 mV\u003c/option>\u003coption value=\"0.012\">+12 mV\u003c/option>\u003coption value=\"0.06\">+60 mV\u003c/option>\u003coption value=\"-0.06\">−60 mV\u003c/option>\u003c/select>\u003c/label>');$('offset').value=String(tutorialOffset);$('offset').onchange=e=>{tutorialOffset=+e.target.value;reset();};}\n\nfunction makeFlowTrace(){\n const M=window.DramModel;let sc={id:'tutorial',init:bit,offset:0,ops:['ACT']};\n if(lesson===9)sc={...sc,open:true,ops:['PRE']};\n if(lesson===10)sc={...sc,open:true,ops:[accessOp]};\n if(lesson===11||lesson===15){if(story==='read')sc.ops=['ACT','RD','PRE'];if(story==='write'||story==='verify'){sc.init=1-bit;sc.ops=['ACT','W'+bit,'PRE'];if(story==='verify')sc.ops.push('ACT','RD','PRE');}if(story==='refresh'){sc.init=bit?.88:.12;sc.ops=['REF'];}}\n if(lesson>=12)sc.offset=tutorialOffset;\n fullSim=M.simulate(lesson>=13?'ocsa':'blsa',sc);\n if(lesson===13){const last=fullSim.stages.findIndex(s=>s.key==='hold');fullSim.stages=fullSim.stages.slice(0,last+1);fullSim.total=fullSim.stages.at(-1).end;fullSim.samples=fullSim.samples.filter(s=>s.t\u003c=fullSim.total&&s.stage\u003c=last);}\n if(lesson===8&&earlyClose){sc.earlyWLTime=fullSim.stages.find(s=>s.key==='share').end;fullSim=M.simulate('blsa',sc);}\n const L=lessons[lesson];L.stages=fullSim.stages.map(s=>s.op+' · '+s.title);L.dur=fullSim.stages.map(s=>s.duration);L.why=fullSim.stages.map(s=>s.key==='timing'?'本段只補足尚未滿足的時序。計時從原始命令起算，與感測及恢復重疊；不是完成電路動作後，再重新等一整段時間。':(flowWhy[s.key]||['保持本段電路狀態。'])[0]);L.watch=fullSim.stages.map(s=>s.key==='timing'?'點公式看各門檻的起算事件與剩餘時間；已滿足時僅保留短暫的教學檢查段。':(flowWhy[s.key]||['觀察目前節點電位。',''])[1]);bounds=fullSim.stages.map(s=>s.start);bounds.push(fullSim.total);total=fullSim.total;\n trace=fullSim.samples.map(s=>flowSample(s.t));\n}\nfunction flowSample(x){const M=window.DramModel, roke=\"${colors[j]}\" stroke-width=\"2\"/>`;}z+=`\u003cpath d=\"M${45+t/total*835} 15V115\" stroke=\"white\"/>`+txt(45,133,'0 ns','small','start')+txt(880,133,total+' ns','small','end');$('wave').innerHTML=z;}\nfunction stop(){run=false;cancelAnimationFrame(raf);last=0;}\nfunction go(k,play=false){stop();stage=k;t=bounds[k];render();if(play)start(false);}\nfunction start(all=false){stop();if(t>=bounds[stage+1]-.01)t=bounds[stage];auto=all;run=true;last=0;render();raf=requestAnimationFrame(tick);}\nfunction tick(now){if(!run)return;if(last){t+=Math.min(.1,(now-last)/1000)*+$('speed').value*(bounds[stage+1]-bounds[stage])/5;if(t>=bounds[stage+1]){t=bounds[stage+1]-.00001;if(auto&&stage\u003clessons[lesson].stages.length-1){stage++;t=bounds[stage];}else stop();}}last=now;render();if(run)raf=requestAnimationFrame(tick);}\nfunction reset(){stop();stage=0;t=0;makeTrace();render();}\nlet lessonsCollapsed=null;\nfunction syncLessonMenu(){const hidden=lessonsCollapsed===null?lesson>=8:lessonsCollapsed;$('lessons').hidden=hidden;$('toggleLessons').setAttribute('aria-expanded',String(!hidden));$('toggleLessons').textContent=hidden?'展開課程選單 ▾':'收起課程選單 ▴';}\n$('toggleLessons').onclick=()=>{lessonsCollapsed=!$('lessons').hidden;syncLessonMenu();};\nfunction choose(n){lesson=n;syncLessonMenu();mosType='n';gateOn=1;symbol='mos';$('lessons').innerHTML=lessons.map((l,i)=>`\u003cbutton data-lesson=\"${i}\" aria-current=\"${i===n}\">\u003cb>${String(i+1).padStart(2,'0')}\u003c/b>\u003cdiv>${l.name}\u003cspan>${l.sub}\u003c/span>\u003c/div>\u003c/button>`).join('');let c='';if(n===1)c='\u003clabel>MOS \u003cselect id=\"type\">\u003coption value=\"n\">NMOS 下拉\u003c/option>\u003coption value=\"p\">PMOS 上拉\u003c/option>\u003c/select>\u003c/label>\u003clabel>啟用 Gate \u003cinput id=\"gate\" type=\"range\" min=\"0\" max=\"1.5\" step=\".05\" value=\"1\">\u003coutput id=\"gateLabel\">1.00 V\u003c/output>\u003c/label>';if(n>=2&&n!==5)c='\u003clabel>'+ (n===2?'寫入':'儲存')+'資料 \u003cselect id=\"bit\" M Circuit Design: Fundamental and High-Speed Topics，第 1.2 節；CMOS VLSI Design 與 Sedra/Smith 的 MOS、電容基本模型。本教學使用理想 RC、簡化長通道 MOS 和電荷守恆教學模型，不是 JEDEC 規定的內部電路或電壓值。第⑨～⑫課加入 Cell 恢復與欄位讀寫；第⑬～⑯課加入 OCSA。來源：https://patents.google.com/patent/US20200227111A1/en 。2018 SVC 論文：https://ieeexplore.ieee.org/document/8330545/ ，它是另一種補償方案；不能把兩者當成同一電路。']};\nfunction detail(id){stop();render();const x=(lesson>=13?({P_L:['左側 PMOS','Gate 接 SR，導電端接 LA 與 SL。對側 SR 低時上拉 SL。'],P_R:['右側 PMOS','Gate 接 SL，導電端接 LA 與 SR。'],N_L:['左側 NMOS','Gate 仍接外側 BLB，導電端接 SL 與 LAB。ISO 關閉時，BLB 仍以 Gate 電場控制電流。'],N_R:['右側 NMOS','Gate 仍接 BL，導電端接 SR 與 LAB。'],Y_L:['左側欄位開關','OCSA 從 SL 接到 LIO；不是直接從外側 BL 讀出。'],Y_R:['右側欄位開關','OCSA 從 SR 接到 LIOB。']})[id]:null)||glossary[id]||[id,'點選輸入，播放本段，觀察元件兩端電壓與電流。'];$('detailTitle').textContent=x[0];$('detailText').textContent=x[1].replaceAll('极','極');$('detail').showModal();}\n$('play').onclick=()=>start(false);$('again').onclick=()=>go(stage,true);$('pause').onclick=()=>{stop();render();};$('all').onclick=()=>{go(0);start(true);};$('next').onclick=()=>go(Math.min(stage+1,lessons[lesson].stages.length-1),true);$('seek').oninput=e=>{const q=+e.target.value;stop();t=bounds[stage]+q/1000*(bounds[stage+1]-bounds[stage])-.000001;t=Math.max(bounds[stage],t);render();};$('bridgeButton').onclick=()=>{if(lesson\u003clessons.length-1)choose(lesson+1);else window.open('https://dram-circuit-lab.tira8697.chatgpt.site','_blank','noopener');};$('close').onclick=()=>$('detail').close();$('source').onclick=()=>detail('source');document.addEventListener('click',e=>{const l=e.target.closest('[data-lesson]'),s=e.target.closest('[data-stage]'),p=e.target.closest('[data-part]');if(l)choose(+l.dataset.lesson);if(s)go(+s.dataset.stage,true);if(p)detail(p.dataset.part);});$('circuit').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const p=e.target.closest('[data-part]');if(p){e.preventDefault();detail(p.dataset.part);}}});\nObject.assign(glossary,{BLB:['互補位線 BLB','本次未接所選 Cell 的參考支路。後續也是交叉耦合的另一個感測節點；不是固定不動的理想參考電源。'],N_L:['左側 NMOS','Gate 接 BLB 時，BLB 較高會使左側下拉更強，將 BL 拉低。第⑦課前兩段使用外加 Gate 示範，接線段才改用對側位線。'],N_R:['右側 NMOS','第⑥課 Gate 使用外加訊號；第⑦、⑧課接回 BL。右側的下拉電流會改變 BLB；不是 Gate 在提供這條導電電流。'],P_L:['左側 PMOS','Gate 接 BLB，對側電位低時，從 LA 向 BL 提供上拉電流。是否導通取決於當下 VSG，不只看 P_EN 是否開啟。'],P_R:['右側 PMOS','Gate 接 BL，從 LA 向 BLB 提供上拉電流。LA 在 P_EN 開啟前也可存有電荷。'],LA:['上方供電軌 LA','本課包含 40 fF 等效電容。P_EN 未開時，儲存電荷也可能流經 PMOS；P_EN 開啟後才由 VINTA 持續供應。'],LAB:['下方供電軌 LAB','本課用理想控制軌表示 N_EN 的動作。拉低 LAB 能增加 NMOS 的 VGS；實際控制訊號 SAN 與此供電軌不是同一個節點。'],P_EN:['上拉供電開關','SAP_n 為低時啟用。本課用受控電阻代表供電管，把 VINTA 連到 LA。'],M_PL:['左側預充電開關','EQ 高時將 BL 接向 VPRE。與 M_PR、M_EQ 同時作用。'],M_PR:['右側預充電開關','EQ 高時將 BLB 接向 VPRE。'],M_EQ:['位線等化開關','EQ 高時連接 BL 與 BLB，讓兩條位線交換電荷；另外兩個預充電開關同時連回 VPRE。']});\nObject.assign(glossary,{Y_L:['左側欄位開關','CSL 控制 BL 與 LIO 的通路，READ／WRITE 都會使用它。它不控制 WL。'],Y_R:['右側欄位開關','CSL 同時控制互補支路 BLB 與 LIOB。'],IO_PL:['局部 I/O 預充電','IOEQ 控制，把 LIO 拉回 VPRE；與位線 EQ 不同。'],IO_PR:['互補 I/O 預充電','IOEQ 控制，把 LIOB 拉回 VPRE。'],W_PL:['左側寫入上拉','寫 1 時由 VINTA 向 LIO 提供電流。'],W_NL:['左側寫入下拉','寫 0 時把 LIO 拉向 VSS。'],W_PR:['右側寫入上拉','寫 0 時把互補線 LIOB 拉高。'],W_NR:['右側寫入下拉','寫 1 時把互補線 LIOB 拉低。']});\nObject.assign(glossary,{ISO_L:['左側隔離管','連接 BL 與 SL；預感測時關閉，恢復時接通。'],ISO_R:['右側隔離管','連接 BLB 與 SR。'],OC_L:['交叉補償管','連接 BL 與 SR。此拓撲在待機即導通；校準時 ISO 關閉而 OC 維持導通。'],OC_R:['交叉補償管','連接 BLB 與 SL；校準後關閉，位線保留補償偏壓。'],N_EN:['下拉供電管','SAN 高時把 LAB 拉向 VSS。'],readout:['讀出取樣端','以 LIO−LIOB 的符號與教學裕度判讀，在 capture 段末才更新 DQ。此功能方塊省略局部/全域感測、序列化及外部 PHY。Refresh 不產生新 DQ。'],writerL:['左側寫入驅動','W_PL 上拉 LIO，W_NL 下拉 LIO。圖中以功能方塊收納，模擬仍計算兩顆 MOS 的電流。'],writerR:['右側寫入驅動','W_PR 上拉 LIOB，W_NR 下拉 LIOB，與左側建立相反資料。']});\nchoose(Math.max(0,Math.min(lessons.length-1,(Number((location.hash.match(/^#lesson-(\\d+)$/)||[])[1])||1)-1)));window.BeginnerLab={choose,at,getTrace:()=>trace,getFlowSimulation:()=>fullSim,setOffset:x=>{tutorialOffset=x;reset();},setEarly:x=>{earlyClose=x;reset();},setAccess:x=>{accessOp=x;reset();},setStory:x=>{story=x;reset();},setSingleGate:x=>{singleGate=x;reset();},getState:()=>({lesson,stage,t,run,view}),seek:(k,q)=>{go(k);t=bounds[k]+(bounds[k+1]-bounds[k])*q-.00001;t=Math.max(bounds[k],t);render();},setBit:x=>{bit=x;reset();},setMOS:(type,g)=>{mosType=type;gateOn=g;reset();},setWL:x=>{wlHigh=x;reset();}};\n\u003c/script>\u003c/body>\u003c/html>\n", "glossary": "\u003c!doctype html>\u003chtml lang=\"zh-Hant\">\u003cscript>\n(function(){const originalOpen=window.open;function route(h){if(!h||h[0]==='#')return null;const base=h.split('#')[0].split('?')[0];if(/^https?:/.test(h)&&!h.startsWith('https://dram-circuit-lab.tira8697.chatgpt.site'))return null;const file=base.split('/').pop();return ({'index.html':'index','beginner.html':'beginner','glossary.html':'glossary','flow.html':'flow','':'index'})[file]||(base==='https://dram-circuit-lab.tira8697.chatgpt.site'?'index':null);}\ndocument.addEventListener('click',function(e){const a=e.target.closest('a');if(!a)return;const r=route(a.getAttribute('href'));if(r){e.preventDefault();top.showLab(r);}},true);window.open=function(url,...args){const r=route(String(url));if(r){top.showLab(r);return null;}return originalOpen.call(window,url,...args);};})();\n\u003c/script>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>DRAM 名詞解釋\u003c/title>\u003cstyle>*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#05070a;color:#edf5ff;font:16px/1.6 system-ui,\"Microsoft JhengHei\",sans-serif}header{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid #263749}nav{display:flex;gap:16px;flex-wrap:wrap}a{color:#73dcff}button,select,input{font:inherit;color:inherit;background:#111f2e;border:1px solid #39546d;border-radius:7px;padding:7px 11px}button{cursor:pointer}button:disabled{opacity:.4}button:hover,a:hover{color:#ffd174}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ffd174;outline-offset:3px}h1{font-size:23px;margin:0}h2{font-size:21px}p{margin:8px 0 16px}.muted{color:#a9bad0;font-size:14px}.panel{background:#0c131d;border:1px solid #293d50;border-radius:10px;padding:16px;min-width:0}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 20px}pre{font:15px/1.7 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#9be5ff}label{display:flex;align-items:center;gap:8px}article{scroll-margin-top:12px}small{font-size:14px}main{max-width:1250px;margin:auto;padding:20px}.intro{max-width:850px}.term-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.badge{font-size:14px;color:#70efb5}h2{margin:4px 0}dt{color:#ffd174;font-size:14px}dd{margin:0 0 12px}.jump{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}@media(max-width:760px){.term-grid{grid-template-columns:1fr}header{display:block}nav{margin-top:8px}}@media print{nav,.jump{display:none}.panel{break-inside:avoid}body{background:white;color:black}}\u003c/style>\u003cheader>\u003ch1>DRAM 名詞解釋\u003c/h1>\u003cnav>\u003ca href=\"beginner.html\">分段教學\u003c/a>\u003ca href=\"glossary.html\">名詞解釋\u003c/a>\u003ca href=\"flow.html\">完整流程\u003c/a>\u003ca href=\"index.html\">電路實驗室\u003c/a>\u003c/nav>\u003c/header>\u003cmain>\u003cp class=\"intro\">先分清「外部規格」與「內部電路」。JEDEC 定義命令、接腳與時序；WL、CSL、EQ、ISO 等內部名稱則依電路實作與文獻而定。\u003c/p>\u003cdiv class=\"jump\">\u003ca href=\"#cat0\">外部介面\u003c/a>\u003ca href=\"#cat1\">命令與位址\u003c/a>\u003ca href=\"#cat2\">內部電路\u003c/a>\u003ca href=\"#cat3\">電壓與模型\u003c/a>\u003ca href=\"#cat4\">時序\u003c/a>\u003c/div>\u003csection id=\"cat0\">\u003ch2>外部介面\u003c/h2>\u003cdiv class=\"term-grid\">\u003carticle class=\"panel\">\u003cspan class=\"badge\">外部介面\u003c/span>\u003ch2>CS_n\u003c/h2>\u003cp class=\"muted\">Chip Select／晶片選擇\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>外部命令選擇訊號，參與命令編碼及 Rank 選擇。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>由控制器送到 DRAM；高低狀態依命令真值表解讀。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>不是 CSL；CSL 在晶片內部選欄。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：JESD79-5C §2.6 Table 3\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">外部介面\u003c/span>\u003ch2>CA[13:0]\u003c/h2>\u003cp class=\"muted\">Command / Address\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>承載命令碼與位址的外部輸入線。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>控制器透過 CA 送 ACT、READ、WRITE 與對應位址。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>CA 不是直接接到 WL 或 CSL 的控制電壓。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：JESD79-5C Table 3、30\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">外部介面\u003c/span>\u003ch2>CK_t / CK_c\u003c/h2>\u003cp class=\"muted\">差動時脈\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>外部命令與位址取樣的時序基準。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>規格以時脈邊緣及時間限制定義何時接受命令。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>不等於動畫內部每顆開關都在同一個邊緣切換。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：JESD79-5C Table 3\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">外部介面\u003c/span>\u003ch2>DQ\u003c/h2>\u003cp class=\"muted\">Data Input / Output\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>雙向資料接腳。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>讀取時 DRAM 輸出，寫入時控制器輸入。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>動畫的 DQ 方塊是判讀結果，省略序列化與實際 PHY。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：JESD79-5C Table 3\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">外部介面\u003c/span>\u003ch2>DQS_t / DQS_c\u003c/h2>\u003cp class=\"muted\">Data Strobe\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>伴隨資料傳輸的差動資料選通信號。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>READ 由 DRAM 送出，WRITE 由控制器送入。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>DQS 不負責選擇 DRAM 內部哪一欄。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：JESD79-5C Table 3\u003c/small>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"cat1\">\u003ch2>命令與位址\u003c/h2>\u003cdiv class=\"term-grid\">\u003carticle class=\"panel\">\u003cspan class=\"badge\">命令與位址\u003c/span>\u003ch2>ACT\u003c/h2>\u003cp class=\"muted\">Activate／開列\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>選取 Bank 與 Row，開始該列的內部感測與恢復。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>列開啟後，感測器維持這一列的資料。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>ACT 本身不把這整列直接輸出到外部 DQ。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：JESD79-5C Table 30\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">命令與位址\u003c/span>\u003ch2>READ / RD\u003c/h2>\u003cp class=\"muted\">讀取命令\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>指定已開啟列中的欄位資料並安排外部讀出。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>欄位選擇後，資料經 I/O 階層送向 DQ。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>同列連續 READ 不需每次重做 ACT。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：JESD79-5C Table 30\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">命令與位址\u003c/span>\u003ch2>WRITE / WR\u003c/h2>\u003cp class=\"muted\">寫入命令\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>把外部資料寫入所指定的欄位。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>寫入驅動改變感測節點，透過仍開啟的 WL 改寫 Cell。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>WRITE 結束不能忽略寫入恢復時間就立即 PRE。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：JESD79-5C 命令及時序章節\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">命令與位址\u003c/span>\u003ch2>PRE\u003c/h2>\u003cp class=\"muted\">Precharge／預充電命令\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>關閉開啟的列，讓位線回到下一次感測的準備狀態。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>內部先隔離 Cell，再停止感測強驅動並等化。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>PRE 不會替漏電的 Cell 完成刷新。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：JESD79-5C Table 30；電路教材 §1.2\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">命令與位址\u003c/span>\u003ch2>REF\u003c/h2>\u003cp class=\"muted\">Refresh／刷新\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>由內部刷新位址控制執行資料恢復。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>示意流程：選列→感測→恢復→關列；不需把資料送到 DQ。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>不是外部控制器逐欄 READ 再 WRITE；單一動畫只代表一列。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：JESD79-5C Refresh；電路教材 §1.2\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">命令與位址\u003c/span>\u003ch2>Row / Column\u003c/h2>\u003cp class=\"muted\">列位址／欄位址\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>Row 選一列；Column 選已開啟列中的資料群。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>ACT 提供 Row，READ／WRITE 提供 Column。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>一次 burst 不一定等於只接通一對位線。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：JESD79-5C Table 30\u003c/small>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"cat2\">\u003ch2>內部電路\u003c/h2>\u003cdiv class=\"term-grid\">\u003carticle class=\"panel\">\u003cspan class=\"badge\">內部電路\u003c/span>\u003ch2>CSL\u003c/h2>\u003cp class=\"muted\">Column Select Line／欄選擇線\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>內部欄位解碼與時序控制產生的選擇訊號。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>開啟 Y_L／Y_R，把選中的感測節點接到局部 I/O。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>不是 JEDEC 外部接腳或獨立命令，也不是 CS_n。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：電路名稱；外部對應 READ／WRITE＋Column Address\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">內部電路\u003c/span>\u003ch2>WL\u003c/h2>\u003cp class=\"muted\">Word Line／字線\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>控制一列 Cell 存取電晶體 Gate 的內部線。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>WL 高時 M_A 連接 Cell 與 BL；WL 低時隔離保存。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>WL 電壓不是 Cell 的資料電壓，也不等於外部 VPP 接腳。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：DRAM Circuit Design §1.2\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">內部電路\u003c/span>\u003ch2>Cell / Ccell\u003c/h2>\u003cp class=\"muted\">儲存單元／儲存電容\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>1T1C 中由一顆存取管與一顆電容保存資料。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>固定極板電位時，Qcell = Ccell(Vcell−VPL)。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>存 0 不表示電容兩端的電壓必然為零。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：DRAM Circuit Design §1.2\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">內部電路\u003c/span>\u003ch2>BL / BLB\u003c/h2>\u003cp class=\"muted\">Bit Line／互補位線\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>傳遞 Cell 小訊號的位線對。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>Cell 接入一側，感測器利用兩側差值判讀。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>BLB 不是全程固定在半電源的理想電壓源。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：DRAM Circuit Design §1.2\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">內部電路\u003c/span>\u003ch2>BLSA\u003c/h2>\u003cp class=\"muted\">Bit-Line Sense Amplifier\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>把微小位線差值再生為明確高低位的感測器。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>使用交叉耦合正回授，並在 WL 開啟時恢復 Cell。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>BLSA 是功能名稱；並非與 OCSA 完全互斥的分類。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：DRAM Circuit Design §1.2\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">內部電路\u003c/span>\u003ch2>OCSA\u003c/h2>\u003cp class=\"muted\">Offset-Cancellation Sense Amplifier\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>加入偏移補償的感測器類型。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>先建立補償偏壓，減少失配對後續判讀的影響。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>不是所有 DRAM 都換成同一種 OCSA；不同論文有不同拓撲。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：US20200227111A1 Fig.3、6A–E\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">內部電路\u003c/span>\u003ch2>SL / SR\u003c/h2>\u003cp class=\"muted\">SABL / SABLB／內部感測節點\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>本教學 OCSA 核心的左右小負載節點。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>ISO 關閉時可先在 SL／SR 預感測，再接回大位線。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>SL／SR 與外側 BL／BLB 不一定有相同電位。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：US20200227111A1\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">內部電路\u003c/span>\u003ch2>ISO\u003c/h2>\u003cp class=\"muted\">Isolation／隔離控制\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>控制外側位線與同側內部感測節點的通路。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>ISO_L 接 BL↔SL；ISO_R 接 BLB↔SR。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>導電通路隔離後，接在 BL／BLB 的 NMOS Gate 仍可控制電流。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：本教學 OCSA 拓撲\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">內部電路\u003c/span>\u003ch2>OC\u003c/h2>\u003cp class=\"muted\">Offset Cancellation／補償控制\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>控制交叉補償通路。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>OC_L 接 BL↔SR；OC_R 接 BLB↔SL。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>此拓撲待機 OC 已高；補償啟動靠切斷 ISO 與啟用感測供電。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：US20200227111A1 Fig.6、8\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">內部電路\u003c/span>\u003ch2>EQ\u003c/h2>\u003cp class=\"muted\">Equalization／等化控制\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>本模型同時控制 M_EQ、M_PL、M_PR。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>M_EQ 拉近兩側電位；預充電管把共模拉向 VPRE。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>EQ 不是 CSL；共享與感測時不可持續把位線等化。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：DRAM Circuit Design §1.2；教學命名\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">內部電路\u003c/span>\u003ch2>LIO / LIOB\u003c/h2>\u003cp class=\"muted\">Local I/O／局部資料線\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>連接選中的感測器與後續讀寫電路的資料線對。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>READ 把差值送出；WRITE 從此處驅動新資料。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>LIO 不是晶片外部 DQ 接腳。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：內部電路命名\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">內部電路\u003c/span>\u003ch2>IOEQ\u003c/h2>\u003cp class=\"muted\">局部 I/O 預充電控制\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>將 LIO／LIOB 準備在教學基準電位。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>讀寫前解除，欄位關閉後可重新啟用。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>與位線 EQ 分開；IOEQ 啟用不表示正在 PRE 關列。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：教學周邊命名\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">內部電路\u003c/span>\u003ch2>M_A / Y_L / Y_R\u003c/h2>\u003cp class=\"muted\">存取管／欄位管\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>M_A 由 WL 控制；Y_L、Y_R 由 CSL 控制。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>前者連 Cell 與 BL；後者連感測器與 I/O。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>關閉 CSL 不代表已關閉 WL。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：教學元件標記\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">內部電路\u003c/span>\u003ch2>N_L / N_R / P_L / P_R\u003c/h2>\u003cp class=\"muted\">交叉耦合感測核心\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>NMOS 負責下拉，PMOS 負責上拉。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>由 Gate、Source、Drain 的即時電位決定導通與電流。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>導通不一定有顯著電流；兩端沒有壓差時電流可接近零。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：MOS 模型與電路教材\u003c/small>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"cat3\">\u003ch2>電壓與模型\u003c/h2>\u003cdiv class=\"term-grid\">\u003carticle class=\"panel\">\u003cspan class=\"badge\">電壓與模型\u003c/span>\u003ch2>VDD / VDDQ / VPP\u003c/h2>\u003cp class=\"muted\">外部供電名稱\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>分別用於規格定義的供電域；VDDQ 與 I/O 供電相關。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>實際電壓與條件依裝置與 JEDEC 規格。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>教學內部 1 V、WL 1.5 V 不應當成 DDR5 接腳規格值。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：JESD79-5C 電源與電氣規格\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">電壓與模型\u003c/span>\u003ch2>VPRE / VPL / VINTA\u003c/h2>\u003cp class=\"muted\">內部預充電／極板／感測供電\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>本例分別為 0.5 V、0.5 V、1 V。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>VPRE 準備位線；VPL 是 Cell 下極板；VINTA 提供感測能量。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>相同數值不表示是同一條實體電源線；也不是 JEDEC 指定的內部值。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：教學選值及電路文獻\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">電壓與模型\u003c/span>\u003ch2>LA / LAB / SAP_n / SAN\u003c/h2>\u003cp class=\"muted\">感測供電軌／啟用控制\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>LA、LAB 是供電節點；SAP_n、SAN 是本模型供電管的控制。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>SAP_n 低啟用上拉，SAN 高啟用下拉。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>控制訊號與受控制的供電軌是不同節點。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：教學拓撲命名\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">電壓與模型\u003c/span>\u003ch2>VT / ΔVT / Vos\u003c/h2>\u003cp class=\"muted\">臨界電壓／失配／輸入等效偏移\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>VT 是單管參數；ΔVT 是兩管差；Vos 是整體判讀偏移。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>偏移可能使小訊號被判成錯誤方向。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>不能把 ΔVT 直接當作所有電路的 Vos。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：MOS 與感測器分析\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">電壓與模型\u003c/span>\u003ch2>Charge Sharing\u003c/h2>\u003cp class=\"muted\">電荷共享\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>Cell 與位線電容接通後重新分配電荷。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>Vshare ≈ (CBL·VBL,初+Ccell·Vcell,初)/(CBL+Ccell)。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>此式需固定極板電位，並忽略其他通路與耦合；OCSA 要用補償後初值。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：DRAM Circuit Design §1.2\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">電壓與模型\u003c/span>\u003ch2>Positive Feedback / Restore\u003c/h2>\u003cp class=\"muted\">正回授／資料恢復\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>正回授放大差值；恢復將已判讀的電位寫回 Cell。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>讀 0 與讀 1 都需要恢復。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>SA 已鎖存不代表 Cell 已充分恢復。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：DRAM Circuit Design §1.2\u003c/small>\u003c/article>\u003c/div>\u003c/section>\u003csection id=\"cat4\">\u003ch2>時序\u003c/h2>\u003cdiv class=\"term-grid\">\u003carticle class=\"panel\">\u003cspan class=\"badge\">時序\u003c/span>\u003ch2>tRCD\u003c/h2>\u003cp class=\"muted\">ACT 到讀寫命令的最小間隔\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>限制開列後何時能接受相應欄位命令。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>從 ACT 參考事件起算，感測在其中進行。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>不是感測做完後才另加一整段 tRCD。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：JEDEC 命令時序\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">時序\u003c/span>\u003ch2>tRAS / tRP / tRC\u003c/h2>\u003cp class=\"muted\">列開啟／預充電／列循環時間\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>限制 ACT→PRE、PRE→後續 ACT 與同 Bank ACT→ACT 等時序。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>電路狀態與時間條件都滿足，才能進入下一操作。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>不能把 tRAS 完全等同動畫 Restore 一段。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：JEDEC 命令時序\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">時序\u003c/span>\u003ch2>tRTP / tWR\u003c/h2>\u003cp class=\"muted\">讀到預充電／寫入恢復\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>約束讀寫後何時允許 PRE。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>需遵守所選模式、burst 與規格的起算定義。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>動畫內部寫入末端只是 tWR 教學參考，非完整外部 CK／DQ 定義。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：JEDEC 命令時序\u003c/small>\u003c/article>\u003carticle class=\"panel\">\u003cspan class=\"badge\">時序\u003c/span>\u003ch2>tRFC\u003c/h2>\u003cp class=\"muted\">刷新恢復時間\u003c/p>\u003cdl>\u003cdt>是什麼\u003c/dt>\u003cdd>限制相應刷新操作之後的命令時序。\u003c/dd>\u003cdt>在流程中的工作\u003c/dt>\u003cdd>本流程圖以 REF 忙碌結束檢查表示。\u003c/dd>\u003cdt>容易混淆\u003c/dt>\u003cdd>實際值依刷新類型與裝置等條件，不是所有 DDR5 固定 295 ns。\u003c/dd>\u003c/dl>\u003csmall class=\"muted\">依據：JEDEC Refresh 時序\u003c/small>\u003c/article>\u003c/div>\u003c/section>\u003cp class=\"muted\">教材：使用者提供的 JESD79-5C_v1.30、DRAM Circuit Design: Fundamental and High-Speed Topics §1.2。OCSA 拓撲：\u003ca href=\"https://patents.google.com/patent/US20200227111A1/en\" target=\"_blank\" rel=\"noopener\">US20200227111A1\u003c/a>。教學命名與模型數值不代表特定量產 DDR5 晶片。\u003c/p>\u003c/main>\u003c/html>", "flow": "\u003c!doctype html>\u003chtml lang=\"zh-Hant\">\u003chead>\u003cscript>\n(function(){const originalOpen=window.open;function route(h){if(!h||h[0]==='#')return null;const base=h.split('#')[0].split('?')[0];if(/^https?:/.test(h)&&!h.startsWith('https://dram-circuit-lab.tira8697.chatgpt.site'))return null;const file=base.split('/').pop();return ({'index.html':'index','beginner.html':'beginner','glossary.html':'glossary','flow.html':'flow','':'index'})[file]||(base==='https://dram-circuit-lab.tira8697.chatgpt.site'?'index':null);}\ndocument.addEventListener('click',function(e){const a=e.target.closest('a');if(!a)return;const r=route(a.getAttribute('href'));if(r){e.preventDefault();top.showLab(r);}},true);window.open=function(url,...args){const r=route(String(url));if(r){top.showLab(r);return null;}return originalOpen.call(window,url,...args);};})();\n\u003c/script>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>DRAM 完整流程導覽\u003c/title>\u003cstyle>*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#05070a;color:#edf5ff;font:16px/1.6 system-ui,\"Microsoft JhengHei\",sans-serif}header{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid #263749}nav{display:flex;gap:16px;flex-wrap:wrap}a{color:#73dcff}button,select,input{font:inherit;color:inherit;background:#111f2e;border:1px solid #39546d;border-radius:7px;padding:7px 11px}button{cursor:pointer}button:disabled{opacity:.4}button:hover,a:hover{color:#ffd174}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ffd174;outline-offset:3px}h1{font-size:23px;margin:0}h2{font-size:21px}p{margin:8px 0 16px}.muted{color:#a9bad0;font-size:14px}.panel{background:#0c131d;border:1px solid #293d50;border-radius:10px;padding:16px;min-width:0}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 20px}pre{font:15px/1.7 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#9be5ff}label{display:flex;align-items:center;gap:8px}article{scroll-margin-top:12px}small{font-size:14px}\nmain.focus{grid-template-columns:1fr!important}main.focus .map,main.focus .explain{display:none}body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{flex-shrink:0}.toolbar{flex-shrink:0}main{padding:0 14px 14px;display:grid;grid-template-columns:230px minmax(0,1fr) 310px;gap:12px;flex:1;min-height:0}.map{overflow:auto}.map h2{margin:0 0 10px}.step{display:block;width:100%;text-align:left;font-size:14px;padding:8px;position:relative;margin-bottom:16px}.step:not(:last-child):after{content:'↓';position:absolute;bottom:-21px;left:50%;color:#90aec6}.step[aria-current=true]{border-color:#67ddff;background:#153449;color:#9cecff}.step small{display:block;color:#a9bad0}.stage{display:flex;flex-direction:column;padding:0;overflow:hidden}.stage h2{font-size:18px;padding:10px 14px;margin:0;border-bottom:1px solid #293d50}.illustration{flex:1;min-height:0;background:black;position:relative}iframe{border:0;width:100%;height:100%;display:block}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;border-top:1px solid #293d50}#scrub{flex:1;min-width:90px}.explain{overflow:auto}.explain h2{margin-top:0}.status{padding:8px 14px;color:#ff9dcb;background:#101925;font-size:14px}#loading{position:absolute;inset:0;display:grid;place-items:center;background:black}#loading[hidden]{display:none}details{border-top:1px solid #293d50;margin-top:14px;padding-top:12px}.hint{padding:0 20px 8px;margin:0}@media(max-width:1050px){main{grid-template-columns:190px minmax(0,1fr)}.explain{grid-column:1/-1;max-height:240px}.illustration{min-height:280px}body{height:auto;overflow:auto}main{display:grid;grid-template-rows:570px auto}}@media(max-width:620px){header{display:block}main{display:flex;flex-direction:column}.map{max-height:180px}.stage{height:650px}.explain{max-height:none}nav{gap:10px}h1{font-size:20px}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ch1>完整流程 · 一步一步看\u003c/h1>\u003cnav>\u003ca href=\"beginner.html\">分段教學\u003c/a>\u003ca href=\"glossary.html\">名詞解釋\u003c/a>\u003ca href=\"flow.html\">完整流程\u003c/a>\u003ca href=\"index.html\">電路實驗室\u003c/a>\u003c/nav>\u003c/header>\u003cdiv class=\"toolbar\">\u003clabel>架構 \u003cselect id=\"mode\">\u003coption value=\"blsa\">BLSA\u003c/option>\u003coption value=\"ocsa\">OCSA\u003c/option>\u003c/select>\u003c/label>\u003clabel>故事 \u003cselect id=\"story\">\u003coption value=\"read\">ACT → READ → PRE\u003c/option>\u003coption value=\"write\">ACT → WRITE → PRE\u003c/option>\u003coption value=\"verify\">翻轉寫入 → 關列 → 讀回\u003c/option>\u003coption value=\"refresh\">Refresh\u003c/option>\u003c/select>\u003c/label>\u003clabel>資料／寫入目標 \u003cselect id=\"bit\">\u003coption value=\"0\">0\u003c/option>\u003coption value=\"1\">1\u003c/option>\u003c/select>\u003c/label>\u003clabel>速度 \u003cselect id=\"speed\">\u003coption value=\".5\">0.5×\u003c/option>\u003coption value=\"1\" selected>1×\u003c/option>\u003coption value=\"2\">2×\u003c/option>\u003c/select>\u003c/label>\u003cbutton id=\"focus\" aria-pressed=\"false\">放大電路\u003c/button>\u003c/div>\u003cp class=\"hint muted\">左側是所選故事的完整流程；點任一步會從該段起點播放。電路與時間採教學模型，未展開外部 PHY。\u003c/p>\u003cmain>\u003csection class=\"panel map\" aria-label=\"故事流程圖\">\u003ch2>流程圖\u003c/h2>\u003cdiv id=\"steps\">\u003c/div>\u003c/section>\u003csection class=\"panel stage\">\u003ch2 id=\"title\">載入電路…\u003c/h2>\u003cdiv class=\"illustration\">\u003ciframe id=\"lab\" title=\"同步電路動畫\" src=\"about:blank\">\u003c/iframe>\u003cdiv id=\"loading\">正在準備電路模型…\u003c/div>\u003c/div>\u003cdiv class=\"status\" id=\"status\">\u003c/div>\u003cdiv class=\"controls\">\u003cbutton id=\"prev\">上一段\u003c/button>\u003cbutton id=\"play\">播放本段\u003c/button>\u003cbutton id=\"pause\">暫停\u003c/button>\u003cbutton id=\"next\">下一段\u003c/button>\u003cbutton id=\"all\">從頭全部播放\u003c/button>\u003cinput id=\"scrub\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\" aria-label=\"本段進度\">\u003c/div>\u003c/section>\u003caside class=\"panel explain\">\u003ch2 id=\"heading\">這一步在做什麼？\u003c/h2>\u003cp id=\"explanation\">\u003c/p>\u003cp id=\"watch\">\u003c/p>\u003ca href=\"glossary.html\" target=\"_blank\" rel=\"noopener\">查名詞 ↗\u003c/a>\u003cdetails open>\u003csummary>本步公式與目前數值\u003c/summary>\u003cpre id=\"formula\">\u003c/pre>\u003c/details>\u003cdetails>\u003csummary>範圍與假設\u003c/summary>\u003cp class=\"muted\" id=\"assumptions\">\u003c/p>\u003c/details>\u003c/aside>\u003c/main>\u003cscript>\nconst $=id=>document.getElementById(id);$('focus').onclick=()=>{const on=document.querySelector('main').classList.toggle('focus');$('focus').setAttribute('aria-pressed',String(on));$('focus').textContent=on?'恢復流程與解說':'放大電路';};let api,doc,sim,k=0,q=0,playing=false,all=false,last=0,raf=0,lastPaint=0;\nfunction stop(){playing=false;cancelAnimationFrame(raf);last=0;$('pause').disabled=true;}\nfunction setup(){if(!api)return;stop();api.choose($('mode').value==='ocsa'?15:11);api.setBit(+$('bit').value);api.setStory($('story').value);sim=api.getFlowSimulation();k=0;q=0;$('steps').innerHTML=sim.stages.map((s,i)=>`\u003cbutton class=\"step\" data-step=\"${i}\" aria-current=\"false\">\u003cb>${i+1}. ${s.title}\u003c/b>\u003csmall>${s.op} · ${s.duration.toFixed(1)} ns（模型）\u003c/small>\u003c/button>`).join('');draw();}\nfunction draw(){if(!api)return;api.seek(k,q);const s=api.getState().view;doc.body.classList.toggle('paused',!playing);$('title').textContent=`${k+1} / ${sim.stages.length} · ${sim.stages[k].title}`;$('heading').textContent=sim.stages[k].op+' · '+sim.stages[k].title;for(const [to,from] of [['explanation','explain'],['watch','watch'],['formula','formula'],['assumptions','assumptions']])$(to).textContent=doc.getElementById(from).textContent;$('status').textContent=`Cell ${s.cell.toFixed(3)} V　BL ${s.bl.toFixed(3)} V　BLB ${s.b.toFixed(3)} V　DQ ${s.dq===null?'尚未取樣':s.dq}　${playing?'播放中':'暫停'}`;$('scrub').value=Math.round(q*1000);$('prev').disabled=k===0;$('next').disabled=k===sim.stages.length-1;$('pause').disabled=!playing;document.querySelectorAll('.step').forEach((el,i)=>el.setAttribute('aria-current',String(k===i)));}\nfunction goto(i,run=true){if(!sim)return;stop();k=Math.max(0,Math.min(sim.stages.length-1,i));q=0;draw();if(run)start(false);}\nfunction start(chain=false){if(!api)return;stop();if(q>=1)q=0;all=chain;playing=true;last=0;draw();raf=requestAnimationFrame(tick);}\nfunction tick(now){if(!playing)return;if(last)q+=Math.min((now-last)/1000,.15)*+$('speed').value/5;last=now;if(q>=1){q=1;draw();if(all&&k\u003csim.stages.length-1){k++;q=0;document.querySelectorAll('.step')[k].scrollIntoView({block:'nearest'});}else stop();}if(now-lastPaint>50||!playing){draw();lastPaint=now;}if(playing)raf=requestAnimationFrame(tick);}\n$('lab').onload=()=>{try{doc=$('lab').contentDocument;api=$('lab').contentWindow.BeginnerLab;if(!api)throw Error('model');const css=doc.createElement('style');css.textContent='html,body{height:100%!important;overflow:hidden!important}body{display:block!important}header,#lessons,aside,.scope,.question,.config,.controls{display:none!important}main{display:block!important;height:100%!important;padding:0!important;margin:0!important;min-height:0!important}.workspace{height:100%!important;border:0!important;border-radius:0!important}.canvas{height:100%!important;min-height:0!important;flex:1!important}.canvas svg{height:100%!important;width:100%!important}';doc.head.append(css);doc.addEventListener('click',e=>{if(e.target.closest('[data-part]'))stop();},true);setup();$('loading').hidden=true;}catch(e){$('loading').textContent='電路未載入。請重新整理，或由「分段教學」進入。';}};\nfor(const id of ['mode','story','bit'])$(id).onchange=setup;$('steps').onclick=e=>{const b=e.target.closest('[data-step]');if(b)goto(+b.dataset.step);};$('play').onclick=()=>start(false);$('pause').onclick=()=>{stop();draw();};$('prev').onclick=()=>goto(k-1);$('next').onclick=()=>goto(k+1);$('all').onclick=()=>{goto(0,false);start(true);};$('scrub').oninput=()=>{if(!api)return;stop();q=+$('scrub').value/1000;draw();};window.FlowGuide={setup,goto,draw,getState:()=>({k,q,playing,sim})};\ntop.mountLab(document.getElementById('lab'),'beginner');\n\u003c/script>\u003c/body>\u003c/html>\n"};
window.mountLab=function(frame,name){frame.contentWindow.matchMedia=frame.contentWindow.matchMedia||(()=>({matches:false,addEventListener(){},removeEventListener(){}}));frame.contentWindow.ResizeObserver=window.ResizeObserver||class{observe(){} disconnect(){}};const d=frame.contentDocument;d.open();d.write(pages[name]);d.close();if(typeof frame.onload==='function')frame.onload();};
window.showLab=function(name){if(!pages[name])name='index';document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.page===name)));const old=document.getElementById('content'),fresh=document.createElement('iframe');fresh.id='content';fresh.title='DRAM 實驗室內容';old.replaceWith(fresh);mountLab(fresh,name);};
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)showLab(b.dataset.page);});showLab('index');
</script></body></html>
